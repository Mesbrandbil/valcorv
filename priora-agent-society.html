<style>/* =====================================================================
   WRITTEN UNDER · film stylesheet
   Paper, ink and hairlines. The stage art never changes with colour
   scheme; only the chrome outside the stage (letterbox, controls) does.
   Screen-space text lives inside the scaled stage and is sized in stage
   px, with CSS minimums written as max(stage px, CSS px / --s).
   ===================================================================== */
:root{
  --desk:#EEEBE4; --page:#FBFAF7; --paper:#F5F3EE; --ink:#111111;
  --ink-2:rgba(17,17,17,.68); --ink-3:rgba(17,17,17,.47); --ink-4:rgba(17,17,17,.28);
  --hair:rgba(17,17,17,.13); --rule:rgba(17,17,17,.07);
  --site-line:#5E5D59; --site-detail:#A9A6A0;
  --face-top:#FBFAF6; --face-r:#EAE6DD; --face-l:#E1DCD1; --paint:#A6A39D;
  --signal:#C4441C; --signal-2:rgba(196,68,28,.10);
  --vest:#E8B820; --reflect:#C9C6BF; --shadow:rgba(17,17,17,.08);
  --card-shadow:0 1px 0 rgba(17,17,17,.03), 0 34px 80px -34px rgba(17,17,17,.24), 0 10px 26px -14px rgba(17,17,17,.10);
  --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  /* chrome (outside the stage) */
  --letterbox:var(--desk); --chrome:var(--paper); --chrome-ink:var(--ink);
  --chrome-ink-3:var(--ink-3); --chrome-hair:var(--hair); --chrome-fill:var(--ink);
  --ctrl-h:56px;
  --s:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --letterbox:#1B1A17; --chrome:#1B1A17; --chrome-ink:#F5F3EE;
    --chrome-ink-3:rgba(245,243,238,.62); --chrome-hair:rgba(245,243,238,.16); --chrome-fill:#F5F3EE;
  }
}
:root[data-theme="dark"]{
  --letterbox:#1B1A17; --chrome:#1B1A17; --chrome-ink:#F5F3EE;
  --chrome-ink-3:rgba(245,243,238,.62); --chrome-hair:rgba(245,243,238,.16); --chrome-fill:#F5F3EE;
}

html,body{height:100%;overflow:hidden;margin:0;padding:0}
body{background:var(--letterbox);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.film *,.film *::before,.film *::after{box-sizing:border-box}
.film button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer}
.film :focus-visible{outline:1px solid currentColor;outline-offset:3px}
.film :focus:not(:focus-visible){outline:none}
.vh{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.film svg.g{width:1em;height:1em;flex:none;overflow:visible}

/* ---------- frame ---------- */
#film{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--letterbox);overflow:hidden}
#stagewrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--letterbox)}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--desk);contain:layout paint}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none}
#screen{position:absolute;inset:0;pointer-events:none}
/* reduced-motion soft dip: the stage fades toward paper, never toward the (possibly dark) letterbox */
#veil{position:absolute;inset:0;pointer-events:none;background:var(--paper);opacity:0}
#leaders{position:absolute;left:0;top:0;overflow:visible}
#leaders line{stroke:var(--ink-4);stroke-width:1;vector-effect:non-scaling-stroke}
#world > *, #screen > *{position:absolute}
:where(#world > *, #screen > *){left:0;top:0}

/* ---------- start overlay ---------- */
.start{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(245,243,238,.72)}
.start[hidden]{display:none}
.start-in{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;text-align:center}
.start-title{margin:0;font:300 clamp(34px,6vw,64px)/1.05 var(--sans);letter-spacing:-.01em;color:var(--ink)}
.start-play{width:88px;height:88px;border-radius:50%;background:var(--ink) !important;color:var(--paper) !important;display:flex;align-items:center;justify-content:center}
.start-play svg{width:28px;height:28px;margin-left:4px}
.start-play:hover{background:#2a2a2a !important}
.start-hint{margin:0;font:500 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- controls ---------- */
.controls{position:relative;z-index:40;flex:none;height:var(--ctrl-h);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--chrome);color:var(--chrome-ink);border-top:1px solid var(--chrome-hair)}
.cbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;min-width:32px;padding:0 10px;border:1px solid var(--chrome-hair) !important;border-radius:16px;font:500 10px/1 var(--mono) !important;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.cbtn:hover{border-color:var(--chrome-ink-3) !important}
.cbtn svg{width:11px;height:11px}
.cbtn.round{width:32px;padding:0;border-radius:50%;background:var(--chrome-fill) !important;color:var(--chrome) !important;border-color:var(--chrome-fill) !important}
.cbtn.round svg{width:12px;height:12px}
#b-prev,#b-next{width:32px;padding:0}
#b-sound[aria-pressed="true"]{border-color:var(--chrome-ink) !important}
.c-time{flex:none;font:500 11px/1 var(--mono);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--chrome-ink)}
.c-chap{flex:none;width:136px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--chrome-ink-3)}
.c-tag{flex:none;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--chrome-ink-3);padding:5px 7px;border:1px solid var(--chrome-hair);border-radius:4px}
.scrubwrap{position:relative;flex:1 1 auto;min-width:80px;height:32px}
.scrub{position:absolute;inset:0;cursor:pointer;touch-action:none}
.scrub .track{position:absolute;left:0;right:0;top:15px;height:2px;background:var(--chrome-hair)}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--chrome-ink)}
.scrub .knob{position:absolute;top:10px;left:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--chrome-ink)}
.ticks{position:absolute;inset:0;pointer-events:none}
.tick{position:absolute;top:4px;width:14px;height:24px;margin-left:-7px;pointer-events:auto;display:flex;justify-content:center;border:0 !important}
.tick::before{content:"";display:block;width:1px;height:8px;margin-top:3px;background:var(--chrome-ink-3)}
.tick .tip{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);padding:5px 7px;border-radius:4px;background:var(--chrome);border:1px solid var(--chrome-hair);font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--chrome-ink);opacity:0;pointer-events:none}
.tick:hover .tip,.tick:focus-visible .tip{opacity:1}
.tick.first .tip{left:0;transform:none}
.tick.last .tip{left:auto;right:0;transform:none}

/* transcript */
.transcript{position:absolute;right:16px;bottom:calc(var(--ctrl-h) + 12px);z-index:45;width:min(420px,calc(100% - 32px));max-height:min(60vh,520px);display:flex;flex-direction:column;background:var(--page);color:var(--ink);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--card-shadow)}
.transcript[hidden]{display:none}
.tr-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-bottom:1px solid var(--hair);font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tr-head .cbtn{border-color:var(--hair) !important;color:var(--ink)}
.tr-list{list-style:none;margin:0;padding:6px 0;overflow-y:auto}
.tr-list li{margin:0}
.tr-list button{display:grid;grid-template-columns:48px 1fr;gap:10px;width:100%;padding:7px 16px;text-align:left;font:400 14px/1.35 var(--sans)}
.tr-list button:hover{background:var(--paper)}
.tr-list .tt{font:500 11px/1.6 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.tr-list .who{display:block;font:500 10px/1.4 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.tr-list .cap{font-weight:300;font-style:normal}

/* ---------- screen-space text (stage px, CSS minimums) ---------- */
#screen{
  --fs-note:max(22px, calc(14px / var(--s)));
  --fs-lab:max(11px, calc(11px / var(--s)));
  --fs-tag2:max(12px, calc(12px / var(--s)));
  --fs-cap:max(30px, calc(16px / var(--s)));
  --fs-chap:max(11px, calc(10px / var(--s)));
  --fs-step:max(11px, calc(10px / var(--s)));
  --fs-clock:max(18px, calc(13px / var(--s)));
  --fs-spoken:max(28px, calc(15px / var(--s)));
  --hair-px:calc(1px / var(--s));
  color:var(--ink);
}
.lab{font:500 var(--fs-lab)/1.25 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}

/* running head */
.hd{left:0;top:0;width:100%;height:max(56px, calc(40px / var(--s)));display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(245,243,238,.92);border-bottom:var(--hair-px) solid var(--hair)}
.hd-brand{display:flex;align-items:center;gap:max(9px, calc(6px / var(--s)))}
.hd-brand svg{width:max(20px, calc(16px / var(--s)));height:max(20px, calc(16px / var(--s)));color:var(--ink)}
.hd-brand span{font:500 max(17px, calc(13px / var(--s)))/1 var(--sans);letter-spacing:-.01em}
.hd-right{display:flex;align-items:center;gap:22px}
.hd-group{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hd-group em{font:normal 500 max(9px, calc(9px / var(--s)))/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.hd-steps{display:flex;gap:6px}
.step{position:relative;padding:4px 8px 5px;border:var(--hair-px) solid var(--ink-4);border-radius:999px;font:500 var(--fs-step)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
.step.dashed{border-style:dashed}
.step.on{color:var(--ink);border-color:var(--ink-3)}
.step::after{content:"";position:absolute;left:8px;right:8px;bottom:-5px;height:1.5px;background:var(--ink);transform:scaleX(0);transform-origin:left}
.step.cur::after{transform:scaleX(1)}
.hd-clock{font:400 var(--fs-clock)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em;padding-left:22px;border-left:var(--hair-px) solid var(--hair);white-space:nowrap}
.hd-compact{display:none;align-items:center;gap:10px}
.hd-compact b{font:500 var(--fs-step)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.hd-dots{display:flex;gap:max(5px, calc(4px / var(--s)))}
.hd-dots i{width:max(7px, calc(6px / var(--s)));height:max(7px, calc(6px / var(--s)));border-radius:50%;border:var(--hair-px) solid var(--ink-3)}
.hd-dots i.on{background:var(--ink);border-color:var(--ink)}
.hd-dots i.dashed{border-style:dashed}
.hd-dots i.dashed.on{border-style:solid}
.portrait .hd-right{display:none}
.portrait .chap{padding:4px 6px;margin:-4px -6px;border-radius:3px;background:rgba(251,250,247,.9)}
.portrait .hd-compact{display:flex}
.portrait .hd{padding:0 max(24px, calc(12px / var(--s)))}
.portrait .hd-compact .hd-clock{font-size:max(11px, calc(11px / var(--s)));padding-left:10px}

.chap{font:500 var(--fs-chap)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.corner{font:500 var(--fs-chap)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
/* the location label wraps on phones instead of running off the stage */
.portrait .loc{white-space:normal;max-width:852px;line-height:1.45}
/* model sheet route: the canvas sheet only */
.sheet #world,.sheet #screen{display:none}

/* spoken sentence beside Rasmus */
.spk{width:max-content;max-width:640px}
.portrait .spk{max-width:820px}
.spk-lab{margin-bottom:max(8px, calc(5px / var(--s)))}
.spk-txt{font:500 var(--fs-spoken)/1.25 var(--sans);color:var(--ink);white-space:normal;padding:2px 8px 4px;margin:-2px -8px -4px;border-radius:4px}
.spk-txt span{display:inline-block;white-space:pre}
.spk-cur{display:inline-block;width:max(2px, calc(1.5px / var(--s)));height:.95em;margin-left:2px;vertical-align:-.12em;background:var(--ink-3)}

/* agent notes: marginal annotations, never bubbles */
.note{left:0;top:0;width:max-content;padding:6px 8px;margin:-6px -8px;border-radius:4px;background:rgba(251,250,247,.86);max-width:calc(var(--fs-note) * 13.6)}
.note-lab{margin-bottom:max(5px, calc(4px / var(--s)))}
.note-txt{font:500 var(--fs-note)/1.3 var(--sans);color:var(--ink)}
.note-txt.mono{font-family:var(--mono);font-size:calc(var(--fs-note) * .9);letter-spacing:-.01em}

/* role tags under agents' feet */
.tag{left:0;top:0;width:max-content;text-align:center;padding:2px 6px;border-radius:3px;background:rgba(251,250,247,.8)}
.tag-1{font:500 var(--fs-lab)/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.tag-2{font:400 var(--fs-tag2)/1.3 var(--sans);color:var(--ink-2);white-space:nowrap}

/* narrator captions */
.cap{left:50%;top:auto;bottom:calc(900px - 846px - 6px);padding:2px 14px 6px;border-radius:6px;background:rgba(251,250,247,.84);width:max-content;max-width:1100px;transform:translateX(-50%);text-align:center;font:300 var(--fs-cap)/1.3 var(--sans);color:rgba(17,17,17,.85);text-wrap:balance}
.portrait .cap{display:none}

/* Ingrid inset label and initials */
.inset-lab{white-space:nowrap}
.initials{overflow:visible}
.initials path,.sig path{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}

/* Anna's phone card (landscape, stage px) */
.phone{left:860px;top:96px;width:660px;height:704px;padding:28px 32px 24px;background:var(--page);border:var(--hair-px) solid var(--hair);border-radius:28px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;color:var(--ink)}
.ph-lab{font:500 max(11px, calc(11px / var(--s)))/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.ph-title{margin-top:12px;font:500 max(22px, calc(16px / var(--s)))/1.2 var(--sans);letter-spacing:-.005em}
.ph-sub{margin-top:8px;display:flex;gap:10px;align-items:flex-start;font:400 max(16px, calc(13px / var(--s)))/1.4 var(--sans);color:var(--ink-2)}
.ph-sub svg{flex:none;width:max(18px, calc(14px / var(--s)));height:max(18px, calc(14px / var(--s)));margin-top:2px;color:var(--signal)}
.ph-opts{margin-top:18px;border-top:var(--hair-px) solid var(--hair)}
.ph-opt{position:relative;display:grid;grid-template-columns:max(22px, calc(16px / var(--s))) 1fr;gap:12px;padding:12px 10px;border-bottom:var(--hair-px) solid var(--hair)}
.ph-opt svg{width:max(20px, calc(15px / var(--s)));height:max(20px, calc(15px / var(--s)));margin-top:1px}
.ph-opt b{font:500 max(11px, calc(11px / var(--s)))/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-right:8px}
.ph-opt .h{font:500 max(16px, calc(13px / var(--s)))/1.35 var(--sans)}
.ph-opt .d{font:400 max(15px, calc(13px / var(--s)))/1.4 var(--sans);color:var(--ink-2)}
.ph-row{position:relative;padding:3px 6px;margin:2px -6px 0;border:var(--hair-px) solid transparent;border-radius:6px;font:400 max(15px, calc(13px / var(--s)))/1.4 var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums}
.ph-row.box{border-color:var(--ink);color:var(--ink)}
.ph-foot{margin-top:14px}
.ph-sign{position:relative;margin-top:auto;height:120px;border-top:var(--hair-px) dashed var(--ink-4);display:flex;align-items:flex-end;justify-content:space-between}
.ph-sign .ph-lab{padding-bottom:4px}
.ph-sign .sig{position:absolute;left:0;bottom:22px;width:300px;height:80px;overflow:visible}
.ph-ok{position:absolute;left:0;bottom:-2px;color:var(--ink)}
.ph-tap{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:var(--hair-px) solid var(--ink);pointer-events:none}

/* final frame */
.fin1{left:250px;top:389px;width:1100px;text-align:center;font:300 max(40px, calc(20px / var(--s)))/52px var(--sans);letter-spacing:-.005em}
.fin1 span{display:inline-block;white-space:pre}
.fin2{left:250px;top:519px;width:1100px;text-align:center;font:500 max(40px, calc(20px / var(--s)))/52px var(--sans);letter-spacing:-.005em}
.wm{left:777px;top:216px;font:500 max(64px, calc(28px / var(--s)))/64px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.credit{left:0;width:100%;text-align:center;font:500 max(12px, calc(10px / var(--s)))/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.credit.sm{font:400 max(10px, calc(10px / var(--s)))/1 var(--mono);letter-spacing:.11em}
.portrait .fin1{left:60px;width:780px;top:470px;line-height:1.3}
.portrait .fin2{left:60px;width:780px;top:auto}

/* ---------- world-space page text (pu, scales with camera; it is art, no minimums) ---------- */
#world{color:var(--ink)}
.w-rec{left:150px;font:500 28px/28px var(--sans);white-space:pre}
.w-rec span{display:inline-block;white-space:pre;transform-origin:50% 80%}
.w-ul{height:1px;background:var(--ink-3);transform-origin:0 50%}
.w-mono{font:500 10px/10px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.w-frame{font:500 11px/11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:pre}
.w-row{left:150px;width:610px;height:24px}
.w-row .gl{position:absolute;left:1px;top:3px;width:18px;height:18px;color:var(--ink);overflow:visible}
.w-row .lb{position:absolute;left:32px;top:0;font:400 16px/24px var(--sans);white-space:nowrap}
.w-row .ins{font:500 10px/10px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink);display:inline-block;margin-left:8px;vertical-align:1px}
.w-row .an{position:absolute;right:0;top:7px;font:500 10px/10px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;padding-bottom:3px}
.w-row .an.dotted{border-bottom:1px dotted var(--ink-4)}
.w-row.sig .lb,.w-row.sig .an{color:var(--signal)}
.w-row.sig .gl{color:var(--signal)}
.w-rib{font:500 10px/10px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.w-rib .ins{font:400 11px/10px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);display:inline-block;margin-left:5px}
.w-out{font:500 10px/10px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--signal);white-space:nowrap}
.w-foot{font:300 14px/14px var(--sans);color:var(--ink-2);white-space:nowrap}
.w-newrec{font:500 12px/12px var(--mono);letter-spacing:.06em;white-space:nowrap}
.w-desk{font:500 10px/10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}

/* decision card in the margin */
.w-dec{left:900px;top:340px;width:320px;height:260px;padding:14px 16px}
.w-dec .h{font:500 9.5px/12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.w-dec .t{margin-top:8px;font:500 13px/17px var(--sans)}
.w-dec .r{position:relative;display:grid;grid-template-columns:16px 1fr;gap:8px;margin-top:9px;font:400 12px/15.5px var(--sans);color:var(--ink)}
.w-dec .r svg{width:14px;height:14px;margin-top:1px}
.w-dec .sig{position:absolute;left:30px;bottom:6px;width:180px;height:48px;overflow:visible}

/* the slip (paper is DOM so it can cover page text while in flight) */
.w-slip{left:0;top:0;width:240px;height:450px;transform-origin:120px 225px;background:var(--page);border:.8px solid var(--hair);border-radius:4px}
.w-slip .in{position:absolute;left:14px;right:14px;top:16px}
.w-slip .hdr{font:500 10px/13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.w-slip .ln{margin-top:7px;font:400 12px/15px var(--sans);color:var(--ink)}
.w-slip .ln.hd2{font-weight:500}
.w-slip .ln.dev{display:grid;grid-template-columns:14px 1fr;gap:6px;color:var(--signal)}
.w-slip .ln.dev svg{width:13px;height:13px;margin-top:1px;color:var(--signal)}
.w-slip .ln.ins{position:relative}
.w-slip .ck{display:inline-block;width:11px;height:11px;margin-left:5px;vertical-align:-1px}
.w-slip .rule{position:absolute;left:14px;right:14px;height:0;border-top:.8px solid var(--ink-4)}
.w-slip .wu{position:absolute;left:14px;right:34px;font:400 11px/13px var(--sans);color:var(--ink)}
.w-slip .st{position:absolute;right:12px;width:18px;height:18px;margin-top:-9px;border:.9px solid var(--ink);border-radius:50%;font:500 6px/16px var(--mono);letter-spacing:.04em;text-align:center}
.w-slip .seal{position:absolute;left:12px;top:416px;display:flex;align-items:center;gap:6px}
.w-slip .seal-ring{width:30px;height:30px;border:1.2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.w-slip .seal-ring svg{width:20px;height:20px}
.w-slip .seal span{font:500 7.5px/9px var(--mono);letter-spacing:.1em;color:var(--ink)}
.w-slip .bound{position:absolute;left:18px;top:250px;width:204px;padding:7px 8px;border:1.1px solid var(--ink);border-radius:3px;font:500 9px/12px var(--mono);letter-spacing:.09em;text-transform:uppercase;text-align:center;color:var(--ink);background:rgba(251,250,247,.86)}
.w-tally{font:500 9px/9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap}

/* embossed cards rising from beneath the paper */
.w-emb{padding:7px 10px}
.w-emb .h{font:500 7.5px/9px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.w-emb .b{margin-top:3px;font:500 10.5px/13px var(--sans);color:var(--ink)}
.w-emb.c2 .b{font-size:9.5px;line-height:12px;margin-top:2px}

/* ---------- portrait caption dock ---------- */
#dock{display:none;flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:var(--paper);border-top:1px solid var(--hair);color:var(--ink);padding:10px 16px 8px}
.portrait #dock{display:block}
.dk-note{position:absolute;left:16px;right:16px}
.dk-note .l{font:500 11px/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.dk-note .x{margin-top:2px;font:500 15px/1.3 var(--sans)}
.dk-note .x.mono{font-family:var(--mono);font-size:14px}
.dk-cap{position:absolute;left:16px;right:16px;bottom:10px;font:300 16px/1.35 var(--sans);color:rgba(17,17,17,.85);text-align:center}

/* portrait phone card overlay (CSS px) */
#phoneP{position:absolute;left:4%;top:calc((100% - var(--ctrl-h)) / 2);width:92%;z-index:25;display:none;padding:16px 16px 14px;background:var(--page);color:var(--ink);border:1px solid var(--hair);border-radius:20px;box-shadow:var(--card-shadow)}
.portrait #phoneP{display:block}
#phoneP .ph-lab{font-size:11px}
#phoneP .ph-title{font-size:18px;margin-top:8px}
#phoneP .ph-sub{font-size:13px;margin-top:6px}
#phoneP .ph-sub svg{width:14px;height:14px}
#phoneP .ph-opts{margin-top:10px}
#phoneP .ph-opt{grid-template-columns:16px 1fr;gap:8px;padding:8px 6px}
#phoneP .ph-opt svg{width:15px;height:15px}
#phoneP .ph-opt b{font-size:10px}
#phoneP .ph-opt .h{font-size:14px}
#phoneP .ph-row{font-size:13px}
#phoneP .ph-sign{height:74px;margin-top:10px}
#phoneP .ph-sign .sig{width:180px;height:48px;bottom:16px}
#phoneP .ph-ok{font-size:10px}

/* ---------- small screens ---------- */
@media (max-width:1100px){ .c-tag{display:none} }
@media (max-width:900px){ .c-chap{display:none} #b-replay .lbl,#b-sound .lbl,#b-trans .lbl{display:none} #b-replay,#b-sound,#b-trans{width:32px;padding:0} }
@media (max-width:479px){
  :root{--ctrl-h:76px}
  .controls{flex-wrap:wrap;align-content:center;gap:0 2px;padding:0 6px;justify-content:space-between}
  .scrubwrap{order:-1;flex:1 0 100%;height:28px}
  .scrub .track{top:13px}
  .scrub .knob{top:8px}
  .ticks{display:none}
  .cbtn{height:44px;min-width:44px;width:44px;padding:0;border-color:transparent !important}
  .cbtn.round{width:44px;height:44px}
  .c-time{font-size:11px;letter-spacing:0}
}
@media (pointer:coarse){ .cbtn{min-width:44px;min-height:44px} }

@media (prefers-reduced-motion: reduce){
  .film *,.film *::before,.film *::after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
