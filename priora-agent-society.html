<style>/* Where They Meet: a single dark cinema look. The film commits to one visual world,
   so the page keeps the same palette in light and dark viewer themes. */
:root {
  --black: #000000;
  --ink: #05090d;
  --paper: #f4efe6;
  --dim: rgba(244, 239, 230, 0.62);
  --faint: rgba(244, 239, 230, 0.18);
  --ember: #ffb45c;
  --sans: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--black); color: var(--paper); }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#film { position: fixed; inset: 0; background: var(--black); user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Cover */
#cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 55%, rgba(5, 9, 13, 0.35), rgba(5, 9, 13, 0.82) 70%);
  transition: opacity 0.7s ease; z-index: 5; }
#cover.gone { opacity: 0; pointer-events: none; }
.cover-in { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 0 16px; text-align: center; }
#bigplay { width: clamp(84px, 11vmin, 132px); height: clamp(84px, 11vmin, 132px); border: 0; padding: 0; background: none; cursor: pointer; color: var(--paper); border-radius: 30%; }
#bigplay svg { width: 100%; height: 100%; overflow: visible; }
#bigplay .mk { fill: none; stroke: currentColor; stroke-width: 0.7; transition: stroke-width 0.3s ease; }
#bigplay .tri { fill: var(--ember); transition: transform 0.3s ease; transform-origin: 12px 12px; }
#bigplay:hover .mk, #bigplay:focus-visible .mk { stroke-width: 1.05; }
#bigplay:hover .tri, #bigplay:focus-visible .tri { transform: scale(1.12); }
#bigplay:focus-visible { outline: 1px solid var(--dim); outline-offset: 8px; }
.cover-title { font: 300 clamp(28px, 4.4vmin, 54px)/1.1 var(--sans); letter-spacing: -0.01em; }
.cover-sub { font: 500 clamp(10px, 1.25vmin, 13px)/1.4 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }

/* Controls: hidden while the film plays, shown on pointer movement or focus. */
#bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; gap: 14px;
  padding: 26px max(16px, 2.2vw) calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0));
  opacity: 1; transition: opacity 0.5s ease; }
#film.playing.idle #bar { opacity: 0; }
#film.playing.idle { cursor: none; }
#film.cover-on #bar { opacity: 0; pointer-events: none; }
#bar button { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; padding: 0; background: none; color: var(--paper); cursor: pointer; border-radius: 50%; }
#bar button:hover { background: rgba(244, 239, 230, 0.08); }
#bar button:focus-visible, #scrub:focus-visible { outline: 1px solid var(--dim); outline-offset: 2px; }
#bar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#pp .i-play, #pp .i-pause, #pp .i-replay { display: none; }
#pp .i-play, #pp .i-pause { fill: currentColor; stroke: none; }
#film:not(.playing):not(.ended) #pp .i-play { display: block; }
#film.playing #pp .i-pause { display: block; }
#film.ended #pp .i-replay { display: block; }
#snd .i-x { display: none; }
#film.muted #snd .i-wave { display: none; }
#film.muted #snd .i-x { display: block; }
#scrub { position: relative; flex: 1; min-width: 60px; height: 32px; cursor: pointer; touch-action: none; }
#rail { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--faint); border-radius: 2px; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--paper); border-radius: 2px; }
#knob { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; left: 0; border-radius: 50%; background: var(--paper); transform: scale(0.75); transition: transform 0.2s ease; }
#scrub:hover #knob, #scrub:focus-visible #knob { transform: scale(1); }
#time { flex: none; font: 500 12px/1 var(--mono); letter-spacing: 0.06em; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 88px; text-align: right; }
@media (max-width: 520px) {
  #bar { gap: 6px; padding-top: 18px; }
  #bar button { width: 44px; height: 44px; }
  #time { min-width: 0; font-size: 11px; }
}
</style>

<script>(function () {
'use strict';
/* ==== 00-core.js ==== */
/* Core: stage size, timing, easing, hashing, noise, colour, glow sprites and shared geometry.
   Everything on screen is a pure function of the film time t. */

const W = 1920, H = 1080;
const DURATION = 75;
const TAU = Math.PI * 2;
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = p => p * p * (3 - 2 * p);
const easeIO = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeIO2 = p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeOut5 = p => 1 - Math.pow(1 - p, 5);

  function stopAll() { for (const n of live) { try { n.stop(); } catch (e) { /* ignore */ } } live.clear(); }
  function seekIdx(t) { nextIdx = 0; while (nextIdx < CUES.length && CUES[nextIdx][0] < t) nextIdx++; }

  return {
    init() { init(); if (ac) seekIdx(lastT); },
    resume() { if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); },
    pauseAll() { if (!ac) return; stopAll(); if (beds) for (const k of ['room', 'sea', 'pad', 'market']) beds[k].gain.setTargetAtTime(0, ac.currentTime, 0.05); },
    seek(t) { lastT = t; if (!ac) return; stopAll(); seekIdx(t); },
    setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.85, ac.currentTime, 0.05); },
    update(t, playing) {
      lastT = t;
      if (!ac || !playing || ac.state !== 'running') return;
      const now = ac.currentTime;
      const L = bedLevels(t);
      for (const k in L) beds[k].gain.setTargetAtTime(L[k], now, 0.12);
      while (nextIdx < CUES.length && CUES[nextIdx][0] < t + 0.2) {
        const [ct, fn] = CUES[nextIdx++];
        if (ct < t - 0.15) continue;
        try { fn(now + Math.max(0, ct - t)); } catch (e) { /* a failed cue never stops the film */ }
      }
    },
  };
})();

/* ==== 20-room.js ==== */
/* The real world: Production Room 4 at Nordhavn, early morning. A side-on, cinematic illustration.
   Static parts are painted once into a layer; light, the worker, the detector LED, the blanket,
   the arc and the drain are drawn live. */

function makeLayer(w = W, h = H) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * VIEW.k));
  c.height = Math.max(1, Math.round(h * VIEW.k));
  const g = c.getContext('2d');
  g.setTransform(VIEW.k, 0, 0, VIEW.k, 0, 0);
  return { c, g };
}

const RC = {
  ceil: '#0f1518', wallTop: '#26333a', wallBot: '#34444b', wainscot: '#2f3d44', seam: 'rgba(0,0,0,0.22)',
  floorBack: '#2a3338', floorFront: '#141a1d', steelHi: '#d7e0e3', steel: '#8b999f', steelLo: '#47535a',
  warm: '#ffc27a', warmHi: '#ffe7c2', box: '#94703f', boxDark: '#7a5a31', wood: '#5a4330',
  coverall: '#2b3a48', coverallDark: '#1f2b36', rim: 'rgba(226,160,104,0.75)', skin: '#b47e5c', glove: '#9a6f45', boot: '#17191b',
  helmet: '#41484e', visor: '#121619',
};

let ROOM_LAYER = null, ROOM_BLUR = null;
function prerenderRoom() {
  ROOM_LAYER = makeLayer();
  paintRoom(ROOM_LAYER.g);
  // A cheap, strong blur for close-up backgrounds: downscale then upscale.
  const small = document.createElement('canvas');
  small.width = 120; small.height = 68;
  const sg = small.getContext('2d');
  sg.imageSmoothingQuality = 'high';
  sg.drawImage(ROOM_LAYER.c, 0, 0, 120, 68);
  ROOM_BLUR = small;
}

function paintRoom(g) {
  const { window: win, pipe, tank, pallet, floorY } = ROOM;
  // Ceiling
  g.fillStyle = RC.ceil;

  g.fillStyle = '#0a0f11';
  g.fillRect(0, 92, W, 8);
  // cable tray
  g.fillStyle = '#1b2327';
  g.fillRect(0, 60, W, 10);
  // Back wall
  let gr = g.createLinearGradient(0, 100, 0, floorY);
  gr.addColorStop(0, RC.wallTop);
  gr.addColorStop(1, RC.wallBot);
  g.fillStyle = gr;
  g.fillRect(0, 100, W, floorY - 100);
  g.fillStyle = RC.wainscot;
  g.fillRect(0, 660, W, floorY - 660);
  g.fillStyle = 'rgba(255,255,255,0.05)';
  g.fillRect(0, 658, W, 2);
  for (let x = 120; x < W; x += 270) {
    g.fillStyle = RC.seam; g.fillRect(x, 100, 2, floorY - 100);

  }
  // Warm spill on the wall around the window
  gr = g.createRadialGradient(win.x + win.w / 2, win.y + win.h / 2, 40, win.x + win.w / 2, win.y + win.h / 2, 620);
  gr.addColorStop(0, 'rgba(255,190,120,0.16)');
  gr.addColorStop(1, 'rgba(255,190,120,0)');
  g.fillStyle = gr;
  g.fillRect(0, 100, 1300, floorY - 100);
  // Window
  g.fillStyle = '#151c20';
  g.fillRect(win.x - 16, win.y - 16, win.w + 32, win.h + 32);
  gr = g.createLinearGradient(0, win.y, 0, win.y + win.h);
  gr.addColorStop(0, '#fff3dd');
  gr.addColorStop(0.55, '#ffd49a');
  gr.addColorStop(1, '#f7aa5e');
  g.fillStyle = gr;
  g.fillRect(win.x, win.y, win.w, win.h);
  g.fillStyle = 'rgba(255,255,255,0.25)';
  g.beginPath(); g.moveTo(win.x + 30, win.y); g.lineTo(win.x + 120, win.y); g.lineTo(win.x + 40, win.y + win.h); g.lineTo(win.x - 50 + 30, win.y + win.h); g.closePath(); g.fill();
  g.fillStyle = '#151c20';
  g.fillRect(win.x + win.w / 3 - 4, win.y, 8, win.h);
  g.fillRect(win.x + 2 * win.w / 3 - 4, win.y, 8, win.h);
  g.fillRect(win.x, win.y + win.h / 2 - 4, win.w, 8);
  g.fillStyle = '#20292e';
  g.fillRect(win.x - 22, win.y + win.h + 16, win.w + 44, 12);
  // Wall pipe penetration and main pipe
  const py = pipe.y, pd = pipe.d;
  g.fillStyle = 'rgba(0,0,0,0.28)';
  g.fillRect(pipe.x0, py + pd / 2 + 6, pipe.x1 - pipe.x0, 16);
  steelPipeH(g, pipe.x0, pipe.x1, py, pd);
  g.fillStyle = '#56636a';
  g.fillRect(pipe.x0 - 14, py - pd / 2 - 14, 18, pd + 28);
  g.fillStyle = 'rgba(255,255,255,0.18)';
  g.fillRect(pipe.x0 - 14, py - pd / 2 - 14, 18, 3);
  // Brackets
  for (let x = pipe.x0 + 120; x < pipe.x1 - 40; x += 230) {
    if (Math.abs(x - ROOM.flange.x) < 90) continue;
    g.fillStyle = '#1e272b';
    g.fillRect(x - 5, py + pd / 2, 10, 44);
    g.fillRect(x - 18, py + pd / 2 + 38, 36, 8);
  }
  // Vertical pipe from the ceiling, with valve
  steelPipeV(g, 1450, 100, py - pd / 2, 30);
  g.fillStyle = '#5e6b71';
  g.fillRect(1430, py - pd / 2 - 10, 40, 14);
  valveWheel(g, 1450, 360, 34);
  // Flange (the weld joint), drawn twice for the two pipe ends
  flange(g, ROOM.flange.x - 17, py, pd);
  flange(g, ROOM.flange.x + 17, py, pd);
  // Tank
  paintTank(g, tank);
  // Floor
  gr = g.createLinearGradient(0, floorY, 0, H);
  gr.addColorStop(0, RC.floorBack);
  gr.addColorStop(1, RC.floorFront);
  g.fillStyle = gr;
  g.fillRect(0, floorY, W, H - floorY);
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.fillRect(0, floorY, W, 6);
  g.strokeStyle = 'rgba(255,255,255,0.035)';
  g.lineWidth = 2;
  for (let i = -12; i <= 12; i++) {
    g.beginPath(); g.moveTo(960 + i * 150, floorY); g.lineTo(960 + i * 520, H); g.stroke();
  }
  [834, 880, 944, 1030].forEach(y => { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); });
  // Pallet shadow and pallet
  g.fillStyle = 'rgba(0,0,0,0.4)';
  g.beginPath(); g.ellipse(pallet.x + pallet.w / 2 + 30, floorY + 34, pallet.w * 0.62, 18, 0, 0, TAU); g.fill();
  paintPallet(g, pallet);
  // Tank shadow
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.beginPath(); g.ellipse(tank.x + tank.w / 2, floorY + 18, tank.w * 0.6, 14, 0, 0, TAU); g.fill();
  // Detector base plate (LED drawn live)
  const d = ROOM.detector;
  g.fillStyle = '#c7cdd0';
  g.beginPath(); g.ellipse(d.x, d.y - 4, 30, 6, 0, 0, TAU); g.fill();
  gr = g.createLinearGradient(0, d.y - 4, 0, d.y + 14);
  gr.addColorStop(0, '#e6eaec'); gr.addColorStop(1, '#a9b1b5');
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(d.x, d.y - 2, 24, 16, 0, 0, Math.PI); g.fill();
  g.fillStyle = '#d6dbdd';
  g.fillRect(d.x - 2, 92, 4, d.y - 96);
}

function steelPipeH(g, x0, x1, y, d) {
  const gr = g.createLinearGradient(0, y - d / 2, 0, y + d / 2);
  gr.addColorStop(0, RC.steelLo); gr.addColorStop(0.18, RC.steelHi); gr.addColorStop(0.42, RC.steel); gr.addColorStop(1, '#2f383d');
  g.fillStyle = gr;
  g.fillRect(x0, y - d / 2, x1 - x0, d);
}
function steelPipeV(g, x, y0, y1, d) {
  const gr = g.createLinearGradient(x - d / 2, 0, x + d / 2, 0);
  gr.addColorStop(0, RC.steelLo); gr.addColorStop(0.25, RC.steelHi); gr.addColorStop(0.5, RC.steel); gr.addColorStop(1, '#2f383d');
  g.fillStyle = gr;
  g.fillRect(x - d / 2, y0, d, y1 - y0);
}
function flange(g, x, y, d) {
  const h = d + 30, w = 18;
  const gr = g.createLinearGradient(0, y - h / 2, 0, y + h / 2);
  gr.addColorStop(0, '#5c686e'); gr.addColorStop(0.2, '#e3eaec'); gr.addColorStop(0.5, '#97a5aa'); gr.addColorStop(1, '#2c353a');
  g.fillStyle = gr;
  g.fillRect(x - w / 2, y - h / 2, w, h);
  g.fillStyle = '#20282c';
  for (let i = 0; i < 3; i++) g.fillRect(x - 3, y - h / 2 + 6 + i * (h - 14) / 2, 6, 4);
}
function valveWheel(g, x, y, r) {
  g.strokeStyle = '#7a3428'; g.lineWidth = 7;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
  g.lineWidth = 4;
  for (let i = 0; i < 3; i++) { const a = i * TAU / 3 + 0.3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); g.stroke(); }
  g.fillStyle = '#4b1f18'; g.beginPath(); g.arc(x, y, 7, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,200,170,0.25)'; g.lineWidth = 2;
  g.beginPath(); g.arc(x, y, r - 1, Math.PI * 1.05, Math.PI * 1.55); g.stroke();
}
function paintTank(g, k) {
  const gr = g.createLinearGradient(k.x, 0, k.x + k.w, 0);
  gr.addColorStop(0, '#2c3539'); gr.addColorStop(0.16, '#8c999e'); gr.addColorStop(0.26, '#cfd8db');
  gr.addColorStop(0.4, '#77858b'); gr.addColorStop(0.85, '#3d484d'); gr.addColorStop(1, '#232b2f');
  g.fillStyle = gr;
  g.fillRect(k.x, k.y + 40, k.w, k.h - 70);
  g.beginPath(); g.ellipse(k.x + k.w / 2, k.y + 40, k.w / 2, 46, 0, Math.PI, TAU); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.25)';
  [k.y + 230, k.y + 430].forEach(y => g.fillRect(k.x, y, k.w, 3));
  g.fillStyle = 'rgba(255,255,255,0.12)';
  [k.y + 233, k.y + 433].forEach(y => g.fillRect(k.x, y, k.w, 2));
  // legs
  g.fillStyle = '#20282c';
  g.fillRect(k.x + 30, k.y + k.h - 32, 14, 32);
  g.fillRect(k.x + k.w - 44, k.y + k.h - 32, 14, 32);
  // manway
  const mx = k.x + k.w * 0.58, my = k.y + 330;
  g.fillStyle = '#5a676c'; g.beginPath(); g.ellipse(mx, my, 46, 52, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 2; g.beginPath(); g.ellipse(mx, my, 46, 52, 0, Math.PI * 1.1, Math.PI * 1.6); g.stroke();
  g.fillStyle = '#2a3236';
  for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; g.beginPath(); g.arc(mx + Math.cos(a) * 40, my + Math.sin(a) * 46, 3, 0, TAU); g.fill(); }
  // gauge
  g.fillStyle = '#e8ecee'; g.beginPath(); g.arc(k.x + 92, k.y + 150, 20, 0, TAU); g.fill();
  g.strokeStyle = '#1b2125'; g.lineWidth = 3; g.beginPath(); g.arc(k.x + 92, k.y + 150, 20, 0, TAU); g.stroke();
  g.beginPath(); g.moveTo(k.x + 92, k.y + 150); g.lineTo(k.x + 104, k.y + 141); g.stroke();
  // stencil
  font(g, 15, 500, MONO);
  g.fillStyle = 'rgba(20,26,29,0.55)';
  g.textAlign = 'left';
  spacedText(g, 'R4 · T01', k.x + 132, k.y + 520, 3);
}
function paintPallet(g, p) {
  // pallet base
  g.fillStyle = RC.wood;
  g.fillRect(p.x, p.y + p.h - 28, p.w, 10);
  g.fillRect(p.x, p.y + p.h - 8, p.w, 8);
  g.fillStyle = '#3d2d20';
  for (let i = 0; i < 3; i++) g.fillRect(p.x + 8 + i * (p.w - 36) / 2, p.y + p.h - 18, 20, 10);
  // boxes: 2 columns x 3 rows
  const bw = p.w / 2, bh = (p.h - 28) / 3;
  for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) {
    const x = p.x + c * bw, y = p.y + r * bh;
    g.fillStyle = (r + c) % 2 ? RC.box : '#a07a46';
    g.fillRect(x + 2, y + 2, bw - 4, bh - 4);
    g.fillStyle = 'rgba(0,0,0,0.12)';
    g.fillRect(x + 2, y + bh - 14, bw - 4, 12);
    g.fillStyle = 'rgba(232,214,170,0.55)';
    g.fillRect(x + bw / 2 - 6, y + 2, 12, bh - 4);
    g.fillStyle = 'rgba(30,20,10,0.5)';
    g.fillRect(x + 18, y + 18, 34, 3);
    g.fillRect(x + 18, y + 25, 22, 3);
  }
  // shrink wrap sheen
  g.fillStyle = 'rgba(220,235,255,0.07)';
  g.fillRect(p.x - 3, p.y - 3, p.w + 6, p.h - 22);
  g.fillStyle = 'rgba(255,255,255,0.16)';
  for (let i = 0; i < 4; i++) {
    const x = p.x + 30 + i * 70;
    g.beginPath(); g.moveTo(x, p.y); g.lineTo(x + 18, p.y); g.lineTo(x - 50, p.y + p.h - 30); g.lineTo(x - 64, p.y + p.h - 30); g.closePath(); g.fill();
  }
}

/* Light from the window: two soft beams with drifting dust. */
function drawBeams(g, t, a) {
  if (a <= 0) return;
  const { window: win } = ROOM;
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 2; i++) {
    const sway = noise1(t * 0.15 + i * 9) * 14;
    const x0 = win.x + 10 + i * 160, x1 = x0 + 150;
    const gr = g.createLinearGradient(x0, win.y + win.h, x0 + 520, 1000);
    gr.addColorStop(0, `rgba(255,200,130,${0.16 * a})`);
    gr.addColorStop(1, 'rgba(255,200,130,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(x0, win.y + win.h * 0.2);
    g.lineTo(x1, win.y + win.h * 0.2);
    g.lineTo(x1 + 560 + sway, 1040);
    g.lineTo(x0 + 330 + sway, 1040);
    g.closePath();
    g.fill();
  }
  // floor pool
  const pg = g.createRadialGradient(840, 880, 10, 840, 880, 380);
  pg.addColorStop(0, `rgba(255,190,120,${0.12 * a})`);
  pg.addColorStop(1, 'rgba(255,190,120,0)');
  g.fillStyle = pg;
  g.beginPath(); g.ellipse(840, 890, 420, 90, 0, 0, TAU); g.fill();
  g.restore();
  // dust
  for (let i = 0; i < 70; i++) {
    const bx = 300 + h1(i * 3.1) * 820, by = 360 + h1(i * 5.7) * 560;
    const x = bx + noise1(t * 0.12 + i) * 40 + t * 3, y = by + noise1(t * 0.1 + i * 2.3) * 30 - t * 2;
    const inBeam = clamp(1 - Math.abs((x - 360) - (y - 380) * 0.95 - 120) / 300);
    glow(g, x, y, 3 + h1(i) * 4, '#ffd9a8', 0.5 * a * inBeam * (0.4 + 0.6 * h1(i * 9)));
  }
}

function drawDetectorLED(g, t, mode) {
  const d = ROOM.detector;
  if (mode === 'off') {
    g.fillStyle = '#3a4246'; g.beginPath(); g.arc(d.x, d.y + 8, 3.5, 0, TAU); g.fill();
    return;
  }
  const on = (t % 1.6) < 0.18;
  g.fillStyle = on ? '#7dffb0' : '#2d6b49';
  g.beginPath(); g.arc(d.x, d.y + 8, 3.5, 0, TAU); g.fill();
  if (on) glow(g, d.x, d.y + 8, 22, '#5dff9c', 0.8);
}

/* The floor drain: the rounded square opening between the two worlds. */
function drawDrain(g, x, y, w, h, inner, grateA = 1) {
  g.save();
  markPath(g, x, y, w * 1.18, h * 1.18);
  g.fillStyle = '#566167';
  g.fill();
  markPath(g, x, y, w * 1.08, h * 1.08);
  g.fillStyle = '#2b3337';
  g.fill();
  markPath(g, x, y, w, h);
  g.fillStyle = inner || '#070c10';
  g.fill();
  g.clip();
  // grate slots
  g.fillStyle = `rgba(120,135,140,${0.85 * grateA})`;
  const n = 7;
  for (let i = 0; i < n; i++) {
    const sx = x - w / 2 + (i + 0.5) * w / n;
    g.fillRect(sx - w * 0.018, y - h / 2, w * 0.036, h);
  }
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.18)';
  g.lineWidth = Math.max(1, h * 0.04);
  markPath(g, x, y, w * 1.18, h * 1.18);
  g.stroke();
}

/* The fire blanket over the pallet; p is how far it has fallen (0 up, 1 settled). */
function drawBlanket(g, p) {
  if (p <= 0) return;
  const pl = ROOM.pallet;
  const drop = (1 - spring(p, 5, 9)) * -260;
  const sag = 1 - p;
  g.save();
  g.translate(0, drop);
  const x0 = pl.x - 18, x1 = pl.x + pl.w + 18, top = pl.y - 14;
  const gr = g.createLinearGradient(0, top, 0, pl.y + pl.h);
  gr.addColorStop(0, '#9aa3a6'); gr.addColorStop(1, '#5e676b');
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(x0 + 10, top + 10 + sag * 30);
  g.quadraticCurveTo((x0 + x1) / 2, top - 6 - sag * 20, x1 - 10, top + 10 + sag * 30);
  g.lineTo(x1 + 6, pl.y + pl.h - 30 - sag * 140);
  for (let i = 0; i <= 6; i++) {
    const x = lerp(x1 + 6, x0 - 6, i / 6);
    g.lineTo(x, pl.y + pl.h - 30 - sag * 140 + (i % 2 ? 10 : 0));
  }
  g.closePath();
  g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.18)';
  g.lineWidth = 3;
  for (let i = 1; i < 5; i++) {
    const x = lerp(x0, x1, i / 5);
    g.beginPath(); g.moveTo(x, top + 20); g.quadraticCurveTo(x + 10, pl.y + pl.h * 0.5, x - 6, pl.y + pl.h - 40 - sag * 140); g.stroke();
  }
  g.fillStyle = 'rgba(255,255,255,0.12)';
  g.fillRect(x0 + 20, top + 6 + sag * 26, x1 - x0 - 40, 4);
  // safety tag
  g.fillStyle = '#c8402a';
  g.fillRect(x1 - 44, top + 40, 22, 30);
  g.restore();
}

/* The worker. Poses: 'speak' (kneeling, phone near mouth), 'ready' (kneeling, visor up, torch low),
   'weld' (kneeling, visor down, torch at the flange), 'cover' (standing by the pallet). */
function limb(g, pts, w, col, rim) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = col; g.lineWidth = w;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.stroke();
  if (rim) {
    // a soft lit plane along the side facing the window, instead of an outline
    g.strokeStyle = 'rgba(150,170,190,0.16)'; g.lineWidth = w * 0.42;
    g.beginPath(); g.moveTo(pts[0][0] - w * 0.2, pts[0][1] - w * 0.22);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] - w * 0.2, pts[i][1] - w * 0.22);
    g.stroke();
  }
}
function drawWorker(g, pose, t, o = {}) {
  const talk = o.talk || 0;
  if (pose === 'cover') return drawWorkerStanding(g, t, o);
  const K = [ROOM.worker.x, ROOM.worker.y];
  const breathe = Math.sin(t * 1.6) * 1.5;
  const hip = [K[0] - 22, K[1] - 100], sh = [K[0] + 4, K[1] - 222 + breathe];
  const headC = [sh[0] + 24, sh[1] - 40];
  // shadow
  g.fillStyle = 'rgba(0,0,0,0.38)';
  g.beginPath(); g.ellipse(K[0] + 10, K[1] + 4, 120, 12, 0, 0, TAU); g.fill();
  // far arm
  let elbowF, handF;
  if (pose === 'weld') { elbowF = [sh[0] + 58, sh[1] + 38]; handF = [sh[0] + 104, sh[1] + 10]; }
  else { elbowF = [sh[0] + 46, sh[1] + 64]; handF = [sh[0] + 92, sh[1] + 74]; }
  limb(g, [[sh[0] - 4, sh[1] + 8], elbowF, handF], 26, RC.coverallDark);
  // torch
  const tip = pose === 'weld' ? [ROOM.flange.x - 4, ROOM.pipe.y + 16] : [handF[0] + 46, handF[1] - 22];
  g.strokeStyle = '#2a2f33'; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath(); g.moveTo(handF[0] - 4, handF[1] + 4); g.lineTo(tip[0], tip[1]); g.stroke();
  g.strokeStyle = '#9aa6ab'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(lerp(handF[0], tip[0], 0.7), lerp(handF[1], tip[1], 0.7)); g.lineTo(tip[0], tip[1]); g.stroke();
  g.strokeStyle = '#1b1f22'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(handF[0] - 6, handF[1] + 8); g.quadraticCurveTo(handF[0] - 60, K[1] + 10, handF[0] - 160, K[1] + 2); g.stroke();
  g.fillStyle = RC.glove; g.beginPath(); g.arc(handF[0], handF[1], 13, 0, TAU); g.fill();
  // back leg (kneeling on the near knee)
  limb(g, [[K[0] - 90, K[1] - 4], K, hip], 34, RC.coverallDark);
  g.fillStyle = RC.boot; g.beginPath(); g.ellipse(K[0] - 96, K[1] - 8, 22, 12, -0.2, 0, TAU); g.fill();
  // torso
  g.fillStyle = RC.coverall;
  torsoPath(g, hip, sh, 0); g.fill();
  g.save(); torsoPath(g, hip, sh, 0); g.clip();
  const tg = g.createLinearGradient(sh[0] - 50, 0, sh[0] + 40, 0);
  tg.addColorStop(0, 'rgba(232,170,110,0.32)'); tg.addColorStop(0.35, 'rgba(232,170,110,0)');
  g.fillStyle = tg; g.fillRect(sh[0] - 80, sh[1] - 40, 180, hip[1] - sh[1] + 80);
  // reflective bands
  g.fillStyle = 'rgba(205,215,220,0.6)';
  g.fillRect(sh[0] - 80, lerp(hip[1], sh[1], 0.6), 180, 8);
  g.fillRect(sh[0] - 80, lerp(hip[1], sh[1], 0.6) + 16, 180, 4);
  g.restore();
  // front leg
  const knee2 = [K[0] + 78, K[1] - 92], foot2 = [K[0] + 86, K[1] - 4];
  limb(g, [hip, knee2, foot2], 34, RC.coverall, RC.rim);
  g.fillStyle = RC.boot; g.beginPath(); g.ellipse(foot2[0] + 12, foot2[1] - 2, 26, 12, 0, 0, TAU); g.fill();
  // head and helmet
  drawWorkerHead(g, headC, pose === 'weld' ? 1 : o.visor || 0, talk, t, o.look || 0);
  // near arm
  if (pose === 'speak') {
    const el = [sh[0] - 18, sh[1] + 70], hand = [headC[0] + 34, headC[1] + 30];
    limb(g, [[sh[0] + 6, sh[1] + 10], el, hand], 28, RC.coverall, RC.rim);
    drawPhoneSmall(g, hand[0] + 6, hand[1] - 18, o.phoneGlow || 0);
    g.fillStyle = RC.glove; g.beginPath(); g.arc(hand[0], hand[1], 14, 0, TAU); g.fill();
  } else {
    const el = [sh[0] + 10, sh[1] + 84], hand = [sh[0] + 66, sh[1] + 96];
    limb(g, [[sh[0] + 6, sh[1] + 10], el, hand], 28, RC.coverall, RC.rim);
    g.fillStyle = RC.glove; g.beginPath(); g.arc(hand[0], hand[1], 14, 0, TAU); g.fill();
  }
}
function torsoPath(g, hip, sh, off) {
  const o = off;
  g.beginPath();
  g.moveTo(hip[0] - 36 + o, hip[1] + 16 + o);
  g.bezierCurveTo(hip[0] - 52 + o, hip[1] - 40 + o, sh[0] - 50 + o, sh[1] + 40 + o, sh[0] - 26 + o, sh[1] - 6 + o);
  g.quadraticCurveTo(sh[0] + 4 + o, sh[1] - 22 + o, sh[0] + 34 + o, sh[1] + 2 + o);
  g.bezierCurveTo(sh[0] + 46 + o, sh[1] + 40 + o, hip[0] + 46 + o, hip[1] - 30 + o, hip[0] + 40 + o, hip[1] + 16 + o);
  g.closePath();
}
function drawWorkerHead(g, c, visorDown, talk, t, look) {
  const [x, y] = c;
  // neck
  g.fillStyle = RC.skin; g.fillRect(x - 12, y + 20, 22, 22);
  // face (profile, facing right)
  g.fillStyle = RC.skin;
  g.beginPath(); g.ellipse(x + 4, y + 4, 27, 31, 0, 0, TAU); g.fill();
  // nose and beard
  g.beginPath(); g.moveTo(x + 28, y - 4); g.lineTo(x + 38, y + 10); g.lineTo(x + 27, y + 12); g.closePath(); g.fill();
  g.fillStyle = '#3a2b21';
  g.beginPath(); g.moveTo(x - 10, y + 12); g.quadraticCurveTo(x + 2, y + 40, x + 26, y + 30); g.lineTo(x + 30, y + 20); g.quadraticCurveTo(x + 10, y + 22, x - 10, y + 12); g.fill();
  // mouth
  const open = talk > 0 ? (0.5 + 0.5 * Math.sin(t * 38)) * talk : 0;
  g.fillStyle = '#2a1a12';
  g.beginPath(); g.ellipse(x + 24, y + 21, 5, 1.5 + open * 4, 0, 0, TAU); g.fill();
  // eye
  g.fillStyle = '#1a1210';
  g.beginPath(); g.ellipse(x + 20 + look * 2, y - 4, 2.6, 3.2, 0, 0, TAU); g.fill();
  g.strokeStyle = '#3a2b21'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + 13, y - 13); g.lineTo(x + 27, y - 12); g.stroke();
  // ear
  g.fillStyle = '#9c6a4c'; g.beginPath(); g.ellipse(x - 8, y + 2, 6, 9, 0, 0, TAU); g.fill();
  // helmet shell
  g.fillStyle = RC.rim;
  g.beginPath(); g.ellipse(x - 4 - 2, y - 6 - 2, 34, 34, 0, Math.PI * 0.62, Math.PI * 1.95); g.fill();
  g.fillStyle = RC.helmet;
  g.beginPath(); g.ellipse(x - 4, y - 6, 34, 34, 0, Math.PI * 0.62, Math.PI * 1.95); g.fill();
  // visor: raised sits on top; lowered covers the face
  g.save();
  g.translate(x - 2, y - 10);
  g.rotate(lerp(-1.25, 0, visorDown));
  g.fillStyle = RC.visor;
  g.beginPath(); g.moveTo(4, -30); g.quadraticCurveTo(46, -26, 44, 8); g.quadraticCurveTo(42, 40, 18, 44); g.lineTo(14, 30); g.quadraticCurveTo(28, 6, 4, -30); g.closePath(); g.fill();
  g.fillStyle = 'rgba(120,170,200,0.25)';
  g.beginPath(); g.moveTo(26, -14); g.quadraticCurveTo(38, -8, 36, 6); g.lineTo(31, 6); g.quadraticCurveTo(32, -6, 22, -12); g.closePath(); g.fill();
  g.restore();
}
function drawWorkerStanding(g, t, o) {
  const fx = 850, fy = 890;
  const lift = o.lift || 0;
  g.fillStyle = 'rgba(0,0,0,0.38)';
  g.beginPath(); g.ellipse(fx, fy + 2, 90, 11, 0, 0, TAU); g.fill();
  const hip = [fx + 4, fy - 170], sh = [fx - 8, fy - 330];
  limb(g, [[fx + 30, fy - 6], [fx + 22, fy - 90], hip], 34, RC.coverallDark);
  limb(g, [hip, [fx - 14, fy - 88], [fx - 20, fy - 8]], 34, RC.coverall, RC.rim);
  g.fillStyle = RC.boot;
  g.beginPath(); g.ellipse(fx + 22, fy - 6, 24, 11, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(fx - 30, fy - 6, 24, 11, 0, 0, TAU); g.fill();
  g.fillStyle = RC.coverall; torsoPath(g, hip, sh, 0); g.fill();
  g.fillStyle = 'rgba(205,215,220,0.6)'; g.fillRect(sh[0] - 36, lerp(hip[1], sh[1], 0.6), 76, 8);
  const hand = [lerp(fx - 110, fx - 150, lift), lerp(fy - 280, fy - 400, lift)];
  limb(g, [[sh[0] - 10, sh[1] + 10], [sh[0] - 60, sh[1] + 40 - lift * 50], hand], 26, RC.coverall, RC.rim);
  // head facing left: mirror the head drawing
  g.save();
  g.translate(sh[0] - 16, 0); g.scale(-1, 1); g.translate(-(sh[0] - 16), 0);
  drawWorkerHead(g, [sh[0] - 16, sh[1] - 42], 0, 0, t, 0);
  g.restore();
  g.fillStyle = RC.glove; g.beginPath(); g.arc(hand[0], hand[1], 14, 0, TAU); g.fill();
}
function drawPhoneSmall(g, x, y, glowA) {
  g.fillStyle = '#0d1114';
  g.beginPath(); g.roundRect(x - 10, y - 18, 20, 36, 4); g.fill();
  g.fillStyle = `rgba(150,200,255,${0.25 + 0.5 * glowA})`;
  g.fillRect(x - 7, y - 14, 14, 28);
  if (glowA > 0) glow(g, x, y, 60, '#9cc8ff', 0.25 * glowA);
}

/* Arc light and sparks at the flange. a: arc strength 0 to 1, tt: time since strike. */
function drawArc(g, t, tt, a) {
  if (a <= 0) return;
  const fx = ROOM.flange.x - 2, fy = ROOM.pipe.y + 16;
  const flick = 0.75 + 0.25 * noise1(t * 40) + 0.15 * noise1(t * 97);
  // room wash
  g.save();
  g.globalCompositeOperation = 'lighter';
  const wash = g.createRadialGradient(fx, fy, 10, fx, fy, 1100);
  wash.addColorStop(0, `rgba(190,215,255,${0.35 * a * flick})`);
  wash.addColorStop(0.4, `rgba(120,160,255,${0.1 * a * flick})`);
  wash.addColorStop(1, 'rgba(120,160,255,0)');
  g.fillStyle = wash;
  g.fillRect(0, 0, W, H);
  g.restore();
  glow(g, fx, fy, 140 * flick, '#cfe3ff', 0.9 * a);
  glow(g, fx, fy, 36, '#ffffff', a);
  // sparks: ballistic arcs, bouncing off the floor
  const N = REDUCED ? 30 : 90;
  g.lineCap = 'round';
  for (let i = 0; i < N; i++) {
    const life = 0.7 + h1(i * 1.3) * 0.9;
    const born = h1(i * 2.7) * life;
    const age = ((tt + born) % life);
    const cyc = Math.floor((tt + born) / life);
    if (tt + born - age < 0) continue;
    const ang = -Math.PI * (0.15 + 0.7 * h2(i, cyc));
    const sp = 260 + 520 * h2(i + 9, cyc);
    const vx = Math.cos(ang) * sp * (h2(i, cyc + 3) < 0.5 ? -1 : 1) * 0.8, vy = Math.sin(ang) * sp;
    let x = fx + vx * age, y = fy + vy * age + 900 * age * age;
    const floor = 870 + h2(i, cyc + 5) * 60;
    if (y > floor) y = floor - (y - floor) * 0.25;
    const fade = 1 - age / life;
    const tx = x - vx * 0.03, ty = y - (vy + 1800 * age) * 0.03;
    g.strokeStyle = `rgba(255,${190 + Math.round(60 * fade)},${120 + Math.round(100 * fade)},${0.9 * fade * a})`;
    g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(x, y); g.stroke();
  }
}

/* The whole room shot with a camera: c = world point at screen centre, s = zoom, sy = extra vertical stretch. */
function drawRoom(g, t, o) {
  const cam = o.cam || { cx: 960, cy: 540, s: 1, sy: 1 };
  g.save();
  g.translate(960, 540);
  g.scale(cam.s, cam.s * (cam.sy || 1));
  g.translate(-cam.cx, -cam.cy);
  // floor and wall continue beyond the painted frame when the camera moves
  g.fillStyle = RC.floorFront; g.fillRect(-2000, H - 2, W + 4000, 3000);
  g.fillStyle = RC.wallBot; g.fillRect(-2000, 0, 2002, ROOM.floorY); g.fillRect(W - 2, 0, 2000, ROOM.floorY);
  g.drawImage(ROOM_LAYER.c, 0, 0, W, H);
  drawBeams(g, t, o.light === undefined ? 1 : o.light);
  drawDetectorLED(g, t, o.detector || 'on');
  if (o.blanket) drawBlanket(g, o.blanket);
  drawDrain(g, ROOM.drain.x, ROOM.drain.y, ROOM.drain.w, ROOM.drain.h, o.drainInner, o.grateA === undefined ? 1 : o.grateA);
  if (o.worker) drawWorker(g, o.worker, t, o);
  if (o.arc) drawArc(g, t, o.arcT, o.arc);
  g.restore();
  if (o.dim) { g.fillStyle = `rgba(4,8,12,${o.dim})`; g.fillRect(0, 0, W, H); }
}

/* Map a room-world point to the screen under a room camera. */
function roomToScreen(cam, x, y) {
  return [960 + (x - cam.cx) * cam.s, 540 + (y - cam.cy) * cam.s * (cam.sy || 1)];
}

/* ==== 30-chars.js ==== */
/* The society. Each agent is a deep-sea creature built from simple shapes, with expressive eyes.
   Every draw function takes (g, x, y, s, st): position, scale and a state object for this frame.
   Common state: t (time), look [x, y] in -1..1, blink 0..1, face (1 right, -1 left). */

const AG = {
  ember: '#ffb45c', emberHot: '#fff4dc',
  vest: '#e6c21c', hat: '#f2b51c', reflect: '#dfe6e8', puffer: '#6f8f96', pufferBelly: '#c9d5cc',
  dome: '#e9eef0', ledGreen: '#58f0a0', ledRed: '#ff4a36', ledBlue: '#6cb8ff',
  lensGreen: '#9dffcb', fishDark: '#273846',
  warn: '#ff9a24', angler: '#36474f',
  shell: '#efe3cc', shellStripe: '#b4643a', hood: '#6e3b26', gold: '#d8b45c',
  octo: '#e0714f', octoCalm: '#4aa9a0',
  risk: '#ff5a36',
};

/* An expressive eye. Options: look, blink, lid (top lid droop), lidTilt (radians, + droops the outer side),
   squint (bottom lid), irisCol, iris (size), pupil ('round' | 'bar' | false), skin (lid colour), white. */
function eye(g, x, y, r, o = {}) {
  const look = o.look || [0, 0];
  const lid = Math.max(o.blink || 0, o.lid || 0), squint = o.squint || 0;
  g.save();
  g.translate(x, y);
  g.beginPath();
  g.ellipse(0, 0, r, r * (o.oval || 1.06), 0, 0, TAU);
  g.fillStyle = o.white || '#f6f2ea';
  g.fill();
  g.save();
  g.clip();
  const ir = r * (o.iris || 0.6), ix = look[0] * r * 0.38, iy = look[1] * r * 0.34;
  g.fillStyle = o.irisCol || '#1d2c35';
  g.beginPath(); g.arc(ix, iy, ir, 0, TAU); g.fill();
  if (o.pupil === 'bar') {
    g.fillStyle = '#05080a';
    g.beginPath(); g.ellipse(ix, iy, ir * 0.78, ir * 0.26, 0, 0, TAU); g.fill();
  } else if (o.pupil !== false) {
    g.fillStyle = '#05080a';
    g.beginPath(); g.arc(ix, iy, ir * 0.55 * (o.pupilScale || 1), 0, TAU); g.fill();
  }
  g.fillStyle = 'rgba(255,255,255,0.95)';
  g.beginPath(); g.arc(ix + ir * 0.38, iy - ir * 0.42, ir * 0.3, 0, TAU); g.fill();
  if (lid > 0.002) {
    g.save();
    g.rotate(o.lidTilt || 0);
    g.fillStyle = o.skin || '#333';
    g.fillRect(-r * 2, -r * 2.2, r * 4, r * 1.1 + r * 2.2 * lid);
    g.restore();
  }
  if (squint > 0.002) {
    g.fillStyle = o.skin || '#333';
    g.beginPath(); g.ellipse(0, r * 1.15, r * 1.4, r * 1.3 * squint + r * 0.05, 0, 0, TAU); g.fill();
  }
  g.restore();
  g.lineWidth = Math.max(1, r * 0.1);
  g.strokeStyle = o.line || 'rgba(0,0,0,0.4)';
  g.beginPath(); g.ellipse(0, 0, r, r * (o.oval || 1.06), 0, 0, TAU); g.stroke();
  g.restore();
}

function faceFlip(g, st) {
  if ((st.face || 1) < 0) { g.scale(-1, 1); return [-(st.look ? st.look[0] : 0), st.look ? st.look[1] : 0]; }
  return st.look || [0, 0];
}

/* Activity: a spark born from the spoken sentence. Eager, quick, a little impatient. */
function drawEmber(g, x, y, s, st) {
  const t = st.t, I = st.intensity === undefined ? 1 : st.intensity;
  glow(g, x, y - 14 * s, 190 * s * (0.6 + 0.4 * I), '#ff8a2c', 0.42 * I);
  glow(g, x, y - 12 * s, 70 * s, '#ffd08a', 0.75 * I);
  g.save();
  g.translate(x, y);
  g.scale(s * (st.sqx || 1), s * (st.sqy || 1));
  const look = faceFlip(g, st);

  g.beginPath();

  g.bezierCurveTo(8 + tipx * 0.3, -32, 24, -18, 23, 0);
  g.bezierCurveTo(22, 15, 12, 23, 0, 23);
  g.bezierCurveTo(-12, 23, -22, 15, -23, 0);
  g.bezierCurveTo(-24, -18, -8 + tipx * 0.3, -32, tipx, tipy);
  const gr = g.createRadialGradient(0, 4, 2, 0, 0, 34);

  gr.addColorStop(0.42, '#ffd789');
  gr.addColorStop(0.8, '#ff9c3e');
  gr.addColorStop(1, '#ff6f22');
  g.fillStyle = gr;
  g.fill();

  const bl = st.blink || 0, happy = st.happy || 0, guilty = st.guilty || 0;
  const ey = -2 + guilty * 3, lx = look[0] * 2.5, ly = look[1] * 2.5 + guilty * 2;

    const sx = x + (noise1(t * 2 + i * 5) * 18 + (h1(i * 3) - 0.5) * 20) * s, sy = y - (40 + a * 70) * s;
    glow(g, sx, sy, 6 * s, '#ffd08a', (1 - a) * 0.8 * I);
  }
}

/* Site: a pufferfish foreman in a hard hat and high-visibility vest. Proud of the site, protective, always watching the clock. */
function drawForeman(g, x, y, s, st) {
  const t = st.t, puff = st.puff || 0;
  const R = 62 * (1 + 0.38 * puff);
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const look = faceFlip(g, st);
  const bob = Math.sin(t * 2.1) * 3;
  g.translate(0, bob);
  // tail fin
  const tw = Math.sin(t * 6) * 0.25;
  g.fillStyle = '#4f6b72';
  g.beginPath();
  g.moveTo(-R * 0.9, 0);
  g.quadraticCurveTo(-R * 1.4, -R * 0.55 + tw * 20, -R * 1.55, -R * 0.45 + tw * 20);
  g.quadraticCurveTo(-R * 1.35, 0, -R * 1.55, R * 0.45 + tw * 20);
  g.quadraticCurveTo(-R * 1.4, R * 0.55 + tw * 20, -R * 0.9, 0);
  g.fill();
  // spikes when puffed
  if (puff > 0.02) {
    g.fillStyle = '#5b777e';
    for (let i = 0; i < 22; i++) {
      const a = i / 22 * TAU, l = 14 * puff * (0.8 + 0.4 * h1(i));
      const ca = Math.cos(a), sa = Math.sin(a);
      g.beginPath();
      g.moveTo(ca * R * 0.98 - sa * 5, sa * R * 0.94 + ca * 5);
      g.lineTo(ca * (R + l), sa * (R * 0.96 + l));
      g.lineTo(ca * R * 0.98 + sa * 5, sa * R * 0.94 - ca * 5);
      g.fill();
    }
  }
  // body
  const gr = g.createLinearGradient(0, -R, 0, R);
  gr.addColorStop(0, '#7a9aa0'); gr.addColorStop(0.55, AG.puffer); gr.addColorStop(1, AG.pufferBelly);
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(0, 0, R * 1.04, R * 0.96, 0, 0, TAU); g.fill();
  // spots
  g.fillStyle = 'rgba(30,45,50,0.35)';
  for (let i = 0; i < 9; i++) { const a = -2.6 + i * 0.28, rr = R * (0.55 + 0.25 * h1(i * 4)); g.beginPath(); g.arc(Math.cos(a) * rr, Math.sin(a) * rr * 0.9, 3 + 2 * h1(i), 0, TAU); g.fill(); }
  // vest (clipped to the body)
  g.save();
  g.beginPath(); g.ellipse(0, 0, R * 1.04, R * 0.96, 0, 0, TAU); g.clip();
  g.fillStyle = AG.vest;
  g.beginPath();
  g.moveTo(-R * 1.1, -R * 0.05);
  g.lineTo(R * 0.25, -R * 0.12);
  g.lineTo(R * 0.55, R * 0.3);
  g.lineTo(R * 0.85, -R * 0.08);
  g.lineTo(R * 1.2, -R * 0.05);
  g.lineTo(R * 1.2, R * 1.2);
  g.lineTo(-R * 1.2, R * 1.2);
  g.closePath();
  g.fill();
  g.fillStyle = AG.reflect;
  g.fillRect(-R * 1.2, R * 0.38, R * 2.4, R * 0.14);
  g.fillRect(-R * 1.2, R * 0.68, R * 2.4, R * 0.14);
  g.fillStyle = 'rgba(0,0,0,0.12)';
  g.fillRect(-R * 1.2, R * 0.38, R * 2.4, 2);
  g.fillRect(-R * 1.2, R * 0.68, R * 2.4, 2);
  g.strokeStyle = 'rgba(120,95,0,0.5)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-R * 1.1, -R * 0.05); g.lineTo(R * 0.25, -R * 0.12); g.lineTo(R * 0.55, R * 0.3); g.lineTo(R * 0.85, -R * 0.08); g.stroke();
  g.restore();
  // pectoral fin, with a watch for tapping
  const tap = st.tap || 0, flap = Math.sin(t * 7) * 0.2 + tap * (0.4 + 0.35 * Math.sin(t * 22));
  g.save();
  g.translate(-R * 0.05, R * 0.25);
  g.rotate(-0.4 - flap - (st.point || 0) * 1.1);
  g.fillStyle = '#c6a314';
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(R * 0.5, -R * 0.35, R * 0.62, 0); g.quadraticCurveTo(R * 0.5, R * 0.25, 0, 0); g.fill();
  if (tap > 0.05 || st.watch) {
    g.fillStyle = '#222'; g.beginPath(); g.arc(R * 0.28, -R * 0.04, 6, 0, TAU); g.fill();
    g.fillStyle = '#e7f3ef'; g.beginPath(); g.arc(R * 0.28, -R * 0.04, 4, 0, TAU); g.fill();
  }
  g.restore();
  // eyes
  const mood = st.mood || 'stern';
  const tilt = mood === 'angry' ? -0.35 : mood === 'worried' ? 0.3 : mood === 'relief' ? 0.15 : -0.12;
  const lidAmt = mood === 'relief' ? 0.45 : mood === 'angry' ? 0.32 : 0.22;
  const sk = '#6c8b91';
  eye(g, R * 0.13, -R * 0.3, R * 0.2, { look, blink: st.blink, lid: lidAmt, lidTilt: -tilt, skin: sk });
  eye(g, R * 0.52, -R * 0.26, R * 0.24, { look, blink: st.blink, lid: lidAmt, lidTilt: tilt, skin: sk, squint: mood === 'relief' ? 0.25 : 0 });
  // brows
  g.strokeStyle = '#25363b'; g.lineWidth = R * 0.08; g.lineCap = 'round';
  const by = -R * 0.56 + (mood === 'angry' ? 4 : 0);
  g.beginPath(); g.moveTo(R * 0.0, by - tilt * 6); g.lineTo(R * 0.27, by + tilt * 6); g.stroke();
  g.beginPath(); g.moveTo(R * 0.36, by + 3 + tilt * 8); g.lineTo(R * 0.72, by - 4 - tilt * 8); g.stroke();
  // mouth: pursed lips
  const mo = st.huff || 0;
  g.fillStyle = '#4a2a26';
  g.beginPath(); g.ellipse(R * 0.98, R * 0.12, 6 + mo * 4, 7 + mo * 5, 0, 0, TAU); g.fill();
  g.fillStyle = '#d98f7a';
  g.beginPath(); g.ellipse(R * 0.98, R * 0.12, 6 + mo * 4, 7 + mo * 5, 0, 0, TAU); g.lineWidth = 3; g.strokeStyle = '#c47a66'; g.stroke();
  // hard hat
  const hy = -R * 0.84;
  g.fillStyle = '#b8870f';
  g.beginPath(); g.ellipse(R * 0.06, hy + 4, R * 0.78, R * 0.13, -0.05, 0, TAU); g.fill();
  const hg = g.createLinearGradient(0, hy - R * 0.55, 0, hy);
  hg.addColorStop(0, '#ffd75a'); hg.addColorStop(1, AG.hat);
  g.fillStyle = hg;
  g.beginPath(); g.ellipse(R * 0.04, hy, R * 0.6, R * 0.5, -0.05, Math.PI, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.35)';
  g.beginPath(); g.ellipse(-R * 0.18, hy - R * 0.28, R * 0.12, R * 0.06, -0.6, 0, TAU); g.fill();
  g.strokeStyle = '#c8930f'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(R * 0.04, hy - R * 0.5); g.lineTo(R * 0.04, hy - 2); g.stroke();
  g.restore();
}

/* Fire alarm: a jellyfish whose bell is a smoke detector and whose eye is its LED. Dutiful and nervous. */
function drawBell(g, x, y, s, st) {
  const t = st.t, alarm = st.alarm || 0, sleep = st.sleep || 0;
  const ledCol = st.led === 'red' ? AG.ledRed : st.led === 'blue' ? AG.ledBlue : AG.ledGreen;
  const pul = Math.sin(t * TAU * 0.55 + (st.phase || 0));
  const shake = alarm * Math.sin(t * 46) * 3;
  // cable to the thing it hangs from
  if (st.cableTop !== undefined) {
    g.strokeStyle = 'rgba(210,230,236,0.35)'; g.lineWidth = 2 * s;
    g.beginPath(); g.moveTo(x, st.cableTop); g.lineTo(x + shake * s, y - 70 * s); g.stroke();
  }
  // glow
  const ga = st.led === 'red' ? 0.45 + 0.35 * alarm * (0.5 + 0.5 * Math.sin(t * TAU * 2)) : 0.18 * (1 - sleep * 0.6);
  glow(g, x, y - 26 * s, 230 * s, ledCol, ga);
  g.save();
  g.translate(x + shake * s, y);
  g.scale(s, s);
  // tentacles
  g.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const bx = -58 + i * 14.5, len = 170 + 60 * h1(i * 2.3) + alarm * 30;
    const spread = alarm * (bx * 0.9);
    g.strokeStyle = `rgba(214,232,238,${0.5 - 0.02 * Math.abs(i - 4)})`;
    g.lineWidth = 3.4 - Math.abs(i - 4) * 0.25;
    g.beginPath();
    g.moveTo(bx, 4);
    for (let k = 1; k <= 8; k++) {
      const p = k / 8;
      const sway = noise1(t * 0.9 + i * 1.7 - p * 1.6) * 22 * p + Math.sin(t * 1.4 + i - p * 3) * 6 * p;
      g.lineTo(bx + sway + spread * p, 4 + p * len * (1 - 0.06 * pul));
    }
    g.stroke();
    const tipSway = noise1(t * 0.9 + i * 1.7 - 1.6) * 22 + Math.sin(t * 1.4 + i - 3) * 6;
    glow(g, bx + tipSway + spread, 4 + len, 9, ledCol, 0.35);
  }
  // dome
  g.save();
  g.scale(1 + 0.035 * pul, 1 - 0.05 * pul);
  g.fillStyle = '#a9b4b9';
  g.beginPath(); g.ellipse(0, 4, 78, 12, 0, 0, TAU); g.fill();
  const dg = g.createLinearGradient(0, -72, 0, 4);
  dg.addColorStop(0, '#fbfdfd'); dg.addColorStop(1, '#c4ced2');
  g.fillStyle = dg;
  g.beginPath(); g.ellipse(0, 2, 75, 72, 0, Math.PI, TAU); g.fill();
  g.strokeStyle = 'rgba(60,75,82,0.45)'; g.lineWidth = 3;
  for (let i = 0; i < 9; i++) {
    const a = Math.PI + 0.25 + i * (Math.PI - 0.5) / 8;
    g.beginPath(); g.moveTo(Math.cos(a) * 60, Math.sin(a) * 52 + 2); g.lineTo(Math.cos(a) * 70, Math.sin(a) * 62 + 2); g.stroke();
  }
  g.fillStyle = 'rgba(255,255,255,0.6)';
  g.beginPath(); g.ellipse(-30, -46, 18, 8, -0.5, 0, TAU); g.fill();
  g.restore();
  // the LED eye
  const ey = -30;
  g.fillStyle = '#1b2327';
  g.beginPath(); g.arc(0, ey, 20, 0, TAU); g.fill();
  const look = st.look || [0, 0];
  const lx = look[0] * 6, ly = look[1] * 5;
  const open = 1 - Math.max(st.blink || 0, sleep * 0.75);
  g.save();
  g.beginPath(); g.arc(0, ey, 17, 0, TAU); g.clip();
  g.fillStyle = ledCol;
  g.beginPath(); g.ellipse(lx, ey + ly, 9, 9 * Math.max(0.08, open), 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.85)';
  if (open > 0.4) { g.beginPath(); g.arc(lx + 3, ey + ly - 3.5, 2.6, 0, TAU); g.fill(); }
  // lid for sleep
  if (sleep > 0.01) {
    g.fillStyle = '#d4dcdf';
    g.fillRect(-20, ey - 20, 40, 2 + 26 * sleep * 0.8);
  }
  g.restore();
  glow(g, lx, ey + ly, 26, ledCol, 0.55 * open);
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 2;
  g.beginPath(); g.arc(0, ey, 20, 0, TAU); g.stroke();
  // worried brow when alarmed
  if (alarm > 0.05) {
    g.strokeStyle = `rgba(40,50,55,${alarm})`; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-22, ey - 26); g.lineTo(-6, ey - 31); g.moveTo(22, ey - 26); g.lineTo(6, ey - 31); g.stroke();
  }
  g.restore();
}

/* Evidence: a barreleye fish. Transparent head, green tube eyes that swivel to what is actually there. Deadpan. */
function drawLens(g, x, y, s, st) {
  const t = st.t;
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  faceFlip(g, st);
  const sw = Math.sin(t * 3) * 0.12;
  // tail
  g.fillStyle = '#1f2e39';
  g.beginPath();
  g.moveTo(-96, 0);
  g.lineTo(-146, -30 + sw * 40);
  g.quadraticCurveTo(-130, 0, -146, 30 + sw * 40);
  g.closePath(); g.fill();
  // body
  const bg = g.createLinearGradient(0, -36, 0, 36);
  bg.addColorStop(0, '#2c3e4c'); bg.addColorStop(0.6, AG.fishDark); bg.addColorStop(1, '#5d7685');
  g.fillStyle = bg;
  g.beginPath();
  g.moveTo(-100, 0);
  g.bezierCurveTo(-70, -34, 40, -40, 92, -6);
  g.bezierCurveTo(100, 0, 98, 10, 88, 14);
  g.bezierCurveTo(40, 36, -70, 30, -100, 0);
  g.fill();
  // scales hint
  g.strokeStyle = 'rgba(160,200,215,0.12)'; g.lineWidth = 2;
  for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(-60 + i * 22, 2, 16, -0.9, 0.9); g.stroke(); }
  // pectoral fin
  g.fillStyle = 'rgba(120,170,190,0.45)';
  g.beginPath(); g.moveTo(20, 10); g.quadraticCurveTo(-10, 40 + sw * 30, -34, 34 + sw * 30); g.quadraticCurveTo(0, 20, 20, 10); g.fill();
  // mouth and the false "eyes" (nostrils) that fool everyone
  g.fillStyle = '#0d151b';
  g.beginPath(); g.arc(80, -4, 4, 0, TAU); g.fill();
  g.beginPath(); g.arc(68, -6, 3.2, 0, TAU); g.fill();
  g.strokeStyle = '#0d151b'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(90, 8); g.quadraticCurveTo(84, 12, 76, 10); g.stroke();
  // transparent dome head
  const hx = 36, hy = -38;
  g.fillStyle = 'rgba(170,230,250,0.10)';
  g.beginPath(); g.ellipse(hx, hy, 62, 46, 0, 0, TAU); g.fill();
  // tube eyes
  const base = st.eyeAngle === undefined ? -Math.PI / 2 : st.eyeAngle;
  const skew = (st.skeptic || 0) * 0.55;
  const eyesAt = [[hx - 16, hy + 6, base + skew], [hx + 14, hy + 6, base]];
  for (const [ex, ey, a] of eyesAt) {
    g.save();
    g.translate(ex, ey);
    g.rotate(a + Math.PI / 2);
    g.fillStyle = '#1d3b33';
    g.beginPath(); g.roundRect(-9, -30, 18, 36, 8); g.fill();
    g.fillStyle = AG.lensGreen;
    g.beginPath(); g.ellipse(0, -28, 9, 7, 0, 0, TAU); g.fill();
    g.fillStyle = '#0a1a14';
    g.beginPath(); g.ellipse(0, -28, 3.5, 3, 0, 0, TAU); g.fill();
    g.restore();
    const lx = ex + Math.cos(a) * 28, ly = ey + Math.sin(a) * 28;
    glow(g, lx, ly, 26, '#7dffb8', 0.55);
  }
  g.strokeStyle = 'rgba(205,245,255,0.6)'; g.lineWidth = 2.5;
  g.beginPath(); g.ellipse(hx, hy, 62, 46, 0, 0, TAU); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 3;
  g.beginPath(); g.ellipse(hx, hy, 52, 36, 0, Math.PI * 1.1, Math.PI * 1.45); g.stroke();
  g.restore();
}
/* Where Lens's tube eyes point from, in stage space (for scan beams). */
function lensEyePoint(x, y, s, st) {
  const f = st.face || 1, a = st.eyeAngle === undefined ? -Math.PI / 2 : st.eyeAngle;
  return [x + f * (36 + Math.cos(a) * 28) * s, y + (-32 + Math.sin(a) * 28) * s];
}

/* Safety: a small anglerfish whose lure is a warning sign. Protective, jumpy, kind. */
function drawLantern(g, x, y, s, st) {
  const t = st.t, alert = st.alert || 0, relief = st.relief || 0;
  const la = st.lureAngle === undefined ? -1.1 : st.lureAngle;
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const look = faceFlip(g, st);
  g.translate(0, Math.sin(t * 2.6 + 1) * 3);
  // tail
  g.fillStyle = '#26343b';
  const tw = Math.sin(t * 8) * 8;
  g.beginPath(); g.moveTo(-44, 0); g.lineTo(-78, -24 + tw); g.lineTo(-74, 0); g.lineTo(-78, 24 + tw); g.closePath(); g.fill();
  // body
  const gr = g.createRadialGradient(10, 10, 6, 0, 0, 60);
  gr.addColorStop(0, '#61737b'); gr.addColorStop(1, AG.angler);
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(0, 0, 54, 46, 0, 0, TAU); g.fill();
  // lure stalk and the warning-sign lantern
  const sx = 14, sy = -40, L = 92;
  const lx = sx + Math.cos(la) * L, ly = sy + Math.sin(la) * L + Math.sin(t * 3) * 3;
  g.strokeStyle = '#2b393f'; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo(sx + Math.cos(la - 0.7) * L * 0.6, sy + Math.sin(la - 0.7) * L * 0.6, lx, ly); g.stroke();
  const flare = 1 + alert * 0.35 * (0.6 + 0.4 * Math.sin(t * 14));
  glow(g, lx, ly + 4, 90 * flare, AG.warn, (0.5 - relief * 0.25) * flare);
  g.save();
  g.translate(lx, ly + 12);
  g.scale(flare * 0.95, flare * 0.95);
  g.fillStyle = AG.warn;
  g.beginPath(); g.moveTo(0, -24); g.quadraticCurveTo(3, -26, 5, -22); g.lineTo(22, 10); g.quadraticCurveTo(23, 15, 18, 15); g.lineTo(-18, 15); g.quadraticCurveTo(-23, 15, -22, 10); g.lineTo(-5, -22); g.quadraticCurveTo(-3, -26, 0, -24); g.fill();
  g.fillStyle = '#2a1600';
  g.fillRect(-2.6, -12, 5.2, 14); g.beginPath(); g.arc(0, 7.5, 2.9, 0, TAU); g.fill();
  g.restore();
  // fins
  g.fillStyle = '#4a5c64';
  g.beginPath(); g.moveTo(-6, 18); g.quadraticCurveTo(-26, 40 + Math.sin(t * 6) * 6, -36, 30); g.quadraticCurveTo(-18, 20, -6, 18); g.fill();
  // mouth: a small underbite with two teeth
  g.fillStyle = '#1a2327';
  g.beginPath(); g.moveTo(22, 18); g.quadraticCurveTo(40, 30, 54, 10); g.quadraticCurveTo(42, 20, 22, 18); g.fill();
  g.fillStyle = '#f2efe6';
  g.beginPath(); g.moveTo(34, 21); g.lineTo(36, 14); g.lineTo(38, 21); g.fill();
  g.beginPath(); g.moveTo(44, 18); g.lineTo(46, 11); g.lineTo(48, 17); g.fill();
  // eyes
  const sk = '#4f6168';
  const wide = alert * 0.25;
  eye(g, 6, -10, 15 * (1 + wide * 0.3), { look, blink: st.blink, lid: relief * 0.45 + (1 - alert) * 0.08, lidTilt: -0.25, skin: sk, iris: 0.55 - wide * 0.15 });
  eye(g, 34, -6, 13 * (1 + wide * 0.3), { look, blink: st.blink, lid: relief * 0.45 + (1 - alert) * 0.08, lidTilt: 0.25, skin: sk, iris: 0.55 - wide * 0.15 });
  g.strokeStyle = '#222e33'; g.lineWidth = 3.5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-6, -32 - alert * 4); g.lineTo(12, -28 - alert * 6); g.stroke();
  g.beginPath(); g.moveTo(26, -26 - alert * 6); g.lineTo(44, -24 - alert * 3); g.stroke();
  g.restore();
}
function lanternLurePoint(x, y, s, st) {
  const la = st.lureAngle === undefined ? -1.1 : st.lureAngle, f = st.face || 1;
  return [x + f * (14 + Math.cos(la) * 92) * s, y + (-40 + Math.sin(la) * 92 + 12 + Math.sin(st.t * 2.6 + 1) * 3) * s];
}

/* Insurance conditions: a nautilus whose shell is written full of wording. Slow, precise, wears a monocle. */
function drawScroll(g, x, y, s, st) {
  const t = st.t, read = st.read || 0, red = st.red || 0;
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const look = faceFlip(g, st);
  g.translate(0, Math.sin(t * 1.3) * 4);
  // shell
  const R = 82, cx = -14, cy = -10;
  const sg = g.createRadialGradient(cx - 20, cy - 26, 10, cx, cy, R);
  sg.addColorStop(0, '#fbf5e8'); sg.addColorStop(1, '#dccbaa');
  g.fillStyle = sg;
  g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
  // chambers: radial stripes along a spiral, each one a line of wording
  for (let i = 0; i < 9; i++) {
    const a0 = -Math.PI * 0.35 - i * 0.62;
    const r0 = R * Math.pow(0.86, i);
    const isRed = i === 0 && red > 0;
    g.strokeStyle = isRed ? rgba(AG.risk, 0.5 + 0.5 * red) : rgba(AG.shellStripe, 0.75);
    g.lineWidth = 7 * Math.pow(0.9, i);
    g.lineCap = 'round';
    g.beginPath(); g.arc(cx, cy, r0 * 0.92, a0 - 0.5, a0 + 0.05); g.stroke();
    // wording dashes
    g.strokeStyle = isRed ? rgba('#ffd2c4', 0.8 * red) : `rgba(${read > 0 ? '255,214,140' : '120,90,60'},${0.35 + 0.5 * read})`;
    g.lineWidth = 2;
    for (let k = 0; k < 4; k++) {
      const rr = r0 * (0.62 + k * 0.075);
      g.beginPath(); g.arc(cx, cy, rr, a0 - 0.48 + k * 0.03, a0 - 0.05 - (k % 2) * 0.12); g.stroke();
    }
    if (isRed) glow(g, cx + Math.cos(a0 - 0.2) * r0 * 0.75, cy + Math.sin(a0 - 0.2) * r0 * 0.75, 70, AG.risk, 0.5 * red);
  }
  if (read > 0) glow(g, cx, cy, R * 1.2, '#ffd08a', 0.18 * read);
  // spiral centre
  g.strokeStyle = 'rgba(150,100,60,0.6)'; g.lineWidth = 3;
  g.beginPath();
  for (let a = 0; a < TAU * 2.2; a += 0.2) { const r = 4 + a * 4.5; const px = cx + Math.cos(-a) * r, py = cy + Math.sin(-a) * r; a === 0 ? g.moveTo(px, py) : g.lineTo(px, py); }
  g.stroke();
  // hood and head emerging at the front
  g.fillStyle = AG.hood;
  g.beginPath(); g.ellipse(58, 6, 34, 30, 0.2, 0, TAU); g.fill();
  // tentacles
  g.strokeStyle = '#d9a57c'; g.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const a = 0.25 + i * 0.13;
    g.lineWidth = 6 - i * 0.35;
    const bx = 62 + Math.cos(a) * 18, by = 22 + Math.sin(a) * 10;
    const cw = noise1(t * 0.8 + i * 2) * 10;
    g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx + 24 + cw, by + 24, bx + 14 + cw, by + 40 + i * 2); g.stroke();
  }
  if (st.reach) {
    const r = st.reach;
    g.strokeStyle = '#d9a57c'; g.lineWidth = 7;
    g.beginPath(); g.moveTo(66, 26); g.quadraticCurveTo(lerp(66, r[0], 0.5) + 30, lerp(26, r[1], 0.5) + 30, r[0], r[1]); g.stroke();
  }
  // eye with monocle
  eye(g, 66, -4, 15, { look, blink: st.blink, lid: 0.42 - read * 0.2, lidTilt: 0.1, skin: AG.hood, irisCol: '#3b2a1c' });
  g.strokeStyle = AG.gold; g.lineWidth = 3.5;
  g.beginPath(); g.arc(66, -4, 20, 0, TAU); g.stroke();
  g.strokeStyle = 'rgba(216,180,92,0.7)'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(52, 10); g.quadraticCurveTo(30, 40, 0, 50); g.stroke();
  glow(g, 72, -14, 14, '#fff3c8', 0.5 + 0.5 * (st.glint || 0));
  g.restore();
}
/* The red chamber's position in stage space (where the slice of risk is pulled out). */
function scrollRedPoint(x, y, s, st) {
  const f = st.face || 1, a0 = -Math.PI * 0.35 - 0.2;
  return [x + f * (-14 + Math.cos(a0) * 82 * 0.75) * s, y + (-10 + Math.sin(a0) * 82 * 0.75 + Math.sin(st.t * 1.3) * 4) * s];
}

/* Mitigation: an octopus. Eight arms, many ideas. Colour shifts as it thinks. */
function drawOcto(g, x, y, s, st) {
  const t = st.t, calm = st.calm || 0;
  const col = mixHex(AG.octo, AG.octoCalm, calm), dark = mixHex('#a4482f', '#2f7a74', calm);
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const look = faceFlip(g, st);
  const bob = Math.sin(t * 2.2) * 4;
  // arms
  g.lineCap = 'round';
  const reach = st.reach || {};
  for (let i = 0; i < 8; i++) {
    const side = i < 4 ? -1 : 1, k = i % 4;
    const baseX = side * (8 + k * 7), baseY = -8 + bob;
    const tgt = reach[i];
    const pts = [];
    for (let j = 0; j <= 12; j++) {
      const p = j / 12;
      let ax = baseX + side * (10 + k * 14) * p * 2.2 + noise1(t * 1.1 + i * 3 - p * 2) * 26 * p;
      let ay = baseY + p * (58 + k * 6) + Math.sin(t * 2 + i - p * 4) * 8 * p;
      const curl = p > 0.75 ? (p - 0.75) * 4 : 0;
      ax += side * curl * 14 * Math.sin(t + i); ay -= curl * 12;
      if (tgt && tgt.p > 0) {
        const e = easeIO(tgt.p);
        const bx = lerp(baseX, tgt.x, p), by = lerp(baseY, tgt.y, p) - Math.sin(p * Math.PI) * 40;
        ax = lerp(ax, bx + Math.sin(t * 3 + p * 6) * 4 * p, e); ay = lerp(ay, by, e);
      }
      pts.push([ax, ay]);
    }
    for (let j = 1; j < pts.length; j++) {
      g.strokeStyle = j < 2 ? col : mixHex(col, dark, j / 14);
      g.lineWidth = 15 * (1 - j / 13) + 2;
      g.beginPath(); g.moveTo(pts[j - 1][0], pts[j - 1][1]); g.lineTo(pts[j][0], pts[j][1]); g.stroke();
    }
    g.fillStyle = 'rgba(255,225,205,0.5)';
    for (let j = 3; j < 11; j += 2) { g.beginPath(); g.arc(pts[j][0], pts[j][1] + 3, 1.8, 0, TAU); g.fill(); }
    if (tgt && tgt.hold) tgt.hold(g, pts[12][0], pts[12][1]);
  }
  // mantle
  const mg = g.createRadialGradient(-12, -78 + bob, 6, 0, -54 + bob, 62);
  mg.addColorStop(0, mixHex(col, '#ffffff', 0.25)); mg.addColorStop(1, col);
  g.fillStyle = mg;
  g.beginPath();
  g.moveTo(-40, -14 + bob);
  g.bezierCurveTo(-56, -60 + bob, -36, -112 + bob, 0, -112 + bob);
  g.bezierCurveTo(36, -112 + bob, 56, -60 + bob, 40, -14 + bob);
  g.quadraticCurveTo(0, 0 + bob, -40, -14 + bob);
  g.fill();
  // skin spots shimmer
  for (let i = 0; i < 10; i++) {
    const px = (h1(i * 5) - 0.5) * 60, py = -96 + h1(i * 7) * 60 + bob;
    g.fillStyle = rgba(dark, 0.35 + 0.25 * Math.sin(t * 3 + i));
    g.beginPath(); g.arc(px, py, 2.5 + 2 * h1(i), 0, TAU); g.fill();
  }
  // eyes with bar pupils
  eye(g, -17, -36 + bob, 13, { look, blink: st.blink, lid: st.lid || 0.12, skin: col, pupil: 'bar', irisCol: '#d6b26a', iris: 0.72 });
  eye(g, 17, -36 + bob, 13, { look, blink: st.blink, lid: st.lid || 0.12, skin: col, pupil: 'bar', irisCol: '#d6b26a', iris: 0.72 });
  g.restore();
}

/* A carrier: a whale. Huge, slow, ancient. Each carries its insurer's emblem in light. dir 1 swims right. */
function drawWhale(g, x, y, s, st) {
  const t = st.t, dir = st.dir || 1, kind = st.kind || 'hump';
  g.save();
  g.translate(x, y);
  g.scale(s * dir, s);
  const flex = Math.sin(t * 1.3 + (st.phase || 0));
  const L = 300;
  const top = kind === 'sperm' ? '#24384a' : kind === 'shark' ? '#2a3d4f' : '#203446';
  const belly = kind === 'shark' ? '#9fb3bd' : '#6d8798';
  // flukes
  g.save();
  g.translate(-L * 0.62, 6);
  g.rotate(flex * 0.22);
  g.fillStyle = top;
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-30, -18, -78, -46); g.quadraticCurveTo(-58, -6, -64, 2); g.quadraticCurveTo(-58, 10, -78, 50); g.quadraticCurveTo(-30, 18, 0, 0); g.fill();
  g.restore();
  // body
  const bg = g.createLinearGradient(0, -70, 0, 70);
  bg.addColorStop(0, top); bg.addColorStop(0.62, top); bg.addColorStop(1, belly);
  g.fillStyle = bg;
  g.beginPath();
  g.moveTo(-L * 0.62, 6);
  if (kind === 'sperm') {
    g.bezierCurveTo(-L * 0.3, -40, L * 0.05, -66, L * 0.42, -62);
    g.lineTo(L * 0.5, -40); g.lineTo(L * 0.5, 22);
    g.bezierCurveTo(L * 0.3, 52, -L * 0.2, 48, -L * 0.62, 6);
  } else {
    g.bezierCurveTo(-L * 0.25, -40 + flex * 3, L * 0.2, -62, L * 0.46, -22);
    g.bezierCurveTo(L * 0.52, -8, L * 0.5, 14, L * 0.42, 24);
    g.bezierCurveTo(L * 0.2, 56, -L * 0.25, 46, -L * 0.62, 6);
  }
  g.fill();
  // throat grooves or spots
  if (kind === 'hump') {
    g.strokeStyle = 'rgba(170,200,215,0.18)'; g.lineWidth = 2;
    for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(L * 0.4 - i * 4, 18 + i * 5); g.quadraticCurveTo(L * 0.1, 34 + i * 5, -L * 0.1, 30 + i * 4); g.stroke(); }
  }
  if (kind === 'shark') {
    for (let i = 0; i < 40; i++) {
      const px = -L * 0.5 + h1(i * 3) * L * 0.9, py = -40 + h1(i * 7) * 50;
      glow(g, px, py, 6, '#cfe8ff', 0.25);
    }
  }
  // pectoral fin
  g.save();
  g.translate(L * 0.12, 26);
  g.rotate(0.5 + flex * 0.15);
  g.fillStyle = kind === 'hump' ? '#2a4256' : top;
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-30, 30, -(kind === 'hump' ? 150 : 70), 50); g.quadraticCurveTo(-40, 14, 0, 0); g.fill();
  g.restore();
  // emblem in light on the flank
  const ex = -L * 0.05, ey = -18;
  glow(g, ex, ey, 70, st.emblemCol || '#cfe6ff', 0.35 * (st.emblemA === undefined ? 1 : st.emblemA));
  g.save();
  g.translate(ex, ey);
  g.strokeStyle = rgba(st.emblemCol || '#cfe6ff', 0.85 * (st.emblemA === undefined ? 1 : st.emblemA));
  g.fillStyle = g.strokeStyle;
  g.lineWidth = 3;
  drawEmblem(g, st.emblem || 'star', 18);
  g.restore();
  // eye
  const eyx = L * 0.3, eyy = kind === 'sperm' ? -20 : 4;
  g.fillStyle = '#0b1218';
  g.beginPath(); g.ellipse(eyx, eyy, 7, 5, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(220,240,255,0.8)';
  g.beginPath(); g.arc(eyx + 2, eyy - 1.5, 1.6, 0, TAU); g.fill();
  if (st.eyeGlint) glow(g, eyx, eyy, 30, st.eyeGlintCol || AG.risk, st.eyeGlint);
  g.restore();
}
function drawEmblem(g, kind, r) {
  if (kind === 'star') {
    g.beginPath();
    for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * Math.PI / 4, rr = i % 2 ? r * 0.32 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    g.closePath(); g.fill();
  } else if (kind === 'wave') {
    g.beginPath();
    for (let i = 0; i <= 20; i++) { const px = -r * 1.3 + i * r * 0.13; g.lineTo(px, Math.sin(i * 0.6) * r * 0.35 - r * 0.2); }
    g.stroke();
    g.beginPath();
    for (let i = 0; i <= 20; i++) { const px = -r * 1.3 + i * r * 0.13; g.lineTo(px, Math.sin(i * 0.6 + 1) * r * 0.35 + r * 0.3); }
    g.stroke();
  } else if (kind === 'globe') {
    g.beginPath(); g.arc(0, 0, r * 0.9, 0, TAU); g.stroke();
    g.beginPath(); g.ellipse(0, 0, r * 0.4, r * 0.9, 0, 0, TAU); g.stroke();
    g.beginPath(); g.moveTo(-r * 0.9, 0); g.lineTo(r * 0.9, 0); g.stroke();
  }
}

/* ==== 40-deep.js ==== */
/* The hidden world beneath the floor: a deep, quiet sea where the agents live.
   One continuous world with a camera: the drop from the drain, the awakening, and the society's debate. */

const DEEP = {
  top: '#123047', mid: '#0a1c2b', bot: '#040a10',
  reefFar: '#0f2638', reefMid: '#0b1c29', reefNear: '#060e15',
  line: '#cdeeff',
  openingY: -2500,      // world y of the drain seen from below
};

/* Reef layers: the seabed grows over shapes that look like the site above (pipes, tanks, valves). */
let REEF_FAR = null, REEF_MID = null, REEF_NEAR = null;
function prerenderDeep() {
  REEF_FAR = makeLayer(2600, 520);
  paintReef(REEF_FAR.g, 2600, 520, 11, DEEP.reefFar, 0.8);
  REEF_MID = makeLayer(2400, 420);
  paintReef(REEF_MID.g, 2400, 420, 23, DEEP.reefMid, 1.0);
  // the near layer only covers the lower part of the frame
  REEF_NEAR = makeLayer(W, H - 540);
  REEF_NEAR.g.translate(0, -540);
  paintNear(REEF_NEAR.g);
}
function paintReef(g, w, h, seed, col, k) {
  g.fillStyle = col;
  // rolling seabed
  g.beginPath();
  g.moveTo(0, h);
  for (let x = 0; x <= w; x += 40) g.lineTo(x, h * 0.62 + noise1(x / 260 + seed) * h * 0.12);
  g.lineTo(w, h);
  g.closePath();
  g.fill();
  // structures
  let x = 40;
  let i = 0;
  while (x < w - 60) {
    const r = h2(seed, i), base = h * 0.64 + noise1(x / 260 + seed) * h * 0.12;
    if (r < 0.28) { // tank
      const tw = 70 + 70 * h2(seed + 1, i), th = 120 + 180 * h2(seed + 2, i) * k;
      g.fillRect(x, base - th, tw, th + 10);
      g.beginPath(); g.ellipse(x + tw / 2, base - th, tw / 2, tw * 0.28, 0, Math.PI, TAU); g.fill();
      x += tw + 30;
    } else if (r < 0.5) { // pipe run with a bend
      const ph = 60 + 120 * h2(seed + 3, i) * k, pl = 120 + 160 * h2(seed + 4, i), d = 16 + 10 * h2(seed + 5, i);
      g.fillRect(x, base - ph, d, ph);
      g.fillRect(x, base - ph, pl, d);
      g.beginPath(); g.arc(x + d / 2, base - ph + d / 2, d / 2 + 4, 0, TAU); g.fill();
      g.fillRect(x + pl - d, base - ph, d, ph);
      x += pl + 20;
    } else if (r < 0.66) { // valve wheel on a stem
      const vh = 50 + 90 * h2(seed + 6, i) * k, vr = 18 + 12 * h2(seed + 7, i);
      g.fillRect(x + vr - 4, base - vh, 8, vh);
      g.lineWidth = 6; g.strokeStyle = col;
      g.beginPath(); g.arc(x + vr, base - vh - vr, vr, 0, TAU); g.stroke();
      g.beginPath(); g.moveTo(x, base - vh - vr); g.lineTo(x + 2 * vr, base - vh - vr); g.moveTo(x + vr, base - vh - 2 * vr); g.lineTo(x + vr, base - vh); g.stroke();
      x += 2 * vr + 30;
    } else { // coral fan
      const fh = 60 + 120 * h2(seed + 8, i) * k;
      g.lineWidth = 5; g.strokeStyle = col; g.lineCap = 'round';
      for (let b = 0; b < 7; b++) {
        const a = -Math.PI / 2 + (b - 3) * 0.22;
        g.beginPath(); g.moveTo(x + 30, base); g.quadraticCurveTo(x + 30 + Math.cos(a) * fh * 0.5, base + Math.sin(a) * fh * 0.6, x + 30 + Math.cos(a) * fh * 0.8, base + Math.sin(a) * fh); g.stroke();
      }
      x += 80;
    }
    i++;
  }
}
function paintNear(g) {
  g.fillStyle = DEEP.reefNear;
  // seabed in front
  g.beginPath();
  g.moveTo(0, H);
  for (let x = 0; x <= W; x += 30) g.lineTo(x, 905 + noise1(x / 300 + 4) * 26 + Math.pow(Math.abs(x - 960) / 960, 2) * -60);
  g.lineTo(W, H);
  g.closePath();
  g.fill();
  // framing rocks left and right
  g.beginPath(); g.moveTo(0, 560); g.quadraticCurveTo(120, 600, 170, 760); g.quadraticCurveTo(230, 900, 330, 1080); g.lineTo(0, 1080); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(W, 620); g.quadraticCurveTo(1800, 660, 1760, 800); g.quadraticCurveTo(1720, 940, 1620, 1080); g.lineTo(W, 1080); g.closePath(); g.fill();
  // Octo's rock
  g.beginPath(); g.moveTo(400, 960); g.quadraticCurveTo(404, 880, 470, 866); g.quadraticCurveTo(560, 852, 590, 912); g.lineTo(612, 960); g.closePath(); g.fill();
  // a pipe half buried in the sand
  g.fillRect(1260, 936, 440, 26);
  g.beginPath(); g.arc(1260, 949, 22, 0, TAU); g.fill();
}

/* Background agents of other activities: pairs of eyes and small lights across the far reef. */
const CROWD = Array.from({ length: 30 }, (_, i) => ({
  x: 80 + (i + h1(i * 3.7)) / 30 * 1760,
  y: 520 + h1(i * 5.1) * 230,
  d: 0.35 + 0.5 * h1(i * 9.3),              // depth: smaller is farther
  col: ['#7fe0ff', '#ffd27a', '#9dffcb', '#ff9a6a', '#cfa8ff', '#ffffff'][Math.floor(h1(i * 2.2) * 6)],
  open: 15.2 + h1(i * 4.4) * 1.4,
}));

/* Marine snow: drifting particles; depth gives parallax. */
const SNOW = Array.from({ length: 200 }, (_, i) => ({ x: h1(i * 1.9), y: h1(i * 4.3), d: 0.3 + 0.9 * h1(i * 7.7), r: 0.8 + 1.8 * h1(i * 3.1) }));

function drawDeepBG(g, t, cam, light) {
  // water column: lighter toward the opening above
  const depth = clamp((cam.cy - DEEP.openingY) / 3000);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, mixHex(DEEP.top, '#1e4a66', 1 - depth));
  gr.addColorStop(0.55, DEEP.mid);
  gr.addColorStop(1, DEEP.bot);
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  // light shafts from far above
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const sx = 360 + i * 330 + noise1(t * 0.07 + i * 3) * 90 - (cam.cx - 960) * 0.2;
    const a = (0.045 + 0.02 * Math.sin(t * 0.4 + i * 2)) * (0.5 + 0.5 * light);
    const sg = g.createLinearGradient(0, 0, 0, H);
    sg.addColorStop(0, `rgba(150,215,240,${a})`);
    sg.addColorStop(1, 'rgba(150,215,240,0)');
    g.fillStyle = sg;
    g.beginPath(); g.moveTo(sx - 30, 0); g.lineTo(sx + 50, 0); g.lineTo(sx + 260, H); g.lineTo(sx + 40, H); g.closePath(); g.fill();
  }
  g.restore();
}

function worldToScreen(cam, x, y) { return [960 + (x - cam.cx) * cam.z, 540 + (y - cam.cy) * cam.z]; }

/* Reef and crowd, drawn in world space with parallax. ambient: 0 dark to 1 fully awake. */
function drawReefLayers(g, t, cam, ambient) {
  const quiet = clamp(1.6 - cam.z * 0.75, 0.45, 1);
  const par = (f, x, y) => [960 + (x - 960 - (cam.cx - 960) * f) * cam.z, 540 + (y - 540 - (cam.cy - 540) * f) * cam.z];
  // far reef
  let p = par(0.55, -340, 380);
  g.globalAlpha = 0.55 + 0.45 * ambient;
  g.drawImage(REEF_FAR.c, p[0], p[1], 2600 * cam.z, 520 * cam.z);
  // crowd lights on the far reef
  for (let i = 0; i < CROWD.length; i++) {
    const c = CROWD[i];
    const q = par(0.55 + c.d * 0.3, c.x, c.y);
    const open = smooth(seg(t, c.open, c.open + 0.4));
    if (open <= 0) continue;
    const r = (5 + 10 * c.d) * cam.z;
    glow(g, q[0], q[1], r * 6, c.col, (0.12 + 0.3 * ambient) * quiet * open * (0.7 + 0.3 * Math.sin(t * 1.3 + i)));
    // a pair of eyes
    const bl = blinkAt(t, 100 + i);
    g.fillStyle = `rgba(240,248,255,${0.7 * open * quiet})`;
    const ew = r * 0.5, eh = r * 0.55 * (1 - bl * 0.9);
    g.beginPath(); g.ellipse(q[0] - r * 0.55, q[1], ew, eh, 0, 0, TAU); g.ellipse(q[0] + r * 0.55, q[1], ew, eh, 0, 0, TAU); g.fill();
  }
  // mid reef
  p = par(0.8, -240, 620);
  g.globalAlpha = 0.75 + 0.25 * ambient;
  g.drawImage(REEF_MID.c, p[0], p[1], 2400 * cam.z, 420 * cam.z);
  g.globalAlpha = 1;
  // polyps glowing along the reef tops
  for (let i = 0; i < 70; i++) {

function drawSnow(g, t, cam, streak) {

/* The opening above: the drain, seen from below, as a soft rounded square of morning light. */
function drawOpening(g, x, y, w, a, t, soft) {
  if (a <= 0) return;

  g.save();

  for (let i = 0; i < 7; i++) {
    const k = (i - 3) / 3, sway = noise1(t * 0.3 + i * 4) * 0.05;

    gr.addColorStop(0, `rgba(190,228,245,${0.12 * a})`);
    gr.addColorStop(1, 'rgba(190,228,245,0)');

    g.beginPath();
    g.moveTo(x + k * w * 0.32 - w * 0.06, y); g.lineTo(x + k * w * 0.32 + w * 0.06, y);
    g.lineTo(x + (k + sway) * 900 + 90, y + 1000); g.lineTo(x + (k + sway) * 900 - 90, y + 1000);

  glow(g, x, y, w * 1.3, '#fff1d8', 0.45 * a);

/* ---------- The reflection: Room 4 as the agents see it, drawn in light above them. ---------- */
const REFL = { s: 0.46, ox: 960, oy: 40, rx: 1000, ry: 80 };

function reflLine(g, pts, a, col = DEEP.line, w = 2) {
  if (a <= 0) return;

  g.strokeStyle = rgba(col, 0.16 * a); g.lineWidth = w * 4; g.stroke();
  g.strokeStyle = rgba(col, 0.7 * a); g.lineWidth = w; g.stroke();
}
function reflRect(g, x, y, w, h, a, col, lw) { reflLine(g, [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]], a, col, lw); }

/* st: draw (0..1 reveal), hi: {detector, site, worker, pallet, bound} highlight amounts, fire (0..1), blanket (0..1), detOff, red (flood) */

  reflLine(g, [[1098, 772], [1198, 786], [1206, 868]], wa, wk, 2.5);
  reflLine(g, [[1124, 650], [1176, 712], [1222, 700], [1246, 600]], wa, wk, 2.5);
  const hc = rp(1150, 602);
  g.strokeStyle = rgba(wk, 0.7 * wa); g.lineWidth = 2.5;
  g.beginPath(); g.arc(hc[0], hc[1], 32 * REFL.s, 0, TAU); g.stroke();
  // drain
  const dq = rp(ROOM.drain.x, ROOM.drain.y);
  g.strokeStyle = rgba(DEEP.line, 0.5 * el(6)); g.lineWidth = 2;

    const b0 = rp(110, 60), b1 = rp(1890, 930);

    g.beginPath(); g.roundRect(b0[0], b0[1], b1[0] - b0[0], b1[1] - b0[1], 22); g.stroke();

    const p = easeOut(st.blanket);
    const a = rp(pallet.x - 14, pallet.y - 10 - (1 - p) * 120), b = rp(pallet.x + pallet.w + 14, pallet.y + pallet.h - 30);

  }

}
function tick(g, x, y, a) {
  if (a <= 0) return;
  glow(g, x, y, 34, '#7dffb8', 0.5 * a);
  g.strokeStyle = rgba('#b8ffd8', a); g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
  const p = easeOut(clamp(a * 1.4));
  g.beginPath(); g.moveTo(x - 10, y);
  if (p < 0.4) g.lineTo(x - 10 + 6 * p / 0.4, y + 7 * p / 0.4);
  else { g.lineTo(x - 4, y + 7); g.lineTo(x - 4 + 18 * (p - 0.4) / 0.6, y + 7 - 20 * (p - 0.4) / 0.6); }
  g.stroke();
}
function drawImaginedFire(g, t, f, tt) {
  const fl = RP.flange;

  // sparks arcing from the flange toward the pallet
  for (let i = 0; i < 26; i++) {
    const life = 0.6 + h1(i) * 0.5, age = ((tt + h1(i * 3) * life) % life) / life;
    const tx = RP.pallet[0] + (h1(i * 7) - 0.3) * 80, ty = RP.pallet[1] - 30 + h1(i * 9) * 60;
    const x = lerp(fl[0], tx, age), y = lerp(fl[1], ty, age) - Math.sin(age * Math.PI) * (40 + 40 * h1(i * 5));
    glow(g, x, y, 7, '#ffb050', (1 - age) * sparksA);
  }
  // flames on the pallet
  const fa = smooth(seg(tt, 1.0, 2.0));
  if (fa > 0) {
    const pb = rp(ROOM.pallet.x, ROOM.pallet.y + ROOM.pallet.h - 30), pw = ROOM.pallet.w * REFL.s;
    for (let i = 0; i < 9; i++) {
      const fx = pb[0] + (i + 0.5) * pw / 9, hgt = (40 + 60 * h1(i * 4)) * fa * (0.75 + 0.25 * noise1(t * 8 + i));
      g.fillStyle = rgba(i % 2 ? '#ff7a2a' : '#ffb347', 0.75 * fa);
      g.beginPath(); g.moveTo(fx - 12, pb[1]); g.quadraticCurveTo(fx - 10 + noise1(t * 6 + i) * 8, pb[1] - hgt * 0.6, fx + noise1(t * 7 + i * 3) * 10, pb[1] - hgt - 30 * fa); g.quadraticCurveTo(fx + 12, pb[1] - hgt * 0.5, fx + 12, pb[1]); g.fill();
    }
    glow(g, RP.pallet[0], RP.pallet[1], 200 * fa, '#ff6a2a', 0.45 * fa);
  }
  // smoke rising toward the detector
  const sa = smooth(seg(tt, 1.6, 2.6));
  if (sa > 0) {
    for (let i = 0; i < 12; i++) {
      const age = ((tt * 0.6 + h1(i)) % 1);
      const x = lerp(RP.pallet[0], RP.detector[0], age) + noise1(t + i) * 30, y = lerp(RP.pallet[1] - 60, RP.detector[1] + 20, age);
      glow(g, x, y, 40 + 30 * age, '#8a8f94', 0.25 * sa * (1 - age * 0.5));
    }
  }
}

  fx -= env(t, 35.7, 36.1, 38.8, 39.8) * 150;

    tap: env(t, 22.0, 22.2, 23.0, 23.2) + env(t, 34.9, 35.1, 35.7, 35.9),
