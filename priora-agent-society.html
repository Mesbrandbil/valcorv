  } };
  // ---- Fire alarm: the bell
  const bx = HOME.bell[0] + Math.sin((t - 35.95) * 18) * 14 * env(t, 35.95, 36.05, 36.6, 36.8) + Math.sin(t * 25) * 4 * env(t, 37.6, 37.8, 38.5, 38.8);
  const by = HOME.bell[1] - bump(t, 20.3, 1.2) * 34 - recoil * 20;
  const ledRed = (t > 31.0 && t < 32.6) || (t > 35.95 && t < 36.75);
  const asleep = smooth(seg(t, 42.6, 43.2));
  C.bell = { x: bx, y: by, s: 0.92, st: {
    t, cableTop: RP.detector[1] + 6, blink: blinkAt(t, 3), led: ledRed ? 'red' : asleep > 0.3 ? 'blue' : 'green',
    alarm: env(t, 31.0, 31.2, 32.4, 33.0) + 0.5 * env(t, 35.95, 36.05, 36.55, 36.75), sleep: asleep * (1 - 0.65 * bump(t, 45.3, 0.7)),
  } };
  // ---- Evidence: the barreleye
  const lx = HOME.lens[0] + recoil * 40, ly = HOME.lens[1] - env(t, 23.0, 23.5, 24.4, 25.0) * 24;
  C.lens = { x: lx, y: ly, s: 1.0, st: { t, face: -1, skeptic: env(t, 33.6, 34.0, 37.4, 37.8) * 0.8, scan: env(t, 23.5, 23.65, 24.45, 24.6) } };
  // ---- Safety: the anglerfish
  let nx = HOME.lantern[0] + env(t, 24.6, 25.0, 25.9, 26.5) * 30 - recoil * 30 + env(t, 33.5, 33.9, 39.4, 40.4) * 60;
  let ny = HOME.lantern[1] - env(t, 33.5, 33.9, 39.4, 40.4) * 40;
  C.lantern = { x: nx, y: ny, s: 1.08, st: { t, face: 1, blink: blinkAt(t, 5),
    alert: Math.max(env(t, 24.9, 25.2, 26.0, 26.5), env(t, 31.2, 31.4, 33.0, 33.6), env(t, 33.6, 33.9, 35.0, 35.8) * 0.85),
    relief: env(t, 41.4, 41.9, 46.5, 47.5) } };
  // ---- Insurance conditions: the nautilus
  let sx = HOME.scroll[0] + smooth(seg(t, 36.6, 37.1)) * 190, sy = HOME.scroll[1] - env(t, 26.1, 26.6, 27.5, 28.3) * 34 - smooth(seg(t, 36.6, 37.1)) * 34;
  sx -= recoil * 30;
  C.scroll = { x: sx, y: sy, s: 1.02, st: { t, face: 1, blink: blinkAt(t, 6),
    read: env(t, 26.2, 26.6, 27.4, 28.2) + env(t, 36.9, 37.1, 37.4, 37.7) + env(t, 43.5, 43.8, 44.4, 44.9),
    red: smooth(seg(t, 43.7, 44.1)) * (1 - smooth(seg(t, 44.45, 44.75))), glint: bump(t, 27.0, 0.5) + bump(t, 37.15, 0.4) } };
  // ---- Mitigation: the octopus
  let ox = HOME.octo[0], oy = HOME.octo[1];
  oy -= smooth(seg(t, 27.6, 28.0)) * 150 * (1 - 0.55 * smooth(seg(t, 28.6, 29.2)));
  oy -= smooth(seg(t, 38.75, 38.95)) * 60 * (1 - smooth(seg(t, 39.3, 39.5)) * 0);
  const jet = easeIO(seg(t, 39.4, 40.4));
  ox = lerp(ox, 820, jet); oy = lerp(oy, 900, jet);
  ox += Math.sin(t * 1.3) * 6 * smooth(seg(t, 40.4, 41));
  const reach = {};
  reach[5] = { x: 26, y: -220, p: env(t, 38.85, 39.0, 39.5, 40.0) };
  const os = 1.15;
  const palRel = [(RP.pallet[0] - ox) / os, (RP.pallet[1] + 40 - oy) / os];
  reach[6] = { x: palRel[0], y: palRel[1], p: env(t, 40.45, 41.0, 41.35, 41.9),
    hold: t < 41.2 ? (g2, x, y) => { g2.fillStyle = '#9aa5a9'; g2.beginPath(); g2.roundRect(x - 26, y - 18, 52, 34, 6); g2.fill(); g2.strokeStyle = 'rgba(0,0,0,0.25)'; g2.lineWidth = 2; g2.stroke(); g2.fillStyle = '#c8402a'; g2.fillRect(x + 12, y - 12, 8, 12); } : null };
  const bellRel = [(bx - ox) / os, (by - 28 - oy) / os];
  reach[2] = { x: bellRel[0] - 8, y: bellRel[1] + 10, p: env(t, 42.05, 42.5, 42.95, 43.5) };
  C.octo = { x: ox, y: oy, s: os, st: { t, face: 1, blink: blinkAt(t, 7), reach,
    calm: clamp(smooth(seg(t, 39.2, 40.2)) + bump(t, 27.9, 0.6) * 0.7) } };

  // ---- Who looks at what
  const L = (k, x, y, kk) => { C[k].st.look = lookAt(C[k].x, C[k].y - 40, x, y, kk); };
  const all = ['foreman', 'lantern', 'scroll', 'octo', 'bell'];
  // default: everyone watches the ember
  all.forEach(k => L(k, E[0], E[1]));
  C.ember.st.look = t < 12.4 ? [0, 0.3] : t < 12.9 ? [-1, 0] : t < 13.3 ? [1, 0] : [Math.sin(t * 1.3) * 0.6, -0.2];
  if (t >= 18.4 && t < 28.4) { all.forEach(k => L(k, C[k].x, 200)); C.ember.st.look = [0, -1]; }
  if (t >= 20.2 && t < 21.7) L('bell', RP.detector[0], RP.detector[1]);
  if (t >= 21.7 && t < 23.2) L('foreman', RP.tank[0], RP.tank[1]);
  if (t >= 24.7 && t < 26.2) L('lantern', RP.pallet[0], RP.pallet[1]);
  if (t >= 26.2 && t < 27.6) L('scroll', 700, 120);
  if (t >= 27.6 && t < 28.4) L('octo', E[0], E[1]);
  if (t >= 28.4 && t < 31.3) { all.forEach(k => L(k, RP.pallet[0], RP.pallet[1])); C.ember.st.look = [-0.4, -1]; }
  if (t >= 31.3 && t < 33.6) { all.forEach(k => L(k, E[0], E[1] - 300)); C.ember.st.look = [0, 1]; }
  if (t >= 33.6 && t < 34.6) { all.forEach(k => L(k, nx, ny)); L('lantern', E[0], E[1]); C.ember.st.look = lookAt(ex, ey, nx, ny, 80); }
  if (t >= 34.6 && t < 35.8) { all.forEach(k => L(k, fx, fy)); L('foreman', E[0], E[1]); C.ember.st.look = lookAt(ex, ey, fx, fy, 80); }
  if (t >= 35.8 && t < 36.8) { all.forEach(k => L(k, bx, by)); L('foreman', bx, by - 30); L('bell', fx, fy); }
  if (t >= 36.8 && t < 37.6) { all.forEach(k => L(k, sx, sy)); L('scroll', fx, fy - 40); }
  if (t >= 37.6 && t < 38.8) { all.forEach((k, i) => L(k, lerp(300, 1600, 0.5 + 0.5 * Math.sin(t * 7 + i * 2)), 700)); }
  if (t >= 38.8 && t < 40.4) { all.forEach(k => L(k, ox, oy - 120)); C.ember.st.look = lookAt(ex, ey, ox, oy - 100, 80); L('octo', E[0], E[1]); }
  if (t >= 40.4 && t < 42.0) { all.forEach(k => L(k, RP.pallet[0], RP.pallet[1])); C.ember.st.look = [-0.6, -1]; }
  if (t >= 42.0 && t < 43.6) { all.forEach(k => L(k, bx, by - 30)); C.ember.st.look = lookAt(ex, ey, bx, by, 80); }
  if (t >= 43.6 && t < 44.4) { all.forEach(k => L(k, sx, sy - 40)); L('scroll', sx + 100, sy - 120); C.ember.st.look = [-1, -0.3]; }
  const orb = orbAt(t, C);
  if (orb && t >= 44.4) { all.forEach(k => L(k, orb.x, orb.y, 160)); C.ember.st.look = lookAt(ex, ey, orb.x, orb.y, 80); }
  C.orb = orb;

  // ---- Lens eye angle (the fish faces left, so angles are mirrored)
  const lEye = lensEyePoint(lx, ly, 1.0, { face: -1, eyeAngle: -Math.PI / 2 });
  const aim = (x, y) => Math.atan2(y - lEye[1], -(x - lEye[0]));
  let ea = lerp(aim(E[0], E[1]), -Math.PI / 2 - 0.3, smooth(seg(t, 18.4, 18.9)));
  ea = lerp(ea, aim(RP.worker[0], RP.worker[1]), env(t, 23.25, 23.5, 24.5, 24.9));
  ea = lerp(ea, aim(RP.pallet[0], RP.pallet[1]), env(t, 28.4, 28.8, 31.2, 31.5));
  ea = lerp(ea, aim(nx, ny), env(t, 33.6, 33.8, 34.4, 34.6));
  ea = lerp(ea, aim(fx, fy - 30), env(t, 34.6, 34.8, 36.6, 36.8));
  ea += Math.sin(t * 13) * 0.95 * env(t, 37.6, 37.8, 38.5, 38.8);
  ea = lerp(ea, aim(ox, oy - 100), env(t, 38.8, 39.0, 40.3, 40.5));
  ea = lerp(ea, aim(RP.pallet[0], RP.pallet[1]), env(t, 40.5, 40.8, 42.0, 42.3));
  ea = lerp(ea, aim(bx, by), env(t, 42.1, 42.4, 43.5, 43.7));
  if (orb && t > 44.4) ea = lerp(ea, aim(orb.x, orb.y), smooth(seg(t, 44.4, 44.8)));
  C.lens.st.eyeAngle = ea;

  // ---- Safety's lure
  const lureBase = [nx + 14 * 1.08, ny - 40 * 1.08];
  let la = -1.1 + Math.sin(t * 1.2) * 0.08;
  la = lerp(la, Math.atan2(RP.pallet[1] - lureBase[1], RP.pallet[0] - lureBase[0]), env(t, 24.8, 25.2, 26.0, 26.5));
  la = lerp(la, -1.5 + Math.sin((t - 33.8) * 11) * 0.2, env(t, 33.6, 33.9, 34.9, 35.5));
  C.lantern.st.lureAngle = la;

  // ---- Ember expression
  Object.assign(C.ember.st, {
    blink: t < 12.1 ? 1 : blinkAt(t, 1),
    intensity: (0.85 + 0.6 * bump(t, 18.2, 1.4) + 0.4 * env(t, 28.4, 28.6, 31.2, 31.4)) * (1 - 0.45 * env(t, 31.4, 31.6, 33.6, 34.6)),
    guilty: env(t, 31.8, 32.2, 34.4, 35.0), happy: env(t, 16.6, 17.0, 17.8, 18.2) + env(t, 41.9, 42.2, 43.3, 43.7),
    sqy: 1 - bump(t, 13.55, 0.18) * 0.25 - bump(t, 18.95, 0.2) * 0.2, sqx: 1 + bump(t, 13.55, 0.18) * 0.2,
  });
  return C;
}

/* The slice of risk: forty minutes without fire detection, pulled out of the wording as a glowing orb. */
function orbAt(t, C) {
  if (t < 44.35) return null;
  const sc = C.scroll, start = scrollRedPoint(sc.x, sc.y, sc.s, { t, face: 1 });
  const p1 = easeOut(seg(t, 44.35, 45.1));
  let x = lerp(start[0], 900, p1), y = lerp(start[1], 600, p1);
  const p2 = easeIO(seg(t, 45.1, 50.0));
  x = lerp(x, 960, p2); y = lerp(y, -1500, p2 * p2);
  return { x, y, a: smooth(seg(t, 44.35, 44.6)) };
}
function drawOrb(g, x, y, s, t, a = 1) {
  glow(g, x, y, 130 * s, AG.risk, 0.5 * a);
  glow(g, x, y, 42 * s, '#ffc2a8', 0.8 * a);
  g.save();
  g.globalAlpha = a;
  g.translate(x, y);
  g.scale(s, s);
  g.fillStyle = 'rgba(255,120,90,0.25)';
  g.beginPath(); g.arc(0, 0, 22, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,225,215,0.85)'; g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, 22, 0, TAU); g.stroke();
  g.strokeStyle = '#ffe9e0'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.arc(0, 0, 14, -Math.PI / 2, -Math.PI / 2 + TAU * (40 / 60)); g.stroke();
  g.fillStyle = '#fff4ef';
  g.beginPath(); g.arc(0, 0, 3, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.7)';
  g.beginPath(); g.ellipse(-8, -10, 6, 3, -0.6, 0, TAU); g.fill();
  g.restore();
}

function drawSupers(g, t, C, cam) {
  for (const [label, a, b, who, dx, dy, align] of SUPERS) {
    const al = env(t, a, a + 0.25, b - 0.3, b);
    if (al <= 0) continue;
    const c = C[who];
    const p = worldToScreen(cam, c.x + dx, c.y + dy);
    const size = minText(18, 10);
    font(g, size, 500, MONO);
    // keep the label inside the visible part of the stage
    const tw = g.measureText(label).width + label.length * size * 0.32;
    let x = p[0];
    const left = align === 'left' ? x : align === 'right' ? x - tw : x - tw / 2;
    const shift = clamp(left, VIS.x0 + 24, VIS.x0 + VIS.w - 24 - tw) - left;
    x += shift;
    g.textAlign = align;
    g.textBaseline = 'middle';
    g.fillStyle = `rgba(236,246,250,${0.88 * al})`;
    spacedText(g, label, x + (1 - al) * (align === 'right' ? 8 : align === 'left' ? -8 : 0), p[1], size * 0.32);
    g.textBaseline = 'alphabetic';
  }
}

/* Eyes seen in the dark before the bloom: only lights and eye whites. */
function drawEyesInDark(g, t, C, cam, dark) {
  if (dark <= 0.02) return;
  const S = (x, y) => worldToScreen(cam, x, y);
  const pair = (x, y, r, open) => {
    if (open <= 0) return;
    const p = S(x, y);
    r *= cam.z;
    g.fillStyle = rgba('#f6f2ea', 0.95 * open * dark);
    g.beginPath(); g.ellipse(p[0] - r * 1.25, p[1], r, r * 1.1 * open, 0, 0, TAU); g.ellipse(p[0] + r * 1.25, p[1], r * 0.92, r * open, 0, 0, TAU); g.fill();
    g.fillStyle = rgba('#05080a', open * dark);
    g.beginPath(); g.arc(p[0] - r * 1.25 + r * 0.25, p[1] + 1, r * 0.5, 0, TAU); g.arc(p[0] + r * 1.25 + r * 0.25, p[1] + 1, r * 0.46, 0, TAU); g.fill();
  };
  const op = a => smooth(seg(t, a, a + 0.22)) * (1 - blinkAt(t, a * 10) * 0.9);
  const f = C.foreman, ln = C.lantern, sc = C.scroll, oc = C.octo, b = C.bell;
  pair(f.x - 36 * f.s, f.y - 20 * f.s, 12, op(13.7));
  pair(ln.x + 20 * ln.s, ln.y - 9 * ln.s, 11, op(14.0));
  if (op(14.0) > 0) { const lp = lanternLurePoint(ln.x, ln.y, ln.s, ln.st); glow(g, ...S(lp[0], lp[1]), 70 * cam.z, AG.warn, 0.7 * op(14.0) * dark); }
  const bp = S(b.x, b.y - 30 * b.s);
  glow(g, bp[0], bp[1], 70 * cam.z, AG.ledGreen, 0.8 * op(14.3) * dark);
  g.fillStyle = rgba(AG.ledGreen, op(14.3) * dark); g.beginPath(); g.arc(bp[0], bp[1], 8 * cam.z, 0, TAU); g.fill();
  const le = lensEyePoint(C.lens.x, C.lens.y, C.lens.s, C.lens.st), lp = S(le[0], le[1]);
  glow(g, lp[0], lp[1], 46 * cam.z, '#7dffb8', 0.9 * op(14.6) * dark);
  pair(sc.x + 66 * sc.s, sc.y - 4 * sc.s, 10, op(14.9));
  // the crowd, far away
  for (let i = 0; i < CROWD.length; i++) {
    const c = CROWD[i], o = smooth(seg(t, c.open, c.open + 0.3)) * (1 - blinkAt(t, 100 + i) * 0.9);
    if (o <= 0) continue;
    const q = [960 + (c.x - 960 - (cam.cx - 960) * (0.55 + c.d * 0.3)) * cam.z, 540 + (c.y - 540 - (cam.cy - 540) * (0.55 + c.d * 0.3)) * cam.z];
    const r = (2 + 4 * c.d) * cam.z;
    g.fillStyle = rgba('#eef6fa', 0.85 * o * dark);
    g.beginPath(); g.ellipse(q[0] - r * 1.2, q[1], r, r * o, 0, 0, TAU); g.ellipse(q[0] + r * 1.2, q[1], r, r * o, 0, 0, TAU); g.fill();
  }
}

function shotDeep(g, t) {
  const cam = societyCam(t);
  const C = castAt(t);
  const ambient = t < 16.2 ? 0 : smooth(seg(t, 16.2, 18.4));
  drawDeepBG(g, t, cam, ambient);
  if (t < 11.6) {
    const p = seg(t, 7.6, 11.6);
    drawOpening(g, 960, lerp(120, -260, easeIO(p)), lerp(520, 120, easeOut(p)), 1 - smooth(seg(p, 0.65, 1)), t, true);
  }
  // while the deep is completely dark, only the ember's light needs drawing
  const hidden = t > 10.4 && t < 15.9;
  g.save();
  if (!hidden) drawReefLayers(g, t, cam, ambient);
  g.translate(960, 540); g.scale(cam.z, cam.z); g.translate(-cam.cx, -cam.cy);
  drawReflection(g, t, reflectionState(t));
  const beam = env(t, 18.4, 18.9, 19.8, 20.6);
  if (beam > 0) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const bg = g.createLinearGradient(0, C.ember.y, 0, 60);
    bg.addColorStop(0, `rgba(255,200,130,${0.32 * beam})`); bg.addColorStop(1, 'rgba(255,200,130,0)');
    g.fillStyle = bg;
    g.beginPath(); g.moveTo(C.ember.x - 14, C.ember.y - 40); g.lineTo(C.ember.x + 14, C.ember.y - 40); g.lineTo(C.ember.x + 460, 40); g.lineTo(C.ember.x - 460, 40); g.closePath(); g.fill();
    g.restore();
  }
  if (C.lens.st.scan > 0) {
    const e = lensEyePoint(C.lens.x, C.lens.y, C.lens.s, C.lens.st);
    g.save(); g.globalCompositeOperation = 'lighter';
    const sg = g.createLinearGradient(e[0], e[1], RP.worker[0], RP.worker[1]);
    sg.addColorStop(0, `rgba(125,255,184,${0.4 * C.lens.st.scan})`); sg.addColorStop(1, `rgba(125,255,184,${0.06 * C.lens.st.scan})`);
    g.fillStyle = sg;
    g.beginPath(); g.moveTo(e[0] - 6, e[1]); g.lineTo(e[0] + 6, e[1]); g.lineTo(RP.worker[0] + 60, RP.worker[1] - 60); g.lineTo(RP.worker[0] - 60, RP.worker[1] - 60); g.closePath(); g.fill();
    g.restore();
  }
  const lure = env(t, 24.9, 25.2, 26.0, 26.4);
  if (lure > 0) {
    const lp = lanternLurePoint(C.lantern.x, C.lantern.y, C.lantern.s, C.lantern.st);
    g.save(); g.globalCompositeOperation = 'lighter';
    g.strokeStyle = rgba(AG.warn, 0.45 * lure); g.lineWidth = 2; g.setLineDash([3, 9]);
    g.beginPath(); g.moveTo(lp[0], lp[1]); g.lineTo(RP.pallet[0], RP.pallet[1] + 50); g.stroke();
    g.restore();
  }
  // the cast, back to front, each with a faint backlight that separates it from the reef
  const back = (c, dy, r) => glow(g, c.x, c.y + dy, r, '#6cc4e0', 0.13 * ambient);
  if (!hidden) {
    back(C.bell, -30, 170); back(C.lens, -20, 190); back(C.foreman, 0, 170); back(C.scroll, 0, 170); back(C.lantern, 0, 140); back(C.octo, -60, 150);
    drawBell(g, C.bell.x, C.bell.y, C.bell.s, C.bell.st);
    if (t > 42.5 && t < 45.6) drawTimerRing(g, C.bell.x, C.bell.y - 28 * C.bell.s, t);
    drawLens(g, C.lens.x, C.lens.y, C.lens.s, C.lens.st);
    drawForeman(g, C.foreman.x, C.foreman.y, C.foreman.s, C.foreman.st);
    drawScroll(g, C.scroll.x, C.scroll.y, C.scroll.s, C.scroll.st);
    drawOcto(g, C.octo.x, C.octo.y, C.octo.s, C.octo.st);
  }
  drawLantern(g, C.lantern.x, C.lantern.y, C.lantern.s, C.lantern.st);
  if (t > 11.25) drawEmber(g, C.ember.x, C.ember.y, C.ember.s, C.ember.st);
  if (C.orb) drawOrb(g, C.orb.x, C.orb.y, 1.5, t, C.orb.a);
  g.restore();
  if (!hidden) drawNearLayer(g, cam);
  // darkness before the bloom: only the ember's light, growing into the bloom
  const dark = 1 - ambient;
  const ep = worldToScreen(cam, C.ember.x, C.ember.y - 20);
  if (dark > 0.01) {
    const preDrop = smooth(seg(t, 9.3, 10.2));
    const R = lerp(t < 11.3 ? 1 : 230 * clamp((t - 11.3) * 3) + 1, 2800, easeOut(seg(t, 16.2, 18.4)));
    const dg = g.createRadialGradient(ep[0], ep[1], R * 0.22, ep[0], ep[1], R);
    dg.addColorStop(0, 'rgba(2,6,10,0)');
    dg.addColorStop(1, `rgba(2,6,10,${0.985 * preDrop})`);
    g.fillStyle = dg;
    g.fillRect(0, 0, W, H);
    drawEyesInDark(g, t, C, cam, t < 16.2 ? 1 : 1 - smooth(seg(t, 16.2, 17.0)));
    if (t > 11.25 && t < 16.4) drawEmber(g, ep[0], ep[1] + 20, C.ember.s * cam.z, C.ember.st);
  }
  if (t < 11.8) drawSinkingLetters(g, t, cam);
  const br = seg(t, 16.2, 18.0);
  if (br > 0 && br < 1) {
    g.strokeStyle = `rgba(255,220,170,${0.4 * (1 - br)})`; g.lineWidth = 3;
    g.beginPath(); g.arc(ep[0], ep[1], easeOut(br) * 2000, 0, TAU); g.stroke();
  }
  drawSupers(g, t, C, cam);
}

/* What the reflection shows at time t. */
function reflectionState(t) {
  const st = {
    draw: smooth(seg(t, 18.6, 20.4)),
    hi: {
      detector: env(t, 20.2, 20.5, 21.4, 21.8),
      site: env(t, 21.8, 22.1, 23.0, 23.4) + 0.8 * env(t, 34.8, 35.0, 35.7, 36.0),
      worker: env(t, 23.4, 23.7, 24.5, 25.0),
      pallet: env(t, 24.9, 25.2, 26.0, 26.6) + 0.6 * env(t, 33.6, 33.9, 41.0, 41.6),
    },
    bound: smooth(seg(t, 26.35, 27.3)) * (1 - 0.6 * smooth(seg(t, 27.8, 28.6)) + 0.6 * env(t, 36.7, 36.9, 37.5, 37.9)),
    boundRed: bump(t, 36.9, 0.8),
    fire: env(t, 29.0, 29.1, 32.4, 32.9),
    fireT: t - 29.0,
    detRed: (t > 31.0 && t < 32.7) ? 1 : 0,
    red: env(t, 31.2, 31.7, 32.3, 32.8),
    blanket: smooth(seg(t, 41.15, 41.8)),
    detOff: t > 42.7,
    ticks: [
      [RP.worker[0] + 58, RP.worker[1] - 60, seg(t, 23.95, 24.3) * (1 - smooth(seg(t, 27.6, 28.2)))],
      [RP.worker[0] + 58, RP.worker[1] - 22, seg(t, 24.2, 24.55) * (1 - smooth(seg(t, 27.6, 28.2)))],
      [RP.pallet[0] + 76, RP.pallet[1] - 46, seg(t, 41.8, 42.15) * (1 - smooth(seg(t, 45.4, 46.2)))],
    ],
  };
  st.draw *= 1 - smooth(seg(t, 45.6, 46.8));
  return st;
}

function drawTimerRing(g, x, y, t) {
  const p = easeOut(seg(t, 42.7, 43.5)), a = env(t, 42.6, 42.9, 45.0, 45.6);
  g.strokeStyle = rgba(AG.ledBlue, 0.85 * a); g.lineWidth = 3.5; g.lineCap = 'round';
  g.beginPath(); g.arc(x, y, 58, -Math.PI / 2, -Math.PI / 2 + TAU * (40 / 60) * p); g.stroke();
  g.strokeStyle = rgba(AG.ledBlue, 0.18 * a);

}

/* The letters of the sentence sinking through the water and fusing into the ember. */
function drawSinkingLetters(g, t, cam) {
  const L = subtitleLayout(g);
  const target = worldToScreen(societyCam(11.3), HOME.ember[0], HOME.ember[1] - 20);
  font(g, 42, 500, SANS);

  for (const lt of L.letters) {

    const e = easeIO(p);

    const x = lerp(sx, target[0], e) + swirl, y = lerp(sy, target[1], p * 0.55 + e * 0.45) + noise1(t * 2 + i) * 18 * (1 - e);

    glow(g, x, y - 14 * sc, 46 * sc + 8, '#ffa64a', 0.5);
    g.save();
    g.translate(x, y);
    g.rotate(noise1(i * 7 + t * 0.6) * 1.2 * (1 - e));
    g.scale(sc, sc);
    g.fillStyle = 'rgba(255,222,170,0.96)';

  const f = bump(t, 11.1, 0.6);
  if (f > 0) { glow(g, target[0], target[1], 280 * f, '#ffcf8a', 0.9 * f); glow(g, target[0], target[1], 90, '#ffffff', f); }
}

/* ==== 50-market.js ==== */
/* The market, 48.6 to 57.2 s. The camera rises with the slice of risk and the world opens up:
   a floor of societies (one under every piece of work), a ceiling of openings (one for every sentence),
   and between them the carriers, swimming like whales. A simple perspective projection. */

const MK = { f: 900, ceil: 9.5, orb: [0, 0, 10] };

const CLUSTERS = [];
for (let i = -18; i <= 18; i++) for (let k = 0; k < 44; k++) {
  const X = i * 4.2 + (h2(i, k) - 0.5) * 2.6, Z = 4 + k * 4 + (h2(k + 40, i) - 0.5) * 2.6;
  if (Math.abs(X) < 2.2 && Math.abs(Z - 10) < 2.2) continue;
  CLUSTERS.push({ X, Z, col: ['#7fe0ff', '#ffd27a', '#9dffcb', '#ffb38a'][Math.floor(h2(i * 3, k) * 4)], rises: h2(i + 7, k * 3) < 0.16, ph: h2(i, k + 9), seed: i * 100 + k });
}

/* Market camera: x, y (height), z (position along the view), hy (horizon on screen). */
function marketCam(t) {
  const p1 = easeIO(seg(t, 48.6, 53.2)), p2 = easeIO(seg(t, 53.0, 55.0)), p3 = easeIO(seg(t, 55.2, 57.2));
  let x = 0, y = lerp(2.0, 7.6, p1), z = lerp(4.2, -15, p1), hy = 500;
  y = lerp(y, 4.4, p2); z = lerp(z, 3.6, p2);
  y = lerp(y, 7.4, p3); z = lerp(z, 5.6, p3); hy = lerp(hy, 1250, p3);
  x += Math.sin(t * 0.3) * 0.4 * (1 - p2);
  return { x, y, z, hy };
}
function proj(c, X, Y, Z) {
  const d = Z - c.z;
  if (d < 0.25) return null;
  return { x: 960 + MK.f * (X - c.x) / d, y: c.hy - MK.f * (Y - c.y) / d, s: MK.f / d, d };
}

/* The orb's path in the market, and the two offers that come to circle it. */
function marketOrb(t) {
  const rise = easeOut(seg(t, 48.6, 54.2)), up = easeIn(seg(t, 55.2, 57.0));
  return [0, lerp(1.6, 4.4, rise) + up * 5.4 + Math.sin(t * 1.4) * 0.05, 10];
}

/* Whales: the carriers. Each path is a function of t returning [X, Y, Z, dir]. */
const WHALES = [
  { name: 'NORTHSTAR', emblem: 'star', col: '#cfe6ff', kind: 'hump', len: 7.5, path: t => {
      const a = easeIO(seg(t, 49.6, 54.0));
      return [lerp(26, 5.4, a), lerp(7, 4.7, a), lerp(30, 13.2, a), -1];
    } },
  { name: 'BOREAL', emblem: 'wave', col: '#8ff0d0', kind: 'sperm', len: 7, path: t => {
      const a = easeIO(seg(t, 50.4, 54.6));
      return [lerp(-30, -5.6, a), lerp(2.5, 3.5, a), lerp(40, 14.6, a), 1];
    } },
  { name: 'ATLAS', emblem: 'globe', col: '#ffd28a', kind: 'shark', len: 8, path: t => {
      const a = easeIO(seg(t, 49.8, 53.4)), b = easeIn(seg(t, 53.9, 56.5));
      return [lerp(-24, 0.6, a) + b * -22, lerp(9, 7.3, a) + b * 1.8, lerp(22, 15.5, a) + b * 14, b > 0.02 ? -1 : 1];
    } },
  // the one that passes close to the camera: scale of the world
  { name: '', emblem: 'star', col: '#bfe0ff', kind: 'hump', len: 9, path: t => {
      const a = seg(t, 50.0, 53.6);
      return [lerp(-26, 26, a), 6.2 + Math.sin(a * 3) * 0.3, -6.0, 1];
    } },
  { name: '', emblem: 'wave', col: '#a6f2dc', kind: 'sperm', len: 6, path: t => [lerp(40, -40, seg(t, 46, 60)), 6, 60, -1] },
  { name: '', emblem: 'globe', col: '#ffe0a8', kind: 'shark', len: 6, path: t => [lerp(-50, 50, seg(t, 46, 60)), 4.5, 80, 1] },
];
/* Offers: a whale releases a pearl, which then circles the orb. */
const OFFERS = [
  { whale: 0, at: 54.2, price: 'DKK 520', phase: 0 },
  { whale: 1, at: 54.75, price: 'DKK 640', phase: Math.PI },
];

function shotMarket(g, t, alpha = 1) {
  const c = marketCam(t);
  g.save();
  g.globalAlpha = alpha;
  // water
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#0d2638'); gr.addColorStop(clamp(c.hy / H, 0.05, 0.95), '#0a1d2c'); gr.addColorStop(1, '#040b12');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  // horizon haze
  glow(g, 960, c.hy, 1400, '#2c6e8e', 0.35);
  // ceiling: one opening for every sentence spoken somewhere
  for (let n = CLUSTERS.length - 1; n >= -1; n--) {
    const cl = n < 0 ? { X: 0, Z: 10, col: '#ffd27a', ours: true } : CLUSTERS[n];
    const p = proj(c, cl.X, MK.ceil, cl.Z);
    if (!p || p.x < -200 || p.x > W + 200 || p.y < -200 || p.y > H + 200) continue;
    const fog = Math.pow(clamp(1 - p.d / 170), 1.6);
    const w = p.s * 1.1, h = p.s * 1.3 * clamp((MK.ceil - c.y) / p.d, 0.04, 1);
    const ga = g.globalAlpha;
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = ga * (cl.ours ? 0.9 : 0.22) * fog;
    g.drawImage(glowSprite('#ffe2b8'), p.x - w * 1.6, p.y - h * 1.6, w * 3.2, h * 3.2);
    g.globalAlpha = ga;
    g.globalCompositeOperation = 'source-over';
    if (p.s > 40) {
      g.strokeStyle = rgba('#fff0d8', 0.32 * fog * (cl.ours ? 2.4 : 1));
      g.lineWidth = Math.max(1, p.s * 0.03);
      markPath(g, p.x, p.y, w * 0.8, h * 0.8);
      g.stroke();
    }
  }
  // floor: a society under every piece of work
  for (let n = CLUSTERS.length - 1; n >= 0; n--) {
    const cl = CLUSTERS[n];
    const p = proj(c, cl.X, 0, cl.Z);
    if (!p || p.x < -100 || p.x > W + 100 || p.y < -100 || p.y > H + 100) continue;
    const fog = Math.pow(clamp(1 - p.d / 170), 1.4);
    if (p.s < 5) { glow(g, p.x, p.y, Math.max(3, p.s * 1.6), cl.col, 0.5 * fog); continue; }
    glow(g, p.x, p.y - p.s * 0.2, p.s * 1.4, cl.col, 0.3 * fog);
    glow(g, p.x, p.y - p.s * 0.1, p.s * 0.35, '#ffb45c', 0.8 * fog);
    for (let j = 0; j < 5; j++) {
      const a = j / 5 * TAU + cl.ph * 6;
      glow(g, p.x + Math.cos(a) * p.s * 0.45, p.y - p.s * 0.15 + Math.sin(a) * p.s * 0.12, p.s * 0.1, ['#e9f7ff', '#ffd27a', '#9dffcb', '#ff9a6a', '#7fe0ff'][j], 0.9 * fog);
    }
    // other slices of risk rising toward the market
    if (cl.rises) {
      const y = ((t - 46 + cl.ph * 9) * 0.8) % 9.5;
      const q = proj(c, cl.X, y, cl.Z);
      if (q) glow(g, q.x, q.y, Math.max(3, q.s * 0.35), AG.risk, 0.75 * fog * (1 - y / 9.5));
    }
  }
  // our society: a little brighter, the ember at its heart
  const ours = proj(c, 0, 0, 10);
  if (ours) {
    glow(g, ours.x, ours.y - ours.s * 0.25, ours.s * 2.2, '#6cc4e0', 0.35);
    glow(g, ours.x, ours.y - ours.s * 0.1, ours.s * 0.5, '#ffb45c', 1);
    for (let j = 0; j < 6; j++) {
      const a = j / 6 * TAU;
      glow(g, ours.x + Math.cos(a) * ours.s * 0.55, ours.y - ours.s * 0.15 + Math.sin(a) * ours.s * 0.14, ours.s * 0.12, [AG.vest, AG.ledGreen, AG.lensGreen, AG.warn, '#efe3cc', AG.octoCalm][j], 1);
    }
  }
  // whales, far to near
  const ws = WHALES.map((w, i) => { const [X, Y, Z, dir] = w.path(t); return { w, i, X, Y, Z, dir, p: proj(c, X, Y, Z) }; })
    .filter(o => o.p && o.p.d > 0.6).sort((a, b) => b.p.d - a.p.d);
  const orbW = marketOrb(t), orbP = proj(c, ...orbW);
  let orbDrawn = false;
  for (const o of ws) {
    if (!orbDrawn && orbP && o.p.d < orbP.d) { drawMarketOrb(g, t, c, orbP); orbDrawn = true; }
    const fog = clamp(1 - o.p.d / 120);
    const sc = o.p.s * o.w.len / 300;
    if (o.p.x < -sc * 400 || o.p.x > W + sc * 400) continue;
    // the turn: a whale that declines flips its direction smoothly
    let dir = o.dir;
    if (o.i === 2) { const turn = seg(t, 53.6, 54.3); dir = Math.cos(turn * Math.PI); }
    const look = o.i <= 2 && orbP ? env(t, 52.8, 53.4, 55.4, 56) : 0;
    g.save();
    g.globalAlpha *= 0.35 + 0.65 * fog;
    drawWhale(g, o.p.x, o.p.y, sc, { t, kind: o.w.kind, dir: Math.abs(dir) < 0.08 ? 0.08 * Math.sign(dir || 1) : dir, emblem: o.w.emblem, emblemCol: o.w.col, phase: o.i, eyeGlint: look * 0.6 });
    g.restore();
  }
  if (!orbDrawn && orbP) drawMarketOrb(g, t, c, orbP);
  g.restore();
}

function drawMarketOrb(g, t, c, p) {
  const s = clamp(p.s / 140, 0.25, 2.2);
  drawOrb(g, p.x, p.y, s * 1.4, t, 1);
  // offers: pearls released by the carriers, circling the orb, each with its price
  for (const o of OFFERS) {
    const rel = seg(t, o.at, o.at + 0.9);
    if (rel <= 0) continue;
    const [X, Y, Z, dir] = WHALES[o.whale].path(t);
    const wl = WHALES[o.whale].len;
    const wp = proj(c, X + dir * wl * 0.42, Y + 0.1, Z);
    const side = o.whale === 0 ? 1 : -1;
    const ox = p.x + side * 92 * s * 1.4, oy = p.y + Math.sin(t * 2 + o.phase) * 5 * s;
    const e = easeIO(rel);
    const x = wp ? lerp(wp.x, ox, e) : ox, y = wp ? lerp(wp.y, oy, e) : oy;
    const pr = 9 * s * 1.4;
    glow(g, x, y, pr * 6, '#e8f4ff', 0.6);
    g.fillStyle = '#f4fbff';
    g.beginPath(); g.arc(x, y, pr, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.arc(x - pr * 0.35, y - pr * 0.35, pr * 0.3, 0, TAU); g.fill();
    // price tag: appears once the pearl arrives, fades as the orb leaves for the surface
    const ta = smooth(seg(rel, 0.7, 1)) * (1 - smooth(seg(t, 56.3, 56.9)));
    if (ta > 0) {
      const size = minText(26, 12), small = minText(15, 9);
      g.textAlign = side > 0 ? 'left' : 'right';
      const lx = x + side * (pr + 16);
      font(g, small, 500, MONO);
      g.fillStyle = `rgba(214,232,242,${0.75 * ta})`;
      spacedText(g, WHALES[o.whale].name, lx, y - size * 0.55, small * 0.3);
      font(g, size, 500, MONO);
      g.fillStyle = `rgba(246,251,255,${0.95 * ta})`;
      spacedText(g, o.price, lx, y + size * 0.6, size * 0.06);
    }
  }
}

/* ==== 60-return.js ==== */
/* Back in the real world, 57.2 to 67.6 s: one instruction for the worker, one decision for the site manager,
   then the weld. And the ending, 67.6 to 75 s: back through the drain to the place where they meet. */

const UI = { bg: '#0f1519', card: '#172027', line: 'rgba(230,240,245,0.12)', text: '#eef3f5', dim: 'rgba(230,240,245,0.6)' };

/* A phone with a screen drawn by fn(g, w, h) in screen-local coordinates. buzz shakes it. */
function drawPhone(g, cx, cy, w, h, rot, buzz, fn) {
  g.save();
  g.translate(cx + Math.sin(buzz * 90) * 6 * Math.min(1, buzz * 4) * (buzz > 0 && buzz < 0.5 ? 1 : 0), cy);
  g.rotate(rot);
  g.fillStyle = 'rgba(0,0,0,0.45)';
  g.beginPath(); g.roundRect(-w / 2 + 18, -h / 2 + 26, w, h, 54); g.fill();
  g.fillStyle = '#06080a';
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 54); g.fill();
  g.strokeStyle = '#2b3236'; g.lineWidth = 4;
  g.beginPath(); g.roundRect(-w / 2 + 2, -h / 2 + 2, w - 4, h - 4, 52); g.stroke();
  const sw = w - 34, sh = h - 34;
  g.save();
  g.beginPath(); g.roundRect(-sw / 2, -sh / 2, sw, sh, 40); g.clip();
  g.translate(-sw / 2, -sh / 2);
  g.fillStyle = UI.bg; g.fillRect(0, 0, sw, sh);
  fn(g, sw, sh);
  // glass sheen
  g.fillStyle = 'rgba(255,255,255,0.035)';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(sw * 0.6, 0); g.lineTo(0, sh * 0.5); g.closePath(); g.fill();
  g.restore();
  g.fillStyle = '#06080a';
  g.beginPath(); g.roundRect(-46, -h / 2 + 26, 92, 26, 13); g.fill();
  g.restore();
}
function phoneHeader(g, w, label) {
  g.strokeStyle = UI.text; g.lineWidth = 2.2;
  markPath(g, 52, 92, 26, 26); g.stroke();
  g.fillStyle = UI.text; g.beginPath(); g.arc(52 + MARK_DOT.dx * 26, 92 + MARK_DOT.dy * 26, MARK_DOT.r * 26, 0, TAU); g.fill();
  font(g, 26, 500, SANS); g.textAlign = 'left'; g.fillStyle = UI.text; g.fillText('Priora', 78, 101);
  font(g, 20, 500, MONO); g.textAlign = 'right'; g.fillStyle = UI.dim; g.fillText('07:42', w - 40, 100);
  font(g, 19, 500, MONO); g.textAlign = 'left'; g.fillStyle = UI.dim;
  spacedText(g, label, 40, 170, 3);
}
function wrapText(g, str, x, y, maxW, lh) {
  const words = str.split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, yy); line = w; yy += lh; } else line = test;
  }
  g.fillText(line, x, yy);
  return yy;
}

/* The worker's message: one practical instruction. */
function shotWorkerPhone(g, t) {
  const p = seg(t, 57.2, 59.7);
  // blurred room behind
  g.save();
  g.imageSmoothingQuality = 'high';
  g.drawImage(ROOM_BLUR, -80, -60, W + 160, H + 120);
  g.restore();
  g.fillStyle = 'rgba(6,10,14,0.45)'; g.fillRect(0, 0, W, H);
  glow(g, 380, 260, 600, '#ffc27a', 0.25);
  const rise = easeOut(seg(t, 57.2, 57.8));
  const cy = lerp(1320, 560, rise) - p * 14;
  g.save(); g.translate(1080, 540); g.scale(0.84, 0.84); g.translate(-1080, -540);
  holdingHand(g, 1080, cy, -0.05, 560, 1060, '#9a6f45', '#7c5634', '#2b3a48', false);
  drawPhone(g, 1080, cy, 560, 1060, -0.05, t - 57.75, (s, w, h) => {
    phoneHeader(s, w, 'ROOM 4 · HOT WORK');
    const a = smooth(seg(t, 57.9, 58.3));
    s.globalAlpha = a;
    s.fillStyle = UI.card;
    s.beginPath(); s.roundRect(28, 210, w - 56, 330, 28); s.fill();
    font(s, 46, 500, SANS); s.fillStyle = UI.text; s.textAlign = 'left';
    wrapText(s, 'Cover the pallet with the fire blanket.', 58, 290, w - 116, 58);
    font(s, 46, 300, SANS); s.fillStyle = '#ffd7a0';
    s.fillText('Then begin.', 58, 470);
    s.globalAlpha = 1;
  });
  holdingHand(g, 1080, cy, -0.05, 560, 1060, '#9a6f45', '#7c5634', '#2b3a48', true);
  g.restore();
}

/* A hand holding a phone from below: palm and fingers behind (front = false), thumb in front (front = true). */
function holdingHand(g, cx, cy, rot, w, h, skin, shade, sleeve, front) {
  g.save();
  g.translate(cx, cy);
  g.rotate(rot);
  if (!front) {
    g.fillStyle = sleeve;
    g.beginPath(); g.ellipse(-w * 0.5, h * 0.78, w * 0.5, h * 0.2, 0.5, 0, TAU); g.fill();
    g.fillStyle = shade;
    g.beginPath(); g.ellipse(-w * 0.12, h * 0.56, w * 0.5, h * 0.13, 0.12, 0, TAU); g.fill();
    g.fillStyle = skin;
    g.beginPath(); g.ellipse(-w * 0.1, h * 0.53, w * 0.46, h * 0.11, 0.12, 0, TAU); g.fill();
    for (let i = 0; i < 4; i++) {
      g.fillStyle = i % 2 ? skin : mixHex(skin, shade, 0.4);
      g.beginPath(); g.roundRect(w * 0.38, h * (0.02 + i * 0.1), w * 0.17, h * 0.085, h * 0.04); g.fill();
    }
  } else {
    g.fillStyle = skin;
    g.save();
    g.translate(-w * 0.47, h * 0.36);
    g.rotate(-0.5);
    g.beginPath(); g.roundRect(-w * 0.08, -h * 0.17, w * 0.17, h * 0.3, w * 0.085); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.14)';
    g.beginPath(); g.roundRect(-w * 0.04, -h * 0.16, w * 0.07, h * 0.08, w * 0.035); g.fill();
    g.restore();
  }
  g.restore();
}

/* The site manager's decision: the one question that needs a person with authority. */
function shotManagerPhone(g, t) {
  const p = seg(t, 60.8, 63.6);
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#2a2420'); bg.addColorStop(1, '#0d0f12');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) {
    glow(g, 120 + h1(i * 3) * 1700, 120 + h1(i * 5) * 500, 60 + 90 * h1(i * 7), i % 3 ? '#ffcf96' : '#9cc8ff', 0.18);
  }
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, H * 0.72, W, H * 0.28);
  const rise = easeOut(seg(t, 60.8, 61.4));
  const cx = 900, cy = lerp(1340, 560, rise) - p * 10;
  const pick = smooth(seg(t, 62.05, 62.25)), done = smooth(seg(t, 62.75, 62.95));
  g.save(); g.translate(cx, 540); g.scale(0.84, 0.84); g.translate(-cx, -540);
  holdingHand(g, cx, cy, 0.03, 580, 1070, '#c9906c', '#a8724f', '#1f2430', false);
  drawPhone(g, cx, cy, 580, 1070, 0.03, t - 61.3, (s, w, h) => {
    phoneHeader(s, w, 'DECISION · ROOM 4');
    const a = smooth(seg(t, 61.45, 61.8));
    s.globalAlpha = a;

/* Wide shots in the room after the decisions. */

/* The ending: through the drain once more, look up, and the opening becomes the mark. */
function shotEnding(g, t) {
  if (t < 68.6) {
    // dive into the drain, sparks falling with us
    const p = easeIn(seg(t, 67.6, 68.6));
    const cam = { cx: lerp(1120, ROOM.drain.x, smooth(seg(t, 67.6, 68.2))), cy: lerp(600, ROOM.drain.y, smooth(seg(t, 67.6, 68.3))), s: 1.32 * Math.pow(14, p), sy: lerp(1, 3.2, p) };
    drawRoom(g, t, { cam, worker: 'weld', blanket: 1, detector: 'off', light: 0.5, arc: 0.35 * (1 - p), arcT: t - 65.2, drainInner: '#0a1c2a', grateA: 1 - smooth(seg(t, 68.0, 68.5)) });
    return;
  }
  // looking up from the deep at the opening, with the ember resting inside its light
  const q = seg(t, 68.6, 71.0);
  g.fillStyle = mixHex('#0b1c2a', '#05090d', smooth(q)); g.fillRect(0, 0, W, H);
  const mx = 960, my = lerp(470, 330, easeIO(seg(t, 69.6, 71.2)));
  const size = lerp(560, 190, easeIO(seg(t, 68.6, 71.2)));
  const crisp = smooth(seg(t, 69.8, 71.0));
  // the society's lights below, fading as the image simplifies
  for (let i = 0; i < 26; i++) {
    const x = 120 + h1(i * 3.3) * 1680, y = 820 + h1(i * 5.5) * 220;
    glow(g, x, y, 30 + 30 * h1(i), ['#7fe0ff', '#ffd27a', '#9dffcb', '#ff9a6a'][i % 4], 0.35 * (1 - crisp));
  }
  // light from the opening
  if (crisp < 1) {
    g.save();
    g.globalAlpha = 1 - crisp;
    drawOpening(g, mx, my, size, 1, t);
    g.restore();
  }
  // the crisp mark
  if (crisp > 0) {
    g.strokeStyle = rgba('#f4efe6', crisp);
    g.lineWidth = size * (1.15 / 17.6);
    markPath(g, mx, my, size, size);
    g.stroke();
  }
  // the ember becomes the dot
  const dx = mx + MARK_DOT.dx * size, dy = my + MARK_DOT.dy * size;
  const er = MARK_DOT.r * size;
  glow(g, dx, dy, er * 8, '#ff9a3c', 0.5 * (1 - crisp * 0.6));
  if (crisp < 1) drawEmber(g, dx, dy + er * 0.6, (size / 560) * 1.4 * (1 - crisp * 0.3), { t, look: [0, -0.4], blink: blinkAt(t, 1), intensity: 1 - crisp * 0.5, happy: env(t, 69.0, 69.3, 70.0, 70.4) });
  if (crisp > 0) {
    g.fillStyle = rgba(mixHex('#ffcf8a', '#f4efe6', crisp), crisp);
    g.beginPath(); g.arc(dx, dy, er, 0, TAU); g.fill();
  }
  // the closing line
  const l1 = smooth(seg(t, 70.6, 71.6)), l2 = smooth(seg(t, 72.4, 73.3));
  const size1 = minText(46, 17);
  font(g, size1, 300, SANS);
  g.textAlign = 'center';
  g.fillStyle = rgba('#f4efe6', l1);
  const maxW = Math.min(1400, VIS.w - 140);
  const words = 'The future of insurance is a community of agents responding to reality as it happens.'.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (g.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  lines.push(line);
  const lh = size1 * 1.32, y0 = 610 - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => g.fillText(ln, 960, y0 + i * lh + (1 - l1) * 10));
  font(g, size1, 500, SANS);
  g.fillStyle = rgba('#f4efe6', l2);
  g.fillText('Priora is where they meet.', 960, y0 + lines.length * lh + size1 * 0.9 + (1 - l2) * 10);
  // a whisper of credit at the very end
  const cr = smooth(seg(t, 73.6, 74.4));
  if (cr > 0) {
    const cs = minText(15, 9);
    font(g, cs, 500, MONO);
    g.fillStyle = rgba('#f4efe6', 0.45 * cr);
    spacedText(g, 'VALCORV', 960, 1010, cs * 0.35);
  }
}

/* ==== 80-director.js ==== */
/* Director: which shot is on screen at time t, and how shots hand over to each other. */

const POSTER_T = 4.6;
const SENTENCE = 'I need to weld this pipe in production room four.';

function prerenderAll() {
  prerenderRoom();
  if (typeof prerenderDeep === 'function') prerenderDeep();
}

/* Subtitle layout: letter positions for the spoken sentence, wrapped on narrow screens. */
let SUB = null;
function subtitleLayout(g) {
  const size = Math.round(minText(46, 16));
  if (SUB && SUB.size === size && SUB.cx === VIS.cx && SUB.w === VIS.w) return SUB;
  font(g, size, 400, SANS);
  const words = SENTENCE.split(' ');
  const full = g.measureText(SENTENCE).width;
  let lines = [SENTENCE];
  if (full > VIS.w - 160) {
    let best = 0, bestD = 1e9, acc = 0;
    for (let i = 0; i < words.length - 1; i++) { acc += words[i].length + 1; const d = Math.abs(acc - SENTENCE.length / 2); if (d < bestD) { bestD = d; best = i; } }
    lines = [words.slice(0, best + 1).join(' '), words.slice(best + 1).join(' ')];
  }
  const lh = size * 1.3, baseY = 1000 - (lines.length - 1) * lh;
  const letters = [];
  let wordIdx = 0;
  lines.forEach((ln, li) => {
    const lw = g.measureText(ln).width;
    let x = VIS.cx - lw / 2;
    for (let i = 0; i < ln.length; i++) {
      const ch = ln[i];
      const w = g.measureText(ch).width;
      if (ch === ' ') wordIdx++;
      else letters.push({ ch, x: x + w / 2, y: baseY + li * lh, word: wordIdx, i: letters.length });
      x += w;
    }
    wordIdx++;
  });
  SUB = { size, letters, words: words.length, cx: VIS.cx, w: VIS.w };
  return SUB;
}

/* Shot 1: Production Room 4, the sentence, and the fall into the drain (0 to 7.6 s). */
function roomCamOpen(t) {
  const p1 = smooth(seg(t, 0, 5.4));
  let cx = lerp(960, 1010, p1), cy = lerp(540, 570, p1), s = lerp(1.0, 1.06, p1), sy = 1;
  const p2 = easeIO(seg(t, 5.0, 6.9));
  cx = lerp(cx, ROOM.drain.x, p2); cy = lerp(cy, ROOM.drain.y - 90, p2); s = lerp(s, 1.65, p2);
  const p3 = easeIn(seg(t, 6.55, 7.6));
  s *= Math.pow(16, p3); sy = lerp(1, 3.2, p3); cy = lerp(cy, ROOM.drain.y, smooth(seg(t, 6.55, 7.3)));
  return { cx, cy, s, sy };
}
function shotRoomOpen(g, t) {
  const cam = roomCamOpen(t);
  const talk = env(t, 1.3, 1.5, 4.3, 4.6);
  drawRoom(g, t, { cam, worker: 'speak', talk, phoneGlow: env(t, 1.0, 1.6, 5.2, 6.0), drainInner: '#0a1c2a', grateA: 1 - smooth(seg(t, 6.7, 7.25)) });
  // fade in from black
  const fin = 1 - smooth(seg(t, 0, 1.3));
  if (fin > 0) { g.fillStyle = `rgba(0,0,0,${fin})`; g.fillRect(0, 0, W, H); }
  drawSentence(g, t, cam);
}

/* The sentence: appears word by word as he speaks, warms, then falls letter by letter into the drain. */
function drawSentence(g, t, cam) {
  const L = subtitleLayout(g);
  const warm = smooth(seg(t, 4.8, 5.5));
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  font(g, L.size, 400, SANS);
  const drain = roomToScreen(cam, ROOM.drain.x, ROOM.drain.y);
  for (const lt of L.letters) {
    const appear = smooth(seg(t, 1.4 + lt.word * 0.29, 1.4 + lt.word * 0.29 + 0.35));
    if (appear <= 0) continue;
    const start = 5.45 + lt.i * 0.021, dur = 0.95;
    const p = seg(t, start, start + dur);
    if (p >= 1) continue;
    let x = lt.x, y = lt.y - (1 - appear) * 10, sc = 1, a = appear;
    if (p > 0) {
      const e = easeIn(p);
      const cx = lerp(lt.x, drain[0], 0.35), cy = lt.y - 120 - 60 * h1(lt.i);
      x = (1 - e) * (1 - e) * lt.x + 2 * (1 - e) * e * cx + e * e * drain[0];
      y = (1 - e) * (1 - e) * lt.y + 2 * (1 - e) * e * cy + e * e * drain[1];
      sc = lerp(1, 0.35, e);
      a = 1 - smooth(seg(p, 0.85, 1));
    }
    const col = mixHex('#f4efe6', '#ffc27a', warm);
    if (warm > 0) glow(g, x, y - L.size * 0.32, L.size * 0.9 * sc, '#ff9c3a', 0.35 * warm * a);
    g.save();
    g.translate(x, y);
    if (p > 0) g.rotate((h1(lt.i * 3) - 0.5) * 1.6 * easeIn(p));
    g.scale(sc, sc);
    g.fillStyle = rgba(col, a);
    g.fillText(lt.ch, 0, 0);
    g.restore();
  }
}

/* Model sheet for checking characters: open the file with ?sheet */
const SHEET = /[?&]sheet/.test(location.search);
function drawSheet(g, t) {
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#12293a'); bg.addColorStop(1, '#060d14');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const lk = [Math.sin(t), Math.cos(t * 0.7) * 0.5];
  const b = k => blinkAt(t, k);
  drawEmber(g, 160, 300, 1.6, { t, look: lk, blink: b(1) });
  drawForeman(g, 470, 300, 1.2, { t, look: lk, blink: b(2), mood: 'stern', watch: true });
  drawBell(g, 830, 240, 1.0, { t, look: lk, blink: b(3), led: 'green', cableTop: 0 });
  drawLens(g, 1180, 300, 1.1, { t, look: lk, eyeAngle: -Math.PI / 2 + Math.sin(t) * 0.6 });
  drawLantern(g, 1560, 300, 1.3, { t, look: lk, blink: b(5) });
  drawScroll(g, 220, 760, 1.1, { t, look: lk, blink: b(6), read: 0.5, red: 1 });
  drawOcto(g, 560, 820, 1.2, { t, look: lk, blink: b(7) });
  drawForeman(g, 860, 780, 0.9, { t, look: lk, blink: b(8), mood: 'angry', puff: 1, tap: 1 });
  drawBell(g, 1100, 700, 0.8, { t, look: lk, led: 'red', alarm: 1, cableTop: 520 });
  drawWhale(g, 1550, 780, 0.9, { t, kind: 'hump', emblem: 'star' });
}

function direct(g, t) {
  if (SHEET) { drawSheet(g, t); return; }
  if (t < 7.6) { shotRoomOpen(g, t); return; }
  if (t < 48.6) { shotDeep(g, t); return; }
  if (t < 49.8) { shotDeep(g, t); shotMarket(g, t, smooth(seg(t, 48.6, 49.8))); return; }
  if (t < 57.2) { shotMarket(g, t); flash(g, t, 57.0, 0.5); return; }
  if (t < 59.7) { shotWorkerPhone(g, t); flash(g, t, 57.0, 0.5); return; }
  if (t < 60.8) { shotRoomAfter(g, t); return; }
  if (t < 63.6) { shotManagerPhone(g, t); return; }
  if (t < 67.6) { shotRoomAfter(g, t); return; }
  shotEnding(g, t);
}
/* A white flash centred on time at, lasting dur. */
function flash(g, t, at, dur) {
  const f = bump(t, at, dur);
  if (f <= 0) return;
  g.fillStyle = `rgba(255,246,232,${0.9 * f})`;
  g.fillRect(0, 0, W, H);
}

/* ==== 90-main.js ==== */
/* Main: canvas and letterbox, the playback clock, controls, keyboard and the window.film API. */

const filmEl = document.getElementById('film');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const cover = document.getElementById('cover');
const ppBtn = document.getElementById('pp');
const sndBtn = document.getElementById('snd');
const fsBtn = document.getElementById('fs');
const scrub = document.getElementById('scrub');
const fillEl = document.getElementById('fill');
const knobEl = document.getElementById('knob');
const timeEl = document.getElementById('time');
const ccEl = document.getElementById('cc');

const VIEW = { k: 1, ox: 0, oy: 0, cw: 0, ch: 0, dpr: 1, portrait: false, vw: 1, vh: 1 };
/* On portrait screens the film is shown as a crop that follows the subject of each shot. */
const CROP_W = 1180;
const FOCUS = [[0, 1040], [4.9, 1040], [6.3, 900], [7.6, 960], [59.7, 960], [59.71, 760], [60.8, 760], [60.81, 960], [DURATION, 960]];
function focusAt(t) {
  for (let i = 1; i < FOCUS.length; i++) if (t <= FOCUS[i][0]) { const a = FOCUS[i - 1], b = FOCUS[i]; return lerp(a[1], b[1], smooth(seg(t, a[0], b[0]))); }
  return 960;
}
function applyCrop(t) {
  if (!VIEW.portrait) { VIS.x0 = 0; VIS.w = W; VIS.cx = W / 2; return; }
  const s = STAGE_SCALE;
  VIS.w = CROP_W;
  VIS.x0 = clamp(focusAt(t) - CROP_W / 2, 0, W - CROP_W);
  VIS.cx = VIS.x0 + CROP_W / 2;
  VIEW.ox = Math.round(-VIS.x0 * s * VIEW.dpr);
  VIEW.oy = Math.round((VIEW.vh - H * s) / 2 * VIEW.dpr);
}
let T = 0, playing = false, ready = false, started = false, muted = false;

function layout() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  // cap the backing store near 2200 x 1240 so large retina screens stay smooth
  const dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2200 * 1240 / (vw * vh)));
  cv.width = Math.round(vw * dpr);
  cv.height = Math.round(vh * dpr);
  VIEW.vw = vw; VIEW.vh = vh;
  VIEW.portrait = vw / vh < 0.9;
  const s = VIEW.portrait ? Math.min(vw / CROP_W, vh * 0.72 / H) : Math.min(vw / W, vh / H);
  STAGE_SCALE = s;
  VIEW.dpr = dpr;
  VIEW.k = s * dpr;
  VIEW.ox = Math.round((vw - W * s) / 2 * dpr);
  VIEW.oy = Math.round((vh - H * s) / 2 * dpr);
  VIEW.cw = cv.width;
  VIEW.ch = cv.height;
  if (ready) { prerenderAll(); render(T); }
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  applyCrop(t);
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox, VIEW.oy);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  direct(ctx, t);
  ctx.restore();
  updateBar(t);
  updateCaptions(t);
}

/* Captions for assistive technology: the spoken sentence, the two messages and the closing line. */
const CC = [
  [1.4, 'Worker: I need to weld this pipe in production room four.'],
  [12.0, 'Beneath the floor, a hidden society of agents wakes up.'],
  [57.6, 'Message to the worker: Cover the pallet with the fire blanket. Then begin.'],
  [61.0, 'Decision for the site manager: fire detection off in Room 4 for 40 minutes. Northstar offers cover for DKK 520, Boreal for DKK 640.'],
  [70.4, 'The future of insurance is a community of agents responding to reality as it happens. Priora is where they meet.'],
];
let ccLast = -1;
function updateCaptions(t) {
  if (!playing) return;
  let idx = -1;
  for (let i = 0; i < CC.length; i++) if (t >= CC[i][0]) idx = i;
  if (idx !== ccLast) { ccLast = idx; if (idx >= 0) ccEl.textContent = CC[idx][1]; }
}

/* Playback */
let last = 0;
function frame(now) {
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  if (playing) {
    T += dt;
    if (T >= DURATION) { T = DURATION; setPlaying(false); filmEl.classList.add('ended'); }
    Sound.update(T, playing);
    render(T);
  }
  requestAnimationFrame(frame);
}

function setPlaying(p) {
  playing = p;
  filmEl.classList.toggle('playing', p);
  ppBtn.setAttribute('aria-label', p ? 'Pause' : T >= DURATION ? 'Replay' : 'Play');
  if (p) { filmEl.classList.remove('ended'); Sound.resume(); } else Sound.pauseAll();
  poke();
}
function start() {
  if (!ready) return;
  if (!started) { started = true; Sound.init(); }
  cover.classList.add('gone');
  filmEl.classList.remove('cover-on');
  if (T >= DURATION) seek(0);
  Sound.seek(T);
  setPlaying(true);
}
function seek(t) {
  T = clamp(t, 0, DURATION);
  if (T < DURATION) filmEl.classList.remove('ended');
  Sound.seek(T);
  render(T);
}
function toggle() { if (playing) setPlaying(false); else start(); }

/* Controls */
function fmt(t) { const s = Math.floor(t + 1e-6); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
let lastBarT = -1;
function updateBar(t) {
  if (Math.abs(t - lastBarT) < 0.04) return;
  lastBarT = t;
  const p = t / DURATION * 100;
  fillEl.style.width = p + '%';
  knobEl.style.left = p + '%';
  timeEl.textContent = fmt(t) + ' / ' + fmt(DURATION);
  scrub.setAttribute('aria-valuenow', t.toFixed(1));
  scrub.setAttribute('aria-valuetext', Math.round(t) + ' seconds');
}
let idleTimer = 0;
function poke() {
  filmEl.classList.remove('idle');
  clearTimeout(idleTimer);
  if (playing) idleTimer = setTimeout(() => filmEl.classList.add('idle'), 2200);
}
['pointermove', 'pointerdown', 'touchstart'].forEach(e => filmEl.addEventListener(e, poke, { passive: true }));

document.getElementById('bigplay').addEventListener('click', e => { start(); e.currentTarget.blur(); });
cover.addEventListener('click', e => { if (e.target === cover) start(); });
ppBtn.addEventListener('click', toggle);
cv.addEventListener('click', () => { if (started) toggle(); });
sndBtn.addEventListener('click', () => {
  muted = !muted;
  filmEl.classList.toggle('muted', muted);
  sndBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
  if (!started) return;
  Sound.setMuted(muted);
});
fsBtn.addEventListener('click', () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (filmEl.requestFullscreen) filmEl.requestFullscreen().catch(() => {});
  } catch (e) { /* full screen is optional */ }
});

let dragging = false, wasPlaying = false;
function scrubTo(e) {
  const r = scrub.getBoundingClientRect();
  seek(clamp((e.clientX - r.left) / r.width) * DURATION);
}
scrub.addEventListener('pointerdown', e => {
  dragging = true; wasPlaying = playing; if (playing) setPlaying(false);
  scrub.setPointerCapture(e.pointerId); scrubTo(e);
});
scrub.addEventListener('pointermove', e => { if (dragging) scrubTo(e); });
const endDrag = () => { if (!dragging) return; dragging = false; if (wasPlaying) start(); };
scrub.addEventListener('pointerup', endDrag);
scrub.addEventListener('pointercancel', endDrag);
scrub.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { seek(T - 5); e.preventDefault(); e.stopPropagation(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { seek(T + 5); e.preventDefault(); e.stopPropagation(); }
});
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'BUTTON' && e.key === 'Enter') return;
  if (e.key === ' ' || e.key === 'k') { if (!e.repeat) toggle(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { seek(T - 5); poke(); }
  else if (e.key === 'ArrowRight') { seek(T + 5); poke(); }
  else if (e.key === 'Home') { seek(0); start(); }
  else if (e.key === 'm') sndBtn.click();
  else if (e.key === 'f') fsBtn.click();
});
// Space on a focused button would also click it; the keydown handler above owns Space.
window.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });
window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) setPlaying(false); });

/* Boot: fonts, prerender, poster frame. */
window.film = {
  duration: DURATION,
  ready: false,
  seek(t) { cover.style.transition = 'none'; cover.classList.add('gone'); filmEl.classList.remove('cover-on'); seek(t); },
  play() { start(); },
  pause() { setPlaying(false); },
  get time() { return T; },
};
filmEl.classList.add('cover-on');
(async function boot() {
  layout();
  try {
    await Promise.all([
      document.fonts.load(`300 40px ${SANS}`), document.fonts.load(`400 40px ${SANS}`),
      document.fonts.load(`500 40px ${SANS}`), document.fonts.load(`500 20px ${MONO}`),
    ]);
  } catch (e) { /* fallback fonts are fine */ }
  ready = true;
  prerenderAll();
  const q = /[?&]t=([\d.]+)/.exec(location.search);
  if (q) { window.film.seek(parseFloat(q[1])); }
  else render(POSTER_T);
  window.film.ready = true;
  requestAnimationFrame(frame);
})();

})();</script>
