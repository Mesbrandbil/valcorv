/* ==== 20-camera.js ==== */
/* 20-camera.js · the one continuous camera, the view object passed to every draw function,
   and pure timeline queries shared by all parts (speaker, look-at, clock, steps, stillness). */

/* Viewport layout, owned and updated by 90-main.js on resize. W, H: logical stage size.
   s: stage px to CSS px. dpr: device pixel ratio, capped at 2. */
const LAYOUT = { mode: 'landscape', W: 1600, H: 900, s: 1, dpr: 1 };

/* ---------- camera rects ----------
   A camera state is a rect in centre / log-size space: { cx, cy, lw, lh }. Moves interpolate
   this space with easeInOutCubic, so zoom changes feel even at every scale (2.6, 3.6). */
function camKeyRect(key, mode) { return CAM_KEYS[key][mode === 'portrait' ? 'P' : 'L']; }
function rectToCam(r) { return { cx: r[0] + r[2] / 2, cy: r[1] + r[3] / 2, lw: Math.log(r[2]), lh: Math.log(r[3]) }; }
function mixCam(a, b, p) { return { cx: lerp(a.cx, b.cx, p), cy: lerp(a.cy, b.cy, p), lw: lerp(a.lw, b.lw, p), lh: lerp(a.lh, b.lh, p) }; }
/* Fit a camera rect to the stage: z = min(W / w, H / h), centred on the rect centre. */
function fitCam(c, W, H) { return { cx: c.cx, cy: c.cy, z: Math.min(W / Math.exp(c.lw), H / Math.exp(c.lh)) }; }

/* Portrait speaker-follow inside a hold (3.5). Targets come only from NOTES and agentPose at each
   note's t0, so the result is a pure function of t. Each new speaker eases from wherever the
   previous follow was at that moment. */
function followEvents(hold, mode) {
  const key = hold.k + mode;
  const cache = followEvents._c || (followEvents._c = {});
  if (cache[key]) return cache[key];
  const r = camKeyRect(hold.k, mode);
  const bx0 = r[0] - FOLLOW.grow, by0 = r[1] - FOLLOW.grow, bx1 = r[0] + r[2] + FOLLOW.grow, by1 = r[1] + r[3] + FOLLOW.grow;
  const evs = [];
  for (const n of NOTES) {
    if (n.t1 <= hold.a || n.t0 - FOLLOW.lead >= hold.b) continue;
    const head = agentPose(n.who, n.t0).head;
    // clamp the 600 x 800 follow rect inside the grown beat rect
    const clampC = (c, half, lo, hi) => (hi - lo < 2 * half ? (lo + hi) / 2 : clamp(c, lo + half, hi - half));
    const cx = clampC(head.x, FOLLOW.w / 2, bx0, bx1);
    // notes are docked below the stage in portrait, so the follow rect also stays on the page
    // (plus a margin) when the beat allows it, instead of showing empty desk under the speaker
    const cy = clampC(head.y + FOLLOW.dy, FOLLOW.h / 2, by0, Math.min(by1, WORLD.page.h + FOLLOW.pageMargin));
    evs.push({ s: Math.max(hold.a, n.t0 - FOLLOW.lead), cam: { cx, cy, lw: Math.log(FOLLOW.w), lh: Math.log(FOLLOW.h) } });
  }
  // when several notes start at the clamped hold start, keep only the latest one
  const out = [];
  for (const e of evs) { if (out.length && Math.abs(out[out.length - 1].s - e.s) < 1e-6) out[out.length - 1] = e; else out.push(e); }
  cache[key] = out;
  return out;
}
function followAt(evs, k, t, base) {
  // value of the follow chain using events 0..k at time t
  if (k < 0) return base;
  const e = evs[k];
  const from = followAt(evs, k - 1, e.s, base);
  return mixCam(from, e.cam, easeInOutCubic(prog(t, e.s, e.s + FOLLOW.dur)));
}

/* Camera state at time t inside hold i (t is clamped to the hold). */
function holdCam(i, t, mode, reduced) {
  const h = CAM[i];
  t = clamp(t, h.a, h.b);
  let c = rectToCam(camKeyRect(h.k, mode));
  if (h.shrink) {
    const k = Math.log(1 - h.shrink.by * prog(t, h.shrink.a, h.shrink.b, easeInOutSine));
    c = { cx: c.cx, cy: c.cy, lw: c.lw + k, lh: c.lh + k };
  }
  if (h.follow && mode === 'portrait' && !reduced) {
    const evs = followEvents(h, mode);
    let k = -1;
    while (k + 1 < evs.length && evs[k + 1].s <= t) k++;
    c = followAt(evs, k, t, c);
  }
  return c;
}

/* cameraAt(t, mode, reduced) -> { cx, cy, z, fade }.  fade is 1 minus the paper veil opacity for the
   reduced-motion soft dip (1 otherwise). */
function cameraAt(t, mode = LAYOUT.mode, reduced = REDUCED) {
  const W = mode === 'portrait' ? 900 : 1600, H = mode === 'portrait' ? 1200 : 900;
  let i = 0;
  while (i < CAM.length - 1 && t > CAM[i].b) i++;
  const h = CAM[i];
  if (t >= h.a || i === 0) return Object.assign(fitCam(holdCam(i, t, mode, reduced), W, H), { fade: 1 });
  // moving from hold i - 1 to hold i
  const prev = CAM[i - 1];
  const from = holdCam(i - 1, prev.b, mode, reduced), to = holdCam(i, h.a, mode, reduced);
  if (reduced) {
    if (h.logZoom) {
      // three cross-dipped scale steps: the page, z 0.2, then the end zoom
      const s0 = REDUCED_FIELD_STEPS[0].t, s1 = REDUCED_FIELD_STEPS[1].t;
      const toFit = fitCam(to, W, H);
      const midZ = REDUCED_FIELD_STEPS[0].z;
      const mid = { cx: toFit.cx, cy: toFit.cy, lw: Math.log(W / midZ), lh: Math.log(H / midZ) };
      const c = t < s0 ? from : t < s1 ? mid : to;
      return Object.assign(fitCam(c, W, H), { fade: Math.min(dipFade(t, s0), dipFade(t, s1)) });
    }
    const m = (prev.b + h.a) / 2;
    return Object.assign(fitCam(t < m ? from : to, W, H), { fade: dipFade(t, m) });
  }
  const p = (t - prev.b) / (h.a - prev.b);
  const e = h.logZoom ? easeInOutSine(p) : easeInOutCubic(p);
  return Object.assign(fitCam(mixCam(from, to, e), W, H), { fade: 1 });
}
function dipFade(t, m) { return 1 - DIP.depth * (1 - clamp(Math.abs(t - m) / (DIP.dur / 2))); }

/* ---------- the view object passed to every draw function ----------
   { t, mode, W, H, s, dpr, cam:{cx,cy,z}, fade, reduced, px,
     worldToStage(x,y) -> [sx, sy], stageToWorld(sx,sy) -> [x, y],
     setWorld(ctx), setStage(ctx) }
   px: world pu per CSS px (use for hairlines: ctx.lineWidth = view.px). */
function makeView(t, L = LAYOUT) {
  const cam = cameraAt(t, L.mode, REDUCED);
  const W = L.W, H = L.H, s = L.s, dpr = L.dpr, z = cam.z;
  const ox = W / 2 - cam.cx * z, oy = H / 2 - cam.cy * z;
  return {
    t, mode: L.mode, W, H, s, dpr, cam, fade: cam.fade, reduced: REDUCED,
    px: 1 / (z * s),
    worldToStage(x, y) { return [x * z + ox, y * z + oy]; },
    stageToWorld(x, y) { return [(x - ox) / z, (y - oy) / z]; },
    setWorld(ctx) { const k = s * dpr; ctx.setTransform(k * z, 0, 0, k * z, k * ox, k * oy); },
    setStage(ctx) { const k = s * dpr; ctx.setTransform(k, 0, 0, k, 0, 0); }
  };
}

/* ---------- timeline queries (pure) ---------- */
function chapterIndexAt(t) { let i = 0; while (i < CHAPTERS.length - 1 && t >= CHAPTERS[i + 1].t) i++; return i; }
/* Minutes of the day shown on the clock, or null before the running head shows a clock. */
function clockAt(t) {
  if (t < CLOCK.keys[0][0]) return null;
  const R = CLOCK.roll;
  if (t >= R.a) return Math.floor(lerp(R.from, R.to, prog(t, R.a, R.b)));
  let m = CLOCK.keys[0][1];
  for (const k of CLOCK.keys) if (t >= k[0]) m = k[1];
  return m;
}
/* Index of the last reached step (-1 before RECORD). */
function stepIndexAt(t) { let i = -1; STEPS.forEach((s, k) => { if (t >= s.t) i = k; }); return i; }
/* Latest note started at or before t (the current speaker for look-at), or null. */
function latestNote(t) { let n = null; for (const x of NOTES) { if (x.t0 <= t) n = x; else break; } return n; }
/* Notes visible at t (fade window included). At most two by construction of the cue sheet. */
function visibleNotes(t) { return NOTES.filter(n => t >= n.t0 && t < n.t1); }
/* The note an agent is speaking at t (first 85 percent of the note's life), or null. */
function speakingNote(id, t) { for (const n of NOTES) if (n.who === id && t >= n.t0 && t < n.t0 + 0.85 * (n.t1 - n.t0)) return n; return null; }
function isStill(t) { return STILL.some(w => t >= w[0] && t < w[1]); }
function isFrozen(t) { return t >= FREEZE[0] && t < FREEZE[1]; }
/* Society opacity multiplier for the funnel dim (B24). */
function societyAlpha(t) {
  return lerp(1, DIM.to, prog(t, DIM.a, DIM.b, easeInOutCubic)) + (1 - DIM.to) * prog(t, DIM.back[0], DIM.back[1], easeInOutCubic);
}

/* Look-at target for agent `id` at t, world point {x, y} (2.8, 5.6). Overrides win; otherwise
   everyone looks at the current speaker's head, and the speaker looks at whoever its note names
   (or the previous speaker). Changes ease over 0.25 s. */
function lookTargetRaw(id, t) {
  for (const o of LOOKAT) {
    if (t >= o.a && t < o.b) {
      if (o.pt) return { x: o.pt[0], y: o.pt[1] };
      if (o.target === 'slip') { const p = slipPose(t); return { x: p.cx, y: p.cy }; }
      return { x: MEASURE.fullStop.x, y: MEASURE.fullStop.y };
    }
  }
  const n = latestNote(t);
  if (!n) return { x: MEASURE.fullStop.x, y: MEASURE.fullStop.y };
  if (n.who !== id) return agentPose(n.who, t).head;
  if (Array.isArray(n.lookAt)) return { x: n.lookAt[0], y: n.lookAt[1] };
  if (n.lookAt) return agentPose(n.lookAt, t).head;
  const i = NOTES.indexOf(n);
  for (let k = i - 1; k >= 0; k--) if (NOTES[k].who !== id) return agentPose(NOTES[k].who, t).head;
  return { x: MEASURE.fullStop.x, y: MEASURE.fullStop.y };
}
const LOOK_CHANGES = [...NOTES.map(n => n.t0), ...LOOKAT.flatMap(o => [o.a, o.b])].sort((a, b) => a - b);
function lookAtPoint(id, t) {
  let tc = null;
  for (const c of LOOK_CHANGES) { if (c <= t) tc = c; else break; }
  const to = lookTargetRaw(id, t);
  if (tc === null || t - tc >= LOOK_EASE) return to;
  const from = lookTargetRaw(id, tc - 1e-3);
  return lerpPt(from, to, easeInOutCubic((t - tc) / LOOK_EASE));
}

/* ==== 30-page.js ==== */
/* 30-page.js · the desk, our page and the page objects drawn on canvas in world space:
   ruling, programme frame and gate, time ribbon and its rope, the red slice and its cut,
   the slip's path, red hairline, decision card box, fallen note slips, embossed card relief.
   Shared geometry for other parts: ropeEnds(t), ribbonPoint(u, t), slipPose(t), caretPoint(name, t). */

const RB = WORLD.ribbon;
const RB_LEN = RB.x1 - RB.x0;
const ribbonU = x => (x - RB.x0) / RB_LEN;
const ribbonX = min => RB.x0 + (min - RB.min0) * RB.perMin;

/* ---------- ribbon and rope geometry ---------- */
/* Rope state during the tug of war (B16, B17): s is the stretch factor (spring overshoot past 0
   on release is the slack), vib the vertical vibration in pu at mid rope. */
function ropeState(t) {
  const on = prog(t, ROPE.tension[0], ROPE.tension[0] + 0.8, easeOutCubic);
  const off = t < ROPE.slack[0] ? 0 : spring(prog(t, ROPE.slack[0], ROPE.slack[1]));
  const s = on * (1 - off);
  const vibOn = REDUCED ? 0 : envelope(t, ROPE.tension[0], ROPE.tension[1], 0.4, 0.3);
  return { s, ext: 0.5 * ROPE.stretch * RB_LEN * s, vib: ROPE.vibAmp * vibOn * Math.sin(TAU * ROPE.vibHz * t) };
}
/* World point on the ribbon axis at parameter u (0 = 15:30 end, 1 = 17:30 end). */
function ribbonPoint(u, t) {
  const st = ropeState(t);
  return { x: lerp(RB.x0 - st.ext, RB.x1 + st.ext, u), y: RB.y + st.vib * Math.sin(Math.PI * clamp(u)) };
}
/* ropeEnds(t) -> { left:{x,y,held}, right:{x,y,held}, tension (0..1) }, world pu.
   The Site agent holds the right end from 50.2, Safety the left end from 54.0, both until 62.2. */
function ropeEnds(t) {
  const st = ropeState(t);
  const l = ribbonPoint(0, t), r = ribbonPoint(1, t);
  return {
    left: { x: l.x, y: l.y, held: t >= ROPE.safetyGrab && t < ROPE.slack[1] },
    right: { x: r.x, y: r.y, held: t >= ROPE.siteGrab && t < ROPE.slack[1] },
    tension: clamp(st.s)
  };
}
/* Hour-after bar height and hatch amount (12 pu solid, narrowing to 5 pu hatched, B17). */
function sliceShape(t) {
  const p = prog(t, SLICE.narrow[0], SLICE.narrow[1], easeInOutCubic);
  return { h: lerp(12, 5, p), hatch: p };
}

/* ---------- the slip's world pose ----------
   slipPose(t) -> { visible, cx, cy, k, rot, alpha, w, h, phase }
   cx, cy: centre (world pu). k: uniform scale of the 240 x 450 slip. rot: radians.
   phase: 'none' | 'unfold' | 'held' | 'carry' | 'pinned' | 'return' | 'slotted'. */
const SLIP_PINNED = { cx: (WORLD.slip.x0 + WORLD.slip.x1) / 2, cy: (WORLD.slip.y0 + WORLD.slip.y1) / 2 };
const SLICE_CENTRE = { cx: (RB.hour[0] + RB.hour[1]) / 2, cy: RB.y };
const GATE_POINT = { cx: WORLD.frame.gate.x, cy: (WORLD.frame.gate.y0 + WORLD.frame.gate.y1) / 2 };
function slipPose(t) {
  const U = WORLD.slipUnfold, kc = WORLD.slipCarry.k;
  const pose = (phase, cx, cy, k, rotDeg, alpha) => ({ visible: alpha > 0.001, phase, cx, cy, k, rot: rotDeg * DEG, alpha, w: 240 * k, h: 450 * k });
  if (t < SLICE.unfold[0]) return pose('none', SLICE_CENTRE.cx, SLICE_CENTRE.cy - 16, 0.08, -3, 0);
  if (t < SLICE.carry[0]) {
    const p = prog(t, SLICE.unfold[0], SLICE.unfold[1]);
    const e = REDUCED ? easeOutCubic(p) : easeOutBack(p, 1.4);
    return pose(p < 1 ? 'unfold' : 'held', lerp(SLICE_CENTRE.cx, U.cx, easeOutCubic(p)), lerp(SLICE_CENTRE.cy - 16, U.cy, easeOutCubic(p)), lerp(0.08, U.k, e), -3, clamp(p * 4));
  }
  if (t < SLICE.back[0]) {
    if (t >= SLICE.carry[1]) return pose('pinned', SLIP_PINNED.cx, SLIP_PINNED.cy, 1, 0, 1);
    // carried by the Broker: fold small, pass the gate at 78.6, unfold to full size when pinned at 79.6
    const g = SLICE.gatePass;
    let cx, cy;
    if (t < g) { const p = easeInOutCubic(prog(t, SLICE.carry[0], g)); cx = lerp(U.cx, GATE_POINT.cx, p); cy = lerp(U.cy, GATE_POINT.cy, p) - 30 * Math.sin(Math.PI * p); }
    else { const p = easeInOutCubic(prog(t, g, SLICE.carry[1])); cx = lerp(GATE_POINT.cx, SLIP_PINNED.cx, p); cy = lerp(GATE_POINT.cy, SLIP_PINNED.cy, p); }
    const k = t < g ? lerp(U.k, kc, easeInOutCubic(prog(t, SLICE.carry[0], SLICE.carry[0] + 0.8))) : lerp(kc, 1, easeInOutCubic(prog(t, g + 0.2, SLICE.carry[1])));
    const rot = t < g ? lerp(-3, -8, prog(t, SLICE.carry[0], g)) : lerp(-8, 0, prog(t, g, SLICE.carry[1], easeOutCubic));
    return pose('carry', cx, cy, k, rot, 1);
  }
  // flies back along a hairline and slots into the notch, then the canvas slice takes over
  const p = easeInOutCubic(prog(t, SLICE.back[0], SLICE.back[1]));
  const fade = 1 - prog(t, SLICE.back[1] - 0.15, SLICE.back[1]);
  return pose(t < SLICE.back[1] ? 'return' : 'slotted', lerp(SLIP_PINNED.cx, SLICE_CENTRE.cx, p), lerp(SLIP_PINNED.cy, SLICE_CENTRE.cy, p) - 40 * Math.sin(Math.PI * p), lerp(1, 0.1, p), lerp(0, -3, p), fade);
}
/* Slip-local point (0..240, 0..450) to world. */
function slipToWorld(pose, lx, ly) {
  const dx = (lx - 120) * pose.k, dy = (ly - 225) * pose.k, c = Math.cos(pose.rot), s = Math.sin(pose.rot);
  return { x: pose.cx + dx * c - dy * s, y: pose.cy + dx * s + dy * c };
}

/* ---------- caret insertion points (the Mitigation agent plants itself exactly here) ----------
   caretPoint('row3' | 'hour' | 'slip', t) -> { x, y } world point on the text baseline where the
   words slide apart: row 3 at 33.0, the red hour at 60.4, the slip at 95.4. */
function caretPoint(name, t) {
  if (name === 'row3') return { x: WORLD.rows.x0 + MEASURE.row3End + 4, y: WORLD.rows.baselines[2] };
  if (name === 'hour') { const p = ribbonPoint(ribbonU(RB.hour[0] + MEASURE.hourEnd + 3), t); return { x: p.x, y: RIBBON_LABEL_BASE }; }
  if (name === 'slip') { const pose = slipPose(t); return slipToWorld(pose, 14, MEASURE.slipInsertY); }
  return { x: 0, y: 0 };
}
const RIBBON_LABEL_BASE = 744;

/* ---------- desk ---------- */
function drawDesk(ctx, view) {
  view.setStage(ctx);
  ctx.fillStyle = COL.desk;
  ctx.fillRect(0, 0, view.W, view.H);
  // 4 percent radial vignette at desk-wide zoom (the only gradient in the film)
  const k = clamp(invLerp(0.9, 0.5, view.cam.z));
  if (k > 0) {
    const R = Math.hypot(view.W, view.H) / 2;
    const g = ctx.createRadialGradient(view.W / 2, view.H / 2, R * 0.45, view.W / 2, view.H / 2, R);
    g.addColorStop(0, inkA(0));
    g.addColorStop(1, inkA(0.04 * k));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, view.W, view.H);
  }
}

/* ---------- our page ---------- */
let _grainPat = null;
function drawPage(ctx, view) {
  const t = view.t, P = WORLD.page, hp = view.px;
  view.setWorld(ctx);
  softShadow(ctx, P.x, P.y, P.w, P.h, 3, 1.2, 16);
  ctx.fillStyle = COL.page;
  ctx.fillRect(P.x, P.y, P.w, P.h);
  if (GRAIN && view.cam.z * view.s > 0.2) {
    if (!_grainPat) _grainPat = ctx.createPattern(GRAIN, 'repeat');
    ctx.fillStyle = _grainPat;
    ctx.fillRect(P.x, P.y, P.w, P.h);
  }
  // manuscript ruling every 34 pu, a 1 CSS px hairline
  if (view.cam.z * view.s > 0.12) {
    ctx.strokeStyle = COL.rule; ctx.lineWidth = hp;
    ctx.beginPath();
    for (let y = P.ruleStart; y < P.h; y += P.ruleStep) { ctx.moveTo(P.x, y); ctx.lineTo(P.x + P.w, y); }
    ctx.stroke();
  }
  drawFrame(ctx, view);
  drawDecisionBox(ctx, view);
  drawRibbon(ctx, view);
  drawOutsideLine(ctx, view);
}

/* ---------- programme frame and gate (2.4, B4, B20) ---------- */
/* Gate opening angle in radians (0 closed). */
function gateAngle(t) {
  return WORLD.frame.gate.angle * DEG * easeOutCubic(prog(t, FRAME.gateOpen[0], FRAME.gateOpen[1])) * (1 - easeInOutCubic(prog(t, FRAME.gateClose[0], FRAME.gateClose[1])));
}
/* Frame outline starting at the top-left corner, clockwise. With gap, the right edge breaks
   between the gate hinges and the path is two subpaths. */
function framePath(ctx, ins, gap) {
  const F = WORLD.frame, G = F.gate;
  const x0 = F.x0 + ins, y0 = F.y0 + ins, x1 = F.x1 - ins, y1 = F.y1 - ins, r = F.r - ins;
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.lineTo(x1 - r, y0);
  ctx.arcTo(x1, y0, x1, y0 + r, r);
  if (gap) { ctx.lineTo(x1, G.y0); ctx.moveTo(x1, G.y1); }
  ctx.lineTo(x1, y1 - r);
  ctx.arcTo(x1, y1, x1 - r, y1, r);
  ctx.lineTo(x0 + r, y1);
  ctx.arcTo(x0, y1, x0, y1 - r, r);
  ctx.lineTo(x0, y0 + r);
  ctx.arcTo(x0, y0, x0 + r, y0, r);
}
function drawFrame(ctx, view) {
  const t = view.t, F = WORLD.frame, G = F.gate, hp = view.px;
  const p = prog(t, FRAME.draw[0], FRAME.draw[1], demoEase);
  if (p <= 0) return;
  const a = gateAngle(t);
  const strokes = [{ ins: 0, w: 1.15, a: 0.62 }, { ins: 4, w: 0.8, a: 0.26 }];
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  for (const s of strokes) {
    ctx.strokeStyle = inkA(s.a);
    ctx.lineWidth = Math.max(s.w, 0.6 * hp);
    framePath(ctx, s.ins, a > 0.001);
    if (p < 1) revealDash(ctx, p, rrectLength(F.x1 - F.x0 - 2 * s.ins, F.y1 - F.y0 - 2 * s.ins, F.r - s.ins));
    ctx.stroke();
    clearDash(ctx);
    if (a > 0.001) {
      // two hinged halves swing outward from the hinges at the gap's ends
      const x = F.x1 - s.ins, half = (G.y1 - G.y0) / 2;
      ctx.beginPath();
      ctx.moveTo(x, G.y0); ctx.lineTo(x + half * Math.sin(a), G.y0 + half * Math.cos(a));
      ctx.moveTo(x, G.y1); ctx.lineTo(x + half * Math.sin(a), G.y1 - half * Math.cos(a));
      ctx.stroke();
    }
  }
}

/* ---------- decision card box in the margin (B18) ---------- */
function drawDecisionBox(ctx, view) {
  const t = view.t, D = WORLD.decision, B = CARDS.decision.box;
  const p = prog(t, B[0], B[1], demoEase);
  if (p <= 0) return;
  const w = D.x1 - D.x0, h = D.y1 - D.y0, r = 10;
  ctx.save();
  ctx.globalAlpha = clamp(p * 2);
  softShadow(ctx, D.x0, D.y0, w, h, r, 0.5, 8);
  ctx.fillStyle = COL.page;
  rrect(ctx, D.x0, D.y0, w, h, r); ctx.fill();
  ctx.restore();
  // hairline box inking clockwise from the top-left corner
  ctx.strokeStyle = inkA(0.47); ctx.lineWidth = Math.max(1, view.px);
  ctx.beginPath();
  ctx.moveTo(D.x0 + r, D.y0); ctx.lineTo(D.x1 - r, D.y0); ctx.arcTo(D.x1, D.y0, D.x1, D.y0 + r, r);
  ctx.lineTo(D.x1, D.y1 - r); ctx.arcTo(D.x1, D.y1, D.x1 - r, D.y1, r);
  ctx.lineTo(D.x0 + r, D.y1); ctx.arcTo(D.x0, D.y1, D.x0, D.y1 - r, r);
  ctx.lineTo(D.x0, D.y0 + r); ctx.arcTo(D.x0, D.y0, D.x0 + r, D.y0, r);
  revealDash(ctx, p, rrectLength(w, h, r));
  ctx.stroke();
  clearDash(ctx);
}

/* ---------- time ribbon (B13 to B29) ---------- */
/* Points of a closed rect perimeter, for partial dashed cut lines. */
function rectPts(x0, y0, x1, y1) { return [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]]; }
function partialPoly(pts, p) {
  const L = polyLength(pts) * clamp(p), out = [pts[0]];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = dist(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
    if (acc + d >= L) { const q = (L - acc) / d; out.push([lerp(pts[i - 1][0], pts[i][0], q), lerp(pts[i - 1][1], pts[i][1], q)]); return out; }
    acc += d; out.push(pts[i]);
  }
  return out;
}
function strokePoly(ctx, pts) { ctx.beginPath(); pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.stroke(); }
/* Hatched fill (diagonal lines) inside a rect, in world pu. */
function hatchRect(ctx, x0, y0, x1, y1, ground, line, step = 3, lw = 0.7) {
  ctx.fillStyle = ground; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
  ctx.strokeStyle = line; ctx.lineWidth = lw;
  ctx.beginPath();
  for (let x = x0 - (y1 - y0); x < x1; x += step) { ctx.moveTo(x, y1); ctx.lineTo(x + (y1 - y0), y0); }
  ctx.stroke();
  ctx.restore();
}
/* Progress of the scissors cut line: a third per snip, each snip easing over 0.2 s. */
function cutProgress(t) { return SLICE.snips.reduce((acc, s) => acc + prog(t, s - 0.2, s, easeOutCubic) / SLICE.snips.length, 0); }

function drawRibbon(ctx, view) {
  const t = view.t, hp = view.px;
  const draw = prog(t, RIBBON.draw[0], RIBBON.draw[1], demoEase);
  if (draw <= 0) return;
  // roll-up at the end of chapter 9: the ribbon winds from the right end back to the left
  const roll = prog(t, RIBBON.rollUp[0], RIBBON.rollUp[1], easeInOutCubic);
  if (roll >= 1) return;
  const uMax = Math.min(draw, 1 - roll);
  const st = ropeState(t);
  const roped = st.s > 0.001 || within(t, ROPE.siteGrab, ROPE.slack[1]);
  const P = u => ribbonPoint(u, t);
  ctx.save();
  // clip to the drawn (or not yet rolled) extent
  const xr = P(uMax).x;
  ctx.beginPath(); ctx.rect(P(0).x - 20, RB.y - 60, xr - P(0).x + 20, 120); ctx.clip();

  // axis (thicker while it is a rope), drawn as a polyline so vibration bends it
  ctx.strokeStyle = inkA(roped ? 0.85 : 0.62);
  ctx.lineWidth = Math.max(roped ? 2.2 : 1, 0.8 * hp);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) { const q = P(i / 24); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); }
  ctx.stroke();
  // ticks every 15 minutes, major ticks at the labelled times
  ctx.lineCap = 'butt';
  for (let m = RB.min0; m <= RB.min0 + 120; m += 15) {
    const q = P(ribbonU(ribbonX(m)));
    ctx.strokeStyle = inkA(0.28); ctx.lineWidth = Math.max(0.8, 0.7 * hp);
    ctx.beginPath(); ctx.moveTo(q.x, q.y + 7); ctx.lineTo(q.x, q.y + 11); ctx.stroke();
  }
  for (const tk of RIBBON.ticks) {
    const q = P(ribbonU(ribbonX(tk.min)));
    ctx.strokeStyle = inkA(0.62); ctx.lineWidth = Math.max(1, 0.8 * hp);
    ctx.beginPath(); ctx.moveTo(q.x, q.y + 6); ctx.lineTo(q.x, q.y + 13); ctx.stroke();
  }
  // bars ride the axis
  const bar = (xa, xb, y0, y1, fn) => { const a = P(ribbonU(xa)), b = P(ribbonU(xb)); const mid = (a.y + b.y) / 2 - RB.y; fn(a.x, y0 + mid, b.x, y1 + mid); };
  bar(RB.weld[0], RB.weld[1], RB.barY0, RB.barY1, (x0, y0, x1, y1) => { ctx.fillStyle = COL.ink; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); });
  drawHourBar(ctx, view, bar);
  // playhead through the afternoon (B28)
  if (within(t, RIBBON.playhead[0], RIBBON.rollUp[0])) {
    const x = lerp(RB.weld[0], RB.hour[1], prog(t, RIBBON.playhead[0], RIBBON.playhead[1]));
    ctx.strokeStyle = COL.ink; ctx.lineWidth = Math.max(1.2, hp);
    ctx.beginPath(); ctx.moveTo(x, RB.y - 14); ctx.lineTo(x, RB.y + 14); ctx.stroke();
    ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.moveTo(x - 4, RB.y - 19); ctx.lineTo(x + 4, RB.y - 19); ctx.lineTo(x, RB.y - 14); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // the roll itself, winding left then tucking into the record line
  if (roll > 0) {
    const tuck = prog(roll, 0.75, 1);
    const at = P(1 - roll);
    const x = lerp(at.x, WORLD.record.x - 12, easeInOutCubic(tuck)), y = lerp(RB.y, WORLD.record.baseline + 8, easeInOutCubic(tuck));
    const r = 3 + 7 * Math.min(roll / 0.75, 1);
    ctx.globalAlpha = 1 - prog(roll, 0.9, 1);
    ctx.fillStyle = COL.page; ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y - r, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y - r, r * 0.45, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* The hour after the weld: dotted outline, then signal red, narrowing to a hatched slice,
   cut out, lifted away (leaving a dashed notch), then slotted back in ink. */
function drawHourBar(ctx, view, bar) {
  const t = view.t, hp = view.px;
  const red = prog(t, RIBBON.red, RIBBON.red + RIBBON.redDraw);
  const sh = sliceShape(t);
  const cy = (RB.barY0 + RB.barY1) / 2;
  const y0 = cy - sh.h / 2, y1 = cy + sh.h / 2;
  const lifted = t >= SLICE.lift[0];
  const back = t >= SLICE.back[1];
  if (!lifted) {
    bar(RB.hour[0], RB.hour[1], y0, y1, (x0, a, x1, b) => {
      if (red < 1) { setDotted(ctx, 0.47, Math.max(1, hp)); ctx.strokeRect(x0, a, x1 - x0, b - a); clearDash(ctx); }
      if (red > 0) {
        ctx.globalAlpha = red;
        if (sh.hatch > 0) hatchRect(ctx, x0, a, x1, b, COL.signal2, sigA(0.55 + 0.45 * (1 - sh.hatch)), 3, 0.8);
        else { ctx.fillStyle = COL.signal; ctx.fillRect(x0, a, x1 - x0, b - a); }
        ctx.globalAlpha = 1;
      }
    });
  }
  // dashed cut line around the slice, one third per snip
  const cut = cutProgress(t);
  if (cut > 0 && !lifted) {
    bar(RB.hour[0], RB.hour[1], y0, y1, (x0, a, x1, b) => {
      ctx.strokeStyle = inkA(0.7); ctx.lineWidth = Math.max(0.8, 0.8 * hp); ctx.setLineDash([3, 2.5]);
      strokePoly(ctx, partialPoly(rectPts(x0 - 3, a - 3.5, x1 + 3, b + 3.5), cut));
      clearDash(ctx);
    });
  }
  if (lifted && !back) {
    // dashed notch where the slice was
    bar(RB.hour[0], RB.hour[1], y0, y1, (x0, a, x1, b) => {
      ctx.fillStyle = COL.page; ctx.fillRect(x0 - 3, a - 3.5, x1 - x0 + 6, b - a + 7);
      ctx.strokeStyle = inkA(0.47); ctx.lineWidth = Math.max(0.8, 0.8 * hp); ctx.setLineDash([2, 3]);
      ctx.strokeRect(x0 - 3, a - 3.5, x1 - x0 + 6, b - a + 7);
      clearDash(ctx);
    });
    // the slice lifting free before it unfolds into the slip (75.6 to 76.2)
    const lp = prog(t, SLICE.lift[0], SLICE.lift[1], easeOutCubic);
    const fade = 1 - prog(t, SLICE.unfold[0], SLICE.unfold[0] + 0.25);
    if (fade > 0) {
      const w = RB.hour[1] - RB.hour[0];
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(SLICE_CENTRE.cx, cy - 16 * lp);
      ctx.rotate(-3 * DEG * lp);
      softShadow(ctx, -w / 2, -sh.h / 2, w, sh.h, 1, lp, 6);
      hatchRect(ctx, -w / 2, -sh.h / 2, w / 2, sh.h / 2, COL.signal2, sigA(0.55), 3, 0.8);
      ctx.restore();
    }
  }
  if (back) {
    // slotted back in: settle 0.2 s, then signal turns to ink (112.4 to 112.6)
    const settle = spring(prog(t, SLICE.back[1], SLICE.back[1] + SLICE.settle));
    const ink = prog(t, SLICE.red2ink[0], SLICE.red2ink[1]);
    bar(RB.hour[0], RB.hour[1], y0, y1, (x0, a, x1, b) => {
      const dy = -6 * (1 - settle);
      hatchRect(ctx, x0, a + dy, x1, b + dy, ink < 1 ? COL.signal2 : inkA(0.06), sigToInk(ink, 0.6), 3, 0.8);
      ctx.strokeStyle = sigToInk(ink, 0.8); ctx.lineWidth = Math.max(0.6, 0.6 * hp);
      ctx.strokeRect(x0, a + dy, x1 - x0, b - a);
    });
  }
}

/* Red hairline from the hour-after bar out through the frame to OUTSIDE CONDITIONS (B14).
   It turns to ink and leaves the page when the bound slip slots back (112.4 to 112.6). */
function outsideAlpha(t) { return prog(t, RIBBON.red, RIBBON.red + 0.2) * (1 - prog(t, SLICE.red2ink[0], SLICE.red2ink[1] + 0.3)); }
function drawOutsideLine(ctx, view) {
  const t = view.t;
  const a = outsideAlpha(t);
  if (a <= 0 || t >= RIBBON.rollUp[0]) return;
  const p = prog(t, RIBBON.red, RIBBON.red + RIBBON.hairDraw, demoEase);
  const s = ribbonPoint(ribbonU(WORLD.outside.from[0]), t), e = WORLD.outside.to;
  const sx = t >= SLICE.lift[0] ? s.x + 3 : s.x;
  ctx.strokeStyle = sigToInk(prog(t, SLICE.red2ink[0], SLICE.red2ink[1]), a);
  ctx.lineWidth = Math.max(1, view.px);
  ctx.beginPath(); ctx.moveTo(sx, s.y); ctx.lineTo(lerp(sx, e[0], p), lerp(s.y, e[1], p)); ctx.stroke();
}

/* ---------- the wake (B4) ---------- */
/* wakeTime(x, y): when the full stop's first ripple reaches world point (x, y). Under reduced
   motion every mark wakes together at 8.0 with a single 0.8 s fade (WAKE.reducedFade). */
function wakeTime(x, y) {
  if (REDUCED) return WAKE.rings[0];
  return WAKE.rings[0] + dist(x, y, MEASURE.fullStop.x, MEASURE.fullStop.y) / WAKE.speed;
}
function drawRipples(ctx, view) {
  const t = view.t;
  if (t < WAKE.rings[0] || t > WAKE.rings[2] + WAKE.maxR / WAKE.speed) return;
  const c = MEASURE.fullStop;
  ctx.lineWidth = view.px;
  for (const t0 of view.reduced ? WAKE.rings.slice(0, 1) : WAKE.rings) {
    const r = (t - t0) * WAKE.speed;
    if (r <= 0 || r >= WAKE.maxR) continue;
    ctx.strokeStyle = inkA(WAKE.alpha * (1 - r / WAKE.maxR));
    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, TAU); ctx.stroke();
  }
}

/* ---------- overlays above the miniatures ---------- */
function drawPageOverlays(ctx, view) {
  view.setWorld(ctx);
  drawRipples(ctx, view);
  drawFallenSlips(ctx, view);
  drawCondensedCard(ctx, view);
  drawPhoneDot(ctx, view);
  drawEmbossRelief(ctx, view);
  drawSlipShadow(ctx, view);
}

/* Fallen note slips (3.4): each of N1 to N29 leaves a small slip at its speaker's feet at t1.
   At 103.0 they all spiral along hairlines into the two cards (B24). */
const FALLEN_NOTES = NOTES.slice(0, FALLEN.last);
function fallenSlipState(n, i, t) {
  if (t < n.t1) return null;
  const feet = agentPose(n.who, n.t1);
  const p0 = { x: feet.x + hashRange(i, 11, -40, 40), y: feet.y + hashRange(i, 12, -6, 10) };
  const rot0 = hashRange(i, 13, -14, 14) * DEG;
  const drop = easeOutCubic(prog(t, n.t1, n.t1 + 0.4));
  const toRasmus = FALLEN.toRasmus.includes(n.id);
  const target = toRasmus ? WORLD.routeTargets.rasmus : WORLD.routeTargets.anna;
  const s0 = FALLEN.spiral[0] + FALLEN.stagger * i;
  const dur = FALLEN.spiral[1] - FALLEN.spiral[0] - FALLEN.stagger * (FALLEN.last - 1);
  const sp = prog(t, s0, s0 + dur);
  if (sp >= 1) return null;
  let x = p0.x, y = p0.y - 10 * (1 - drop), rot = rot0, a = FALLEN.alpha * drop, k = 1;
  if (sp > 0) {
    if (REDUCED) { a *= 1 - sp; }
    else {
      // closed-form spiral: radius shrinks to 0 while the angle turns 2.5 times
      const e = easeInOutCubic(sp);
      const r0 = dist(p0.x, p0.y, target[0], target[1]), a0 = Math.atan2(p0.y - target[1], p0.x - target[0]);
      const ang = a0 + FALLEN.turns * TAU * e, r = r0 * (1 - e);
      x = target[0] + r * Math.cos(ang); y = target[1] + r * Math.sin(ang);
      rot = rot0 + 2 * TAU * e; k = 1 - 0.6 * e;
      a = FALLEN.alpha + (0.7 - FALLEN.alpha) * Math.sin(Math.PI * e);
    }
  }
  return { x, y, rot, a, k, sp, target, p0 };
}
function drawFallenSlips(ctx, view) {
  const t = view.t;
  if (t < FALLEN_NOTES[0].t1) return;
  const hp = view.px;
  FALLEN_NOTES.forEach((n, i) => {
    const s = fallenSlipState(n, i, t);
    if (!s || s.a <= 0.002) return;
    if (s.sp > 0 && !REDUCED) {
      // the hairline it travels along
      ctx.strokeStyle = inkA(0.12 * Math.sin(Math.PI * s.sp)); ctx.lineWidth = hp;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.target[0], s.target[1]); ctx.stroke();
    }
    ctx.save();
    ctx.globalAlpha = s.a;
    ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.scale(s.k, s.k);
    const w = FALLEN.w, h = FALLEN.h;
    ctx.fillStyle = COL.page; ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeStyle = COL.ink; ctx.lineWidth = Math.max(0.8, 0.8 * hp); ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.strokeStyle = COL.siteDetail; ctx.lineWidth = 0.6;
    ctx.beginPath();
    for (let j = 0; j < 3; j++) { const y = -h / 2 + 3.5 + j * 2.6; ctx.moveTo(-w / 2 + 4, y); ctx.lineTo(w / 2 - 4 - (j === 2 ? 10 : 0), y); }
    ctx.stroke();
    ctx.restore();
  });
}

/* A small card condenses out of row 3 and slides along a hairline into Room 4 (34.0 to 35.0). */
function drawCondensedCard(ctx, view) {
  const t = view.t;
  if (!within(t, 33.9, 35.25)) return;
  const from = { x: WORLD.rows.x0 + 250, y: WORLD.rows.baselines[2] - 6 };
  const R = CARDS.emboss1.rect, to = { x: R[0] + R[2] / 2, y: R[1] + R[3] / 2 };
  const p = easeInOutCubic(prog(t, 34.0, 35.0));
  const a = prog(t, 33.9, 34.1) * (1 - prog(t, 35.0, 35.25));
  ctx.strokeStyle = inkA(0.2 * a); ctx.lineWidth = view.px;
  ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
  const x = lerp(from.x, to.x, p), y = lerp(from.y, to.y, p), k = lerp(0.6, 1, prog(t, 34.0, 34.3));
  ctx.save();
  ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(k, k);
  ctx.fillStyle = COL.page; rrect(ctx, -22, -8, 44, 16, 3); ctx.fill();
  ctx.strokeStyle = COL.ink; ctx.lineWidth = Math.max(0.8, view.px); ctx.stroke();
  ctx.strokeStyle = COL.siteDetail; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-16, -2); ctx.lineTo(14, -2); ctx.moveTo(-16, 3); ctx.lineTo(6, 3); ctx.stroke();
  ctx.restore();
}

/* After the photo, an ink dot drops from Rasmus's phone back to row 3 along a hairline (38.5 to 39.2). */
function drawPhoneDot(ctx, view) {
  const t = view.t;
  if (!within(t, 38.3, 39.5)) return;
  const a0 = realityAnchor('rasmus.phone', t);
  const b0 = { x: WORLD.rows.glyphX, y: WORLD.rows.baselines[2] - 6 };
  const p = easeInOutCubic(prog(t, 38.5, 39.2));
  const a = prog(t, 38.3, 38.5) * (1 - prog(t, 39.2, 39.5));
  ctx.strokeStyle = inkA(0.22 * a); ctx.lineWidth = view.px;
  ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.lineTo(b0.x, b0.y); ctx.stroke();
  ctx.fillStyle = inkA(a);
  ctx.beginPath(); ctx.arc(lerp(a0.x, b0.x, p), lerp(a0.y, b0.y, p), 3, 0, TAU); ctx.fill();
}

/* Embossed cards rising from beneath the paper (B10, B24): blank relief first (page fill, a white
   highlight up-left, an ink .18 shade down-right, a soft shadow); 40-text.js inks their text. */
function embossState(card, t) {
  const rise = prog(t, card.rise[0], card.rise[1], easeOutCubic);
  const out = card.out ? prog(t, card.out[0], card.out[1]) : 0;
  return { rise, a: rise * (1 - out) };
}
function drawEmbossRelief(ctx, view) {
  const t = view.t;
  for (const key of ['emboss1', 'emboss2', 'embossAnna']) {
    const c = CARDS[key], s = embossState(c, t);
    if (s.a <= 0) continue;
    const [x, y, w, h] = c.rect, r = 5, d = 1.1;
    const k = lerp(0.96, 1, s.rise), dy = 3 * (1 - s.rise);
    ctx.save();
    ctx.globalAlpha = s.a;
    ctx.translate(x + w / 2, y + h / 2 + dy); ctx.scale(k, k); ctx.translate(-w / 2, -h / 2);
    softShadow(ctx, 0, 0, w, h, r, 0.8 * s.rise, 6);
    ctx.fillStyle = COL.page; rrect(ctx, 0, 0, w, h, r); ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(255, 255, 255, 0.9); rrect(ctx, -d * 0.6, -d * 0.6, w, h, r); ctx.stroke();
    ctx.strokeStyle = inkA(0.18); rrect(ctx, d * 0.6, d * 0.6, w, h, r); ctx.stroke();
    ctx.restore();
  }
}

/* Shadow under the DOM slip while it is lifted or carried (the paper itself is DOM, in 40-text.js). */
function drawSlipShadow(ctx, view) {
  const p = slipPose(view.t);
  if (!p.visible) return;
  const lifted = p.phase === 'unfold' || p.phase === 'held' || p.phase === 'carry' || p.phase === 'return';
  ctx.save();
  ctx.globalAlpha = p.alpha;
  ctx.translate(p.cx, p.cy); ctx.rotate(p.rot);
  softShadow(ctx, -p.w / 2, -p.h / 2, p.w, p.h, 4 * p.k, lifted ? 1.1 : 0.45, lifted ? 14 * p.k + 4 : 4);
  ctx.restore();
}

/* ==== 40-text.js ==== */
/* 40-text.js · all DOM text. Elements are created once from the tables (txBuild), measured after
   fonts load and on every layout change (txMeasure, a PRERENDER step), and updated per frame by
   syncText(view), which only writes styles that changed. Also draws the text-related canvas marks:
   role-tag tethers, letter ink spreads and the portrait speaker tick (drawTethers). */

const TX = { built: false };
/* Baseline of a 1em line box, as a fraction of the font size, measured per family after fonts load. */
const TX_BL = { sans: 0.875, mono: 0.875 };

/* Signature "A. Møller" (the only handwriting in the film) and Ingrid Lund's initials, authored paths. */
const SIG_D = 'M8 66C14 50 22 30 30 12C34 28 40 48 48 66M18 46C26 44 34 44 42 45M56 64C57 63 58 64 57 65' +
  'M70 66C72 50 75 32 78 20C82 34 86 46 90 54C94 42 99 30 104 20C106 36 107 52 109 66' +
  'M128 48C118 47 115 62 124 64C134 66 137 50 128 48ZM116 70L139 42' +
  'M146 66C152 52 158 32 158 16C156 8 149 20 150 40C151 54 154 64 161 64' +
  'M161 64C167 52 173 32 173 16C171 8 164 20 165 40C166 54 169 64 176 64' +
  'M176 58C184 58 192 52 190 47C188 42 178 45 178 55C178 64 189 66 197 60' +
  'M197 60C199 54 201 50 203 47C205 51 208 51 214 47M62 76C110 72 170 70 236 64';
const IL_D = 'M12 10C12 24 11 38 10 52M28 8C28 26 27 40 25 52C33 50 41 50 50 51';

function txW(cls, text) { return el('div', cls, TX.world, text); }
function txS(cls, text) { return el('div', cls, TX.screen, text); }
function txSig(parent, cls, d, vb) {
  const s = svgEl('svg', { class: cls, viewBox: vb, 'aria-hidden': 'true' }, parent);
  const p = svgEl('path', { d, pathLength: '1', 'stroke-dasharray': '1 1', 'stroke-dashoffset': '1' }, s);
  return { svg: s, path: p };
}

/* ---------- build (once) ---------- */
function txBuild() {
  TX.world = document.getElementById('world');
  TX.screen = document.getElementById('screen');
  TX.leaders = document.getElementById('leaders');
  TX.dock = document.getElementById('dock');
  TX.phoneHost = document.getElementById('phoneP');

  /* world: record line, one span per character */
  TX.rec = txW('w-rec');
  TX.recSpans = [...COPY.spoken.text].map(ch => el('span', '', TX.rec, ch));
  TX.wordTags = COPY.wordTags.map(w => ({ w, ul: txW('w-ul'), tag: txW('w-mono', w.text) }));
  TX.frameLab = txW('w-frame');
  TX.rows = ROWS.map(r => {
    const row = txW('w-row');
    const gl = glyphSvg('g-checking', 'gl'); row.appendChild(gl);
    const lb = el('div', 'lb', row);
    const lbt = el('span', '', lb, r.label);
    const ins = r.insert ? el('span', 'ins', lb, r.insert.text) : null;
    const an = el('div', 'an', row);
    return { row, gl, use: gl.firstChild, lb, lbt, ins, an };
  });
  TX.rib = {
    ticks: RIBBON.ticks.map(k => txW('w-rib', k.label)),
    weld: txW('w-rib', RIBBON.bars.weld),
    hour: txW('w-rib'),
    left: txW('w-rib', RIBBON.endTags.left),
    right: txW('w-rib', RIBBON.endTags.right)
  };
  TX.rib.hourT = el('span', '', TX.rib.hour, RIBBON.bars.hour);
  TX.rib.hourIns = el('span', 'ins', TX.rib.hour, RIBBON.insert.text);
  TX.outside = txW('w-out', OUTSIDE_TAG);
  TX.check16 = txW(''); TX.check16.appendChild(glyphSvg('g-check', 'g'));

  /* decision card */
  const D = CARDS.decision;
  TX.dec = txW('w-dec');
  TX.decH = el('div', 'h', TX.dec);
  TX.decT = el('div', 't', TX.dec);
  TX.decRows = D.rows.map(r => { const row = el('div', 'r', TX.dec); const g = glyphSvg(r.glyph, 'g'); row.appendChild(g); return { row, g, span: el('span', '', row) }; });
  TX.decSig = txSig(TX.dec, 'sig', SIG_D, '0 0 240 80');

  /* the slip */
  TX.slip = txW('w-slip');
  const inner = el('div', 'in', TX.slip);
  TX.slipHdr = el('div', 'hdr', inner);
  TX.slipLines = [];
  SLIP.lines.forEach((l, i) => {
    const d = el('div', 'ln' + (l.strong ? ' hd2' : '') + (l.dev ? ' dev' : ''), inner);
    if (l.dev) d.appendChild(glyphSvg('g-outside', 'g'));
    TX.slipLines.push({ node: d, span: el('span', '', d), text: l.text });
    if (i === SLIP.insert.after) {
      TX.slipIns = el('div', 'ln ins', inner);
      TX.slipInsSpan = el('span', '', TX.slipIns, SLIP.insert.text);
    }
  });
  TX.slipRules = WORLD.slip.rules.map(() => el('div', 'rule', TX.slip));
  TX.slipWU = SLIP.writeUnders.map(w => ({ w, a: el('div', 'wu', TX.slip, w.text), b: w.next ? el('div', 'wu', TX.slip, w.next.text) : null, st: el('div', 'st', TX.slip, w.initials) }));
  TX.seal = el('div', 'seal', TX.slip);
  TX.sealRing = el('div', 'seal-ring', TX.seal); TX.sealRing.appendChild(glyphSvg('g-mark', 'g'));
  el('span', '', TX.seal, SLIP.seal.text);
  TX.bound = el('div', 'bound', TX.slip);
  SLIP.bound.lines.forEach(l => el('div', '', TX.bound, l));
  TX.tally = txW('w-tally', SLIP.tally.text);
  TX.foot = txW('w-foot', SLIP.footnote.text);
  TX.deskLab = txW('w-desk', PENCIL_CROWD.label.text);
  TX.newRec = txW('w-newrec', COPY.newRecord.text);

  /* embossed card text */
  TX.emb = ['emboss1', 'emboss2'].map((key, k) => {
    const c = CARDS[key];
    const box = txW('w-emb' + (k ? ' c2' : ''));
    const h = el('div', 'h', box, c.head);
    const lines = c.lines.map(l => el('div', 'b', box, l.text));
    return { key, c, box, h, lines };
  });

  /* screen: running head */
  const hd = txS('hd');
  const brand = el('div', 'hd-brand', hd); brand.appendChild(glyphSvg('g-mark', 'g')); el('span', '', brand, HEAD.brand);
  const right = el('div', 'hd-right', hd);
  TX.steps = [];
  const g1 = el('div', 'hd-group', right); el('em', '', g1, HEAD.today); const s1 = el('div', 'hd-steps', g1);
  const g2 = el('div', 'hd-group', right); el('em', '', g2, HEAD.leads); const s2 = el('div', 'hd-steps', g2);
  STEPS.forEach(s => TX.steps.push(el('span', 'step' + (s.today ? '' : ' dashed'), s.today ? s1 : s2, s.name)));
  TX.clock = el('div', 'hd-clock', right);
  const cmp = el('div', 'hd-compact', hd);
  TX.cmpWord = el('b', '', cmp);
  const dots = el('div', 'hd-dots', cmp);
  TX.cmpDots = STEPS.map(s => el('i', s.today ? '' : 'dashed', dots));
  TX.cmpClock = el('div', 'hd-clock', cmp);
  TX.hd = hd;

  TX.chap = txS('chap');
  TX.loc = txS('corner loc', COPY.location.text);
  TX.corner = txS('corner', COPY.corner.text);

  /* spoken sentence beside Rasmus */
  TX.spk = txS('spk');
  TX.spkLab = el('div', 'lab spk-lab', TX.spk, COPY.speaker.text);
  TX.spkTxt = el('div', 'spk-txt', TX.spk);
  TX.spkSpans = [...COPY.spoken.text].map(ch => el('span', '', TX.spkTxt, ch));
  TX.spkCur = txS('spk-cur');

  /* notes, leaders, tags, captions */
  TX.notes = NOTES.map(n => {
    const node = txS('note');
    el('div', 'lab note-lab', node, n.label || AGENTS[n.who].label);
    el('div', 'note-txt' + (AGENTS[n.who].mono ? ' mono' : ''), node, n.text);
    return { n, node, w: 300, h: 60 };
  });
  TX.lines = [0, 1, 2].map(() => svgEl('line', { x1: 0, y1: 0, x2: 0, y2: 0, visibility: 'hidden' }, TX.leaders));
  TX.tags = AGENT_IDS.map(id => {
    const node = txS('tag');
    el('div', 'tag-1', node, AGENTS[id].tag[0]);
    el('div', 'tag-2', node, AGENTS[id].tag[1]);
    return { id, node, w: 160, h: 30 };
  }).sort((a, b) => AGENTS[a.id].tagT - AGENTS[b.id].tagT);
  TX.caps = CAPTIONS.map(c => ({ c, node: txS('cap', c.text) }));

  /* Ingrid's inset label and initials */
  TX.insetLab = txS('lab inset-lab', INSET.label);
  TX.initials = txSig(TX.screen, 'initials', IL_D, '0 0 60 60');

  /* Anna's phone card: landscape inside the stage, portrait as an overlay over stage and dock */
  TX.phoneL = txBuildPhone(TX.screen, CARDS.phone.L, 'phone');
  TX.phoneP = txBuildPhone(TX.phoneHost, CARDS.phone.P, '');

  /* final frame */
  TX.fin1 = txS('fin1');
  TX.fin1Words = COPY.final1.split(' ').map((w, i, a) => el('span', '', TX.fin1, w + (i < a.length - 1 ? ' ' : '')));
  TX.fin2 = txS('fin2', COPY.final2);
  TX.wm = txS('wm', COPY.wordmark);
  TX.cred1 = txS('credit', COPY.credit1);
  TX.cred2 = txS('credit sm', COPY.credit2);

  /* portrait caption dock: two note rows by note parity (at most two notes overlap, and
     overlapping notes are always consecutive in the cue sheet), captions underneath */
  TX.dockNotes = NOTES.map(n => {
    const node = el('div', 'dk-note', TX.dock);
    el('div', 'l', node, (AGENTS[n.who].glyph.length === 1 ? AGENTS[n.who].glyph + ' ' : '') + AGENTS[n.who].label);
    el('div', 'x' + (AGENTS[n.who].mono ? ' mono' : ''), node, n.text);
    return { n, node };
  });
  TX.dockCaps = CAPTIONS.map(c => ({ c, node: el('div', 'dk-cap', TX.dock, c.text) }));

  /* everything starts hidden; syncText reveals */
  for (const node of [...TX.world.children, ...TX.screen.children]) if (node !== TX.leaders) setAlpha(node, 0);
  TX.built = true;
}

function txBuildPhone(host, copy, cls) {
  const card = cls ? el('div', cls, host) : host;
  el('div', 'ph-lab', card, copy.lab);
  el('div', 'ph-title', card, copy.title);
  const sub = el('div', 'ph-sub', card);
  if (cls) sub.appendChild(glyphSvg('g-outside', 'g'));
  el('span', '', sub, copy.sub);
  const opts = el('div', 'ph-opts', card);
  let chosen = null;
  copy.opts.forEach(o => {
    const opt = el('div', 'ph-opt', opts);
    opt.appendChild(glyphSvg(o.glyph, 'g'));
    const body = el('div', '', opt);
    const h = el('div', 'h', body);
    el('b', '', h, o.lab);
    if (o.h) h.appendChild(document.createTextNode(o.h));
    if (o.d) el('div', 'd', body, o.d);
    (o.rows || []).forEach((r, i) => { const row = el('div', 'ph-row', body, r); if (i === CARDS.phone.chosen) chosen = row; });
  });
  if (copy.foot) el('div', 'ph-lab ph-foot', card, copy.foot);
  const sign = el('div', 'ph-sign', card);
  const lab = el('div', 'ph-lab', sign, CARDS.phone.signLabel);
  const sig = txSig(sign, 'sig', SIG_D, '0 0 240 80');
  const ok = el('div', 'ph-lab ph-ok', sign, CARDS.phone.approvedText);
  const tap = el('div', 'ph-tap', chosen);
  tap.style.right = '18%'; tap.style.top = '50%';
  return { card, chosen, sig, ok, tap, signLab: lab };
}

/* ---------- measure (after fonts load and on every layout change) ---------- */
function txBaselineFactor(family) {
  const probe = el('div', '', document.body);
  probe.style.cssText = `position:absolute;left:-9999px;top:0;font:500 100px/100px ${family};white-space:nowrap`;
  probe.textContent = 'Hx';
  const mark = el('span', '', probe);
  mark.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
  const f = mark.offsetTop / 100;
  probe.remove();
  return f > 0.5 && f < 1.2 ? f : 0.875;
}
/* Distance from an element's top to its first baseline, from its computed font and line height. */
function txBaseOf(node, fam) {
  const cs = getComputedStyle(node);
  const fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight);
  return ((isNaN(lh) ? fs * 1.2 : lh) - fs) / 2 + TX_BL[fam] * fs;
}
function txPlace(node, x, baseline, fam) { node.style.left = px(x); node.style.top = px(baseline - txBaseOf(node, fam)); }

function txMeasure() {
  if (!TX.built) return;
  TX_BL.sans = txBaselineFactor("'IBM Plex Sans', sans-serif");
  TX_BL.mono = txBaselineFactor("'IBM Plex Mono', monospace");
  const portrait = LAYOUT.mode === 'portrait';

  /* record line and its words */
  txPlace(TX.rec, WORLD.record.x, WORLD.record.baseline, 'sans');
  const recTop = WORLD.record.baseline - txBaseOf(TX.rec, 'sans');
  TX.recPos = TX.recSpans.map(s => ({ x: WORLD.record.x + s.offsetLeft, w: s.offsetWidth, cx: WORLD.record.x + s.offsetLeft + s.offsetWidth / 2, cy: recTop + s.offsetHeight * 0.55 }));
  const stop = TX.recPos[TX.recPos.length - 1];
  MEASURE.fullStop = { x: stop.cx, y: WORLD.record.baseline - 4 };
  const words = [];
  let cur = null;
  [...COPY.spoken.text].forEach((ch, i) => {
    if (ch === ' ') { cur = null; return; }
    if (!cur) { cur = { text: '', x0: TX.recPos[i].x, x1: 0 }; words.push(cur); }
    if (ch !== '.') { cur.text += ch; cur.x1 = TX.recPos[i].x + TX.recPos[i].w; }
  });
  MEASURE.words = words;
  TX.wordTags.forEach(({ w, ul, tag }) => {
    const a = words[w.from], b = words[w.to];
    ul.style.left = px(a.x0); ul.style.top = px(WORLD.record.baseline + 6); ul.style.width = px(b.x1 - a.x0);
    txPlace(tag, a.x0, WORLD.record.baseline + 22, 'mono');
  });
  txPlace(TX.frameLab, WORLD.frame.label[0], WORLD.frame.label[1], 'mono');

  /* rows, ribbon labels, outside tag */
  TX.rows.forEach((r, i) => {
    const b = WORLD.rows.baselines[i];
    r.row.style.left = px(WORLD.rows.x0);
    r.row.style.top = px(b - txBaseOf(r.lb, 'sans'));
    if (r.ins) { r.ins.style.width = ''; r.insW = r.ins.offsetWidth; }
  });
  MEASURE.row3End = 32 + TX.rows[2].lbt.offsetWidth;
  const R = TX.rib;
  R.tickW = R.ticks.map(n => n.offsetWidth);
  R.weldW = R.weld.offsetWidth;
  R.rightW = R.right.offsetWidth;
  R.hourIns.style.width = ''; R.hourInsW = R.hourIns.offsetWidth;
  MEASURE.hourEnd = R.hourT.offsetWidth;
  R.baseMono = txBaseOf(R.weld, 'mono');
  txPlace(TX.outside, WORLD.outside.tag[0], WORLD.outside.tag[1] + 3.5, 'mono');
  txPlace(TX.tally, WORLD.tally[0], WORLD.tally[1], 'mono');
  txPlace(TX.foot, WORLD.footnote[0], WORLD.footnote[1], 'sans');
  txPlace(TX.newRec, WORLD.newRecord[0], WORLD.newRecord[1], 'mono');
  txPlace(TX.deskLab, PENCIL_CROWD.label.at[0], PENCIL_CROWD.label.at[1], 'mono');
  TX.check16.style.left = px(ribbonX(1005) - 7); TX.check16.style.top = px(RB.y - 32);
  TX.check16.style.width = TX.check16.style.height = '14px';
  TX.check16.firstChild.style.width = TX.check16.firstChild.style.height = '14px';

  /* slip internals: rules and write-unders hang off the rules (text sits on its line) */
  WORLD.slip.rules.forEach((y, i) => {
    const ly = y - WORLD.slip.y0;
    TX.slipRules[i].style.top = px(ly);
    const wu = TX.slipWU[i];
    for (const n of [wu.a, wu.b]) if (n) { n.style.top = px(ly - 2); n.style.transform = 'translateY(-100%)'; }
    wu.st.style.top = px(ly - 9);
  });
  TX.slipIns.style.height = ''; TX.slipInsH = TX.slipIns.offsetHeight + 7;
  MEASURE.slipInsertY = TX.slipIns.offsetTop + 16 + TX.slipInsH * 0.62;

  /* embossed card text boxes */
  TX.emb.forEach(e => { const [x, y, w, h] = e.c.rect; Object.assign(e.box.style, { left: px(x), top: px(y), width: px(w), height: px(h) }); });

  /* screen: chapter and corner labels, inset label */
  const S = SCREEN[portrait ? 'P' : 'L'];
  TX.headH = TX.hd.offsetHeight;
  const chapTop = Math.max(S.chapter[1], TX.headH + 22);
  if (portrait) txPlace(TX.chap, S.chapter[0], chapTop, 'mono');
  else txPlace(TX.chap, TX.hd.querySelector('.hd-brand').offsetWidth + 64, TX.headH / 2 + 4, 'mono');
  txPlace(TX.loc, S.chapter[0], chapTop, 'mono');
  TX.corner.style.left = px(S.corner[0] - TX.corner.offsetWidth);
  TX.corner.style.top = px(S.corner[1] - txBaseOf(TX.corner, 'mono'));
  TX.insetBox = portrait ? (() => { const sz = 240 / LAYOUT.s; return [S.W - sz - 16 / LAYOUT.s, TX.headH + 16 / LAYOUT.s, sz, sz]; })() : SCREEN.L.inset;
  const ib = TX.insetBox;
  TX.insetLab.style.left = px(ib[0] + ib[2] - TX.insetLab.offsetWidth);
  TX.insetLab.style.top = px(ib[1] + ib[3] + 10);
  const isz = ib[2] * 0.2;
  Object.assign(TX.initials.svg.style, { left: px(ib[0] + ib[2] * 0.62), top: px(ib[1] + ib[3] * 0.66), width: px(isz), height: px(isz) });

  /* spoken sentence: letter offsets inside the block, for typing, cursor and the letter fall */
  TX.spkW = TX.spk.offsetWidth; TX.spkH = TX.spk.offsetHeight;
  TX.spkLabH = TX.spkLab.offsetHeight + parseFloat(getComputedStyle(TX.spkLab).marginBottom);
  TX.spkOff = TX.spkSpans.map(s => ({ x: s.offsetLeft, y: s.offsetTop, w: s.offsetWidth, h: s.offsetHeight }));
  TX.spkFs = parseFloat(getComputedStyle(TX.spkTxt).fontSize);
  // where each spoken letter sits in the world at 5.6 (the camera holds there), the fall's start
  const cam = cameraAt(COPY.fall.a, LAYOUT.mode, false);
  const blk = txSpokenBlock(COPY.fall.a, cam);
  const toWorld = (sx, sy) => [(sx - LAYOUT.W / 2) / cam.z + cam.cx, (sy - LAYOUT.H / 2) / cam.z + cam.cy];
  TX.fallSrc = TX.spkOff.map((o, i) => {
    const [wx, wy] = toWorld(blk.x + o.x + o.w / 2, blk.y + o.y + o.h * 0.55);
    return { dx: wx - TX.recPos[i].cx, dy: wy - TX.recPos[i].cy, k0: (TX.spkFs / cam.z) / WORLD.record.size };
  });

  /* notes and tags (landscape placement needs their size) */
  TX.notes.forEach(o => { o.w = o.node.offsetWidth; o.h = o.node.offsetHeight; });
  TX.tags.forEach(o => { o.w = o.node.offsetWidth; o.h = o.node.offsetHeight; });
  TX.caps.forEach(o => { o.w = o.node.offsetWidth; o.h = o.node.offsetHeight; });
  // placements are decided again for the new layout
  TX.notes.forEach(o => { o.slotKey = null; });
  TX.tags.forEach(o => { o.posKey = null; });

  /* final frame */
  const F = FINAL[portrait ? 'P' : 'L'];
  TX.fin1.style.top = TX.fin2.style.top = '';
  if (portrait) {
    TX.fin2.style.top = px(TX.fin1.offsetTop + TX.fin1.offsetHeight + 34);
    TX.cred1.style.top = px(1090 - txBaseOf(TX.cred1, 'mono'));
    TX.cred2.style.top = px(1122 - txBaseOf(TX.cred2, 'mono'));
  } else {
    TX.cred1.style.top = px(800 - txBaseOf(TX.cred1, 'mono'));
    TX.cred2.style.top = px(830 - txBaseOf(TX.cred2, 'mono'));
  }
  TX.wm.style.left = px(F.word[0]);
  TX.wm.style.top = px(F.word[1] - txBaseOf(TX.wm, 'sans'));
  TX.dockH = TX.dock.clientHeight;
  MEASURE.ready = true;
}
prerender(txMeasure, { onLayout: true });

/* Spoken block position (stage px) at time t: beside Rasmus's head in landscape, below it in portrait. */
function txSpokenBlock(t, cam) {
  const head = realityAnchor('rasmus.head', t);
  const W = LAYOUT.W, H = LAYOUT.H;
  const hx = (head.x - cam.cx) * cam.z + W / 2, hy = (head.y - cam.cy) * cam.z + H / 2;
  const S = SCREEN[LAYOUT.mode === 'portrait' ? 'P' : 'L'];
  let x, y;
  if (LAYOUT.mode === 'portrait') { x = (W - TX.spkW) / 2; y = hy + 70; }
  else { x = hx + 44; y = hy - TX.spkLabH - TX.spkOff[0].h * 0.5; }
  x = clamp(x, S.safe[0], S.safe[2] - TX.spkW);
  y = clamp(y, S.safe[1], S.safe[3] - TX.spkH);
  return { x, y, hx, hy };
}

/* ---------- per-frame sync ---------- */
function syncText(view) {
  if (!TX.built || !MEASURE.ready) return;
  const t = view.t, portrait = view.mode === 'portrait';
  /* world layer: the camera matrix; hidden below zoom 0.35 (fades out 0.35 to 0.25) */
  const z = view.cam.z;
  const [ox, oy] = view.worldToStage(0, 0);
  setStyle(TX.world, 'transform', `matrix(${z},0,0,${z},${ox},${oy})`);
  setAlpha(TX.world, prog(z, 0.25, 0.35));

  txSyncRecord(t, view);
  txSyncRows(t);
  txSyncRibbon(t);
  txSyncDecision(t);
  txSyncSlip(t);
  txSyncPageMisc(t);
  txSyncHead(t, portrait);
  txSyncSpoken(t, view);
  txSyncNotes(t, view, portrait);
  txSyncTags(t, view, portrait);
  txSyncCaptions(t, portrait);
  txSyncInset(t);
  txSyncPhone(t, portrait);
  txSyncFinal(t);
}

/* Record line: letters fall from the spoken sentence into their slots (5.6 to 8.0). */
function txFallTimes(i) {
  const F = COPY.fall, last = TX.recSpans.length - 1;
  const start = i === last ? F.stopLands - F.dur : F.a + i * F.stagger;
  return { start, land: start + F.dur };
}
function txSyncRecord(t, view) {
  const F = COPY.fall;
  TX.recSpans.forEach((s, i) => {
    const { start, land } = txFallTimes(i);
    if (t < start) { setAlpha(s, 0); return; }
    setAlpha(s, 1);
    if (t >= land + F.settle) { setStyle(s, 'transform', 'none'); return; }
    let tr;
    if (t < land) {
      const p = (t - start) / F.dur, src = TX.fallSrc[i];
      if (view.reduced) { setAlpha(s, p); tr = `translate(0px,${-12 * (1 - easeOutCubic(p))}px)`; }
      else {
        // soft arc: horizontal eases out while the drop accelerates, growing to 1.3 x on arrival
        const ox = src.dx * (1 - easeOutCubic(p)), oy = src.dy * (1 - p * p);
        tr = `translate(${ox.toFixed(2)}px,${oy.toFixed(2)}px) scale(${lerp(src.k0, 1.3, easeInOutSine(p)).toFixed(3)})`;
      }
    } else {
      const q = (t - land) / F.settle;
      tr = view.reduced ? 'none' : `scale(${(1 + 0.3 * (1 - easeOutCubic(q))).toFixed(3)})`;
    }
    setStyle(s, 'transform', tr);
  });
  setAlpha(TX.rec, 1);
  /* word tags: hairline underline plus a Mono tag, left by each Activity tap */
  TX.wordTags.forEach(({ w, ul, tag }) => {
    const p = prog(t, w.t, w.t + 0.25, easeOutCubic);
    setAlpha(ul, p > 0 ? 1 : 0);
    setStyle(ul, 'transform', `scaleX(${p.toFixed(3)})`);
    setAlpha(tag, prog(t, w.t + 0.05, w.t + 0.35));
  });
  /* frame label types 10.6 to 11.6 */
  const n = Math.round(FRAME.label.length * prog(t, FRAME.type[0], FRAME.type[1]));
  setText(TX.frameLab, FRAME.label.slice(0, n));
  setAlpha(TX.frameLab, n > 0 ? 1 : 0);
}

/* Checklist rows (B9 to B14, B26). */
function txSyncRows(t) {
  TX.rows.forEach((r, i) => {
    const R = ROWS[i];
    const t0 = ROWS_IN.t0 + i * ROWS_IN.stagger;
    const p = prog(t, t0, t0 + ROWS_IN.dur, demoEase);
    setAlpha(r.row, clamp(p * 3));
    if (p <= 0) return;
    const b = WORLD.rows.baselines[i];
    const dx = (ROWS_IN.from[0] - WORLD.rows.x0) * (1 - p), dy = (ROWS_IN.from[1] - b) * (1 - p);
    setStyle(r.row, 'transform', p < 1 ? `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${lerp(0.35, 1, p).toFixed(3)})` : 'none');
    // glyph: the latest state key that sets one, else the checking ring
    const glyphKey = [...R.keys].reverse().find(k => t >= k.t && k.glyph);
    const gName = glyphKey ? glyphKey.glyph : 'checking';
    setAttr(r.use, 'href', '#g-' + gName);
    // glyph motion: checking spins, stamps press in at 1.3 x, the loupe sweep pulses rows 1 to 5
    let k = 1, rot = 0;
    if (gName === 'checking') rot = (t * CHECK_SPIN * 360) % 360;
    if (glyphKey && glyphKey.stamp) k = stampPress(t, glyphKey.t).k;
    if (i < 5) { const s = LOUPE_SWEEP[i]; if (within(t, s, s + 0.3)) k *= 1 + 0.35 * Math.sin(Math.PI * (t - s) / 0.3); }
    if (glyphKey && glyphKey.signal) k *= stampPress(t, glyphKey.t, 0.3).k;
    setStyle(r.gl, 'transform', `rotate(${rot.toFixed(1)}deg) scale(${k.toFixed(3)})`);
    // deviation colour on row 6 (46.6), back to ink at 112.4
    const sig = R.keys.find(q => q.signal);
    if (sig) {
      const on = prog(t, sig.t, sig.t + RIBBON.redDraw), off = prog(t, SLICE.red2ink[0], SLICE.red2ink[1]);
      const c = on <= 0 || off >= 1 ? '' : sigToInk(1 - on + off, 1);
      setStyle(r.gl, 'color', c);
      setStyle(r.lbt, 'color', c);
      setStyle(r.an, 'color', c);
    }
    // annotation: text of the latest key that has one; fades in on each change
    const ak = [...R.keys].reverse().find(q => t >= q.t && q.ann);
    if (ak) {
      setText(r.an, ak.ann);
      setAlpha(r.an, prog(t, ak.t, ak.t + 0.3));
      const dotted = !!ak.dotted;
      if (r.an._dot !== dotted) { r.an._dot = dotted; r.an.classList.toggle('dotted', dotted); }
    } else setAlpha(r.an, 0);
    // insertion by the caret: the words slide apart (0.3 s), then the insert inks from the pencil
    if (r.ins) txInsert(r.ins, r.insW, t, R.insert.t, R.insert.dur);
  });
}
/* Inline insert: width opens over 0.3 s, then the text inks left to right. */
function txInsert(node, w, t, t0, dur) {
  const open = prog(t, t0, t0 + 0.3, easeInOutCubic);
  const ink = prog(t, t0 + 0.1, t0 + dur, demoEase);
  setStyle(node, 'width', open >= 1 ? '' : px(w * open));
  setStyle(node, 'clipPath', ink >= 1 ? 'none' : `inset(0 ${(100 * (1 - ink)).toFixed(1)}% 0 0)`);
  setAlpha(node, open > 0 ? 1 : 0);
}

/* Ribbon labels ride the rope; they fade as the roll-up passes them. */
function txSyncRibbon(t) {
  const R = TX.rib;
  const show = prog(t, RIBBON.draw[0] + 0.2, RIBBON.draw[1] + 0.2);
  const roll = prog(t, RIBBON.rollUp[0], RIBBON.rollUp[1], easeInOutCubic);
  const rollX = ribbonPoint(1 - roll, t).x;
  const gone = x => (roll > 0 ? clamp((rollX - x) / 30) : 1);
  const at = (node, x, base, w, align) => {
    const p = ribbonPoint(ribbonU(x), t);
    const left = align === 'c' ? p.x - w / 2 : align === 'r' ? p.x - w : p.x;
    setStyle(node, 'transform', `translate(${left.toFixed(2)}px,${(p.y - RB.y + base - R.baseMono).toFixed(2)}px)`);
    return p;
  };
  RIBBON.ticks.forEach((k, i) => { const x = ribbonX(k.min); at(R.ticks[i], x, RB.tickY, R.tickW[i], 'c'); setAlpha(R.ticks[i], show * gone(x)); });
  const wx = (RB.weld[0] + RB.weld[1]) / 2;
  at(R.weld, wx, RIBBON_LABEL_BASE, R.weldW, 'c'); setAlpha(R.weld, show * gone(wx));
  at(R.hour, RB.hour[0], RIBBON_LABEL_BASE, 0, 'l'); setAlpha(R.hour, show * gone(RB.hour[0]));
  txInsert(R.hourIns, R.hourInsW, t, RIBBON.insert.t, RIBBON.insert.dur);
  const ends = envelope(t, ROPE.tags[0], ROPE.tags[1], 0.4, 0.4);
  const L = ribbonPoint(0, t), Rt = ribbonPoint(1, t);
  setStyle(R.left, 'transform', `translate(${(L.x + 2).toFixed(2)}px,${(L.y + RIBBON_LABEL_BASE - RB.y - R.baseMono).toFixed(2)}px)`);
  setStyle(R.right, 'transform', `translate(${(Rt.x - 2 - R.rightW).toFixed(2)}px,${(Rt.y + RIBBON_LABEL_BASE - RB.y - R.baseMono).toFixed(2)}px)`);
  setAlpha(R.left, ends); setAlpha(R.right, ends);
  setAlpha(TX.outside, outsideAlpha(t) * prog(t, RIBBON.red + 0.3, RIBBON.red + 0.6) * (t < RIBBON.rollUp[0] ? 1 : 0));
  setStyle(TX.outside, 'color', sigToInk(prog(t, SLICE.red2ink[0], SLICE.red2ink[1]), 1));
  // the guard's patrol at 16:45 gets a check above the slice (118.2), until the roll-up
  const ck = stampPress(t, SLIP.insert.check);
  setAlpha(TX.check16, ck.a * gone(ribbonX(1005)));
  setStyle(TX.check16, 'transform', `scale(${ck.k.toFixed(3)})`);
}

/* Decision card (B18, B23, B25). */
function txSyncDecision(t) {
  const D = CARDS.decision;
  setAlpha(TX.dec, prog(t, D.type[0], D.type[0] + 0.15));
  if (t < D.type[0]) return;
  const parts = [D.head, D.title, ...D.rows.map(r => r.text)];
  const total = parts.reduce((a, s) => a + s.length, 0);
  let n = Math.round(total * prog(t, D.type[0], D.type[1]));
  const take = s => { const k = Math.min(n, s.length); n -= k; return s.slice(0, k); };
  setText(TX.decH, take(parts[0]));
  setText(TX.decT, take(parts[1]));
  D.rows.forEach((r, i) => {
    let s = take(r.text);
    if (r.next && t >= r.next.t) s = r.next.text.slice(0, Math.round(r.next.text.length * prog(t, r.next.t, r.next.t + 0.8)));
    setText(TX.decRows[i].span, s);
    setAlpha(TX.decRows[i].g, s.length || (r.next && t >= r.next.t) ? 1 : 0);
  });
  txSigReveal(TX.decSig, prog(t, D.sign[0], D.sign[1]));
}
function txSigReveal(sig, p) {
  setAttr(sig.path, 'stroke-dashoffset', (1 - p).toFixed(4));
  setStyle(sig.svg, 'visibility', p > 0 ? 'visible' : 'hidden');
}

/* The slip and its write-unders (B19 to B26). */
function txSyncSlip(t) {
  const pose = slipPose(t);
  setAlpha(TX.slip, pose.alpha);
  if (!pose.visible) return;
  setStyle(TX.slip, 'transform', `translate(${(pose.cx - 120).toFixed(2)}px,${(pose.cy - 225).toFixed(2)}px) rotate(${pose.rot.toFixed(4)}rad) scale(${pose.k.toFixed(4)})`);
  // lines type once the slip is pinned
  const parts = [SLIP.header, ...SLIP.lines.map(l => l.text)];
  const total = parts.reduce((a, s) => a + s.length, 0);
  let n = Math.round(total * prog(t, SLIP.type[0], SLIP.type[1]));
  const take = s => { const k = Math.min(n, s.length); n -= k; return s.slice(0, k); };
  setText(TX.slipHdr, take(parts[0]));
  TX.slipLines.forEach((l, i) => { const s = take(l.text); setText(l.span, s); setAlpha(l.node, s.length ? 1 : 0); });
  // the caret's insert opens a line below the camera line, then inks
  const open = prog(t, SLIP.insert.t, SLIP.insert.t + 0.3, easeInOutCubic);
  setStyle(TX.slipIns, 'height', open >= 1 ? '' : px(TX.slipInsH * open));
  setStyle(TX.slipIns, 'marginTop', open >= 1 ? '' : px(7 * open));
  const ink = prog(t, SLIP.insert.t + 0.1, SLIP.insert.t + SLIP.insert.dur, demoEase);
  setStyle(TX.slipInsSpan, 'clipPath', ink >= 1 ? 'none' : `inset(0 ${(100 * (1 - ink)).toFixed(1)}% 0 0)`);
  setAlpha(TX.slipIns, open > 0 ? 1 : 0);
  TX.slipRules.forEach(r => setAlpha(r, prog(t, SLIP.type[0], SLIP.type[0] + 0.4)));
  // write-unders ink from the left (0.8 s) with the carrier's initials stamp
  TX.slipWU.forEach(({ w, a, b, st }) => {
    const p = prog(t, w.t, w.t + SLIP.writeDur, demoEase);
    let pa = p, pb = 0;
    if (b) { pb = prog(t, w.next.t, w.next.t + SLIP.writeDur, demoEase); pa = p * (1 - prog(t, w.next.t, w.next.t + 0.2)); }
    for (const [node, q] of [[a, pa], [b, pb]]) {
      if (!node) continue;
      setAlpha(node, q > 0 ? 1 : 0);
      setStyle(node, 'clipPath', q >= 1 ? 'none' : `inset(0 ${(100 * (1 - q)).toFixed(1)}% 0 0)`);
    }
    const sp = stampPress(t, w.t + SLIP.writeDur);
    setAlpha(st, sp.a);
    setStyle(st, 'transform', `scale(${sp.k.toFixed(3)})`);
  });
  const seal = stampPress(t, SLIP.seal.t);
  setAlpha(TX.seal, seal.a);
  setStyle(TX.sealRing, 'transform', `scale(${seal.k.toFixed(3)})`);
  const bd = stampPress(t, SLIP.bound.t);
  setAlpha(TX.bound, bd.a);
  setStyle(TX.bound, 'transform', `rotate(-4deg) scale(${bd.k.toFixed(3)})`);
}

/* Tally, footnote, desk label, embossed card text, the new record line. */
function txSyncPageMisc(t) {
  setAlpha(TX.tally, prog(t, SLIP.tally.t, SLIP.tally.t + 0.4));
  const f = prog(t, SLIP.footnote.t, SLIP.footnote.t + 0.8, demoEase);
  setAlpha(TX.foot, f > 0 ? 1 : 0);
  setStyle(TX.foot, 'clipPath', f >= 1 ? 'none' : `inset(0 ${(100 * (1 - f)).toFixed(1)}% 0 0)`);
  setAlpha(TX.deskLab, envelope(t, PENCIL_CROWD.label.a, PENCIL_CROWD.label.b, 0.4, 0.4));
  const nr = prog(t, COPY.newRecord.a, COPY.newRecord.b, demoEase);
  setAlpha(TX.newRec, nr > 0 ? 1 : 0);
  setStyle(TX.newRec, 'clipPath', nr >= 1 ? 'none' : `inset(0 ${(100 * (1 - nr)).toFixed(1)}% 0 0)`);
  TX.emb.forEach(e => {
    const s = embossState(e.c, t);
    setAlpha(e.box, s.a);
    if (s.a <= 0) return;
    const inkH = e.c.ink || e.c.headInk;
    const ph = prog(t, inkH[0], inkH[1], demoEase);
    setStyle(e.h, 'clipPath', `inset(0 ${(100 * (1 - ph)).toFixed(1)}% 0 0)`);
    e.lines.forEach((node, i) => {
      const r = e.c.lines[i].ink || e.c.ink;
      const q = prog(t, r[0], r[1], demoEase);
      setStyle(node, 'clipPath', `inset(0 ${(100 * (1 - q)).toFixed(1)}% 0 0)`);
    });
  });
}

/* Running head, chapter label, Chapter 1 corner labels. */
function txSyncHead(t, portrait) {
  const a = prog(t, HEAD.in, HEAD.in + HEAD.fade) * (1 - prog(t, HEAD.out, HEAD.out + HEAD.fade));
  setAlpha(TX.hd, a);
  const si = stepIndexAt(t);

/* The spoken sentence types beside Rasmus at 16 characters per second (B2). */
function txSyncSpoken(t, view) {
  const show = envelope(t, COPY.speaker.a, COPY.fall.stopLands, 0.3, 0.01);

  // soft cursor after the last typed character; blinks once typing is done, gone when letters fall

  setStyle(TX.spkCur, 'height', px(o.h * 0.8));

  setAttr(ln, 'x2', (blk.x - 6).toFixed(1)); setAttr(ln, 'y2', (blk.y + TX.spkLabH * 0.5).toFixed(1));
  setAttr(ln, 'opacity', la.toFixed(3));
}

/* Agent notes: marginal annotations at authored slots, clamped to the safe area (3.4). */
function txNoteAlpha(n, t) { return t < n.t0 || t > n.t1 ? 0 : Math.min(prog(t, n.t0, n.t0 + NOTE_IN), 1 - prog(t, n.t1 - NOTE_OUT, n.t1)); }

  if (t >= FRAME.type[0]) K.push([WORLD.frame.label[0], WORLD.frame.label[1] - 12, WORLD.frame.label[0] + 430, WORLD.frame.label[1] + 3]);
  if (t >= ROWS_IN.t0 + 0.4) K.push([WORLD.rows.x0, WORLD.rows.baselines[0] - 20, WORLD.rows.x1, WORLD.rows.baselines[5] + 8]);
  if (within(t, RIBBON.draw[0], RIBBON.rollUp[1])) K.push([RB.x0 - 10, RIBBON_LABEL_BASE - 12, RB.x1 + 10, RB.tickY + 4]);
  if (within(t, RIBBON.red, SLICE.red2ink[1])) K.push([WORLD.outside.tag[0], WORLD.outside.tag[1] - 10, WORLD.outside.tag[0] + 130, WORLD.outside.tag[1] + 6]);
  if (t >= CARDS.decision.box[0]) K.push([WORLD.decision.x0, WORLD.decision.y0, WORLD.decision.x1, WORLD.decision.y1]);
  const sp = slipPose(t);
  if (sp.visible && sp.phase === 'pinned') K.push([WORLD.slip.x0, WORLD.slip.y0, WORLD.slip.x1, WORLD.slip.y1 + 40]);
  for (const key of ['emboss1', 'emboss2']) { const c = CARDS[key]; if (embossState(c, t).a > 0) K.push([c.rect[0], c.rect[1], c.rect[0] + c.rect[2], c.rect[1] + c.rect[3]]); }

}
function txOverlap(a, b, pad = 12) { return a.x < b.x + b.w + pad && b.x < a.x + a.w + pad && a.y < b.y + b.h + pad && b.y < a.y + a.h + pad; }

/* Stage rects of the keep-out list under a view. */

/* Fallback slots, nearest first: the authored four, below the head, then further above it. */
const TX_SLOT_ORDER = ['UR', 'UL', 'R', 'L', 'DR', 'DL', 'UC', 'UR2', 'UL2'];

function txNoteRectAt(o, view, place) {
  const S = SCREEN.L.safe, slot = place.slot;

  const [hx, hy] = view.worldToStage(head.x, head.y);
  let x, y;
  switch (slot) {
    case 'UR': x = hx + 28; y = hy - 24 - o.h; break;
    case 'UL': x = hx - 28 - o.w; y = hy - 24 - o.h; break;
    case 'R': x = hx + 40; y = hy - o.h / 2; break;
    case 'L': x = hx - 40 - o.w; y = hy - o.h / 2; break;
    case 'DR': x = hx + 40; y = hy + 30; break;
    case 'DL': x = hx - 40 - o.w; y = hy + 30; break;
    case 'UC': x = hx - o.w / 2; y = hy - 40 - o.h; break;
    case 'UR2': x = hx + 28; y = hy - 110 - o.h; break;
    default: x = hx - 28 - o.w; y = hy - 110 - o.h;

  x += place.dx; y += place.dy;
  const cx = clamp(x, S[0], S[2] - o.w), cy = clamp(y, S[1], S[3] - o.h);
  return { x: cx, y: cy, w: o.w, h: o.h, hx, hy, moved: Math.abs(cx - x) + Math.abs(cy - y) };
}
/* Stage boxes of the agents on screen at view.t (AGENTS w x h standing on the feet), so notes and

function txAgentRects(view) {
  const out = [], sa = societyAlpha(view.t), z = view.cam.z;
  for (const id of AGENT_IDS) {
    const p = agentPose(id, view.t);
    if (!p.visible || p.alpha * sa < 0.3) continue;
    const A = AGENTS[id], k = p.scale * z, [fx, fy] = view.worldToStage(p.x, p.y), [hx, hy] = view.worldToStage(p.head.x, p.head.y);
    const top = Math.min(fy - A.h * k, hy - 14 * k);
    out.push({ id, x: (id === 'd4' ? hx : fx) - A.w * k / 2, y: top, w: A.w * k, h: fy - top });
  }

}
/* Stage rect of the narrator caption showing at t (landscape), or null. */
function txCapRect(t) {
  const c = TX.caps.find(o => envelope(t, o.c.t0, o.c.t1, 0.3, 0.3) > 0);
  return c && c.w ? { x: 800 - c.w / 2, y: 848 - c.h, w: c.w, h: c.h } : null;
}
/* The placement a note uses for its whole life: the authored slot unless, while the note shows, it

   middle and end (agents walk, the camera moves). Decided once per note and layout (no per-frame

function txNoteSlot(o) {

  // provisional answer while this note is being decided (a tag decided meanwhile may ask for it)
  o.slotKey = key; o.slotUsed = { slot: o.n.slot, dx: 0, dy: 0 };
  const samples = txNoteSamples(o);
  let best = null, bestScore = Infinity;
  for (const c of txNoteCands(o, samples)) {
    const score = txNoteScore(o, samples, c);
    if (score < bestScore - 1e-6) { bestScore = score; best = c.p; }
  }

/* What a note must keep clear of at its start, middle and end: { view, avoid: [{ r, k }] }, k weights. */
function txNoteSamples(o) {

    txKeepOutStage(view).forEach(r => avoid.push({ r, k: 3 }));
    if (prev && prev.n.t1 > ts) avoid.push({ r: txNoteRectAt(prev, view, txNoteSlot(prev)), k: 4 });
    TX.tags.forEach(g => { if (AGENTS[g.id].tagT <= n.t0 && txTagAlpha(g.id, ts) > 0) avoid.push({ r: txTagRect(g, view, txTagAbove(g)), k: 3 }); });

/* Candidate placements: every slot as is, and each slot slid just clear of what it hits at the start. */

    const base = slot === o.n.slot ? 0 : TX_SLOT_COST[slot];
    const r = txNoteRectAt(o, first.view, { slot, dx: 0, dy: 0 });
    cands.push({ p: { slot, dx: 0, dy: 0 }, cost: base });
    for (const { r: k } of first.avoid) {

function txSyncNotes(t, view, portrait) {
  const vis = [];
  TX.notes.forEach(o => {
    const a = portrait ? 0 : txNoteAlpha(o.n, t);
    setAlpha(o.node, a);
    if (a > 0) vis.push({ o, a });
  });
  const rects = vis.map(v => txNoteRectAt(v.o, view, txNoteSlot(v.o)));
  // a later note never sits on an earlier one: it moves flush above, or below when there is no room
  if (rects.length === 2 && txOverlap(rects[0], rects[1])) {
    const A = rects[0], B = rects[1], S = SCREEN.L.safe;
    const above = A.y - 16 - B.h, below = A.y + A.h + 16;
    B.y = above >= S[1] ? above : Math.min(below, S[3] - B.h);
  }
  TX.noteRects = rects;
  vis.forEach((v, i) => {
    const r = rects[i];
    const rise = NOTE_RISE * (1 - prog(t, v.o.n.t0, v.o.n.t0 + NOTE_IN, easeOutCubic));
    setStyle(v.o.node, 'transform', `translate(${r.x.toFixed(2)}px,${(r.y + rise).toFixed(2)}px)`);
    // hairline leader from the block's nearest corner to the speaker's head
    const ln = TX.lines[i];
    const cs = [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h]];
    let best = cs[0], bd = Infinity;
    for (const c of cs) { const d = dist(c[0], c[1], r.hx, r.hy); if (d < bd) { bd = d; best = c; } }
    const inside = r.hx > r.x && r.hx < r.x + r.w && r.hy > r.y && r.hy < r.y + r.h;
    if (bd < 16 || inside) { setAttr(ln, 'visibility', 'hidden'); return; }
    const ux = (r.hx - best[0]) / bd, uy = (r.hy - best[1]) / bd;
    setAttr(ln, 'visibility', 'visible');
    setAttr(ln, 'x1', (best[0] + ux * 4).toFixed(1)); setAttr(ln, 'y1', (best[1] + uy * 4 + rise).toFixed(1));
    setAttr(ln, 'x2', (r.hx - ux * 8).toFixed(1)); setAttr(ln, 'y2', (r.hy - uy * 8).toFixed(1));

  if (portrait) {

      const a = txNoteAlpha(o.n, t);

/* Role tags under the agents' feet on first appearance (3.4): hold 4.0 s, fade 0.4 s.

   sits above the head instead, for its whole life. */
function txTagAlpha(id, t) { const T = AGENTS[id].tagT; return t < T ? 0 : Math.min(prog(t, T, T + 0.3), 1 - prog(t, T + TAG_HOLD, T + TAG_HOLD + TAG_FADE)); }

  const S = SCREEN[view.mode === 'portrait' ? 'P' : 'L'].safe;
  const pose = agentPose(o.id, view.t);
  const [fx, fy] = view.worldToStage(pose.x, pose.y), [, hy] = view.worldToStage(pose.head.x, pose.head.y);
  const y = above ? hy - o.h - 16 : fy + 12;

function txTagAbove(o) {
  const key = LAYOUT.mode + LAYOUT.s;

  o.posKey = key; o.above = false;

  const views = [T + 0.3, T + TAG_HOLD / 2, T + TAG_HOLD].map(ts => {
    const view = makeView(ts), avoid = txKeepOutStage(view);

      const cap = txCapRect(ts);
      if (cap) avoid.push(cap);

    TX.tags.forEach(g => { if (AGENTS[g.id].tagT < T && txTagAlpha(g.id, ts) > 0) avoid.push(txTagRect(g, view, txTagAbove(g))); });

}
function txSyncTags(t, view, portrait) {
  const placed = [];
  TX.tags.forEach(o => {
    const pose = agentPose(o.id, t);
    // a tag only shows while its agent stands in the shot
    const [fx, fy] = view.worldToStage(pose.x, pose.y);
    const inShot = fx > 0 && fx < view.W && fy > 40 && fy < view.H + 20;
    const a = inShot ? txTagAlpha(o.id, t) * (pose.visible ? pose.alpha : 0) : 0;
    setAlpha(o.node, a);

    for (const q of placed) if (txOverlap(r, q, 4)) r.y = q.y + q.h + 4;

    setStyle(o.node, 'transform', `translate(${r.x.toFixed(2)}px,${r.y.toFixed(2)}px)`);

function txSyncCaptions(t, portrait) {
  TX.caps.forEach(o => setAlpha(o.node, portrait ? 0 : envelope(t, o.c.t0, o.c.t1, 0.3, 0.3)));
  if (portrait) TX.dockCaps.forEach(o => setAlpha(o.node, envelope(t, o.c.t0, o.c.t1, 0.3, 0.3)));
}

function txSyncInset(t) {
  const a = prog(t, INSET.in[0], INSET.in[1]) * (1 - prog(t, INSET.out[0], INSET.out[1]));
  setAlpha(TX.insetLab, a);
  setAlpha(TX.initials.svg, a);
  txSigReveal(TX.initials, prog(t, INSET.initials[0], INSET.initials[1]));
  if (a <= 0) setStyle(TX.initials.svg, 'visibility', 'hidden');
}

/* Anna's phone card (B25): slides up, tap on Helvetic, signature, approval line. */
function txSyncPhone(t, portrait) {
  const P = CARDS.phone;
  const inP = prog(t, P.in[0], P.in[1], demoEase), outP = prog(t, P.out[0], P.out[1], easeInOutCubic);
  const a = inP * (1 - outP);
  const dy = 40 * (1 - inP) + 30 * outP;
  const active = portrait ? TX.phoneP : TX.phoneL, other = portrait ? TX.phoneL : TX.phoneP;
  setAlpha(other.card, 0);
  setAlpha(active.card, a);
  if (a <= 0) return;
  setStyle(active.card, 'transform', portrait ? `translateY(calc(-50% + ${dy.toFixed(1)}px))` : `translateY(${dy.toFixed(1)}px)`);
  const tapped = t >= P.tap;
  if (active.chosen._box !== tapped) { active.chosen._box = tapped; active.chosen.classList.toggle('box', tapped); }
  const tp = prog(t, P.tap, P.tap + 0.45);
  setAlpha(active.tap, tp > 0 && tp < 1 ? 1 - tp : 0);

  txSigReveal(active.sig, prog(t, P.sign[0], P.sign[1]));

  setAlpha(active.signLab, 1 - prog(t, P.sign[0], P.sign[0] + 0.3));
}

/* Final frame (section 8). */
function txSyncFinal(t) {
  const L1 = FINAL.line1, N = TX.fin1Words.length;
  setAlpha(TX.fin1, t >= L1.a ? 1 : 0);
  TX.fin1Words.forEach((w, i) => {
    const s = L1.a + i * ((L1.b - L1.a - L1.wordDur) / (N - 1));
    const p = prog(t, s, s + L1.wordDur, demoEase);
    setAlpha(w, p);
    setStyle(w, 'transform', `translateY(${(6 * (1 - p)).toFixed(2)}px)`);
  });
  const p2 = prog(t, FINAL.line2, FINAL.line2 + 0.8, demoEase);

  const pw = prog(t, FINAL.lockup[0], FINAL.lockup[1], easeInOutCubic);
  setAlpha(TX.wm, pw);
  setStyle(TX.wm, 'transform', `translateX(${(12 * (1 - pw)).toFixed(2)}px)`);
  const pc = prog(t, FINAL.credit, FINAL.credit + 0.8);

/* ---------- canvas marks owned by the text part ---------- */
/* Real counterpart of a tether name (world pu). */
function tetherPoint(name, id, t) {
  switch (name) {
    case 'record.first': return { x: WORLD.record.x + 8, y: WORLD.record.baseline - 12 };
    case 'record': return { x: MEASURE.words.length ? (MEASURE.words[3].x0 + MEASURE.words[3].x1) / 2 : 330, y: WORLD.record.baseline - 12 };
    case 'frameLabel': return { x: WORLD.frame.label[0] + 6, y: WORLD.frame.label[1] - 4 };
    case 'offRight': return { x: 2800, y: agentPose(id, t).y - 40 };

/* Tethers (dashed [2, 4], ink .28 settling to .14), letter ink spreads, portrait speaker ticks. */
function drawTethers(ctx, view) {
  const t = view.t;

  ctx.setLineDash([2 * css, 4 * css]);
  const out = 1 - prog(t, HEAD.out, HEAD.out + 0.6);
  for (const id of AGENT_IDS) {
    const A = AGENTS[id];
    if (!A.tether || t < A.tagT || out <= 0) continue;
    const pose = agentPose(id, t);
    if (!pose.visible) continue;
    const a = lerp(0.28, 0.14, prog(t, A.tagT + TAG_HOLD, A.tagT + TAG_HOLD + 0.6)) * prog(t, A.tagT, A.tagT + 0.3) * pose.alpha * societyAlpha(t) * out;
    const targets = [tetherPoint(A.tether, id, t)];

    const [ax, ay] = view.worldToStage(pose.x, (pose.y + pose.head.y) / 2);
    ctx.strokeStyle = inkA(a);
    // Northstar's second, thinner-looking tether (to the frame label) is drawn at 60 percent
    targets.forEach((p, k) => {
      const [bx, by] = view.worldToStage(p.x, p.y);

      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
  clearDash(ctx);
  // faint ink spread where each falling letter lands
  if (TX.recPos && t > COPY.fall.a && t < COPY.fall.stopLands + 0.6) {
    view.setWorld(ctx);
    TX.recPos.forEach((p, i) => {
      const land = txFallTimes(i).land, q = prog(t, land, land + 0.4);
      if (q <= 0 || q >= 1 || COPY.spoken.text[i] === ' ') return;
      ctx.fillStyle = inkA(0.1 * (1 - q));

    });

  if (view.mode === 'portrait') {
    view.setWorld(ctx);
    for (const n of visibleNotes(t)) {
      const h = agentPose(n.who, t).head, a = txNoteAlpha(n, t);
      ctx.fillStyle = inkA(a);
      ctx.fillRect(h.x - 3, h.y - 18, 6, 6);
    }
  }
}

/* ---------- accessibility: mirror notes and captions into the live region during playback ---------- */
/* Returns the cue texts that start in (a, b]. */
function cuesBetween(a, b) {
  const out = [];
  for (const n of NOTES) if (n.t0 > a && n.t0 <= b) out.push({ t: n.t0, text: AGENTS[n.who].label + ': ' + n.text });
  for (const c of CAPTIONS) if (c.t0 > a && c.t0 <= b) out.push({ t: c.t0, text: c.text });
  if (COPY.spoken.type[0] > a && COPY.spoken.type[0] <= b) out.push({ t: COPY.spoken.type[0], text: 'Rasmus Krogh, pipefitter: ' + COPY.spoken.text });
  if (FINAL.line1.a > a && FINAL.line1.a <= b) out.push({ t: FINAL.line1.a, text: COPY.final1 + ' ' + COPY.final2 });
  return out.sort((x, y) => x.t - y.t).map(c => c.text);
}

    if (t < m[1]) {

/* ---------- the core rig (cheap, cached per id and t; agentPose and drawing share it) ---------- */

/* ---------- agentPose (contract) ---------- */

/* ---------- extras drawn around the agents ---------- */

/* Room 4's plan dot pops out and flies to row 3 (31.15 to 31.6), leaving a faint ink spread. */
function agDrawPlanDot(ctx, view, dim) {

  const a = dim * (1 - prog(t, D.fade - 0.3, D.fade));

}
/* Safety digs its point in: a 14 pu crease in the paper (54.6, fading after the rope slackens). */
function agDrawCrease(ctx, view, dim) {
  const t = view.t, a = prog(t, 54.6, 54.9) * (1 - prog(t, 63.0, 65.0));
