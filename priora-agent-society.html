  ctx.strokeStyle = rgba(255, 255, 255, 0.8 * a); ctx.beginPath(); ctx.moveTo(f[0] + 1, f[1] - 0.2); ctx.lineTo(f[0] + 1 + 14 * p, f[1] + 0.3); ctx.stroke();

/* The Risk Owner draws the decision card: a hairline from its arm to the inking corner (70.2 to 71.0). */
function agDrawPantograph(ctx, view, dim) {
  const t = view.t, B = CARDS.decision.box, D = WORLD.decision;

/* Northstar sends a hairline off the page to its underwriter's inset and the answer pulses back. */
function agInsetBox(view) {
  if (view.mode === 'portrait') { const sz = 240 / view.s; return [view.W - sz - 16 / view.s, SCREEN.P.headH + 16 / view.s, sz, sz]; }

/* ---------- drawAgents (contract) ---------- */
function drawAgents(ctx, view) {
  const t = view.t;
  if (t > 132.6) return;
  view.setWorld(ctx);
  const dimAll = societyAlpha(t);
  agDrawCarriers(ctx, view);
  agDrawCable(ctx, view, dimAll);
  agDrawCrease(ctx, view, dimAll);
  agDrawStampRing(ctx, view, dimAll);
  agDrawPantograph(ctx, view, dimAll);
  const rigs = AGENT_IDS.map(id => agRig(id, t, view));
  rigs.sort((a, b) => a.c.y - b.c.y);
  for (const R of rigs) {

    const dim = R.c.sp.on ? Math.max(dimAll, R.c.sp.env) : dimAll;

  }
  ctx.globalAlpha = 1;

  agDrawNorthLine(ctx, view, dimAll);
  ctx.globalAlpha = 1;
}

/* Largest extent (width or height, pu) of each agent, so each fits its sheet cell. */
const AG_SHEET_BOX = { activity: 92, site: 98, d4: 70, room4: 74, safety: 102, evidence: 108, conditions: 112, mitigation: 84, tc12: 48, riskowner: 76, broker: 94, northstar: 124, atlas: 116, boreal: 112, helvetic: 90 };

/* ---------- model sheet (#sheet): every agent at 160, 64 and 24 px, plus the pencil carriers ---------- */
function drawModelSheet(ctx, view) {
  view.setStage(ctx);
  const W = view.W, H = view.H, t = view.t;
  ctx.fillStyle = COL.paper; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COL.ink3; ctx.font = '500 11px "IBM Plex Mono", monospace'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('WRITTEN UNDER · MODEL SHEET · 160 / 64 / 24 PX', 24, 30);
  const ids = AGENT_IDS, n = ids.length;
  // draws one agent standing on (cx, base), its largest extent `size` stage px; opts: pencil, shut
  const place = (id, cx, base, size, opts = {}) => {
    const R = agRig(id, t, null);
    const k = size / AG_SHEET_BOX[id];
    const c = Object.assign({}, R.c, { x: 0, y: 0, lift: 0, lean: 0, flip: 1, sx: 1, sy: 1, sc: 1, life: Object.assign({}, R.c.life, { alpha: 1, pencil: !!opts.pencil, reveal: 1, shut: opts.shut ? 1 : 0 }) });
    Object.assign(R, { c, lod: size < 30 ? 2 : 0, shut: opts.shut ? 1 : 0, handL: null, look: { x: 0.4, y: 0.2 }, open: 1 });
    ctx.save();

    AGD.pencil = !!opts.pencil; AGD.dotted = id === 'tc12' && !!opts.pencil; AGD.inv = 1; AGB.on = false;
    if (!opts.pencil && AG_GEOM[id].shadow) { ctx.fillStyle = COL.shadow; ctx.beginPath(); ctx.ellipse(AG_GEOM[id].shadow[0], 0, 0.4 * AG_GEOM[id].shadow[1], 4, 0, 0, TAU); ctx.fill(); }
    AG_DRAW[id](ctx, R);

  };
  const cols = W > 1000 ? 8 : 5;
  // 160 px row(s)
  let y = 60;
  const cw = (W - 48) / cols;
  for (let i = 0; i < n; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = 24 + cw * (col + 0.5), base = y + 175 + row * 205;
    place(ids[i], cx, base, 160);
    ctx.fillStyle = COL.ink3; ctx.textAlign = 'center'; ctx.fillText(AGENTS[ids[i]].glyph + ' ' + ids[i].toUpperCase(), cx, base + 22);
  }
  y += Math.ceil(n / cols) * 205 + 10;
  // 64 px row
  const cw2 = (W - 48) / n;
  for (let i = 0; i < n; i++) place(ids[i], 24 + cw2 * (i + 0.5), y + 70, Math.min(64, cw2 * 0.9));
  y += 96;
  // 24 px row, then the pencil (asleep or unjoined) state at 48 px
  for (let i = 0; i < n; i++) place(ids[i], 24 + cw2 * (i + 0.5), y + 28, 24);
  for (let i = 0; i < n; i++) place(ids[i], 24 + cw2 * (i + 0.5), y + 80, 48, { pencil: true, shut: AG_LIFE[ids[i]].wakes || AG_LIFE[ids[i]].shutUntilJoin });
  y += 110;
  // the 18 pencil carriers at 64 px
  const cw3 = (W - 48) / PENCIL_CARRIERS.length;
  PENCIL_CARRIERS.forEach((pc, i) => {
    const S = AG_PC_SHAPES[pc.shape], k = Math.min(64, cw3 * 1.2) / 72, cx = 24 + cw3 * (i + 0.5);
    ctx.save(); ctx.translate(cx, y + 70); ctx.scale(k, k);
    AGD.pencil = true; AGD.inv = 1 / k * 0.8;
    ctx.beginPath(); S.d(ctx); agLine(ctx, 6);
    ctx.fillStyle = inkA(0.45); for (const ex of [-4, 4]) { ctx.beginPath(); ctx.arc(S.eye[0] + ex, S.eye[1], 2.4, 0, TAU); ctx.fill(); }
    ctx.restore();
  });
  AGD.pencil = false; AGD.inv = 1;
  ctx.textAlign = 'left';
}

/* ==== 60-reality.js ==== */
/* 60-reality.js · Reality, the first of the three layers (storyboard 2.4): small isometric line drawings
   in the demo's style that are windows onto the real world, and the only place humans exist.
     - Room 4 (3.2): a 10 x 8 m cutaway with 3 m back walls, mapped by roomToWorld().
     - Anna Møller's office: pencil until 104.0, inked by 104.6.
     - The humans as pose swaps (4.3), the fire blanket, the weld arc and its sparks.
     - Ingrid Lund's inset in screen space, clipped by the Priora mark (B21, B22).
   Static drawings are built once as projected primitive lists and painted into offscreen sprites
   (with halving mip levels, so every zoom from the tight cold open to the page view stays crisp).
   Everything that depends on t is drawn live on top. Exported: drawReality(ctx, view),
   realityAnchor(name, t). Private names use the re / RE_ prefix. */

/* ---------- line weights (pu) and the demo site colours ---------- */
const RE_LW = { edge: 0.5, detail: 0.32, grid: 0.3, human: 0.8, frame: 1 };
/* grid, faint and dash are the demo site's own CSS values (#site .grid, .faint, .dash);
   the blanket greys sit between --face-l and --paint. */
const RE_C = {
  line: COL.siteLine, detail: COL.siteDetail, grid: '#C9C5BC', faint: '#CFCBC3', dash: '#9C9994',
  paint: COL.paint, glass: COL.paper, blanketTop: '#D6D2CA', blanketFront: '#CBC7BF', blanketSide: '#C1BDB5'
};
const RE_DOT = [0.45, 1.3];   // epistemic dotted state in the miniature (2.5), scaled to miniature line weights
const RE_PENCIL = { color: inkA(0.3), dash: [1.6, 1.2], lw: 0.45 };

/* ---------- projections ---------- */
/* Isometric projection with an origin and a scale (pu per metre), identical to the demo's iso(). */
function reProj(ox, oy, u) { return (x, y, z) => { const q = iso(x, y, z); return [ox + u * q[0], oy + u * q[1]]; }; }
const RE_U = 21;
const RE_P4 = reProj(411.8, 179, RE_U);   // Room 4: the same mapping as roomToWorld()
const RE_PO = reProj(982, 166, RE_U);     // Anna's office, same scale so people match in size
const RE_JOINT = [4.0, 0.3, 1.0];         // the flanged joint on the pipe, world (479, 203)

/* ---------- primitive scenes ----------
   A scene is a list of projected primitives in painter's order:
   { pts: [[x, y], ...], closed, fill, stroke, lw, dash, d, len } or a painted label { text, m, ... }.
   d (0..1) staggers the cold-open draw-on. */
function reScene(P, u) { return { P, u, list: [], d: 0 }; }
function reAdd(S, pts, o, closed) {
  const ring = closed ? pts.concat([pts[0]]) : pts;
  S.list.push({
    pts, closed, fill: o.fill || null, stroke: o.stroke === undefined ? RE_C.line : o.stroke,
    lw: o.lw || RE_LW.edge, dash: o.dash || null, d: o.d === undefined ? S.d : o.d, len: polyLength(ring), multi: null
  });
}
function reFace(S, pts3, fill, o = {}) { reAdd(S, pts3.map(p => S.P(p[0], p[1], p[2])), Object.assign({ fill }, o), true); }
function reLine(S, pts3, o = {}) { reAdd(S, pts3.map(p => S.P(p[0], p[1], p[2])), o, false); }
/* Many short segments as one primitive (grid crosses, seams). They fade in instead of drawing on. */
function reSegs(S, segs3, o = {}) {
  S.list.push({ multi: segs3.map(s => s.map(p => S.P(p[0], p[1], p[2]))), stroke: o.stroke || RE_C.detail, lw: o.lw || RE_LW.detail, dash: o.dash || null, d: o.d === undefined ? S.d : o.d });
}
/* Axis-aligned box: the three visible faces in the demo's order (left y = y1, right x = x1, top). */
function reBox(S, x0, x1, y0, y1, z0, z1, o = {}) {
  reFace(S, [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], o.l || COL.faceL, o);
  reFace(S, [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], o.r || COL.faceR, o);
  reFace(S, [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], o.t || COL.faceTop, o);
}
/* A circle of radius r around c, in the plane normal to axis 'x', 'y' or 'z'. On the x = 0 wall
   angle 0 points up and angles run clockwise as seen on screen. */
function reCircle(c, axis, r, n = 28, a0 = 0, a1 = TAU) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n, ca = Math.cos(a) * r, sa = Math.sin(a) * r;
    if (axis === 'x') out.push([c[0], c[1] - sa, c[2] + ca]);
    else if (axis === 'y') out.push([c[0] + sa, c[1], c[2] + ca]);
    else out.push([c[0] + ca, c[1] + sa, c[2]]);
  }
  return out;
}
/* Vertical cylinder (demo cyl()): side body in face-r, top ellipse in face-top. */
function reCylZ(S, x, y, z0, h, r, o = {}) {
  const c = S.P(x, y, z0), rx = 1.2247 * r * S.u, ry = 0.7071 * r * S.u, top = c[1] - h * S.u, body = [];
  for (let i = 0; i <= 16; i++) { const a = Math.PI * i / 16; body.push([c[0] + rx * Math.cos(a), c[1] + ry * Math.sin(a)]); }
  for (let i = 16; i >= 0; i--) { const a = Math.PI * i / 16; body.push([c[0] + rx * Math.cos(a), top + ry * Math.sin(a)]); }
  reAdd(S, body, { fill: o.side || COL.faceR, lw: o.lw }, true);
  const lid = [];
  for (let i = 0; i < 28; i++) { const a = TAU * i / 28; lid.push([c[0] + rx * Math.cos(a), top + ry * Math.sin(a)]); }
  reAdd(S, lid, { fill: o.top || COL.faceTop, lw: o.lw }, true);
}
/* Horizontal cylinder from a to b along 'x' or 'y': far end cap, body, near end cap (technical drawing order). */
function reCylH(S, a, b, r, axis, o = {}) {
  const ca = reCircle(a, axis, r).map(p => S.P(p[0], p[1], p[2])), cb = reCircle(b, axis, r).map(p => S.P(p[0], p[1], p[2]));
  const A = S.P(a[0], a[1], a[2]), B = S.P(b[0], b[1], b[2]);
  const L = Math.hypot(B[0] - A[0], B[1] - A[1]), nx = -(B[1] - A[1]) / L, ny = (B[0] - A[0]) / L;
  const sup = (pts, s) => pts.reduce((m, p) => ((p[0] - pts[0][0]) * nx + (p[1] - pts[0][1]) * ny) * s > ((m[0] - pts[0][0]) * nx + (m[1] - pts[0][1]) * ny) * s ? p : m, pts[0]);
  const ap = sup(ca, 1), am = sup(ca, -1), bp = sup(cb, 1), bm = sup(cb, -1);
  const body = o.body || COL.faceTop, cap = o.cap || (axis === 'x' ? COL.faceR : COL.faceL);
  if (!o.noFar) reAdd(S, ca.slice(0, -1), { fill: cap, lw: o.lw }, true);
  reAdd(S, [ap, bp, bm, am], { fill: body, stroke: null }, true);
  reAdd(S, [ap, bp], { lw: o.lw }, false);
  reAdd(S, [am, bm], { lw: o.lw }, false);
  if (o.shade) reAdd(S, [reLerp2(ap, am, 0.68), reLerp2(bp, bm, 0.68)], { stroke: RE_C.detail, lw: RE_LW.detail }, false);
  if (!o.noNear) reAdd(S, cb.slice(0, -1), { fill: cap, lw: o.lw }, true);
}
function reLerp2(a, b, p) { return [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p]; }
/* Painted label (demo .paint): Mono 500 in --paint, laid into a plane. plane: 'floor' (reads along +x),
   'wallX' (the x = 0 wall, reads along -y) or 'wallY' (the y = 0 wall, reads along +x). size in metres. */
function rePaint(S, text, at, plane, size, o = {}) {
  const O = S.P(at[0], at[1], at[2]);
  const vec = (dx, dy, dz) => { const q = S.P(at[0] + dx, at[1] + dy, at[2] + dz); return [q[0] - O[0], q[1] - O[1]]; };
  const U = plane === 'wallX' ? vec(0, -1, 0) : vec(1, 0, 0);
  const V = plane === 'floor' ? vec(0, 1, 0) : vec(0, 0, -1);
  const k = size / 10;  // drawn at a 10 px font
  S.list.push({ text, m: [U[0] * k, U[1] * k, V[0] * k, V[1] * k, O[0], O[1]], fill: o.fill || RE_C.paint, align: o.align || 'left', spacing: o.spacing === undefined ? 1.4 : o.spacing, d: o.d === undefined ? S.d : o.d });
}

/* Draw a primitive list. rv(d) -> { line, face } in 0..1 drives the draw-on (null: complete).
   sty overrides the look: { stroke, lw, dash, noFill, alpha } (pencil and epistemic dotted states). */
const RE_DONE = { line: 1, face: 1 };
function reDrawList(ctx, list, rv, sty) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const a0 = sty && sty.alpha !== undefined ? sty.alpha : 1;
  for (const p of list) {
    const r = rv ? rv(p.d) : RE_DONE;
    if (r.line <= 0 && r.face <= 0) continue;
    if (p.text) {
      if (sty && sty.noFill) continue;
      ctx.save();
      ctx.globalAlpha = a0 * r.face;
      ctx.transform(p.m[0], p.m[1], p.m[2], p.m[3], p.m[4], p.m[5]);
      ctx.font = '500 10px "IBM Plex Mono", monospace';
      if ('letterSpacing' in ctx) ctx.letterSpacing = p.spacing + 'px';
      ctx.textAlign = p.align; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = p.fill; ctx.fillText(p.text, 0, 0);
      ctx.restore();

    }
    ctx.beginPath();

    else {
      ctx.moveTo(p.pts[0][0], p.pts[0][1]);
      for (let i = 1; i < p.pts.length; i++) ctx.lineTo(p.pts[i][0], p.pts[i][1]);
      if (p.closed) ctx.closePath();
    }

/* ---------- the fire blanket (B11): folded on the arm, lifted, mid-drape, settled with a 3 pu bounce ---------- */
function reBlanket(ctx, t, reduced) {
  if (t < 36.6) return;
  const P = RE_P4, poly = (pts, fill) => {
    ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = RE_C.line; ctx.lineWidth = RE_LW.edge; ctx.stroke();
  };

  const hem = lerp(1.25, 0.38, fall);

/* ---------- the weld arc and sparks (B27, B28) ----------
   Closed form: each of 14 spark slots relaunches every life_i seconds from a hashed birth phase;
   p = p0 + v tau + g tau^2 / 2. No new sparks after the arc stops at 116.2. */
const RE_ARC = { a: 114.0, b: 116.2, slots: 14, g: 260 };
function reSparks(ctx, t, view) {
  if (t < RE_ARC.a - 0.001 || t > RE_ARC.b + 0.7) return;
  const j = RE_P4(RE_JOINT[0], RE_JOINT[1] + 0.12, RE_JOINT[2] + 0.02);
  const on = t < RE_ARC.b;
  ctx.lineCap = 'round';
  if (view.reduced) {
    if (!on) return;
    // reduced motion: a static six-stroke ink star around the core
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 0.7;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * TAU / 6 + 0.26, r0 = 4.2, r1 = i % 2 ? 8 : 10.5; ctx.moveTo(j[0] + Math.cos(a) * r0, j[1] + Math.sin(a) * r0); ctx.lineTo(j[0] + Math.cos(a) * r1, j[1] + Math.sin(a) * r1); }
    ctx.stroke();
  } else {
    for (let i = 0; i < RE_ARC.slots; i++) {
      const life = hashRange(i, 71, 0.35, 0.6), birth = RE_ARC.a + hash(i, 72) * life;
      if (t < birth) continue;
      const n = Math.floor((t - birth) / life), start = birth + n * life;
      if (start >= RE_ARC.b) continue;
      const tau = t - start, seed = i * 131 + n;
      const ang = -Math.PI / 2 + hashRange(seed, 73, -1.25, 1.25), sp = hashRange(seed, 74, 45, 95);
      const vx = Math.cos(ang) * sp + 14, vy = Math.sin(ang) * sp;
      const x = j[0] + vx * tau, y = j[1] + vy * tau + RE_ARC.g * tau * tau / 2;
      const cvx = vx, cvy = vy + RE_ARC.g * tau, cv = Math.hypot(cvx, cvy) || 1;
      const len = clamp(cv * 0.045, 3, 6) * (1 - 0.5 * tau / life);
      ctx.strokeStyle = inkA(0.9 - 0.5 * tau / life); ctx.lineWidth = 0.55;
      ctx.beginPath(); ctx.moveTo(x - cvx / cv * len, y - cvy / cv * len); ctx.lineTo(x, y); ctx.stroke();
    }
  }
  if (!on) return;
  // the arc: a paper core disc r 3 with an ink ring, flickering on a hashed 24 Hz step
  const f = view.reduced ? 0.5 : hash(Math.floor(t * 24), 75);
  ctx.fillStyle = COL.page; ctx.beginPath(); ctx.arc(j[0], j[1], 3, 0, TAU); ctx.fill();
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(j[0], j[1], 3 + f * 0.5, 0, TAU); ctx.stroke();
  ctx.strokeStyle = inkA(0.22); ctx.lineWidth = 0.5; ctx.beginPath(); ctx.arc(j[0], j[1], 5.6 + f * 1.2, 0, TAU); ctx.stroke();
}

/* ---------- wall clock: hands follow the film clock, rolling 15:35 to 17:15 over 114.6 to 119.6 ---------- */
function reClockMinutes(t) {
  const R = CLOCK.roll;
  if (t >= R.a) return lerp(R.from, R.to, prog(t, R.a, R.b));
  const m = clockAt(t);
  return m === null ? CLOCK.keys[0][1] : m;

  const m = reClockMinutes(t), c = [0.012, 1.5, 2.6];
  const hand = (frac, len, w) => {
    const a = frac * TAU, p0 = RE_P4(c[0], c[1], c[2]), p1 = RE_P4(c[0], c[1] - Math.sin(a) * len, c[2] + Math.cos(a) * len);

/* ---------- the passer-by in the yellow vest behind the door window, 1.0 to 3.2 ---------- */
function rePasserBy(ctx, t, view) {

/* ---------- detector D4-07's LED: armed (pulse every 2 s), isolated during the weld, restored at 116.2 ---------- */

/* ---------- welding cable from the welding set to the torch ---------- */

  reFace(S, [[0, 0, 0], [X, 0, 0], [X, Y, 0], [0, Y, 0]], COL.faceTop);
  reFace(S, [[0, 0, 0], [0, Y, 0], [0, Y, H], [0, 0, H]], COL.faceR);
  reFace(S, [[0, 0, 0], [X, 0, 0], [X, 0, H], [0, 0, H]], COL.faceL);

/* Iso drawing kit. Points are metres [x, y, z]; iso() projects them; lw is a hairline in iso units.
   B (optional) collects the projected bounds for fitting. */
function fiKit(ctx, lw, B) {
  const pt = (x, y, z) => {
    const q = iso(x, y, z || 0);
    if (B) { B.x0 = Math.min(B.x0, q[0]); B.x1 = Math.max(B.x1, q[0]); B.y0 = Math.min(B.y0, q[1]); B.y1 = Math.max(B.y1, q[1]); }
    return q;
  };
  const path = (pts, close) => {
    ctx.beginPath();
    pts.forEach((p, i) => { const q = pt(p[0], p[1], p[2]); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
    if (close) ctx.closePath();
  };
  const stroke = strong => { ctx.strokeStyle = strong ? COL.siteLine : COL.siteDetail; ctx.lineWidth = lw * (strong ? 1 : 0.8); ctx.stroke(); };
  const K = {
    marks: {},
    pt,
    face(pts, fill) { path(pts, true); ctx.fillStyle = fill; ctx.fill(); ctx.lineJoin = 'round'; stroke(true); },
    line(pts, strong) { path(pts); ctx.lineCap = 'round'; stroke(strong); },
    segs(list, strong) {
      ctx.beginPath();
      for (const [a, b] of list) { const p = pt(a[0], a[1], a[2]), q = pt(b[0], b[1], b[2]); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); }
      ctx.lineCap = 'round'; stroke(strong);
    },
    /* solid box: the y1 face, the x1 face and the top (the faces the demo shows) */
    box(x0, y0, x1, y1, z0, z1) {
      K.face([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], COL.faceL);
      K.face([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], COL.faceR);
      K.face([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], COL.faceTop);
    },
    /* cutaway room: back walls along y = 0 and x = 0, a floor slab with a thin front edge */
    room(w, d, h) {
      K.face([[0, 0, 0], [w, 0, 0], [w, 0, h], [0, 0, h]], COL.faceR);
      K.face([[0, 0, 0], [0, d, 0], [0, d, h], [0, 0, h]], COL.faceL);
      K.slab(0, 0, w, d);
    },
    slab(x0, y0, x1, y1) {
      const s = 0.22;
      K.face([[x0, y1, -s], [x1, y1, -s], [x1, y1, 0], [x0, y1, 0]], COL.faceL);
      K.face([[x1, y0, -s], [x1, y1, -s], [x1, y1, 0], [x1, y0, 0]], COL.faceR);
      K.face([[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0]], COL.faceTop);
    },
    /* upright cylinder */
    cyl(x, y, r, z0, z1) {
      const c0 = pt(x, y, z0), c1 = pt(x, y, z1), rx = r * 1.2247, ry = r * 0.7071;
      pt(x + r, y - r, z1); pt(x - r, y + r, z0);
      ctx.beginPath();
      ctx.moveTo(c0[0] - rx, c0[1]); ctx.lineTo(c1[0] - rx, c1[1]);
      ctx.ellipse(c1[0], c1[1], rx, ry, 0, Math.PI, 0, true);
      ctx.lineTo(c0[0] + rx, c0[1]);
      ctx.ellipse(c0[0], c0[1], rx, ry, 0, 0, Math.PI, false);
      ctx.closePath(); ctx.fillStyle = COL.faceR; ctx.fill(); stroke(true);
      ctx.beginPath(); ctx.ellipse(c1[0], c1[1], rx, ry, 0, 0, TAU); ctx.fillStyle = COL.faceTop; ctx.fill(); stroke(true);
    },
    /* cylinder lying along x (a membrane roll): far end, the body between the silhouette tangents, near end */
    roll(x0, x1, y, z, r) {
      const end = x => { const pts = []; for (let i = 0; i < 18; i++) { const a = i / 18 * TAU; pts.push([x, y + r * Math.cos(a), z + r * Math.sin(a)]); } return pts; };
      const at = (x, a) => [x, y + r * Math.cos(a), z + r * Math.sin(a)];
      K.face(end(x1), COL.faceR);
      K.face([at(x0, -Math.PI / 4), at(x1, -Math.PI / 4), at(x1, 3 * Math.PI / 4), at(x0, 3 * Math.PI / 4)], COL.faceL);
      K.face(end(x0), COL.faceTop);
    },
    /* a person in the demo's grey line art; reach: hand out along x (m); kneel lowers the hips */
    person(x, y, z = 0, o = {}) {
      const k = o.kneel ? 0.45 : 0, hip = z + 0.88 - k, sh = z + 1.42 - k, hd = z + 1.64 - k;
      const reach = o.reach || 0.25;
      K.segs([
        [[x, y, hip], [x, y, sh]],
        [[x, y, hip], [x - 0.1, y + 0.12, z + (o.kneel ? 0.25 : 0)]], [[x, y, hip], [x + 0.12, y - 0.1, z]],
        [[x, y, sh - 0.05], [x + reach, y - 0.05, sh - 0.42]], [[x, y, sh - 0.05], [x - 0.12, y + 0.18, hip + 0.02]]
      ], true);
      const h = pt(x, y, hd);
      ctx.beginPath(); ctx.arc(h[0], h[1], 0.2, 0, TAU); ctx.fillStyle = COL.faceTop; ctx.fill(); stroke(true);
      if (o.helmet) { ctx.beginPath(); ctx.arc(h[0], h[1] - 0.04, 0.23, Math.PI, 0); ctx.fillStyle = COL.faceR; ctx.fill(); stroke(true); }
      K.mark('vest', x, y, sh - 0.22);
    },
    /* a small wall or ceiling device with an LED */
    device(x, y, z, w = 0.4) {
      K.box(x - w / 2, y, x + w / 2, y + 0.18, z - w * 0.6, z);
      K.mark('led', x + w * 0.25, y + 0.18, z - w * 0.3);
    },
    mark(name, x, y, z) { K.marks[name] = pt(x, y, z); }
  };
  return K;
}

/* Draw a page sprite centred at stage (sx, sy), stage size w x h, rotated rot. D: device px per stage px. */

  let li = list.length - 1;
  while (li > 0 && list[li].width < dw) li--;
  const sp = list[li], kx = dw / sp.width, ky = h * D / sp.height;
  const c = Math.cos(rot), s = Math.sin(rot);

    ctx.fillStyle = inkA(0.035); ctx.fillRect(-hw - 1.2 / kx, -hh + d, sp.width + 2.4 / kx, sp.height + d);
    ctx.fillStyle = inkA(0.05); ctx.fillRect(-hw, -hh + d * 0.6, sp.width, sp.height);

  for (let k = 0; k < nv; k++) {

    specks.push(X(k, G.speck[2 * c], G.speck[2 * c + 1]), Y(k, G.speck[2 * c], G.speck[2 * c + 1]), v0 * beat(c));

/* Vest specks from a flat list [x, y, size, ...] (stage px): an ink rim, then the vest yellow. */

  ctx.fillStyle = inkA(FI.speck.rimA); ctx.beginPath();
  for (let q = 0; q < specks.length; q += 3) { const h = specks[q + 2] / 2 + rim; ctx.rect(specks[q] - h, specks[q + 1] - h, 2 * h, 2 * h); }
  ctx.fill();
  ctx.fillStyle = COL.vest; ctx.beginPath();
  for (let q = 0; q < specks.length; q += 3) { const h = specks[q + 2] / 2; ctx.rect(specks[q] - h, specks[q + 1] - h, 2 * h, 2 * h); }

/* Distant deviations: the outside glyph in signal red, turning to ink within 0.6 s, then fading. */

    if (t < f.t || t > f.t + F.toInk + F.hold + F.fade) continue;
    const [ox, oy] = fiCellOrigin(G, f.c, t);
    const [sx, sy] = view.worldToStage(ox + 800, oy + 450);
    const p = [sx + z * (G.cos[f.c] * -370 - G.sin[f.c] * -200), sy + z * (G.sin[f.c] * -370 + G.cos[f.c] * -200)]; // the miniature, (430, 250)
    const pop = view.reduced ? 1 : lerp(1.5, 1, easeOutCubic(prog(t, f.t, f.t + 0.18)));
    const a = prog(t, f.t, f.t + 0.06) * (1 - prog(t, f.t + F.toInk + F.hold, f.t + F.toInk + F.hold + F.fade));

  const size = 8 / view.s, speed = view.reduced ? 0.25 : 1;

    const tau = (t - g.start) * speed;

/* ---------- the tracked full stop ---------- */
/* The final mark box [x, y, size] in stage px at t: mark0, easing into the lockup with the wordmark. */
function fiMarkBox(t, mode = LAYOUT.mode) {
  const F = FINAL[mode === 'portrait' ? 'P' : 'L'];
  const p = easeInOutCubic(prog(t, FINAL.lockup[0], FINAL.lockup[1]));
  return [lerp(F.mark0[0], F.mark1[0], p), lerp(F.mark0[1], F.mark1[1], p), F.mark0[2]];
}
/* fullStopPoint(t) -> { x, y, space: 'stage' }: the record line's full stop under the camera until
   131.6, then gliding to the mark's dot, then riding the mark into the lockup. */
function fullStopPoint(t) {
  const v = makeView(Math.min(t, FINAL.dotGlide[0]));
  const [sx, sy] = v.worldToStage(MEASURE.fullStop.x, MEASURE.fullStop.y);
  const b = fiMarkBox(t), k = b[2] / 24;
  const dx = b[0] + MARK_DOT.x * k, dy = b[1] + MARK_DOT.y * k;
  const p = (v.reduced ? easeInOutSine : easeInOutCubic)(prog(t, FINAL.dotGlide[0], FINAL.dotGlide[1]));
  return { x: lerp(sx, dx, p), y: lerp(sy, dy, p), space: 'stage' };
}

/* ---------- Chapter 11: convergence onto the mark ---------- */
/* The mark outline sampled evenly by arc length (24 box units), from the path in MARK_D written as
   four cubic segments (the S commands expanded). */
const FI_OUTLINE = (() => {
  const segs = [
    [[12, 3.2], [19.2, 3.2], [20.8, 4.8], [20.8, 12]], [[20.8, 12], [20.8, 19.2], [19.2, 20.8], [12, 20.8]],
    [[12, 20.8], [4.8, 20.8], [3.2, 19.2], [3.2, 12]], [[3.2, 12], [3.2, 4.8], [4.8, 3.2], [12, 3.2]]
  ];
  const dense = [];
  for (const [a, b, c, d] of segs) for (let i = 0; i < 200; i++) {
    const u = i / 200, v = 1 - u;
    dense.push([v * v * v * a[0] + 3 * v * v * u * b[0] + 3 * v * u * u * c[0] + u * u * u * d[0], v * v * v * a[1] + 3 * v * v * u * b[1] + 3 * v * u * u * c[1] + u * u * u * d[1]]);
  }
  const L = [0];
  for (let i = 1; i <= dense.length; i++) L.push(L[i - 1] + dist(...dense[i - 1], ...dense[i % dense.length]));
  const N = 720, out = [];
  let k = 0;
  for (let q = 0; q < N; q++) {
    const s = q / N * L[L.length - 1];
    while (L[k + 1] < s) k++;
    const p = (s - L[k]) / (L[k + 1] - L[k]), A = dense[k], B = dense[(k + 1) % dense.length];
    out.push([lerp(A[0], B[0], p), lerp(A[1], B[1], p)]);
  }
  // nearest outline sample for each whole degree around the box centre
  const byAngle = new Int16Array(360);
  for (let d = 0; d < 360; d++) {
    let best = 0, bd = Infinity;
    out.forEach((p, i) => { const a = (Math.atan2(p[1] - 12, p[0] - 12) / DEG + 360) % 360; const e = Math.min(Math.abs(a - d), 360 - Math.abs(a - d)); if (e < bd) { bd = e; best = i; } });
    byAngle[d] = best;
  }
  return { pts: out, byAngle };
})();

/* Converging tiles per mode: every page visible at 130.6, its start (stage px) and its target on the
   mark. 70 percent go to the outline at their own angle around the mark (so paths never cross), 30
   percent into the dot. Built on first use. */
const FI_CONV = {};
function fiConvTiles(mode) {
  if (FI_CONV[mode]) return FI_CONV[mode];
  const G = fiGrid(mode), W = mode === 'portrait' ? 900 : 1600, H = mode === 'portrait' ? 1200 : 900;
  const cam = cameraAt(FI.field[1], mode, false), z = cam.z;
  const toStage = (x, y) => [(x - cam.cx) * z + W / 2, (y - cam.cy) * z + H / 2];
  const F = FINAL[mode === 'portrait' ? 'P' : 'L'], k24 = F.mark0[2] / 24;
  const mcx = F.mark0[0] + 12 * k24, mcy = F.mark0[1] + 12 * k24;
  const dcx = F.mark0[0] + MARK_DOT.x * k24, dcy = F.mark0[1] + MARK_DOT.y * k24, dr = MARK_DOT.r * k24;
  const out = [];
  for (let c = 0; c < G.n; c++) {
    const i = G.i0 + (c % G.cols), j = G.j0 + Math.floor(c / G.cols);
    const [sx, sy] = toStage(i * FI.pitch[0] + 800, j * FI.pitch[1] + 450);
    if (sx < -900 * z || sx > W + 900 * z || sy < -500 * z || sy > H + 500 * z) continue;
    let tx, ty;
    if (hash(c, 720) < FI.conv.dotShare) {
      const a = hash(c, 721) * TAU, r = dr * 0.85 * Math.sqrt(hash(c, 722));
      tx = dcx + r * Math.cos(a); ty = dcy + r * Math.sin(a);
    } else {
      const deg = Math.round((Math.atan2(sy - mcy, sx - mcx) / DEG + 360) % 360) % 360;
      const idx = (FI_OUTLINE.byAngle[deg] + Math.round((hash(c, 723) - 0.5) * 6) + 720) % 720;
      const p = FI_OUTLINE.pts[idx];
      tx = F.mark0[0] + p[0] * k24; ty = F.mark0[1] + p[1] * k24;
    }
    out.push({ c, kind: G.kind[c], sx, sy, w: 1600 * z, h: 900 * z, rot: Math.atan2(G.sin[c], G.cos[c]), tx, ty,
      delay: FI.conv.delay * hash(c, 724), speck: [(G.speck[2 * c] - 800) * z, (G.speck[2 * c + 1] - 450) * z] });
  }
  FI_CONV[mode] = out;
  return out;
}

function drawConvergence(ctx, view) {
  const t = view.t;
  if (t < FI.field[1]) return;
  view.setStage(ctx);
  const D = view.s * view.dpr, C = FI.conv, s = view.s;
  // the desk, then the paper crossfade (131.0 to 132.4)
  ctx.fillStyle = COL.desk; ctx.fillRect(0, 0, view.W, view.H);
  const paper = prog(t, FINAL.paper[0], FINAL.paper[1], easeInOutSine);
  if (paper > 0) { ctx.globalAlpha = paper; ctx.fillStyle = COL.paper; ctx.fillRect(0, 0, view.W, view.H); ctx.globalAlpha = 1; }
  const tiles = fiConvTiles(view.mode);
  const fade = view.reduced ? 1 - prog(t, FI.reducedFieldOut[0], FI.reducedFieldOut[1]) : 1 - prog(t, FINAL.tilesFade[0], FINAL.tilesFade[1]);
  if (fade > 0) {
    // pages: shrink toward their target while their sprite gives way to an ink square
    const sq = C.square, inks = [], specks = [];
    for (const T of tiles) {
      const p = view.reduced ? 0 : easeInOutCubic(prog(t, FI.field[1] + T.delay, FI.field[1] + T.delay + C.travel));
      const x = lerp(T.sx, T.tx, p), y = lerp(T.sy, T.ty, p);
      const w = lerp(T.w, sq, p), h = lerp(T.h, sq, p);
      const sa = (1 - prog(p, C.spriteOut[0], C.spriteOut[1])) * fade;
      if (sa > 0.01) {
        ctx.globalAlpha = sa;
        fiBlit(ctx, T.kind, x, y, w, h, T.rot * (1 - p), D, p < 0.1);
        // the page's vest speck rides along until the page dissolves (drawn after all pages, so the
        // sprite draws stay consecutive)
        if (sa > 0.5) specks.push(x + T.speck[0] * (w / T.w), y + T.speck[1] * (h / T.h), Math.max(FI.speck.min / s, FI.speck.pu * view.cam.z) * (1 - p));
      }
      const ia = prog(p, C.inkIn[0], C.inkIn[1]) * fade;
      if (ia > 0.01) inks.push(x, y, ia * C.inkA);
    }
    ctx.globalAlpha = fade;
    ctx.setTransform(D, 0, 0, D, 0, 0);
    fiSpecks(ctx, specks, s);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.ink;
    for (let q = 0; q < inks.length; q += 3) { ctx.globalAlpha = inks[q + 2]; ctx.fillRect(inks[q] - sq / 2, inks[q + 1] - sq / 2, sq, sq); }
    ctx.globalAlpha = 1;
  }
  // the outline: a hairline dash reveal (131.4 to 132.6); under reduced motion a crossfade
  const [bx, by, size] = fiMarkBox(t, view.mode);
  if (view.reduced) {
    const a = prog(t, FINAL.outline[0], FINAL.outline[1], easeInOutSine);
    if (a > 0) { ctx.globalAlpha = a; drawMark(ctx, bx, by, size, { reveal: 1, dot: 0 }); ctx.globalAlpha = 1; }
  } else {
    const reveal = prog(t, FINAL.outline[0], FINAL.outline[1], demoEase);
    if (reveal > 0) drawMark(ctx, bx, by, size, { reveal, dot: 0 });
  }
  // the full stop glides home, grows into the dot, lands with three rings and pulses once
  const f = fullStopPoint(t), L = FI.land, k = size / 24, R = MARK_DOT.r * k;
  if (t < FINAL.land) {
    const r = lerp(FI.stop.r / s, R, easeInOutCubic(prog(t, FINAL.land - L.grow, FINAL.land)));
    ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
    const ra = FI.stop.ringA * (1 - prog(t, FINAL.dotGlide[0], FINAL.dotGlide[0] + 0.5));
    if (ra > 0) { ctx.strokeStyle = inkA(ra); ctx.lineWidth = 1 / s; ctx.beginPath(); ctx.arc(f.x, f.y, FI.stop.ring / s, 0, TAU); ctx.stroke(); }
  } else {
    const pulse = view.reduced ? 0 : Math.sin(Math.PI * prog(t, FINAL.land, FINAL.land + L.pulse));
    drawMark(ctx, bx, by, size, { reveal: 0, dot: lerp(1, L.rMax / 11.5, pulse) });
    fiLandingRings(ctx, view, f);
  }
}
/* The same three rings as the 8.0 strike, at the same on-screen speed and size. */
function fiLandingRings(ctx, view, f) {
  const t = view.t, z8 = cameraAt(WAKE.rings[0], view.mode, false).z;
  const speed = WAKE.speed * z8, maxR = WAKE.maxR * z8;
  ctx.lineWidth = 1 / view.s;
  const rings = view.reduced ? WAKE.rings.slice(0, 1) : WAKE.rings;
  for (const r0 of rings) {
    const r = (t - (FINAL.land + r0 - WAKE.rings[0])) * speed;
    if (r <= 0 || r >= maxR) continue;
    ctx.strokeStyle = inkA(WAKE.alpha * (1 - r / maxR));
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.stroke();
  }
}

/* ==== 80-sound.js ==== */
/* 80-sound.js · procedural WebAudio score (storyboard section 9). No samples, no network.
   Exported name: Sound = { enabled, setEnabled(on), tick(t, playing), seek(t) }.

   Off by default. The AudioContext is created only inside setEnabled(true), which the controls call
   from a click or the M key. Two kinds of sound:
   - Events (SND_TABLE, built once per reduced-motion flag): short one-shots keyed by film time. While
     playing, each tick schedules the events in [t, t + 0.2] at ctx.currentTime + (cue.t - t).
   - Beds (SND_BEDS): sustained layers (room tone, drones, the cello, the tug of war, the chords). Their
     nodes run continuously and each tick sets their gain (and nothing else) from a pure function of t,
     so seeking into the middle of a chord or a drone picks it up where the picture is.
   On seek or pause every event voice stops, the queue is cleared and the beds fall silent; playback
   resumes scheduling from the new t. Every noise source is a seeded buffer and every schedule comes
   from hash(), so the score is the same on every run. Private names use the snd / SND_ prefix. */

}
function sndResume(on) {
  const ctx = sndState.ctx, p = on ? ctx.resume && ctx.resume() : ctx.suspend && ctx.suspend();
  if (p && p.catch) p.catch(() => {});
}

const Sound = {
  enabled: false,
  setEnabled(on) {
    sndGuard(() => {
      if (on && !sndState.ctx && !sndOpen()) { Sound.enabled = false; return; } // no WebAudio: stay off
      Sound.enabled = !!on;
      if (!sndState.ctx) return;
      sndSilence();
      sndResume(Sound.enabled);
    });
  },
  tick(t, playing) {
    if (!Sound.enabled || !sndState.ctx) return;
    sndGuard(() => { if (playing) sndSchedule(t); else sndSilence(); });
  },
  seek(t) {
    if (!sndState.ctx) return;
    sndGuard(() => { sndSilence(); sndState.lastT = t; });
  }
};
// A hidden tab stops requestAnimationFrame, so silence the beds rather than hold a frozen chord.
document.addEventListener('visibilitychange', () => { if (document.hidden && sndState.ctx) sndGuard(sndSilence); });

/* ==== 90-main.js ==== */
/* 90-main.js · boot, layout, render loop, controls, keyboard and the window.film API.
   requestAnimationFrame is the only clock: t advances by the frame delta while playing and
   render(t) is a pure function of t, the layout and the reduced-motion flag. */

const MAIN = { t: 4.6, playing: false, last: null, ready: false, started: false, sheet: false, wasPlaying: false, scrubbing: false, chapter: -1, raf: 0 };
const $id = id => document.getElementById(id);
const UI = {
  film: $id('film'), wrap: $id('stagewrap'), stage: $id('stage'), cv: $id('cv'), veil: $id('veil'),
  start: $id('start'), startBtn: $id('b-start'),
  play: $id('b-play'), prev: $id('b-prev'), next: $id('b-next'), replay: $id('b-replay'), sound: $id('b-sound'), trans: $id('b-trans'),
  time: $id('c-time'), chap: $id('c-chap'), scrub: $id('scrub'), fill: $id('scrub-fill'), knob: $id('scrub-knob'), ticks: $id('ticks'),
  transcript: $id('transcript'), trList: $id('tr-list'), trClose: $id('b-trclose'), cc: $id('cc')
};
const CTX = UI.cv.getContext('2d');
const FONT_SPECS = ['300 16px "IBM Plex Sans"', '400 16px "IBM Plex Sans"', '500 16px "IBM Plex Sans"', '400 16px "IBM Plex Mono"', '500 16px "IBM Plex Mono"'];
const PAINT_ORDER = [drawDesk, drawNeighbours, drawPage, drawReality, drawPageOverlays, drawTethers, drawAgents, drawField, drawConvergence];

/* ---------- layout ---------- */
function computeLayout() {
  const iw = window.innerWidth, ih = window.innerHeight;
  const portrait = iw / ih < 0.8;
  const ctrlH = iw < 480 ? 76 : 56;
  const W = portrait ? 900 : 1600, H = portrait ? 1200 : 900;
  let s, left, top;
  if (portrait) {
    s = Math.min(iw / W, (ih - ctrlH - 150) / H);
    left = (iw - W * s) / 2; top = 0;
    UI.wrap.style.flex = `0 0 ${Math.floor(H * s)}px`;
  } else {
    const availH = ih - ctrlH;
    s = Math.min(iw / W, availH / H);
    left = (iw - W * s) / 2; top = (availH - H * s) / 2;
    UI.wrap.style.flex = '1 1 auto';
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const changed = LAYOUT.mode !== (portrait ? 'portrait' : 'landscape') || LAYOUT.s !== s || LAYOUT.dpr !== dpr;
  Object.assign(LAYOUT, { mode: portrait ? 'portrait' : 'landscape', W, H, s, dpr });
  UI.film.classList.toggle('portrait', portrait);
  Object.assign(UI.stage.style, { width: W + 'px', height: H + 'px', left: px(left), top: px(top), transform: `scale(${s})` });
  UI.stage.style.setProperty('--s', String(s));
  UI.cv.width = Math.round(W * s * dpr);
  UI.cv.height = Math.round(H * s * dpr);
  return changed;
}
function relayout() {
  computeLayout();
  if (MAIN.ready) PRERENDER.forEach(p => { if (p.onLayout) p.fn(); });
  render(MAIN.t);
}

/* ---------- render ---------- */
function render(t) {
  if (!MAIN.ready) return;
  const view = makeView(t);
  CTX.setTransform(1, 0, 0, 1, 0, 0);
  CTX.clearRect(0, 0, UI.cv.width, UI.cv.height);
  if (MAIN.sheet) {
    const sheet = typeof drawModelSheet === 'function' ? drawModelSheet : window.drawModelSheet;
    if (typeof sheet === 'function') { sheet(CTX, view); return; }
  }
  for (const draw of PAINT_ORDER) { CTX.save(); draw(CTX, view); CTX.restore(); }
  syncText(view);
  setStyle(UI.veil, 'opacity', String(Math.round((1 - view.fade) * 1000) / 1000));
  updateControls(t);
}

/* ---------- playback ---------- */
function frame(now) {
  if (!MAIN.playing) return;
  const dt = MAIN.last === null ? 0 : Math.min(0.1, (now - MAIN.last) / 1000);
  MAIN.last = now;
  const prev = MAIN.t;
  MAIN.t = Math.min(DURATION, MAIN.t + dt);
  announce(cuesBetween(prev, MAIN.t).join(' '));
  render(MAIN.t);
  Sound.tick(MAIN.t, true);
  if (MAIN.t >= DURATION) { pause(); return; }
  MAIN.raf = requestAnimationFrame(frame);
}
function play() {
  if (!MAIN.ready) return;
  hideStart();
  if (MAIN.t >= DURATION) seek(0);
  if (MAIN.playing) return;
  MAIN.playing = true; MAIN.last = null;
  Sound.seek(MAIN.t);
  MAIN.raf = requestAnimationFrame(frame);
  updateControls(MAIN.t);
}
function pause() {
  MAIN.playing = false;
  cancelAnimationFrame(MAIN.raf);
  Sound.tick(MAIN.t, false);
  updateControls(MAIN.t);
}
function toggle() { if (MAIN.playing) pause(); else play(); }
function seek(t, quiet) {
  MAIN.t = clamp(Number(t) || 0, 0, DURATION);
  MAIN.last = null;
  hideStart();
  Sound.seek(MAIN.t);
  render(MAIN.t);
  const ci = chapterIndexAt(MAIN.t);
  if (!quiet && ci !== MAIN.chapter) announce(`Chapter ${CHAPTERS[ci].n}, ${CHAPTERS[ci].title}`);
}
function hideStart() { if (!UI.start.hidden) { UI.start.hidden = true; MAIN.started = true; } }
function announce(text) { if (text) UI.cc.textContent = text; }
function chapterStep(dir) {
  const ci = chapterIndexAt(MAIN.t);
  // "previous" goes to the start of the current chapter unless we are within 1.5 s of it
  const target = dir < 0 ? (MAIN.t - CHAPTERS[ci].t > 1.5 ? ci : Math.max(0, ci - 1)) : Math.min(CHAPTERS.length - 1, ci + 1);
  seek(CHAPTERS[target].t);
}

/* ---------- controls ---------- */
function fmtTime(t) { return t.toFixed(1).padStart(5, '0'); }
function updateControls(t) {
  const ci = chapterIndexAt(t), c = CHAPTERS[ci];
  setText(UI.time, `${fmtTime(t)} / ${DURATION.toFixed(1)}`);
  const pct = (100 * t / DURATION).toFixed(3) + '%';
  setStyle(UI.fill, 'width', pct);
  setStyle(UI.knob, 'left', pct);
  setAttr(UI.scrub, 'aria-valuenow', t.toFixed(1));
  setAttr(UI.scrub, 'aria-valuetext', `${Math.floor(t)} seconds, chapter ${c.n} of ${CHAPTERS.length}, ${c.title}`);
  setText(UI.chap, c.title);
  const ended = t >= DURATION && !MAIN.playing;
  const icon = MAIN.playing ? 'pause' : ended ? 'reset' : 'play';
  if (UI.play._icon !== icon) {
    UI.play._icon = icon;
    UI.play.firstChild.firstChild.setAttribute('href', '#g-' + icon);
    UI.play.setAttribute('aria-label', MAIN.playing ? 'Pause' : ended ? 'Replay' : 'Play');
  }
  if (ci !== MAIN.chapter) { MAIN.chapter = ci; UI.cv.setAttribute('aria-label', c.aria); }
}
function setSound(on) {
  Sound.setEnabled(on);
  const en = !!Sound.enabled;
  UI.sound.setAttribute('aria-pressed', String(en));
  UI.sound.setAttribute('aria-label', en ? 'Sound on. Press M to turn sound off' : 'Sound off. Press M to turn sound on');
  UI.sound.querySelector('use').setAttribute('href', en ? '#g-sound-on' : '#g-sound-off');
  UI.sound.querySelector('.lbl').textContent = en ? 'Sound on' : 'Sound off';
  if (en) Sound.seek(MAIN.t);
}
function buildControls() {
  CHAPTERS.forEach((c, i) => {
    const b = el('button', 'tick' + (i === 0 ? ' first' : i === CHAPTERS.length - 1 ? ' last' : ''), UI.ticks);
    b.type = 'button';
    b.style.left = (100 * c.t / DURATION) + '%';
    b.setAttribute('aria-label', `Chapter ${c.n}: ${c.title}`);
    el('span', 'tip', b, `${String(c.n).padStart(2, '0')} · ${c.title}`);
    b.addEventListener('click', () => seek(c.t));
  });
  UI.startBtn.addEventListener('click', () => { seek(0, true); play(); });
  UI.play.addEventListener('click', toggle);
  UI.prev.addEventListener('click', () => chapterStep(-1));
  UI.next.addEventListener('click', () => chapterStep(1));
  UI.replay.addEventListener('click', () => { seek(0, true); play(); });
  UI.sound.addEventListener('click', () => setSound(!Sound.enabled));
  UI.trans.addEventListener('click', () => toggleTranscript());
  UI.trClose.addEventListener('click', () => toggleTranscript(false));
  // scrubber: pointer drag renders synchronously; playback resumes on release
  const tAt = e => { const r = UI.scrub.getBoundingClientRect(); return DURATION * clamp((e.clientX - r.left) / r.width); };
  UI.scrub.addEventListener('pointerdown', e => {
    MAIN.wasPlaying = MAIN.playing; pause();
    UI.scrub.setPointerCapture(e.pointerId); MAIN.scrubbing = true; seek(tAt(e), true);
  });
  UI.scrub.addEventListener('pointermove', e => { if (MAIN.scrubbing) seek(tAt(e), true); });
  const end = () => { if (!MAIN.scrubbing) return; MAIN.scrubbing = false; seek(MAIN.t); if (MAIN.wasPlaying) play(); };
  UI.scrub.addEventListener('pointerup', end);
  UI.scrub.addEventListener('pointercancel', end);
  // transcript: every note and caption with its time; choosing one seeks there
  const items = [
    { t: COPY.spoken.type[0], who: 'Rasmus Krogh · pipefitter', text: COPY.spoken.text },
    ...NOTES.map(n => ({ t: n.t0, who: AGENTS[n.who].label, text: n.text })),
    ...CAPTIONS.map(c => ({ t: c.t0, who: '', text: c.text })),
    { t: FINAL.line1.a, who: '', text: COPY.final1 + ' ' + COPY.final2 }
  ].sort((a, b) => a.t - b.t);
  for (const it of items) {
    const li = el('li', '', UI.trList);
    const b = el('button', '', li);
    b.type = 'button';
    el('span', 'tt', b, fmtTime(it.t));
    const body = el('span', '', b);
    if (it.who) el('span', 'who', body, it.who);
    el(it.who ? 'span' : 'em', it.who ? '' : 'cap', body, it.text);
    b.addEventListener('click', () => seek(it.t));
  }
}
function toggleTranscript(force) {
  const open = force === undefined ? UI.transcript.hidden : force;
  UI.transcript.hidden = !open;
  UI.trans.setAttribute('aria-expanded', String(open));
  if (open) UI.trList.querySelector('button').focus(); else UI.trans.focus();
}
function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = e.target && e.target.tagName === 'BUTTON';
  switch (e.key) {
    case ' ': case 'Spacebar':
      if (onButton) return; // the focused button handles Space itself
      e.preventDefault();
      if (!MAIN.started) { seek(0, true); play(); } else toggle();
      break;
    case 'ArrowLeft': e.preventDefault(); if (e.shiftKey) chapterStep(-1); else seek(MAIN.t - 5); break;
    case 'ArrowRight': e.preventDefault(); if (e.shiftKey) chapterStep(1); else seek(MAIN.t + 5); break;
    case 'Home': e.preventDefault(); seek(0, true); play(); break;
    case 'End': e.preventDefault(); pause(); seek(DURATION); break;
    case 'm': case 'M': setSound(!Sound.enabled); break;
    case 'Escape': if (!UI.transcript.hidden) toggleTranscript(false); break;
  }
}

/* ---------- boot ---------- */
window.film = {
  duration: DURATION,
  chapters: CHAPTERS.map(c => ({ t: c.t, title: c.title })),
  get ready() { return MAIN.ready; },
  get time() { return MAIN.t; },
  seek(t) { seek(t); },
  play() { play(); },
  pause() { pause(); }
};

async function boot() {
  const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  REDUCED = !!(mq && mq.matches);
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { REDUCED = mq.matches; render(MAIN.t); });
  txBuild();
  buildControls();
  computeLayout();
  const params = new URLSearchParams(window.location.search || '');
  MAIN.sheet = window.location.hash === '#sheet' || params.has('sheet');
  UI.film.classList.toggle('sheet', MAIN.sheet);
  // fonts first: text metrics and the letter fall depend on them (fall back after 4 s)
  if (document.fonts && document.fonts.load) {
    await Promise.race([
      Promise.all(FONT_SPECS.map(f => document.fonts.load(f))).catch(() => null),
      new Promise(r => setTimeout(r, 4000))
    ]);
  }
  PRERENDER.forEach(p => p.fn());
  MAIN.ready = true;
  window.addEventListener('resize', relayout);
  window.addEventListener('keydown', onKey);
  const t0 = parseFloat(params.get('t'));
  if (MAIN.sheet || !isNaN(t0)) seek(isNaN(t0) ? 0 : t0);
  else render(MAIN.t); // poster frame under the start overlay
}
boot();

})();</script>
