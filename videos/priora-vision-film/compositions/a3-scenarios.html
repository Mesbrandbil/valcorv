    <title>a3-scenarios: every kind of work carries its own conditions (cut 3, SC1 to SC5)</title>
    <!-- Ignored by the assembler. Everything that must exist at render time is inside <template>.

      HANDOFF IN (cue scenariosIn, 0.4 s crossfade over a3-change's programme-layer hold): this scene
      carries its own paper (the index ground, grain tile and vignette at the same origin) inside the
      wrapper that fades in, so a3-change is covered by clean paper once the crossfade completes,
      whether or not a3-change fades itself out.

      HANDOFF OUT (a3-close crossfades in over this scene's last 0.4 s, cue closeIn to closeIn + 0.4):
        From cue closeIn to the end of this scene the frame is the bare precise site, exactly a full-frame
        1920 x 1080 SiteKit mount:
          SiteKit.mount(svg, { show: 'precise', rough: false })  (a hidden rough layer renders nothing, so
                                                                  rough: true gives the same frame)
          site.setView(SiteKit.CAMERAS.wholeSite)   = SiteKit.rect(16.5, 44.5, 6.01038),
                                                     viewBox "-143.224 -45.345 319.447 179.689", --sw 0.166379
          the untouched kit state: zone labels at the demo's 10 px (no label scaling is applied in this
          scene), Sprinkler Zone 3 as mounted, the envelope and its label as drawn, in whatever colours
          the kit gives a bare precise mount (this scene never restyles the site).
        This scene's own overlay group (markers, tags, decision glyphs, the cobalt envelope pulse) is at
        opacity 0 from closeIn: it fades out over [closeIn - 0.6, closeIn]. The site camera lands on
        wholeSite at the shared cut on 'decisions' and is still from then on. This scene does not fade
        itself out, so the incoming crossfade blends two identical frames.

      SHOTS (docs/cut3-direction.md section 3, a3-scenarios; every time from cues through FL.clock):
        SC1  scenariosIn (xfade 0.4): the whole precise site at wholeSite. Activity markers in their
             colours on consecutive half beats from b(everyKind): hot work Roof 03, crane at Production
             Hall 2, gas detection at the Laboratory, confined space at Tank 2, each with a condition
             tag; ordinary grey markers ripple in after them. Still from then on; on b(L18a.end) a one-
             beat push toward the crane, cut on c(crane).
        SC2  c(crane): the crane vignette, close on the hook line and the load over the hall. On
             b(L18b:lift) a one-beat pull follows the cobalt live line from the anemometer at the boom
             head into the card's rule (the card sets as it arrives). The wind reading counts 7 to 11 m/s
             from 'wind', crosses 9 (the number turns alert); the outcome settles on b(L18b:picks):
             CHANGE THE WORK, Lift paused, Rescheduled 16:30. Hold to the cut.
        SC3  c(gasDetector): the laboratory wall, the gas detector, its bypass key switch. The key
             turns on 'bypassed' and the tag drops; the card's live state IN SERVICE becomes BYPASSED
             (alert); a one-beat push makes the card the hero; the outcome settles on
             b(L18c:maintenance): KNOWINGLY RETAINED, Retained until 17:30, portable detector, owned
             by the lab lead (the portable detector appears in the drawing). Hold to the cut.
        SC4  c(confined): close on the tank manhole, the rescue tripod and the entrant in hi-vis; on
             b(L18d:entry) a one-beat move follows the duct to the fan and reveals the card. On
             'ventilation' the blades run down and stop and the duct collapses; the card flips to
             VENTILATION DOWN (alert) on the next half beat; the outcome settles on b(L18d:down):
             PREVENTION BEFORE THE WORK, Entry held. Hold to the cut.
        SC5  c(L18e.start): cut to the precise site close on Tank 2 (its teal marker), then one
             continuous decelerating pull back to wholeSite, landing on c(decisionsL18). Ordinary
             markers pass with small green ticks; from b(few) the four decisions of the film resolve
             as distinct glyphs in their colours with short labels, one per half beat; on
             c(decisionsL18) each gains the cobalt decision ring; on c(madeInTime) one cobalt pulse
             runs the envelope line once. Overlays fade from closeIn - 0.6.

      Vignette holds (outcome fully settled to the next cut, for the guide narration): see the report;
      each is exactly two beats on the grid.
    -->

            var runDeg = 520 * (tVent - tC4);
            attrTo(v3.gBl, "transform", "rotate(0)", "rotate(" + f2(runDeg) + ")", tC4, tVent - tC4, "none");
            attrTo(v3.gBl, "transform", "rotate(" + f2(runDeg) + ")", "rotate(" + f2(runDeg + 150) + ")", tVent, tStop - tVent, "power2.out");

            attrTo(v3.gSpin, "transform", spinRot(0), spinRot(-520 * (tVent - tC4)), tC4, tVent - tC4, "none");
            ft([v3.gSpin, v3.gBlur], { opacity: 1 }, { opacity: 0, duration: tStop - tVent, ease: "power1.in" }, tVent);
            // the duct collapses as the air stops
            attrTo(v3.ductFill, "d", v3.ductD(1, 0), v3.ductD(0.36, 1), tVent + 0.12, 0.7, "power2.inOut");
            attrTo(v3.ductEdge, "d", v3.ductD(1, 0), v3.ductD(0.36, 1), tVent + 0.12, 0.7, "power2.inOut");
            attrTo(v3.ribs, "d", v3.ribD(1, 0), v3.ribD(0.36, 1), tVent + 0.12, 0.7, "power2.inOut");
            cutTo(v3.vOn, { opacity: 1 }, { opacity: 0 }, tFlip4);
            cutTo(v3.vDown, { opacity: 0 }, { opacity: 1 }, tFlip4);
            settleOutcome(v3.card, tOut4);
          })();

          // ================================================================ build-time initialisation
          // Initialise every tween now (DrawSVG measures, start values), then return to the first frame,
          // so the state at any time never depends on which frames were rendered before it.
          tl.totalTime(tl.duration(), true);
          tl.totalTime(0, true);

          window.__timelines["a3-scenarios"] = tl;
        })();
