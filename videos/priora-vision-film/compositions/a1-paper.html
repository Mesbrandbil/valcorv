<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8">
    <title>a1-paper: insurance becomes workflow (Frame 2)</title>
    <!-- Ignored by the assembler. Everything the render needs is inside <template>. -->
  </head>
  <body>
    <template id="a1-paper-template">
      <link rel="stylesheet" href="assets/css/film.css">
      <link rel="stylesheet" href="assets/css/film-sketch.css">
      <style>
        /* An overlay above a1-world: transparent, no full-bleed paper. Only the detail sheet and the
           four artefacts carry paper fills (drawn solids, like the site's own faces). */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #a1-paper-fade {
          position: absolute;
          inset: 0;
        }
        #a1-paper-sheet {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          overflow: visible;
        }
        /* IBM Plex only: film-sketch.css names system fallbacks in its stacks; the scene pins the
           families to the film tokens, which end in the generic keyword only. */
        #a1-paper-sheet .skt-lab {
          font-family: var(--mono);
        }
        #a1-paper-sheet .skt-sans {
          font-family: var(--sans);
        }
      </style>

      <div id="root" data-composition-id="a1-paper" data-width="1920" data-height="1080">
        <div id="a1-paper-fade">
          <svg id="a1-paper-sheet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" data-layout-ignore=""></svg>
        </div>
      </div>

      <script>
        // Frame 2: a programme clause drawn as detail D1, copied by capable hands into procedure,
        // permit, briefing and checklist. The sprinkler condition thins at every handoff:
        // full sentence, short line, a tick, a spoken note, a question mark.
        // Globals from index.html: gsap (+ DrawSVG), FL, CUES, SCENES, SiteKit, SketchKit.
        var ID = "a1-paper";
        var clk = FL.clock(ID);
        var T = function (a, off) { return clk.t(a, off); };
        var U = SketchKit.util;
        var el = function (id) { return document.getElementById(id); };
        var clampv = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

        // ---------------------------------------------------------------- cue times (scene-local)
        var tIns = T("insurance"), tAcc = T("accepted"), tTr = T("translate"), tPe = T("permits");
        var tBr = T("briefings"), tCh = T("checklists"), tNo = T("noOne");
        var tEx = T("moving", -0.1); // exit: slide left and fade, graphite last

        // ---------------------------------------------------------------- paper context and drawing helpers
        var sheet = el("a1-paper-sheet");
        var P = SketchKit.paper(sheet, { prefix: ID, scene: ID });
        var tl = gsap.timeline({ paused: true });
        var g = function (parent, attrs) { return FL.svgEl("g", attrs || {}, parent); };
        var rectCmds = function (x, y, w, h) { return U.lineCmds([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true); };
        var tickCmds = function (x, y, s) { return [["M", [x - 5 * s, y - 0.8 * s]], ["L", [x - 1.4 * s, y + 4 * s]], ["L", [x + 7.6 * s, y - 7.4 * s]]]; };
        var scribbleCmds = function (x, y, w, h, seed) { // a signature or initials: loops, then a trailing stroke
          var R = U.rng("sig" + seed), pts = [];
          for (var i = 0; i <= 9; i++) pts.push([x + w * (i / 9) * 0.82 + (i % 2 ? -w * 0.05 : 0), y + (i % 2 ? -h : h * 0.35) * (0.55 + R() * 0.5)]);
          pts.push([x + w * 0.9, y + h * 0.1], [x + w, y - h * 0.15]);
          return U.smoothCmds(pts, false);
        };
        var greekCmds = function (x, y, w, rows, lh, seed) { // light rules standing in for lines of copy
          var R = U.rng("gk" + seed), d = "";
          for (var i = 0; i < rows; i++) d += "M" + x + " " + (y + i * lh) + "L" + (x + w * (0.55 + R() * 0.4) * (i === rows - 1 ? 0.6 : 1)).toFixed(2) + " " + (y + i * lh);
          return d;
        };

        // ---------------------------------------------------------------- seek-safe schedulers
        // Every visual state is a fromTo with an explicit from-state; first tweens render their
        // hidden state at build time (immediateRender), exactly as SketchKit items do.
        function stroke(rec, t, d, ease) {
          d = d || clampv(0.1 + rec.len / 720, 0.12, 1.4);
          if (rec.occ) tl.fromTo(rec.occ, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out", immediateRender: true }, t);
          tl.fromTo(rec.main, { drawSVG: "0%" }, { drawSVG: "100%", duration: d, ease: ease || "power1.inOut", immediateRender: true }, t);
          if (rec.over) tl.fromTo(rec.over, { drawSVG: "0%" }, { drawSVG: "100%", duration: d * 0.8, ease: "power1.inOut", immediateRender: true }, t + d * 0.45);
          if (rec.ext) tl.fromTo(rec.ext, { drawSVG: "0%" }, { drawSVG: "100%", duration: Math.min(0.22, d * 0.6), ease: "power1.out", immediateRender: true }, t + d * 0.9);
          return t + d;
        }
        function wipe(lab, t, d, ease) {
          d = d || clampv(0.12 + lab.w / 300, 0.2, 1.8);
          tl.fromTo(lab.clip, { attr: { width: 0 } }, { attr: { width: +lab.full.toFixed(2) }, duration: d, ease: ease || "power1.inOut", immediateRender: true }, t);
          return t + d;
        }
        function pop(node, t, d, cx, cy, sc) {
          var m = function (v) { return "translate(" + cx + " " + cy + ") scale(" + v + ") translate(" + -cx + " " + -cy + ")"; };
          tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: Math.min(0.06, d), ease: "none", immediateRender: true }, t);
          tl.fromTo(node, { attr: { transform: m(sc || 1.12) } }, { attr: { transform: m(1) }, duration: d, ease: "power3.out", immediateRender: true }, t);
          return t + d;
        }
        // a hand line in the kit's language (main pass, overdraw, optional overshoot and paper fill)
        var hand = function (parent, d, o) { return U.hand(P, parent, d, o || {}); };
        var mono = function (parent, text, x, y, o) { return U.letters(P, parent, text, x, y, o || {}); };
        var sansT = function (parent, text, x, y, o) { return U.sans(P, parent, text, x, y, o || {}); };
        // one drawn artefact frame: a hairline sheet, paper inside, construction overshoot
        var frameRec = function (parent, x, y, w, h, seed) { return hand(parent, rectCmds(x, y, w, h), { seed: "fr" + seed, jit: 0.6, ext: true, extMin: 30, cls: "skt-fine", occ: true }); };
        var tick = function (parent, x, y, s, seed) { return hand(parent, tickCmds(x, y, s), { seed: "tk" + seed, jit: 0.35, cls: "skt-heavy", over: false }); };

        // ================================================================ D1: the programme clause
        // The site sits left (a1-world camera siteLeft, SiteKit.CAMERAS.siteLeft); the detail sheet
        // takes the right of the frame, its left edge clear of the site's zone lettering (PRODUCTION
        // HALL 2 ends near x 936 at siteLeft). The leader lands on the accepted envelope where it is visible.
        var CB = { x: 944, y: 150, w: 880, h: 262 };
        var camL = SiteKit.CAMERAS.siteLeft;
        var env = (window.SITE_MODEL && SITE_MODEL.envelope && SITE_MODEL.envelope.pointsWorld) || [];
        var LT = [826, 378], leadTo = LT.slice(), best = 1e9; // the envelope point nearest LT on screen
        env.forEach(function (p) {
          var s = FL.worldToScreen(p, camL), dd = Math.hypot(s[0] - LT[0], s[1] - LT[1]);
          if (dd < best) { best = dd; leadTo = [+s[0].toFixed(2), +s[1].toFixed(2)]; }
        });
        var gCall = g(P.top, { id: ID + "-callout" });
        var call = SketchKit.detailCallout(P, CB, { layer: gCall, leaderTo: leadTo, leaderFrom: [CB.x, CB.y + 150], leaderLift: 20 });

        // head (frame, D1 bubble, heading, rule) from just before "Insurance"; the clauses set under
        // L03 and the last one lands on "accepted"
        call.head.drawOn(tl, tIns - 0.22, { speed: 1.8, events: false });
        call.clauses[0].drawOn(tl, T("insurance", 0.95), { speed: 1.25, events: false });
        call.clauses[1].drawOn(tl, T("accepted", -0.66), { speed: 1.25, events: false });
        // the leader to the envelope once it has closed (a1-world closes it on "accepted")
        call.leader.drawOn(tl, tAcc + 0.15, { speed: 1.0, events: false });
        // L05: a1-world pulls wide, so the leader lets go of the site before the camera moves
        tl.fromTo(call.leader.root, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, tNo - 0.12);

        // the condition that will travel: "sprinkler protection" underlined in pen on "translate"
        var c43 = call.clauses[1].lines[0];
        var ux0 = c43.x0 + U.sansWidth("Automatic ", 26, 400), ux1 = c43.x0 + U.sansWidth("Automatic sprinkler protection", 26, 400), uy = c43.y + 8;
        var ul43 = hand(gCall, "M" + ux0.toFixed(2) + " " + uy + "L" + ux1.toFixed(2) + " " + (uy + 0.6), { seed: "ul43", jit: 0.5, over: false });
        stroke(ul43, tTr - 0.45, 0.32, "power2.out");

        // ================================================================ the translation chain
        // Four artefacts on one row; the sprinkler condition sits on a shared row (YS) so the arrows
        // run between its mentions: solid, dashed, dotted.
        var CH = { x: 944, y: 556, w: 880, h: 320, gap: 40 };
        var AW = (CH.w - CH.gap * 3) / 4, PAD = 14, Y = CH.y, YS = CH.y + 176;
        var XS = [0, 1, 2, 3].map(function (i) { return CH.x + i * (AW + CH.gap); });
        var gChain = g(P.top, { id: ID + "-chain" });
        var gSt = XS.map(function (x, i) { return g(gChain, { id: ID + "-station-" + (i + 1) }); });

        // detail title under each artefact, as on a drawing sheet
        function caption(gp, x, text, t) {
          var lab = mono(gp, text, x + 2, Y + CH.h + 36, { size: 18, weight: 500, ls: 0.14, seed: "cap" + text, rot: 0, irr: 0.02 });
          var r1 = hand(gp, "M" + x + " " + (Y + CH.h + 48) + "L" + (x + lab.w + 26).toFixed(2) + " " + (Y + CH.h + 48), { seed: "capr" + text, jit: 0.3, over: false, cls: "skt-fine" });
          var r2 = hand(gp, "M" + x + " " + (Y + CH.h + 53) + "L" + (x + lab.w + 26).toFixed(2) + " " + (Y + CH.h + 53), { seed: "capr2" + text, jit: 0.3, over: false, cls: "skt-lite" });
          wipe(lab, t, 0.3);
          stroke(r1, t + 0.18, 0.22);
          stroke(r2, t + 0.26, 0.2);
        }

        // ---------- PROCEDURE: HSE-PR-12 / Hot work, lines of text, "Confirm sprinklers in service"
        (function (t0) {
          var x = XS[0], gp = gSt[0];
          stroke(frameRec(gp, x, Y, AW, CH.h, "proc"), t0, 0.5);
          caption(gp, x, "PROCEDURE", t0 + 0.08);
          wipe(mono(gp, "HSE-PR-12", x + PAD, Y + 32, { size: 18, weight: 500, seed: "pr", rot: 0.2 }), t0 + 0.12, 0.3);
          wipe(sansT(gp, "Hot work", x + PAD, Y + 62, { size: 22, weight: 500 }), t0 + 0.28, 0.22);
          stroke(hand(gp, "M" + (x + PAD) + " " + (Y + 76) + "L" + (x + AW - PAD) + " " + (Y + 76), { seed: "prr", jit: 0.3, over: false, cls: "skt-lite" }), t0 + 0.38, 0.18);
          stroke(hand(gp, greekCmds(x + PAD, Y + 100, AW - 2 * PAD, 3, 16, "pr1"), { seed: "gkpr1", jit: 0.45, cls: "skt-lite", over: false }), t0 + 0.45, 0.34);
          var s1 = sansT(gp, "Confirm sprinklers", x + PAD, YS, { size: 19 });
          var s2 = sansT(gp, "in service", x + PAD, YS + 24, { size: 19 });
          wipe(s1, t0 + 0.55, 0.3);
          wipe(s2, t0 + 0.8, 0.18);
          var ul = hand(gp, "M" + (x + PAD) + " " + (YS + 6) + "L" + (s1.x1 + 2).toFixed(2) + " " + (YS + 6) + "M" + (x + PAD) + " " + (YS + 30) + "L" + (s2.x1 + 2).toFixed(2) + " " + (YS + 30), { seed: "prul", jit: 0.45, over: false });
          stroke(ul, t0 + 0.95, 0.26);
          stroke(hand(gp, greekCmds(x + PAD, YS + 58, AW - 2 * PAD, 2, 16, "pr2"), { seed: "gkpr2", jit: 0.45, cls: "skt-lite", over: false }), t0 + 1.05, 0.3);
          wipe(mono(gp, "REV 04 · HSE", x + PAD, Y + CH.h - 20, { size: 18, tone: "skt-t2", ls: 0.08, seed: "prrev", rot: -0.15 }), t0 + 1.25, 0.32);
        })(tTr);

        // ---------- PERMIT: HW-0412, fields, "Sprinklers" + tick, signature, APPROVED · HSE stamp
        var stampNode;
        (function (t0) {
          var x = XS[1], gp = gSt[1];
          stroke(frameRec(gp, x, Y, AW, CH.h, "perm"), t0, 0.5);
          caption(gp, x, "PERMIT", t0 + 0.08);
          wipe(mono(gp, "HW-0412", x + PAD, Y + 34, { size: 22, weight: 500, seed: "pid", rot: -0.2 }), t0 + 0.1, 0.3);
          [["OPERATOR", Y + 64, 74], ["FIRE WATCH", Y + 112, 92]].forEach(function (f, i) {
            var tt = t0 + 0.25 + i * 0.15;
            wipe(mono(gp, f[0], x + PAD, f[1], { size: 16, weight: 500, ls: 0.12, seed: "pf" + i, tone: "skt-t2", rot: 0 }), tt, 0.16);
            stroke(hand(gp, "M" + (x + PAD) + " " + (f[1] + 26) + "L" + (x + AW - PAD) + " " + (f[1] + 26), { seed: "pfr" + i, jit: 0.3, over: false, cls: "skt-lite" }), tt + 0.05, 0.15);
            stroke(hand(gp, scribbleCmds(x + PAD + 6, f[1] + 19, f[2], 4, "pv" + i), { seed: "pv" + i, jit: 0.3, over: false, cls: "skt-fine" }), tt + 0.12, 0.24);
          });
          var sp = sansT(gp, "Sprinklers", x + PAD, YS, { size: 19 });
          wipe(sp, t0 + 0.55, 0.24);
          stroke(tick(gp, sp.x1 + 18, YS - 7, 1.2, "permtick"), t0 + 0.78, 0.16, "power2.out");
          stroke(hand(gp, scribbleCmds(x + PAD + 4, Y + 214, 112, 11, "perm-sig"), { seed: "psig", jit: 0.35, over: false, cls: "skt-heavy" }), t0 + 0.72, 0.36);
          // the stamp: a double-rule box, set at once, turned a little as a hand stamp is
          var sg = g(gp, { transform: "translate(" + (x + AW / 2).toFixed(2) + " " + (Y + 284) + ") rotate(-4.5)" });
          var st = g(sg, {}), sw = 136, sh = 58;
          FL.svgEl("path", { class: "skt-m skt-heavy", d: "M" + -sw / 2 + " " + -sh / 2 + "h" + sw + "v" + sh + "h" + -sw + "Z", opacity: 0.86 }, st);
          FL.svgEl("path", { class: "skt-m skt-fine", d: "M" + (-sw / 2 + 4) + " " + (-sh / 2 + 4) + "h" + (sw - 8) + "v" + (sh - 8) + "h" + -(sw - 8) + "Z", opacity: 0.7 }, st);
          var stt = FL.svgEl("text", { class: "skt-lab skt-w6", x: 0, y: -3, "font-size": 20, "letter-spacing": 2, "text-anchor": "middle", opacity: 0.9 }, st);
          stt.textContent = "APPROVED";
          var stb = FL.svgEl("text", { class: "skt-lab skt-w6", x: 0, y: 19, "font-size": 18, "letter-spacing": 2.5, "text-anchor": "middle", opacity: 0.9 }, st);
          stb.textContent = "HSE";
          pop((stampNode = st), t0 + 0.94, 0.16, 0, 0, 1.1);
          wipe(mono(gp, "SIGNED 14:12", x + PAD, Y + 241, { size: 18, tone: "skt-t2", ls: 0.08, seed: "psl", rot: 0 }), t0 + 1.05, 0.34);
        })(tPe);

        // ---------- BRIEFING: 07:15 TOOLBOX TALK, five figures round a point, "sprinklers on" spoken
        (function (t0) {
          var x = XS[2], gp = gSt[2];
          stroke(frameRec(gp, x, Y, AW, CH.h, "brief"), t0, 0.5);
          caption(gp, x, "BRIEFING", t0 + 0.08);
          wipe(mono(gp, "07:15", x + PAD, Y + 30, { size: 20, weight: 500, seed: "bt1", rot: -0.2 }), t0 + 0.1, 0.2);
          wipe(mono(gp, "TOOLBOX TALK", x + PAD, Y + 54, { size: 18, weight: 500, ls: 0.1, seed: "bt2", rot: 0.25 }), t0 + 0.2, 0.3);
          var figs = SketchKit.groupFigures(P, { kind: "semicircle", centre: [x + AW / 2, Y + 132], n: 5, radius: 58, squash: 0.34, heightPx: 46, markR: 4, layer: gp, seed: "brief" });
          figs.drawOn(tl, t0 + 0.22, { speed: 2.2, events: false });
          var nt = sansT(gp, "sprinklers on", x + PAD + 14, YS, { size: 19, tone: "skt-t2" });
          var bw = nt.w + 26, bx = x + PAD + 2, by = YS - 22, bh = 34;
          var bubble = hand(gp, U.smoothCmds([[bx + 8, by], [bx + bw - 8, by - 1], [bx + bw + 1, by + bh / 2], [bx + bw - 8, by + bh], [bx + 44, by + bh + 1], [bx + 36, by + bh + 12], [bx + 30, by + bh], [bx + 7, by + bh - 1], [bx - 1, by + bh / 2]], true), { seed: "bnote", jit: 0.5, cls: "skt-lite", over: false });
          stroke(bubble, t0 + 0.6, 0.32);
          wipe(nt, t0 + 0.78, 0.3);
          wipe(mono(gp, "ATTENDED 11", x + PAD, Y + 256, { size: 18, tone: "skt-t2", ls: 0.08, seed: "batt", rot: 0.1 }), t0 + 0.98, 0.32);
          stroke(hand(gp, "M" + (x + PAD) + " " + (Y + 292) + "L" + (x + AW - PAD) + " " + (Y + 292), { seed: "bsr", jit: 0.3, over: false, cls: "skt-lite" }), t0 + 1.05, 0.18);
          for (var i = 0; i < 5; i++) { // five sets of initials, each its own hand
            stroke(hand(gp, scribbleCmds(x + PAD + 4 + i * 31, Y + 283 - (i % 2), 17 + ((i * 7) % 9), 4 + (i % 3), "ini" + i), { seed: "ini" + i, jit: 0.3, over: false, cls: "skt-fine" }), t0 + 1.12 + i * 0.07, 0.12);
          }
        })(tBr);

        // ---------- CHECKLIST: HOT WORK, fire watch ticked, extinguisher ticked, "Sprinklers ?"
        (function (t0) {
          var x = XS[3], gp = gSt[3];
          stroke(frameRec(gp, x, Y, AW, CH.h, "chk"), t0, 0.5);
          caption(gp, x, "CHECKLIST", t0 + 0.08);
          wipe(mono(gp, "HOT WORK", x + PAD, Y + 34, { size: 18, weight: 500, seed: "ch2", rot: 0.2 }), t0 + 0.1, 0.25);
          var rows = [["Fire watch", YS - 88, "tick"], ["Extinguisher", YS - 44, "tick"], ["Sprinklers", YS, "q"], ["", YS + 44, "empty"], ["", YS + 88, "empty"]];
          rows.forEach(function (r, i) {
            var bx = x + PAD, bs = 16, ry = r[1];
            stroke(hand(gp, rectCmds(bx, ry - 14, bs, bs), { seed: "cb" + i, jit: 0.45, over: false, cls: r[2] === "empty" ? "skt-lite" : "skt-fine" }), t0 + 0.2 + i * 0.06, 0.14);
            if (!r[0]) {
              stroke(hand(gp, greekCmds(bx + bs + 12, ry - 5, AW - 2 * PAD - bs - 20, 1, 16, "cg" + i), { seed: "gkcg" + i, jit: 0.45, cls: "skt-lite", over: false }), t0 + 1.05 + (i - 3) * 0.08, 0.15);
              return;
            }
            var tt = sansT(gp, r[0], bx + bs + 12, ry, { size: 19, tone: r[2] === "q" ? "skt-t3" : null });
            if (r[2] === "tick") {
              wipe(tt, t0 + 0.3 + i * 0.15, 0.22);
              stroke(tick(gp, bx + 8, ry - 8, 1.05, "ct" + i), t0 + 0.5 + i * 0.18, 0.14, "power2.out");
            } else {
              wipe(tt, t0 + 0.62, 0.25);
              SketchKit.questionMark(P, [tt.x1 + 16, ry + 1], { layer: gp, size: 24, rot: 4 }).drawOn(tl, t0 + 0.95, { events: false });
            }
          });
          wipe(mono(gp, "CHECKED 14:16", x + PAD, Y + CH.h - 20, { size: 18, tone: "skt-t2", ls: 0.06, seed: "chkd", rot: -0.1 }), t0 + 1.15, 0.32);
        })(tCh);

        // ---------- arrows: the clause's condition leads down to the procedure, then solid, dashed, dotted
        var lead = SketchKit.handArrow(P, [(ux0 + ux1) / 2, uy + 6], [XS[0] + AW * 0.5, Y - 9], { layer: gChain, style: "solid", bend: 0.12, head: 10 });
        lead.drawOn(tl, tTr - 0.22, { speed: 1.35, events: false });
        var styles = ["solid", "dashed", "dotted"], arrowAt = [tPe - 0.2, tBr - 0.18, tCh - 0.18];
        styles.forEach(function (s, i) {
          var a = SketchKit.handArrow(P, [XS[i] + AW + 6, YS - 8], [XS[i + 1] - 7, YS - 8], { layer: gChain, style: s, bend: 0, head: 9 });
          a.drawOn(tl, arrowAt[i], { speed: 1.5, events: false });
        });

        // ================================================================ exit
        // L05 "a moving site": the sheet slides left and fades; typeset and lettered text fades first,
        // the graphite lines last. Ends before the slot ends.
        var texts = FL.$$(sheet, ".skt-tw").concat([stampNode]);
        tl.fromTo(texts, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, tEx);
        var fade = el("a1-paper-fade");
        tl.fromTo(fade, { x: 0 }, { x: -140, duration: 0.6, ease: "power2.in", immediateRender: false }, tEx);
        tl.fromTo(fade, { opacity: 1 }, { opacity: 0, duration: 0.56, ease: "power1.in", immediateRender: false }, tEx + 0.04);

        window.__timelines["a1-paper"] = tl;
      </script>
    </template>
  </body>
</html>
