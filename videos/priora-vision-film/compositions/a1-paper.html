<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>a1-paper: the clause and its translation into work (S5)</title>
    <!-- Ignored by the assembler. Everything the render needs is inside <template>. -->
  </head>
  <body>
    <template id="a1-paper-template">
      <link rel="stylesheet" href="assets/css/film.css" />
      <link rel="stylesheet" href="assets/css/film-color.css" />
      <link rel="stylesheet" href="assets/css/film-sketch.css" />
      <style>
        /*
          a1-paper (S5): a paper sheet slides in from the right on the half beat after "accepted",
          lies flat over the drawing (about 92 by 88 percent of the frame, a restrained contact shadow
          only; a1-world dims itself underneath), and a board camera inside the sheet reads the
          programme clause and the four artefacts it is translated into. It lifts off to the left,
          fast and flat, on the shared cut at 'noOne'.

          All SVG: one full-frame <svg>; the sheet is a slide group; the board is a <g> inside a
          nested <svg> viewport (the sheet window, which also clips it) framed by FL.boardCam, so
          the camera transform has an unambiguous origin and seeks render identical pixels.
          Board units are sheet px: at the whole-sheet framing the board is shown at scale 1.

          Colour (cut 3): the sheet is paper and stays calm, two strong colours only. The sprinkler
          condition carries water: the clause's underline, the thread and the procedure's underline, and
          the thread thins in colour as it thins in line (solid water, dashed paler, dotted palest, then
          the graphite question mark). Every tick is ok green. The briefing figures wear hi-vis (the kit).
        */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        svg#a1-paper-svg {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        }
        #a1-paper-svg .a1-paper-shadow {
          fill: var(--c-graphite);
          stroke: none;
        }
        /* the sheet: the palette's white (--c-helmet), a shade lighter than the ground */
        #a1-paper-svg .a1-paper-face {
          fill: var(--c-helmet);
          stroke: none;
        }
        #a1-paper-svg .a1-paper-edge {
          fill: none;
          stroke: var(--c-graphite);
          stroke-opacity: 0.22;
          stroke-width: 1px;
        }
        #a1-paper-svg .a1-paper-rule {
          fill: none;
          stroke: color-mix(in srgb, var(--c-graphite) 55%, var(--c-paper));
          stroke-width: 1px;
          stroke-opacity: 0.75;
        }
        /* IBM Plex only, through the film tokens */
        #a1-paper-svg .skt-lab {
          font-family: var(--mono);
        }
        #a1-paper-svg .skt-sans {
          font-family: var(--sans);
        }
      </style>

      <div id="root" data-composition-id="a1-paper" data-width="1920" data-height="1080">
        <svg id="a1-paper-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" data-layout-ignore="">
          <defs>
            <pattern id="a1-paper-grain" patternUnits="userSpaceOnUse" width="512" height="512">
              <image href="assets/textures/paper-grain.png" x="0" y="0" width="512" height="512" />
            </pattern>
          </defs>
          <g id="a1-paper-slide" transform="translate(1900 0)">
            <g id="a1-paper-shadows"></g>
            <rect class="a1-paper-face" x="77" y="65" width="1766" height="950" />
            <rect x="77" y="65" width="1766" height="950" fill="url(#a1-paper-grain)" />
            <svg id="a1-paper-sheet" x="77" y="65" width="1766" height="950" viewBox="0 0 1766 950" overflow="hidden">
              <g id="a1-paper-board"></g>
            </svg>
            <rect class="a1-paper-edge" x="77.5" y="65.5" width="1765" height="949" />
          </g>
        </svg>
      </div>

      <script>
        (function () {
          // Globals from index.html: gsap (+ DrawSVG, CustomEase), FL, CUES, SCENES, SketchKit.
          var ID = "a1-paper";
          var clk = FL.clock(ID);
          var T = function (a, off) {
            return clk.t(a, off);
          };
          // move starts snap to the quarter-beat grid near a word
          var Q = function (a, off) {
            return clk.b(a, off || 0, "near", 4);
          };
          var BEAT = FL.BEAT;
          var U = SketchKit.util;
          var el = function (id) {
            return document.getElementById(id);
          };
          var clampv = function (v, a, b) {
            return Math.max(a, Math.min(b, v));
          };
          var f2 = function (v) {
            return (Math.round(v * 100) / 100).toString();
          };
          var tl = gsap.timeline({ paused: true });

          // ================================================================ timing (scene-local)
          var tLay = clk.b("L03:accepted.end", 0, "next", 2); // the sheet starts to slide in
          var tLaid = tLay + BEAT; // and lies flat one beat later
          var tUnder = tLaid; // the underline, on the beat
          var tFollow = clk.c("translate"); // the underline runs on into an arrow; the camera follows it
          var dFollow = 0.6;
          var tPermit = Q("permits", -0.25),
            tBrief = Q("briefings", -0.2),
            tCheck = Q("checklists", -0.2),
            dWhip = BEAT / 2; // half-beat whips: the words come too close together for longer moves
          var tStamp = clk.b("permits", 0.1, "next", 1); // the stamp lands on a beat
          var tPull = Q("checklists", 0.5),
            dPull = 1.0; // the pull back to the whole sheet, once the question mark is down
          var tRing = tPull + dPull; // the question mark is circled in the hold
          var tLift = clk.c("noOne"),
            dLift = 0.42; // the sheet lifts off to the left

          // ================================================================ the sheet: slide, contact shadow
          var svg = el(ID + "-svg");
          var slide = el(ID + "-slide");
          var sh = el(ID + "-shadows");
          // a restrained contact shadow: a few soft offset plates, mostly under the bottom edge. Square
          // corners on whole pixels: a laid sheet has no anti-aliased shadow edge, so its pixels do not
          // depend on the seek history (the rounded corners flipped a level on 2 px in the seek check)
          [
            [0, 2, 0.07],
            [2, 5, 0.045],
            [4, 10, 0.028],
            [8, 18, 0.016],
          ].forEach(function (s) {
            FL.svgEl("rect", { class: ID + "-shadow", x: 77 - s[0], y: 65 + s[1] - s[0] * 0.5, width: 1766 + 2 * s[0], height: 950 + s[0], opacity: s[2] }, sh);
          });
          var SX = function (x) {
            return "translate(" + f2(x) + " 0)";
          };
          tl.fromTo(slide, { attr: { transform: SX(1900) } }, { attr: { transform: SX(0) }, duration: tLaid - tLay, ease: "power3.out", immediateRender: true }, tLay);
          tl.fromTo(slide, { attr: { transform: SX(0) } }, { attr: { transform: SX(-1960) }, duration: dLift, ease: "power1.in", immediateRender: false }, tLift);

          // ================================================================ the board inside the sheet
          var board = el(ID + "-board");
          var P = SketchKit.paper(svg, { prefix: ID, scene: ID });
          P.top = P.ground = board; // kit builders draw into the board (defs stay in the outer svg)
          var g = function (parent, attrs) {
            return FL.svgEl("g", attrs || {}, parent);
          };
          var rectCmds = function (x, y, w, h) {
            return U.lineCmds([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true);
          };
          var tickCmds = function (x, y, s) {
            return [["M", [x - 5 * s, y - 0.8 * s]], ["L", [x - 1.4 * s, y + 4 * s]], ["L", [x + 7.6 * s, y - 7.4 * s]]];
          };
          var scribbleCmds = function (x, y, w, h, seed) {
            var R = U.rng("sig" + seed),
              pts = [];
            for (var i = 0; i <= 9; i++) pts.push([x + w * (i / 9) * 0.82 + (i % 2 ? -w * 0.05 : 0), y + (i % 2 ? -h : h * 0.35) * (0.55 + R() * 0.5)]);
            pts.push([x + w * 0.9, y + h * 0.1], [x + w, y - h * 0.15]);
            return U.smoothCmds(pts, false);
          };
          var greekCmds = function (x, y, w, rows, lh, seed) {
            var R = U.rng("gk" + seed),
              d = "";
            for (var i = 0; i < rows; i++) d += "M" + x + " " + (y + i * lh) + "L" + (x + w * (0.55 + R() * 0.4) * (i === rows - 1 ? 0.6 : 1)).toFixed(2) + " " + (y + i * lh);
            return d;
          };
          var hand = function (parent, d, o) {
            return U.hand(P, parent, d, o || {});
          };
          var mono = function (parent, text, x, y, o) {
            return U.letters(P, parent, text, x, y, o || {});
          };
          var sansT = function (parent, text, x, y, o) {
            return U.sans(P, parent, text, x, y, o || {});
          };
          // seek-safe schedulers: fromTo with explicit from-states, the first renders at build time
          function stroke(rec, t, d, ease) {
            d = d || clampv(0.1 + rec.len / 720, 0.12, 1.4);
            if (rec.occ) tl.fromTo(rec.occ, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: true }, t);
            tl.fromTo(rec.main, { drawSVG: "0%" }, { drawSVG: "100%", duration: d, ease: ease || "power1.inOut", immediateRender: true }, t);
            if (rec.over) tl.fromTo(rec.over, { drawSVG: "0%" }, { drawSVG: "100%", duration: d * 0.8, ease: "power1.inOut", immediateRender: true }, t + d * 0.45);
            if (rec.ext) tl.fromTo(rec.ext, { drawSVG: "0%" }, { drawSVG: "100%", duration: Math.min(0.2, d * 0.6), ease: "power1.out", immediateRender: true }, t + d * 0.9);
            return t + d;
          }
          function wipe(lab, t, d, ease) {
            d = d || clampv(0.12 + lab.w / 300, 0.2, 1.8);
            tl.fromTo(lab.clip, { attr: { width: 0 } }, { attr: { width: +lab.full.toFixed(2) }, duration: d, ease: ease || "power1.inOut", immediateRender: true }, t);
            return t + d;
          }
          function pop(node, t, d, cx, cy, sc) {
            var m = function (v) {
              return "translate(" + cx + " " + cy + ") scale(" + v + ") translate(" + -cx + " " + -cy + ")";
            };
            tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: Math.min(0.05, d), ease: "none", immediateRender: true }, t);
            tl.fromTo(node, { attr: { transform: m(sc || 1.12) } }, { attr: { transform: m(1) }, duration: d, ease: "power3.out", immediateRender: true }, t);
            return t + d;
          }
          var frameRec = function (parent, x, y, w, h, seed) {
            return hand(parent, rectCmds(x, y, w, h), { seed: "fr" + seed, jit: 0.6, ext: true, extMin: 30, cls: "skt-fine", occ: true });
          };
          var tick = function (parent, x, y, s, seed) {
            return hand(parent, tickCmds(x, y, s), { seed: "tk" + seed, jit: 0.35, cls: "skt-heavy", over: false, tone: "ok" });
          };
          var rule = function (parent, x0, y0, x1, y1, seed, cls) {
            return hand(parent, "M" + f2(x0) + " " + f2(y0) + "L" + f2(x1) + " " + f2(y1), { seed: seed, jit: 0.3, over: false, cls: cls || "skt-lite" });
          };

          // ================================================================ layout (board px = sheet px)
          var SW = 1766,
            SH = 950;
          var AW = 364,
            AH = 440,
            AY = 380,
            PAD = 22,
            YS = 610; // artefacts, the shared condition row
          var AX = [0, 1, 2, 3].map(function (i) {
            return 50 + i * 434;
          });
          var CS = 21; // condition text size

          // ---------- header: detail bubble and the programme label
          var gHead = g(board, { id: ID + "-head" });
          hand(gHead, U.smoothCmds(
            (function () {
              var pts = [];
              for (var i = 0; i <= 18; i++) {
                var a = -1.2 + (i / 18) * 6.9;
                pts.push([84 + Math.cos(a) * 27, 98 + Math.sin(a) * 27]);
              }
              return pts;
            })(),
            false
          ), { seed: "bub", jit: 0.4, over: false, cls: "skt-fine" });
          rule(gHead, 58, 98, 110, 98, "bubl", "skt-fine");
          mono(gHead, "D1", 84, 90, { size: 19, weight: 600, anchor: "middle", seed: "D1", rot: 0, irr: 0.02 });
          mono(gHead, "01", 84, 116, { size: 14, weight: 500, anchor: "middle", seed: "sh", rot: 0, irr: 0.02, tone: "skt-t2" });
          mono(gHead, "PROPERTY + BI PROGRAMME · CONDITIONS", 132, 106, { size: 18, weight: 500, ls: 0.14, seed: "lbl", rot: 0.1, irr: 0.02 });
          rule(gHead, 132, 128, 1712, 128, "hrule");

          // ---------- the clauses: 4.2 above in grey, 4.3 the hero
          var gCl = g(board, { id: ID + "-clause" });
          mono(gCl, "4.2", 64, 178, { size: 20, weight: 500, seed: "c42", rot: 0, irr: 0.01, tone: "skt-t2" });
          sansT(gCl, "Hot work requires a permit, a certified operator", 132, 178, { size: 22, tone: "skt-t2" });
          sansT(gCl, "and a fire watch.", 132, 208, { size: 22, tone: "skt-t2" });
          mono(gCl, "4.3", 64, 266, { size: 22, weight: 600, seed: "c43", rot: 0, irr: 0.01 });
          var L1a = "Automatic ",
            L1 = "Automatic sprinkler protection",
            L2a = "must remain ",
            L2 = "must remain in service.";
          sansT(gCl, L1, 132, 266, { size: 28 });
          sansT(gCl, L2, 132, 306, { size: 28 });
          var u1x0 = 132 + U.sansWidth(L1a, 28, 400),
            u1x1 = 132 + U.sansWidth(L1, 28, 400),
            u2x0 = 132 + U.sansWidth(L2a, 28, 400),
            u2x1 = 132 + U.sansWidth("must remain in service", 28, 400);
          var ul1 = hand(gCl, "M" + f2(u1x0 - 2) + " 275L" + f2(u1x1 + 2) + " 276.2", { seed: "ul1", jit: 0.5, over: true, cls: "skt-heavy", tone: "water" });
          var ul2 = hand(gCl, "M" + f2(u2x0 - 2) + " 315.4L" + f2(u2x1 + 3) + " 316", { seed: "ul2", jit: 0.5, over: true, cls: "skt-heavy", tone: "water" });
          stroke(ul1, tUnder, 0.2, "power2.out");
          stroke(ul2, tUnder + 0.2, 0.16, "power2.out");

          // ================================================================ the four artefacts
          var gArt = g(board, { id: ID + "-artefacts" });
          var st = AX.map(function (x, i) {
            return g(gArt, { id: ID + "-station-" + (i + 1) });
          });
          function caption(gp, x, text) {
            var lab = mono(gp, text, x + 2, AY + AH + 42, { size: 18, weight: 500, ls: 0.14, seed: "cap" + text, rot: 0, irr: 0.02 });
            rule(gp, x, AY + AH + 54, x + lab.w + 26, AY + AH + 54, "capr" + text, "skt-fine");
            rule(gp, x, AY + AH + 59, x + lab.w + 26, AY + AH + 59, "capr2" + text);
          }

          // ---------- PROCEDURE: HSE-PR-12 / Hot work, lines of copy, "Confirm sprinklers in service"
          var proc = {};
          (function () {
            var x = AX[0],
              gp = st[0];
            frameRec(gp, x, AY, AW, AH, "proc");
            caption(gp, x, "PROCEDURE");
            mono(gp, "HSE-PR-12", x + PAD, AY + 40, { size: 20, weight: 500, seed: "pr", rot: 0.2 });
            sansT(gp, "Hot work", x + PAD, AY + 78, { size: 26, weight: 500 });
            rule(gp, x + PAD, AY + 94, x + AW - PAD, AY + 94, "prr");
            hand(gp, greekCmds(x + PAD, AY + 122, AW - 2 * PAD, 5, 18, "pr1"), { seed: "gkpr1", jit: 0.45, cls: "skt-lite", over: false });
            proc.s1 = sansT(gp, "Confirm sprinklers", x + PAD, YS, { size: CS });
            proc.s2 = sansT(gp, "in service", x + PAD, YS + 28, { size: CS });
            proc.ul = hand(gp, "M" + (x + PAD) + " " + (YS + 7) + "L" + f2(proc.s1.x1 + 2) + " " + (YS + 7) + "M" + (x + PAD) + " " + (YS + 35) + "L" + f2(proc.s2.x1 + 2) + " " + (YS + 35), { seed: "prul", jit: 0.45, over: false, tone: "water" });
            hand(gp, greekCmds(x + PAD, YS + 72, AW - 2 * PAD, 4, 18, "pr2"), { seed: "gkpr2", jit: 0.45, cls: "skt-lite", over: false });
            mono(gp, "REV 04 · HSE", x + PAD, AY + AH - 22, { size: 18, tone: "skt-t2", ls: 0.08, seed: "prrev", rot: -0.15 });
            hand(gp, scribbleCmds(x + AW - 120, AY + AH - 28, 90, 6, "prsig"), { seed: "prsig", jit: 0.3, over: false, cls: "skt-fine" });
          })();

          // ---------- PERMIT: HW-0412, fields, "Sprinklers" + tick, signature, SIGNED 14:12, the stamp
          var perm = {};
          (function () {
            var x = AX[1],
              gp = st[1];
            frameRec(gp, x, AY, AW, AH, "perm");
            caption(gp, x, "PERMIT");
            mono(gp, "PERMIT", x + PAD, AY + 34, { size: 16, weight: 500, ls: 0.18, seed: "pk", tone: "skt-t2", rot: 0.1 });
            mono(gp, "HW-0412", x + PAD, AY + 66, { size: 24, weight: 500, seed: "pid", rot: -0.2 });
            [["OPERATOR", AY + 106, 96], ["FIRE WATCH", AY + 156, 74]].forEach(function (f, i) {
              mono(gp, f[0], x + PAD, f[1], { size: 16, weight: 500, ls: 0.12, seed: "pf" + i, tone: "skt-t2", rot: 0 });
              rule(gp, x + PAD, f[1] + 26, x + AW - PAD, f[1] + 26, "pfr" + i);
              hand(gp, scribbleCmds(x + PAD + 8, f[1] + 18, f[2], 5, "pv" + i), { seed: "pv" + i, jit: 0.3, over: false, cls: "skt-fine" });
            });
            perm.sp = sansT(gp, "Sprinklers", x + PAD, YS, { size: CS });
            perm.tick = tick(gp, perm.sp.x1 + 20, YS - 8, 1.35, "permtick");
            hand(gp, scribbleCmds(x + PAD + 6, YS + 62, 128, 12, "perm-sig"), { seed: "psig", jit: 0.35, over: false, cls: "skt-heavy" });
            mono(gp, "SIGNED 14:12", x + PAD, YS + 96, { size: 18, tone: "skt-t2", ls: 0.08, seed: "psl", rot: 0 });
            // the stamp: a double-rule box, set at once, turned a little as a hand stamp is
            var sg = g(gp, { transform: "translate(" + f2(x + AW - 112) + " " + f2(AY + AH - 58) + ") rotate(-4.5)" });
            var stp = g(sg, {}),
              sw = 204,
              shh = 50;
            FL.svgEl("path", { class: "skt-m skt-heavy", d: "M" + -sw / 2 + " " + -shh / 2 + "h" + sw + "v" + shh + "h" + -sw + "Z", opacity: 0.86 }, stp);
            FL.svgEl("path", { class: "skt-m skt-fine", d: "M" + (-sw / 2 + 4) + " " + (-shh / 2 + 4) + "h" + (sw - 8) + "v" + (shh - 8) + "h" + -(sw - 8) + "Z", opacity: 0.7 }, stp);
            var stt = FL.svgEl("text", { class: "skt-lab skt-w6", x: 0, y: 6.5, "font-size": 18, "letter-spacing": 1.8, "text-anchor": "middle", opacity: 0.9 }, stp);
            stt.textContent = "APPROVED · HSE";
            perm.stamp = stp;
          })();

          // ---------- BRIEFING: 07:15 TOOLBOX TALK, five figures round a point, "sprinklers on" spoken
          var brief = {};
          (function () {
            var x = AX[2],
              gp = st[2];
            frameRec(gp, x, AY, AW, AH, "brief");
            caption(gp, x, "BRIEFING");
            mono(gp, "07:15", x + PAD, AY + 40, { size: 22, weight: 500, seed: "bt1", rot: -0.2 });
            mono(gp, "TOOLBOX TALK", x + PAD, AY + 68, { size: 18, weight: 500, ls: 0.1, seed: "bt2", rot: 0.25 });
            SketchKit.groupFigures(P, { kind: "semicircle", centre: [x + AW / 2, AY + 162], n: 5, radius: 88, squash: 0.34, heightPx: 64, markR: 5, layer: gp, seed: "brief" });
            brief.nt = sansT(gp, "sprinklers on", x + PAD + 16, YS, { size: CS, tone: "skt-t2" });
            var bw = brief.nt.w + 30,
              bx = x + PAD + 2,
              by = YS - 25,
              bh = 38;
            brief.bubble = hand(gp, U.smoothCmds([[bx + 8, by], [bx + bw - 8, by - 1], [bx + bw + 1, by + bh / 2], [bx + bw - 8, by + bh], [bx + 50, by + bh + 1], [bx + 40, by + bh + 14], [bx + 34, by + bh], [bx + 7, by + bh - 1], [bx - 1, by + bh / 2]], true), { seed: "bnote", jit: 0.5, cls: "skt-lite", over: false });
            brief.end = bx + bw + 2;
            mono(gp, "ATTENDED 11", x + PAD, AY + AH - 64, { size: 18, tone: "skt-t2", ls: 0.08, seed: "batt", rot: 0.1 });
            rule(gp, x + PAD, AY + AH - 26, x + AW - PAD, AY + AH - 26, "bsr");
            for (var i = 0; i < 5; i++) hand(gp, scribbleCmds(x + PAD + 6 + i * 40, AY + AH - 34 - (i % 2), 22 + ((i * 7) % 9), 5 + (i % 3), "ini" + i), { seed: "ini" + i, jit: 0.3, over: false, cls: "skt-fine" });
          })();

          // ---------- CHECKLIST: HOT WORK, fire watch ticked, extinguisher ticked, "Sprinklers ?"
          var chk = {};
          (function () {
            var x = AX[3],
              gp = st[3];
            frameRec(gp, x, AY, AW, AH, "chk");
            caption(gp, x, "CHECKLIST");
            mono(gp, "CHECKLIST", x + PAD, AY + 34, { size: 16, weight: 500, ls: 0.16, seed: "ch1", tone: "skt-t2", rot: 0 });
            mono(gp, "HOT WORK", x + PAD, AY + 66, { size: 22, weight: 500, seed: "ch2", rot: 0.2 });
            var rows = [["Fire watch", YS - 92, "tick"], ["Extinguisher", YS - 46, "tick"], ["Sprinklers", YS, "q"], ["", YS + 46, "empty"], ["", YS + 92, "empty"]];
            rows.forEach(function (r, i) {
              var bx = x + PAD,
                bs = 18,
                ry = r[1];
              hand(gp, rectCmds(bx, ry - 16, bs, bs), { seed: "cb" + i, jit: 0.45, over: false, cls: r[2] === "empty" ? "skt-lite" : "skt-fine" });
              if (!r[0]) {
                hand(gp, greekCmds(bx + bs + 14, ry - 6, AW - 2 * PAD - bs - 24, 1, 16, "cg" + i), { seed: "gkcg" + i, jit: 0.45, cls: "skt-lite", over: false });
                return;
              }
              var tt = sansT(gp, r[0], bx + bs + 14, ry, { size: CS, tone: r[2] === "q" ? "skt-t3" : null });
              if (r[2] === "tick") tick(gp, bx + 9, ry - 9, 1.15, "ct" + i);
              else {
                chk.sp = tt;
                chk.box = [bx, ry];
                chk.q = SketchKit.questionMark(P, [tt.x1 + 34, ry + 2], { layer: gp, size: 30, rot: 4 });
                chk.qAt = [tt.x1 + 34, ry - 12];
              }
            });
            mono(gp, "CHECKED 14:16", x + PAD, AY + AH - 22, { size: 18, tone: "skt-t2", ls: 0.06, seed: "chkd", rot: -0.1 });
          })();

          // ---------- the thinning thread: the clause's underline runs on into an arrow down to the
          // procedure (solid), then procedure to permit solid, permit to briefing dashed, briefing to
          // checklist dotted
          var gThread = g(board, { id: ID + "-thread" });
          var lead = SketchKit.handArrow(P, [u2x1 + 6, 316], [proc.s1.x1 - 30, YS - 30], { layer: gThread, style: "solid", bend: -0.28, head: 12 });
          var arrows = [
            SketchKit.handArrow(P, [proc.s1.x1 + 14, YS - 8], [perm.sp.x0 - 12, YS - 8], { layer: gThread, style: "solid", bend: 0, head: 11 }),
            SketchKit.handArrow(P, [perm.sp.x1 + 48, YS - 8], [AX[2] + PAD - 8, YS - 8], { layer: gThread, style: "dashed", bend: 0, head: 11 }),
            SketchKit.handArrow(P, [brief.end + 12, YS - 8], [chk.box[0] - 12, YS - 8], { layer: gThread, style: "dotted", bend: 0, head: 11 }),
          ];
          // the ring that circles the question mark in the hold
          var ringPts = [];
          for (var ri = 0; ri <= 22; ri++) {
            var ra = -2.2 + (ri / 22) * 7.0;
            ringPts.push([chk.qAt[0] + Math.cos(ra) * 26 * (1 + 0.04 * ri / 22), chk.qAt[1] + Math.sin(ra) * 25]);
          }
          var ring = hand(gThread, U.smoothCmds(ringPts, false), { seed: "qring", jit: 0.5, over: true });
          // the condition carries water and thins in colour as it thins in line
          lead.root.classList.add("skt-c-water");
          arrows[0].root.classList.add("skt-c-water");
          arrows[1].root.style.setProperty("--skt-tc", "color-mix(in srgb, var(--skt-t-water) 66%, var(--c-paper))");
          arrows[2].root.style.setProperty("--skt-tc", "color-mix(in srgb, var(--skt-t-water) 42%, var(--c-paper))");

          // ================================================================ choreography of the reading
          // the underline has drawn by the translate cut; the arrow extends as the camera follows it
          lead.drawOn(tl, tFollow, { speed: lead.duration / dFollow, events: false });
          // PROCEDURE: its line and its underline are written as the camera lands
          wipe(proc.s1, tFollow + dFollow - 0.2, 0.26);
          wipe(proc.s2, tFollow + dFollow + 0.04, 0.16);
          stroke(proc.ul, tFollow + dFollow + 0.18, 0.2);
          // PERMIT: the arrow runs with the whip; "Sprinklers" and its tick; the stamp on the beat
          arrows[0].drawOn(tl, tPermit - 0.04, { speed: arrows[0].duration / (dWhip + 0.05), events: false });
          wipe(perm.sp, tPermit + dWhip - 0.06, 0.2);
          stroke(perm.tick, tPermit + dWhip + 0.14, 0.12, "power2.out");
          pop(perm.stamp, tStamp, 0.14, 0, 0, 1.12);
          // BRIEFING: dashed arrow, then the spoken note
          arrows[1].drawOn(tl, tBrief - 0.04, { speed: arrows[1].duration / (dWhip + 0.06), events: false });
          stroke(brief.bubble, tBrief + dWhip - 0.04, 0.24);
          wipe(brief.nt, tBrief + dWhip + 0.1, 0.26);
          // CHECKLIST: dotted arrow, the pale word, the question mark
          arrows[2].drawOn(tl, tCheck - 0.04, { speed: arrows[2].duration / (dWhip + 0.08), events: false });
          wipe(chk.sp, tCheck + dWhip - 0.06, 0.2);
          chk.q.drawOn(tl, tCheck + dWhip + 0.14, { speed: chk.q.duration / 0.18, events: false });
          // the hold on the whole sheet: the question mark is circled
          stroke(ring, tRing, 0.34, "power1.inOut");

          // ================================================================ the board camera
          var FR = { w: SW, h: SH };
          var ZC = 64 / 28; // clause 4.3 at about 64 px on screen
          // artefacts medium-close: each centred, the neighbours half in frame with the thread running
          // through; the frame's top sits just above the documents so the chrome clock corner stays clear
          var ZA = 1.95;
          var aRect = function (i) {
            var w = SW / ZA;
            return { x: AX[i] + AW / 2 - w / 2, y: AY - 40, w: w };
          };
          var cam = FL.boardCam(board, {
            frame: FR,
            rects: {
              clause: { x: 132 - 196 / ZC, y: 30, w: SW / ZC },
              proc: aRect(0),
              permit: aRect(1),
              brief: aRect(2),
              check: aRect(3),
              whole: { x: 0, y: 0, w: SW },
            },
          });
          // the follow passes over the arrow's bend (down from 'in service', then left into the procedure)
          var mid = { cx: 412, cy: 430, w: (cam.rect("clause").w + cam.rect("proc").w) / 2 };
          cam.apply("clause");
          cam.cut(tl, "clause", 0);
          cam.drift(tl, tLay, tFollow - tLay, 0.008);
          cam.follow(tl, [mid, "proc"], tFollow, dFollow);
          cam.to(tl, "permit", tPermit, dWhip, "power3.inOut");
          cam.to(tl, "brief", tBrief, dWhip, "power3.inOut");
          cam.to(tl, "check", tCheck, dWhip, "power3.inOut");
          cam.to(tl, "whole", tPull, dPull, "sine.inOut");
          cam.drift(tl, tPull + dPull, tLift + dLift - (tPull + dPull), 0.004);

          tl.data = { tLay: tLay, tLaid: tLaid, tUnder: tUnder, tFollow: tFollow, tPermit: tPermit, tBrief: tBrief, tCheck: tCheck, tStamp: tStamp, tPull: tPull, tRing: tRing, tLift: tLift };
          window.__timelines["a1-paper"] = tl;
        })();
      </script>
    </template>
