<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>zz-proto: pipeline prototype (temporary, delete before the final build)</title>
    <!-- The head of a templated sub-composition is discarded by the assembler. Everything the
         render needs is inside <template>. -->
  </head>
  <body>
    <template id="zz-proto-template">
      <!-- Hoisted to the page head and de-duplicated against index.html's own link. -->
      <link rel="stylesheet" href="assets/css/film.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #zz-proto-precise-wrap,
        #zz-proto-rough-wrap {
          position: absolute;
          inset: 0;
        }
        #zz-proto-rough-wrap {
          /* Screen-space tremor: the filter sits on the HTML wrapper, not inside the zooming SVG. */
          filter: url(#zz-proto-wobble);
        }
        #zz-proto-rough path {
          fill: none;
          stroke: var(--graphite);
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-width: calc(var(--sw, 0.1664) * 1.5px);
        }
        #zz-proto-rough .zz-proto-over {
          stroke-width: calc(var(--sw, 0.1664) * 1.1px);
          opacity: 0.32;
        }
        #zz-proto-rough .zz-proto-head {
          fill: var(--graphite);
          stroke: none;
        }
        #zz-proto-hud {
          position: absolute;
          top: 56px;
          right: 96px;
          text-align: right;
        }
        #zz-proto-hud .fl-label {
          display: block;
          margin-top: 6px;
        }
        #zz-proto-clock {
          font-family: var(--mono);
          font-weight: 500;
          font-size: 36px;
          letter-spacing: 0.04em;
          color: var(--graphite);
          display: block;
        }
        #zz-proto-statement {
          position: absolute;
          left: 96px;
          bottom: 150px;
          width: 1200px;
          opacity: 0;
        }
        #zz-proto-chain {
          position: absolute;
          left: 96px;
          bottom: 96px;
          display: flex;
          gap: 18px;
          align-items: baseline;
        }
        #zz-proto-chain span {
          display: inline-block;
          opacity: 0;
        }
        #zz-proto-mark {
          position: absolute;
          left: 0;
          right: 0;
          top: 400px;
          text-align: center;
          opacity: 0;
        }
        #zz-proto-mark .zz-proto-word {
          font-family: var(--sans);
          font-weight: 600;
          font-size: 104px;
          letter-spacing: -0.02em;
          color: var(--ink);
          display: block;
        }
        #zz-proto-mark .fl-body-lg {
          display: block;
          margin-top: 18px;
          font-weight: 300;
        }
        #zz-proto-mark-bg {
          position: absolute;
          inset: 0;
          background: var(--paper);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="zz-proto" data-width="1920" data-height="1080">
        <!-- Filter definitions: an invisible SVG inside the root (anything outside the root is dropped). -->
        <svg id="zz-proto-defs" width="0" height="0" style="position: absolute" aria-hidden="true"><defs></defs></svg>
        <div id="zz-proto-precise-wrap" data-layout-ignore></div>
        <div id="zz-proto-rough-wrap" data-layout-ignore>
          <svg id="zz-proto-rough" class="fl-stage" xmlns="http://www.w3.org/2000/svg" viewBox="-143.269 -56.345 319.447 179.689" preserveAspectRatio="xMidYMid meet">
            <g id="zz-proto-rough-g"></g>
          </svg>
        </div>
        <div id="zz-proto-hud">
          <span class="fl-label fl-muted">Site time</span>
          <span id="zz-proto-clock" class="fl-num">06:00</span>
          <span id="zz-proto-film-t" class="fl-label">T 0.000</span>
          <span id="zz-proto-story-t" class="fl-label">S 0.000</span>
        </div>
        <p id="zz-proto-statement" class="fl-display">Prevention before the work. Proof as it happens.</p>
        <div id="zz-proto-chain" class="fl-label-lg">
          <span>Record</span><span>&#8594; Trust</span><span>&#8594; Decision</span><span>&#8594; Price</span><span>&#8594; Capacity &#10003;</span>
        </div>
        <div id="zz-proto-mark-bg"></div>
        <div id="zz-proto-mark">
          <span class="zz-proto-word">Priora</span>
          <span class="fl-body-lg">Infrastructure for activity-level physical risk</span>
        </div>
      </div>

      <script>
        // ---- scene constants: every sync time comes from the cue file, never hard-coded
        var ID = "zz-proto";
        var clk = FL.clock(ID);
        var T = function (a, off) {
          return clk.t(a, off);
        };
        var RS = T("rewindStart"),
          RE = T("rewindEnd"),
          LAND = T("landing"); // story time == film time during the forward pass
        var END = clk.duration;

        // ---- elements (document is scoped to this scene by the runtime)
        var preciseWrap = document.getElementById("zz-proto-precise-wrap");
        var roughWrap = document.getElementById("zz-proto-rough-wrap");
        var rough = document.getElementById("zz-proto-rough");
        var roughG = document.getElementById("zz-proto-rough-g");
        var defs = document.querySelector("#zz-proto-defs defs");

        // Precise site from the inline asset (ids prefixed with the scene id).
        var site = FL.mountSvg(preciseWrap, "SITE_PRECISE", { prefix: ID });
        site.setAttribute("preserveAspectRatio", "xMidYMid meet");
        site.style.opacity = "0";

        // Wobble filter (fixed seed) used in screen space on the rough wrapper.
        var wobble = FL.wobbleFilter(defs, "zz-proto-wobble", { seed: 11, baseFrequency: 0.018, octaves: 2, scale: 2 });

        // ---- rough twin: same geometry, jittered, same command structure
        var rng = FL.prng("zz-proto-rough");
        var srcPaths = FL.$$(site, '[data-draw="stroke"]').filter(function (p) {
          return p.tagName.toLowerCase() === "path";
        });
        var main = [],
          over = [];
        srcPaths.forEach(function (p) {
          var d = FL.normalizePath(p.getAttribute("d"));
          var a = FL.svgEl("path", { d: FL.jitterPath(d, rng, 0.16) }, roughG);
          a.__precise = d;
          main.push(a);
          var b = FL.svgEl("path", { d: FL.jitterPath(d, rng, 0.22), class: "zz-proto-over" }, roughG);
          b.__precise = d;
          over.push(b);
        });
        // Sprinkler heads of zone 3 as graphite dots in the rough drawing.
        var heads = FL.$$(site, "[id^='zz-proto-sz3-head-']")
          .map(function (h) {
            var bb = h.getBBox();
            return { i: +(h.getAttribute("data-i") || 0), x: bb.x + bb.width / 2, y: bb.y + bb.height / 2 };
          })
          .sort(function (a, b) {
            return a.i - b.i;
          })
          .map(function (h) {
            return FL.svgEl("circle", { cx: h.x.toFixed(3), cy: h.y.toFixed(3), r: 0.38, class: "zz-proto-head" }, roughG);
          });

        // ---- cameras (world rects; from assets/site/site-model.json cameras)
        var roof = FL.iso(67, 22, 12); // hot-work node, Roof 03 centre
        var cam = FL.camera([rough, site], {
          rects: {
            overview: "-143.269 -56.345 319.447 179.689",
            roofEdgeMacro: FL.vb.around(roof[0] - 6, roof[1] - 2, 6.01038 * 4.5),
            roof03: "-45.901 -25.015 192 108",
            sz3: "-43.605 -33.161 217.408 122.292",
            afterwardsWide: FL.vb.around(16.454, 46.5, 5.2),
            macro6x: FL.vb.around(roof[0], roof[1], 6.01038 * 6),
            decision: "-200.221 -80.22 433.351 243.76",
          },
        });
        cam.apply("roofEdgeMacro"); // static first frame

        // ================= STORY (unregistered, paused): Act I, driven by the scrub below
        var story = FL.story();
        cam.set(story, "roofEdgeMacro", 0);
        cam.move(story, "roofEdgeMacro", "overview", T("l01"), 4.0, "power2.inOut");
        var ordered = FL.sortByDistance(main, roof);
        FL.drawOn(story, ordered.slice(0, 3), { at: 0.4, duration: 0.7, stagger: 0.25, ease: "power2.out" });
        FL.drawOn(story, ordered.slice(3), { at: T("l01", 0.2), duration: 0.8, stagger: 0.035, ease: "power2.out" });
        FL.drawOn(story, FL.sortByDistance(over, roof), { at: T("l01", 0.9), duration: 0.6, stagger: 0.03, ease: "power1.out" });
        story.fromTo(heads, { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.02, ease: "power1.out" }, T("roof03", 1.0));
        cam.move(story, "overview", "roof03", T("roof03"), 2.2, "power2.inOut");
        cam.move(story, "roof03", "sz3", T("landing"), 2.0, "power2.inOut");
        // subtraction: heads go grey one by one on "offline" (no alarm)
        story.fromTo(heads, { opacity: 1 }, { opacity: 0.2, duration: 0.35, stagger: 0.05, ease: "power1.inOut", immediateRender: false }, T("offline"));
        cam.move(story, "sz3", "afterwardsWide", T("afterwards"), 2.5, "power2.inOut");
        story.fromTo(roughG, { opacity: 1 }, { opacity: 0.35, duration: 1.2, ease: "power1.inOut" }, T("afterwards", 0.4));
        // site clock and story-time readout live inside the story, so they run backward in the rewind
        var clockEl = document.getElementById("zz-proto-clock");
        FL.textTo(story, clockEl, { from: 6 * 3600, to: 7 * 3600, at: T("hour"), duration: 0.8, format: FL.hhmm });
        FL.textTo(story, clockEl, { from: 7 * 3600, to: 14 * 3600 + 18 * 60, at: T("l01", 3), duration: T("roof03") - T("l01", 3), ease: "power1.inOut", format: FL.hhmm });
        FL.textTo(story, clockEl, { from: 14 * 3600 + 18 * 60, to: 14 * 3600 + 41 * 60 + 59, at: T("roof03"), duration: LAND - T("roof03"), format: function (v) { return FL.hhmm(v, true); } });
        FL.textTo(story, clockEl, { from: 14 * 3600 + 41 * 60 + 59, to: 16 * 3600 + 7 * 60, at: T("offline"), duration: T("afterwards") - T("offline"), format: FL.hhmm });
        FL.textTo(story, document.getElementById("zz-proto-story-t"), { from: 0, to: RS, at: 0, duration: RS, format: function (v) { return "S " + v.toFixed(3); } });

        // ================= REGISTERED TIMELINE
        var tl = gsap.timeline({ paused: true });
        FL.scrub(tl, story, { at: 0, from: 0, to: RS, duration: RS, ease: "none" });
        FL.scrub(tl, story, { at: RS, from: RS, to: LAND, duration: RE - RS, ease: FL.rewindEase() });
        FL.textTo(tl, document.getElementById("zz-proto-film-t"), { from: 0, to: END, at: 0, duration: END, format: function (v) { return "T " + v.toFixed(3); } });

        // Act II: rough lines become precise (same command structure, plain attribute tween)
        var R = T("resolve");
        main.concat(over).forEach(function (p, i) {
          FL.morphD(tl, p, p.getAttribute("d"), p.__precise, R + (i % 40) * 0.006, 1.4, "expo.out");
        });
        FL.wobbleScale(tl, wobble, 2, 0, R, 1.2, "power2.out");
        tl.fromTo(roughG, { stroke: "#3B3A36" }, { stroke: "#5E5D59", duration: 1.0, ease: "power1.inOut", immediateRender: false }, R + 0.2);
        tl.fromTo(site, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.inOut", immediateRender: false }, R + 1.2);
        tl.fromTo(roughWrap, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.in", immediateRender: false }, R + 1.7);
        tl.set(roughWrap, { filter: "none" }, R + 1.25); // drop the filter once it is inert (render cost)
        cam.move(tl, "afterwardsWide", "overview", R, 2.4, "power2.inOut");
        cam.move(tl, "overview", "macro6x", T("welding"), 3.0, "power2.inOut");
        cam.drift(tl, "macro6x", T("welding", 3.0), 4.0, 0.012);
        tl.fromTo("#zz-proto-statement", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, T("prevention"));
        tl.to("#zz-proto-statement", { opacity: 0, duration: 0.5, ease: "power1.in" }, T("again", -0.6));
        cam.move(tl, "macro6x", "decision", T("again"), 2.6, "power2.inOut");
        var chain = FL.$$(document.getElementById("zz-proto-chain"), "span");
        ["chainRecord", "chainTrust", "chainDecision", "chainPrice", "chainCapacity"].forEach(function (c, i) {
          tl.fromTo(chain[i], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T(c));
        });
        tl.fromTo("#zz-proto-mark-bg", { opacity: 0 }, { opacity: 0.94, duration: 0.8, ease: "power1.inOut" }, T("priora", -0.4));
        tl.fromTo("#zz-proto-mark", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, T("priora"));

        window.__timelines["zz-proto"] = tl;
      </script>
    </template>
  </body>
</html>
