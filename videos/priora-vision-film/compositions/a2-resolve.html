    <title>a2-resolve: Priora today, prevention and proof (Frame 4, cut 3)</title>
    <!-- Ignored by the assembler. Everything the render needs is inside the template.

      HANDOFF IN (from a1-world, identical frame at cue rewindEnd; this scene crossfades in over 0.4 s):
        Mirrors the handoff contract written at the top of a1-world (its landing frame, site clock 14:41:59),
        cut 3 colour. SiteKit.mount(svg, { show: 'rough', rough: true, wobble: 2, grade: 'act1', field: true })
        at SiteKit.CAMERAS.landing (rect 43.5, 33.5, s 14.5): the rough twin fully drawn in colour pencil and
        watercolour at the Act I grade (--sk-wash = var(--c-wash-act1) 0.85, --sk-sat 1), --sk-bleed 1 (the
        rewind has flooded the colour back in), the pale envelope field ON (fieldG opacity 1), precise layer
        at 0. Rough zone labels at their default size (no --fui-lab scaling), the rough sprinkler zone label
        (.szl) hidden, paint numbers at 0.85, rough envelope (construct + firm) with its hand label at
        font-size 3.3, all 31 Sprinkler Zone 3 heads (site.rough.heads) in --c-water at opacity 1, the Sprinkler
        Zone 3 outline (the rough main path with data-src="sz3-outline") in var(--c-water), dashed and a little
        firmer than the other light lines (the rule in the style block below; a1-world applies the same rule).
        SketchKit world context at refScale 14.5 (the landing scale) with the hot-work marker (activityMarker
        'roof03Centre', variant 'hot', label 'HOT WORK · ROOF 03 · 14:18', scale 'world', refScale 14.5, ring
        at rest; amber by the kit), safeguardItems('roof03Centre', { refScale: 14.5, size: 18 }) (ok ticks,
        coloured by the kit) and the hand label 'SPRINKLER ZONE 3' (label at 'sprinklerZone3Label', leader
        [22, 30], size 18), all fully drawn. Nothing else visible. The chrome clock reads 14:41:59. The LANDING
        block in the script holds these settings in one place: if a1-world changes them, change them there too.
        The resolve then lands on the flat, full-colour precise site (site.resolve grades act1 to full).

      CUT 2 STAGING: one board. The precise site and every interface piece are laid out on one large board
      (5760 x 3800 board px) framed one thing at a time by FL.boardCam. The site keeps its own full-frame SVG
      (SiteKit's viewBox camera, so hairlines stay 1 px at every zoom) and is registered to the board at
      K0 = 12.5 board px per world unit: every board move is issued twice, once to the board (flBoard, zoom
      'linear') and once to the site's viewBox (SiteKit camera), with the same ease and duration, so both
      interpolate identically. Live lines, terminals and the node live in a board-level SVG whose --sw
      (board px per screen px) is tweened with the camera, so they stay screen-constant like the demo's.
        Board layout (board px):  hot-work node on Roof 03 at (2400, 1500);  capture strip north of it
        (left 2351, top 738, 1040 wide), its ACTIVITY underline directly above the node;  programme
        conditions card east (left 3160, 700 wide), 4.2 at the node's height, 4.3 at the height of the
        SPRINKLER ZONE 3 label's anchor;  activity card (left 1434) and trusted record (left 2606, 760 wide)
        side by side south of the site, top 2800.

      SHOTS (every time from a cue, a word anchor or the beat grid; see compositions/a2-resolve.events.json):
        S12  the landing resolves (precision-snap, finishing on "changed") into the flat, full-colour precise
             site; the worker's point (the demo's node, amber, checking) appears on Roof 03; push of 1.5 beats
             toward it, ending on the worker's first word.
        S13  match cut on L13.start: the node's dot becomes the dot at the start of the waveform line, at
             the same screen point; the camera follows the waveform as it draws (the capture strip fills
             the frame width); the words set on the worker's own times; on "six" the tokens underline in
             cobalt on half beats and drop into ACTIVITY / LOCATION / WINDOW, then BY; hold one beat.
        S14  from "Priora" the cobalt line leaves the ACTIVITY field, the camera follows it down to the node
             on Roof 03 (one beat) and on to the conditions card (one beat): 4.2 as a hero; on "conditions"
             the line runs on down the card to 4.3 and back to SPRINKLER ZONE 3 · ACTIVE; on "matter" pull
             back to the whole connection (strip, node, zone, card) and hold still to "It" (slow drift).
        S15  cut on "It" to the activity card at 2.4x; five rows verify on half beats from "certificate";
             on "keeps" the last check mark lifts off and becomes the record entry's marker while the
             camera whips one beat to the trusted record at 2.2x; two entries append inside "record".
        S16  on "prevention" pull back to the calm two-up (card left, record right, 1.4x), statements on
             their words; slow drift to the hard cut at l16.

      CUT 3 COLOUR (docs/cut3-direction.md section 1; tokens only, no hex in this file). Colour tells Act II:
        the worker's point is amber (--c-hot: the node's dot on a paper-white bed, its pulse, the matched dot
        at the start of the waveform, the capture strip's band); Sprinkler Zone 3 and condition 4.3 are water
        (protection, ACTIVE); everything Priora does is cobalt (--c-priora: the capture underlines and the
        STRUCTURED pill, the live lines, the node's reticle, the ring round a condition chip once the line
        reaches it, the trusted record's band); verification is green (--c-ok: the card's ticks and pills,
        the flying tick, the rail markers of the two new record entries). The node stays in its checking state
        (dashed ink ring, turning, easing to a stop as the connection lands) through S12 to S14: green arrives
        with verification, on the card, not before. At most three strong colours share a frame: S12 amber +
        water; S13 amber + cobalt; S14 amber + water + cobalt; S15 amber band + green; S16 amber band + cobalt
        band + green. The cobalt lines are 2.5 px (the demo's 2) so they read as their own layer over the site.
        Film-native pieces (scene-drawn, deviating from the demo; the product's words and logic unchanged): the
        capture strip has no border and takes the hot band when ACTIVITY is recognised, its state is a pill
        (LISTENING ink, STRUCTURED cobalt), the rule above the fields is gone; the programme conditions card is
        paper-white with one water band (protection conditions), no border, a 22 px mono head, the numbers as
        filled chips in their category (4.2 hot-soft with a hot border, 4.3 water-soft with a water border);
        the trusted record is borderless with a cobalt band (Priora's own record). The kit's activity card is
        unchanged except its green state words, a shade deeper for contrast.

      HANDOFF OUT (hard cut at cue l16, no fade): board camera on the two-up (card and record at 1.4x)
      drifted 1.2 percent; site layer at opacity 0; statements, label, card (hot band, 5 OF 5 VERIFIED ·
      INSIDE ENVELOPE, green ticks and pills) and record (cobalt band, 3 ENTRIES, the two new entries with
      green markers) visible. a3-change does not share this frame (hard cut).
    -->
  </head>

        #a2-resolve-board .fui-capture {

        #a2-resolve-clauses {

      <script>
        (function () {
          // Globals from index.html <head>: gsap (+ plugins), FL, CUES, SCENES, NARRATION, FL_EVENTS,
          // SITE_MODEL, SiteKit, UIKit, SketchKit. Nothing is loaded again here.
          var ID = "a2-resolve";
          var clk = FL.clock(ID);
          var T = function (a, off) {
            return clk.t(a, off);
          };
          var EV = function (name) {
            return clk.ev(name);
          };
          var DUR = clk.duration;
          var BEAT = FL.BEAT,
            HB = FL.BEAT / 2;
          var K = window.UIKit,
            SK = window.SiteKit,
            SKT = window.SketchKit,
            M = window.SITE_MODEL;
          var el = function (id) {
            return document.getElementById(id);
          };
          var fade = el(ID + "-fade"),
            svg = el(ID + "-site"),
            board = el(ID + "-board"),
            bov = el(ID + "-bov"),
            bovLines = el(ID + "-bov-lines"),
            bovNodes = el(ID + "-bov-nodes");
          var O = { prefix: ID, scene: ID };
          var opts = function (extra) {
            return Object.assign({}, O, extra || {});
          };
          var tl = gsap.timeline({ paused: true });
          FL.sceneFade(tl, fade, ID); // 0.4 s in over Frame 1's identical landing frame; hard cut out at l16

          // film-color.css tokens resolved for colour tweens (GSAP cannot interpolate var() or color-mix)
          var TK = function (n) {
            return SK.color(n);
          };
          var rgba = function (hex, a) {
            var h = String(hex).trim().replace("#", "");
            if (h.length === 3) h = h.replace(/(.)/g, "$1$1");
            return "rgba(" + [0, 2, 4].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }).join(",") + "," + a + ")";
          };

          // ================================================================ the Frame 1 handoff frame
          // LANDING: a1-world's landing frame (its handoff contract), cut 3 colour, in one place. SketchKit
          // seeds by content, so the same calls draw the same lines; the Roof 03 items are drawn to completion
          // on a throwaway timeline at build time. If a1-world changes any of this, change it here too.
          var LANDING = {
            grade: "act1", // --sk-wash var(--c-wash-act1), --sk-sat 1: colour pencil and watercolour
            field: true, // the pale envelope field is on
            bleed: 1, // the rewind has flooded the colour back in
            heads: 1, // all 31 zone 3 heads in --c-water (site.rough.heads)
            refScale: 14.5, // SiteKit.CAMERAS.landing: world-scaled lettering is 18 px here
            hot: { variant: "hot", label: "HOT WORK · ROOF 03 · 14:18", scale: "world" },
            safeguards: { size: 18 },
            szLabel: { text: "SPRINKLER ZONE 3", leader: [22, 30], size: 18 },
          };
          // SiteKit rough twin at CAMERAS.landing, fully drawn, with the precise layer beneath it.
          var site = SK.mount(svg, { prefix: ID + "-site", show: "rough", rough: true, wobble: 2, grade: LANDING.grade, field: LANDING.field });
          svg.style.setProperty("--sk-bleed", LANDING.bleed);
          site.rough.heads.forEach(function (hd) {
            hd.style.opacity = LANDING.heads;
          });
          var CAM = SK.CAMERAS;
          site.setView(CAM.landing);
          // Act I conventions at the landing: the zone 3 label is left to the scene (hidden), paint numbers at .85
          var szlRough = site.rough.labels ? site.rough.labels.querySelector(".szl") : null;
          if (szlRough) szlRough.style.opacity = 0;
          site.rough.zoneText.forEach(function (z) {
            z.style.opacity = 0.85;
          });
          // the envelope's hand lettering at a1-world's size
          if (site.rough.envelope.label) site.rough.envelope.label.setAttribute("font-size", "3.3");
          // zone labels at their Act I size; they grow to 18 px as they become precise
          svg.classList.add("fui-labels");
          svg.style.setProperty("--fui-lab", 1);
          svg.__fuiLab = 1;

          var W = SKT.world(site, { prefix: ID + "-sk", scene: ID, refScale: LANDING.refScale });
          var hot = SKT.activityMarker(W, "roof03Centre", Object.assign({ refScale: LANDING.refScale }, LANDING.hot));
          var sg = SKT.safeguardItems(W, "roof03Centre", Object.assign({ refScale: LANDING.refScale }, LANDING.safeguards));
          var szLab = SKT.label(W, "sprinklerZone3Label", LANDING.szLabel.text, { leader: LANDING.szLabel.leader, size: LANDING.szLabel.size });
          var pre = gsap.timeline({ paused: true });
          hot.drawOn(pre, 0, { events: false });
          sg.drawOn(pre, 0, { events: false });
          szLab.drawOn(pre, 0, { events: false });
          pre.progress(1);
          pre.kill();

          // ================================================================ the board and its camera
          // The site is registered to the board at K0 board px per world unit, with the hot-work node on
          // Roof 03 at NODE. A board rect {x, y, w} and a site viewBox are the same framing (bw / toB).
          var K0 = 12.5;
          var A = M.anchors.hotWorkNode.world; // [38.971, 32.5]
          var NODE = [2400, 1500];
          var BX = NODE[0] - K0 * A[0],
            BY = NODE[1] - K0 * A[1];
          var toB = function (p) {
            return [BX + K0 * p[0], BY + K0 * p[1]];
          };
          var bw = function (r) {
            return { x: (r.x - BX) / K0, y: (r.y - BY) / K0, w: r.w / K0, h: (r.w * 9) / 16 / K0 };
          };

          var FLY_B = [REC.x + 125, REC.y + 218.9 + 10]; // the hotStart entry's rail marker (measured in cut 2; + 10 for the band's head room)

          tl.fromTo(flyMk, { opacity: 0 }, { opacity: 1, duration: BEAT * 0.5, ease: "power1.inOut", immediateRender: false }, SLIDE + BEAT * 0.25);
          tl.fromTo(fly, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in", immediateRender: false }, RA1 + 0.05);

          // ================================================================ S16 prevention and proof (L15)
          // on the board, over their evidence (board px; 64 px and 18 px on screen at the two-up)
          var ST_Y0 = CARD.y - 392 / zTwo; // top of the two-up frame
          var st = K.statements(

          st.reveal(tl, T("prevention", 0.12), 0);
