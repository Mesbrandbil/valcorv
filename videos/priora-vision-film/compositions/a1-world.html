<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>a1-world: the graphite site today, the invisible crossing, the rewind (Frame 1)</title>
    <!-- Ignored by the assembler. Everything that must exist at render time is inside <template>. -->
  </head>
  <body>
    <template id="a1-world-template">
      <link rel="stylesheet" href="assets/css/film.css" />
      <link rel="stylesheet" href="assets/css/film-sketch.css" />
      <style>
        /*
          HANDOFF CONTRACT FOR a2-resolve (the frame at story time of cue 'landing', site clock 14:41:59)

          The rewind lands on this exact state and holds it from cue rewindEnd to the end of the slot
          (rewindEnd + 0.4). a1-world never fades out: a2-resolve fades in over it on an identical frame.

          Camera   SiteKit.CAMERAS.landing = SiteKit.rect(43.5, 33.5, 14.5)
                   viewBox "-22.7069 -3.7414 132.4138 74.4828", --sw 0.068966 (world units per screen px).
          Site     SiteKit.mount(svg, { prefix, show: 'rough', rough: true, wobble: 2 }), graphite twin at rest:
                   every unit fully drawn (main, overdraw, construction overshoot, hatching, paper occlusion);
                   precise layer opacity 0; rough root opacity 1; wobble filter scale 2 on the svg, no blur
                   (a feGaussianBlur appended to that filter by a1-world sits at stdDeviation 0);
                   zone paint numbers 01 02 03 at opacity 0.85; zone labels (.zl) at opacity 1;
                   the rough sprinkler-zone label group (.szl) hidden (opacity 0);
                   envelope construct pass, firm pass and the textPath label at opacity 1, intact (a1-world's
                   redraw mask on them is inert at the landing); the label is
                   'ACCEPTED CONDITIONS · PROPERTY + BI PROGRAMME' with font-size set to 3.3 (kit default 2.2);
                   all 31 zone 3 sprinkler heads (site.rough.heads) at opacity 1 (graphite, "in ink").
                   Sprinkler Zone 3 outline (the rough unit whose main path has data-src="sz3-outline")
                   dashed and a little firmer than the other lite lines (the rule below), opacity 1.
          Items    const W = SketchKit.world(site, { prefix, scene, refScale: 14.5 });   all fully drawn:
                   SketchKit.activityMarker(W, 'roof03Centre', { variant: 'hot', label: 'HOT WORK · ROOF 03 · 14:18',
                     angle: -128, leadPx: 86, scale: 'world', refScale: 14.5 })     ring scale exactly 1
                   SketchKit.safeguardItems(W, 'roof03Centre', { refScale: 14.5, size: 18 }) (the kit's default schedule layout)
                     every item drawn and ticked (CERTIFICATE, FIRE WATCH, EXTINGUISHER, AREA CLEARED, SPRINKLERS)
                   SketchKit.label(W, 'sprinklerZone3Label', 'SPRINKLER ZONE 3', { leader: [22, 30], size: 18 })
                   (screen-constant lettering, the kit's default annotations 'screen').
                   At the landing scale the hot-work label and the five safeguard labels are 18 px.
          At 0     everything else a1-world draws: contractors, van, gate, routes, LOTO tag, the five morning
                   markers, the toolbox talk, the HSE walk, the accumulation field, containment lines, the ROOF 03
                   marker, the three opening construction strokes, the SZ3 valve tag, the condition connection
                   (drawn after the landing, on 'nothingLooks'), the envelope redraw, the incident box. No blue.

          CAMERA PATH (FL.camera layer "story" on both svgs), for overlays that pin to site points:
            siteOverview -> siteLeft over [insurance, insurance + 2.2] (power2.inOut), then a 1.2 % push-in drift
            (sine.inOut) to noOne; siteLeft drift -> siteWide from noOne over 1.9 s.
            Afterwards: SiteKit.CAMERAS.roof03AndSz3 held exactly from nothingLooks + 2.0 to afterwards, then
            roof03AndSz3 -> afterwardsWide over [afterwards, tooLate - 0.8] (sine.inOut), then afterwardsWide
            held exactly to rewindStart (SketchKit.followPin(tl, frag, pt, roof03AndSz3, afterwardsWide,
            T('afterwards'), T('tooLate', -0.8) - T('afterwards'), 'sine.inOut') keeps a pin on its point).

          The Sprinkler Zone 3 outline rule (a2-resolve must apply the same to its own twin):
        */
        #a1-world-site .sk-rough path.sk-main[data-src="sz3-outline"] {
          stroke: #5e5d59;
          stroke-width: calc(var(--sw) * 1.2px);
          stroke-dasharray: calc(var(--sw) * 5px) calc(var(--sw) * 3.5px);
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #a1-world-all,
        #a1-world-sitewrap,
        #a1-world-ovwrap {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        #a1-world-site,
        #a1-world-ov {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          display: block;
        }
      </style>

      <div id="root" data-composition-id="a1-world" data-width="1920" data-height="1080">
        <div id="a1-world-all">
          <div id="a1-world-sitewrap" data-layout-ignore>
            <svg id="a1-world-site" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <div id="a1-world-ovwrap" data-layout-ignore>
            <svg id="a1-world-ov" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Globals from index.html <head>: gsap (+ DrawSVG, CustomEase), FL, CUES, SCENES, FL_EVENTS,
          // SITE_MODEL, SiteKit, SketchKit. Nothing is loaded again here.
          var ID = "a1-world";
          var clk = FL.clock(ID);
          var T = function (a, off) {
            return clk.t(a, off);
          };
          var EV = function (name) {
            return clk.ev(name);
          };
          var EVD = function (name) {
            return FL.events(ID)[name].dur;
          };
          var SK = window.SiteKit,
            K = window.SketchKit,
            HU = K.util;
          var el = function (id) {
            return document.getElementById(id);
          };
          var RS = T("rewindStart"),
            RE = T("rewindEnd"),
            LAND = T("landing");

          var siteWrap = el(ID + "-sitewrap"),
            ovWrap = el(ID + "-ovwrap"),
            svg = el(ID + "-site"),
            ov = el(ID + "-ov");

          // ================================================================ the site (graphite twin)
          var site = SK.mount(svg, { prefix: ID, show: "rough", rough: true, wobble: 2 });
          var CAM = SK.CAMERAS;
          // a depth-of-field blur rides on the site's own tremor filter (one filtered layer, screen space)
          var wobbleFilter = site.disp.parentNode;
          var blur = FL.svgEl("feGaussianBlur", { stdDeviation: "0" }, wobbleFilter);

          // overlay world (same camera, no tremor, no recede): the incident annotation
          ov.setAttribute("preserveAspectRatio", "xMidYMid slice");
          ov.style.overflow = "hidden";

          // one camera system for both svgs: FL.camera, layer "story" (only the story timeline moves it)
          var cam = FL.camera([svg, ov], {
            layer: "story",
            rects: {
              roofEdgeMacro: CAM.roofEdgeMacro,
              siteOverview: CAM.siteOverview,
              siteLeft: CAM.siteLeft,
              siteWide: CAM.siteWide,
              roof03: CAM.roof03,
              landing: CAM.landing,
              sz3: CAM.sz3,
              roof03AndSz3: CAM.roof03AndSz3,
              afterwardsWide: CAM.afterwardsWide,
            },
          });
          cam.apply("roofEdgeMacro");

          var W = K.world(site, { prefix: ID, scene: ID, refScale: 7.1 });
          var Wov = K.world({ svg: ov, prefix: ID + "-ov", view: CAM.afterwardsWide }, { prefix: ID + "-ov", scene: ID, refScale: 7.4 });

          // annotation groups (each group's opacity has one owner: the story)
          var g = function (name, parent) {
            return FL.svgEl("g", { id: ID + "-" + name }, parent);
          };
          var gCons = g("cons", W.top);
          var gMornGround = g("morn-ground", W.ground);
          var gMorn = g("morn", W.top);
          var gField = g("field", W.top);
          var gRoofMk = g("roofmk", W.top);
          var gRoof03 = g("roof03", W.top);
          var gLater = g("later", W.top);

          var story = FL.story();
          cam.set(story, "roofEdgeMacro", 0);

          // ================================================================ 1.1 lead-in: three construction strokes
          // The production hall's north roof corner, set out with a set square before the drawing begins.
          var uMacro = 1 / 30;
          var consLines = [
            [[22.52, 9.0], [57.16, 29.0]], // north-east roof edge, from the corner
            [[22.52, 9.0], [-1.73, 23.0]], // north-west roof edge
            [[33.77, 15.5], [9.53, 29.5]], // the division between roofs 01 and 02
          ];
          var consRecs = consLines.map(function (seg, i) {
            return HU.hand(W, gCons, HU.lineCmds(seg, false), { u: uMacro, seed: ID + "cons" + i, jit: 0.8, ext: true, extMin: 10, cls: i === 2 ? "skt-lite" : "" });
          });
          var drawRec = function (tl, rec, t, d, ease) {
            tl.fromTo(rec.main, { drawSVG: "0%" }, { drawSVG: "100%", duration: d, ease: ease || "power1.inOut", immediateRender: true }, t);
            if (rec.over) tl.fromTo(rec.over, { drawSVG: "0%" }, { drawSVG: "100%", duration: d * 0.8, ease: "power1.inOut", immediateRender: true }, t + d * 0.45);
            if (rec.ext) tl.fromTo(rec.ext, { drawSVG: "0%" }, { drawSVG: "100%", duration: Math.min(0.22, d * 0.6), ease: "power1.out", immediateRender: true }, t + d * 0.9);
          };
          drawRec(story, consRecs[0], EV("cons-1"), EVD("cons-1"), "power2.inOut");
          drawRec(story, consRecs[1], EV("cons-2"), EVD("cons-2"), "power2.inOut");
          drawRec(story, consRecs[2], EV("cons-3"), EVD("cons-3"), "power1.inOut");
          // they merge into the building's own edges, then lift away (not part of the landing frame)
          story.fromTo(gCons, { opacity: 1 }, { opacity: 0, duration: 1.2, ease: "power1.inOut", immediateRender: false }, T("hour", 0.2));

          // ================================================================ 1.2 the site draws itself (L01)
          cam.to(story, "siteOverview", T("l01"), 4.0, "power2.inOut");
          var ORDER = ["production-hall", "production-hall-2", "pipe-bridge", "utilities", "loading-area-containers", "roads", "tanks", "warehouse", "loading-area", "laboratory", "ground-crosses"];
          var drawEnd = site.drawOn(story, EV("site-draw-01"), { order: ORDER, perBuilding: 0.8, stagger: 0.26, scene: ID });
          // sprinkler heads (zone 3) arrive with the production hall roofs; the zone outline waits for 1.7
          var heads = site.rough.heads.slice().sort(function (a, b) {
            return (+a.getAttribute("data-i") || 0) - (+b.getAttribute("data-i") || 0);
          });
          story.fromTo(heads, { opacity: 0 }, { opacity: 1, duration: 0.22, stagger: 0.018, ease: "power1.out", immediateRender: true }, T("l01", 0.75));
          var szUnit = (site.rough.byBuilding["sprinkler-zone-3"] || [])[0];
          var szOutline = szUnit && szUnit.main;
          // the site kit's own zone-3 label stays hidden (drawOn sets it); Act I letters its own
          cam.drift(story, null, T("l01", 4.0), T("insurance") - T("l01", 4.0), 0.012);

          // ================================================================ 1.3 people and work (L02)
          var PL = K.PLACES;
          var gate = K.gate(W, "gate", { label: false, layer: gMorn });
          gate.drawOn(story, T("contractors", -0.4), { events: false });
          var ROUTE = [{ plan: PL.gateOutside.plan }, "gate", { plan: [104, 41.4, 0] }, { plan: [99, 48, 0] }, "contractorsStop"];
          var route = K.dottedPath(W, ROUTE, {
            layer: gMornGround,
            labelLayer: gMorn,
            label: "CONTRACTORS · GATE 2 · 07:10",
            labelFrac: 0.05,
            labelLeader: [26, -58],
            labelSize: 18,
            spacingPx: 6.5,
          });
          route.drawOn(story, EV("route-01"), { events: false });

          var van = K.van(W, { plan: [108.5, 46.5, 0] }, { heading: 180, size: 1.15, layer: gMorn }); // beside the route, not on it
          van.drawOn(story, EV("van"), { speed: 2.4, events: false });
          van.drive(story, EV("van"), { dur: EVD("van"), events: false });

          // ---------------------------------------------------------------- walkers (in-scene gait)
          // An architect's entourage figure (the kit's side-view silhouette), animated with a real
          // alternating-leg gait: the stance foot stays planted while the body passes over it, the
          // swing foot lifts and the knee leads, the near arm swings against the near leg, and the
          // body rises at mid-stance and settles at double support. Eight poses per stride, all the
          // same command structure, so every pose is a plain attribute tween (seek-safe).
          function armShape(pts, w) {
            var left = [], right = [];
            for (var i = 0; i < pts.length; i++) {
              var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
              var tx = b[0] - a[0], ty = b[1] - a[1], L = Math.hypot(tx, ty) || 1;
              tx /= L; ty /= L;
              var ww = w * (i === pts.length - 1 ? 0.82 : 1);
              left.push([pts[i][0] - ty * ww, pts[i][1] + tx * ww]);
              right.push([pts[i][0] + ty * ww, pts[i][1] - tx * ww]);
            }
            var e = pts[pts.length - 1], p = pts[pts.length - 2];
            var ex = e[0] - p[0], ey = e[1] - p[1], EL = Math.hypot(ex, ey) || 1;
            return left.concat([[e[0] + (ex / EL) * w * 0.95, e[1] + (ey / EL) * w * 0.95]], right.reverse());
          }
          // pose in figure units (height 1, feet at y 0, facing +x)
          function walkPose(q) {
            var bob = q.bob || 0, hipY = -0.465 - bob;
            var leg = function (hx, f, lift, knee) {
              var fy = -0.04 - lift;
              var ax = function (t) { return hx + (f - hx) * t + knee * Math.sin(Math.PI * t); };
              var ay = function (t) { return hipY + (fy - hipY) * t; };
              return {
                back: [[ax(0.28) - 0.045, ay(0.28)], [ax(0.55) - 0.036, ay(0.55)], [ax(0.8) - 0.03, ay(0.8)], [f - 0.026, fy - 0.006]],
                foot: [[f - 0.033, -0.005 - lift], [f + 0.058, -0.005 - lift], [f + 0.052, -0.027 - lift]],
                fr: [[f + 0.016, fy - 0.016], [ax(0.8) + 0.02, ay(0.8)], [ax(0.55) + 0.03, ay(0.55)], [ax(0.28) + 0.036, ay(0.28)]],
              };
            };
            var l1 = leg(-0.012, q.f1, q.l1 || 0, q.k1 || 0), l2 = leg(0.012, q.f2, q.l2 || 0, q.k2 || 0);
            var up = function (pts) { return pts.map(function (p) { return [p[0], p[1] - bob]; }); };
            var body = up([[-0.024, -0.84], [-0.056, -0.809], [-0.066, -0.733], [-0.064, -0.62], [-0.058, -0.505]])
              .concat(l1.back, l1.foot, l1.fr, [[0.004, -0.43 - bob]], l2.back, l2.foot, l2.fr,
                up([[0.052, -0.49], [0.058, -0.602], [0.062, -0.716], [0.05, -0.801], [0.018, -0.84]]));
            var sw = q.sw || 0;
            var sh = [0.0, -0.792 - bob], elb = [sw * 0.052, -0.645 - bob], hd = [0.004 + sw * 0.112, -0.508 - bob];
            return { body: body, arm: armShape([sh, elb, hd], 0.023), hand: hd, bob: bob };
          }
          var GAIT = { A: 0.2, lift: 0.045, knee: 0.035, bob: 0.028 };
          function gaitPose(phi, A, carrying) {
            var legAt = function (ph) {
              ph = ((ph % 1) + 1) % 1;
              if (ph < 0.5) return { f: A - (2 * A * ph) / 0.5, lift: 0, knee: 0 }; // stance: planted
              var u = (ph - 0.5) / 0.5, s = 0.5 - 0.5 * Math.cos(Math.PI * u);
              return { f: -A + 2 * A * s, lift: GAIT.lift * Math.sin(Math.PI * u), knee: GAIT.knee * Math.sin(Math.PI * u) };
            };
            var a = legAt(phi), b = legAt(phi + 0.5);
            var bob = GAIT.bob * 0.5 * (1 - Math.cos(4 * Math.PI * phi));
            var sw = (carrying ? 0.08 : 0.75) * (a.f / A);
            return walkPose({ f1: a.f, f2: b.f, l1: a.lift, l2: b.lift, k1: a.knee, k2: b.knee, bob: bob, sw: sw });
          }
          var STAND = function (carrying) {
            return walkPose({ f1: -0.05, f2: 0.055, sw: carrying ? 0.08 : 0.05 });
          };
          function ellipseCmds(cx, cy, rx, ry) {
            var k = 0.5523;
            return [["M", [cx + rx, cy]], ["C", [cx + rx, cy + ry * k, cx + rx * k, cy + ry, cx, cy + ry]], ["C", [cx - rx * k, cy + ry, cx - rx, cy + ry * k, cx - rx, cy]],
              ["C", [cx - rx, cy - ry * k, cx - rx * k, cy - ry, cx, cy - ry]], ["C", [cx + rx * k, cy - ry, cx + rx, cy - ry * k, cx + rx, cy]], ["Z", []]];
          }
          var wn = 0;
          function makeWalker(ctx, layer, o) {
            var u = 1 / o.refScale, h = o.heightPx * u, carrying = !!o.carry;
            var root = FL.svgEl("g", { id: ID + "-walker-" + wn++, class: "skt-item" }, layer);
            var face = FL.svgEl("g", { transform: "scale(1 1)" }, root);
            var headG = FL.svgEl("g", { transform: "translate(0 0)" }, face);
            var sc = function (pts) { return pts.map(function (p) { return [p[0] * h, p[1] * h]; }); };
            var dBody = function (P) { return SK.fmt(HU.smoothCmds(sc(P.body), true)); };
            var dArm = function (P) { return SK.fmt(HU.smoothCmds(sc(P.arm), true)); };
            var dBox = function (P) {
              var x = P.hand[0] * h, y = P.hand[1] * h + 0.02 * h, bw = 0.15 * h, bh = 0.1 * h;
              return SK.fmt(HU.lineCmds([[x - bw * 0.35, y], [x + bw * 0.65, y], [x + bw * 0.65, y + bh], [x - bw * 0.35, y + bh]], true));
            };
            var P0 = gaitPose(0, GAIT.A, carrying);
            var opt = { u: u, jit: 0, occ: true, over: false, cls: "skt-fine" };
            var head = HU.hand(ctx, headG, ellipseCmds(0.012 * h, -0.905 * h, 0.051 * h, 0.06 * h), opt);
            var body = HU.hand(ctx, face, dBody(P0), opt);
            var arm = HU.hand(ctx, face, dArm(P0), { u: u, jit: 0, occ: true, over: false, cls: "skt-lite" });
            var keyed = [[body.main, dBody], [body.occ, dBody], [arm.main, dArm], [arm.occ, dArm]];
            if (o.carry === "box") {
              var box = HU.hand(ctx, face, dBox(P0), { u: u, jit: 0, occ: true, over: false, cls: "skt-fine" });
              keyed.push([box.main, dBox], [box.occ, dBox]);
            }
            return { root: root, face: face, headG: headG, h: h, u: u, keyed: keyed, carrying: carrying };
          }
          // walk a smoothed route: position (piecewise linear), facing, stride cycles, settle to standing
          function walk(tl, wk, route, o) {
            var pl = HU.flatten(HU.smoothCmds(route, false), 12)[0];
            var L = HU.plLen(pl);
            var s0 = Math.min(L, (o.startPx || 0) * wk.u), s1 = Math.max(s0, L - (o.stopShortPx || 0) * wk.u);
            if (o.maxLen != null) s1 = Math.min(s1, s0 + o.maxLen);
            var speed = o.speed; // world units per second
            var dur = (s1 - s0) / speed;
            var P0 = o.period || 0.92;
            var n = Math.max(1, Math.round(dur / P0)), P = dur / n;
            // stride matched to the ground speed so the stance foot stays planted (horizontal component)
            var hx = Math.abs(HU.pointAt(pl, s1).p[0] - HU.pointAt(pl, s0).p[0]) / Math.max(1e-6, s1 - s0);
            var A = Math.min(0.24, Math.max(0.12, (speed * Math.max(0.6, hx) * P) / (4 * wk.h)));
            var t = o.t;
            var pos = function (s) { return HU.pointAt(pl, Math.max(0, Math.min(L, s))).p; };
            var tr = function (q) { return "translate(" + q[0].toFixed(3) + " " + q[1].toFixed(3) + ")"; };
            var N = Math.max(2, Math.ceil(dur / 0.2));
            wk.root.setAttribute("transform", tr(pos(s0)));
            var facing = null;
            for (var i = 0; i < N; i++) {
              var a = pos(s0 + ((s1 - s0) * i) / N), b = pos(s0 + ((s1 - s0) * (i + 1)) / N), ti = t + (i * dur) / N;
              tl.fromTo(wk.root, { attr: { transform: tr(a) } }, { attr: { transform: tr(b) }, duration: dur / N, ease: "none", immediateRender: false }, ti);
              var dx = b[0] - a[0], seg = Math.hypot(dx, b[1] - a[1]);
              if (seg < 1e-6) continue;
              var dir = dx >= 0 ? 1 : -1;
              if (facing === null) {
                facing = dir;
                wk.face.setAttribute("transform", "scale(" + dir + " 1)");
              } else if (dir !== facing && Math.abs(dx) > seg * 0.3) {
                tl.fromTo(wk.face, { attr: { transform: "scale(" + facing + " 1)" } }, { attr: { transform: "scale(" + dir + " 1)" }, duration: 0.01, ease: "none", immediateRender: false }, ti);
                facing = dir;
              }
            }
            // stride cycle: eight poses, repeated a whole number of times
            var KP = 8, poses = [];
            for (var k = 0; k <= KP; k++) poses.push(gaitPose((k % KP) / KP, A, wk.carrying));
            var cyc = gsap.timeline({ repeat: n - 1 });
            for (var k2 = 0; k2 < KP; k2++) {
              wk.keyed.forEach(function (kv) {
                cyc.fromTo(kv[0], { attr: { d: kv[1](poses[k2]) } }, { attr: { d: kv[1](poses[k2 + 1]) }, duration: P / KP, ease: "none", immediateRender: false }, (k2 * P) / KP);
              });
              var hb0 = -poses[k2].bob * wk.h, hb1 = -poses[k2 + 1].bob * wk.h;
              cyc.fromTo(wk.headG, { attr: { transform: "translate(0 " + hb0.toFixed(4) + ")" } }, { attr: { transform: "translate(0 " + hb1.toFixed(4) + ")" }, duration: P / KP, ease: "none", immediateRender: false }, (k2 * P) / KP);
            }
            tl.add(cyc, t);
            var end = t + dur;
            if (o.settle !== false) {
              var st = STAND(wk.carrying);
              wk.keyed.forEach(function (kv) {
                tl.fromTo(kv[0], { attr: { d: kv[1](poses[0]) } }, { attr: { d: kv[1](st) }, duration: 0.4, ease: "power1.out", immediateRender: false }, end);
              });
            }
            if (o.fadeIn) tl.fromTo(wk.root, { opacity: 0 }, { opacity: 1, duration: o.fadeIn, ease: "power1.out", immediateRender: true }, t);
            return end;
          }

          // contractors in file from the gate to the loading-area apron
          var FIG_PX = 28, REF_OV = 7.1;
          var fileRoute = ["gate", { plan: [104, 41.4, 0] }, { plan: [99, 48, 0] }, "contractorsStop"].map(W.pt);
          var carries = [null, "box", null, null, "box"];
          var WALK_SPEED = 3.5; // world units per second (about 25 px/s at the overview)
          var GAP_PX = 14;
          var walkEnd = 0;
          for (var fi = 0; fi < 5; fi++) {
            var wk = makeWalker(W, gMorn, { refScale: REF_OV, heightPx: FIG_PX, carry: carries[fi] });
            var delay = (fi * GAP_PX) / REF_OV / WALK_SPEED;
            walkEnd = Math.max(walkEnd, walk(story, wk, fileRoute, { t: EV("footsteps") + delay, speed: WALK_SPEED, stopShortPx: fi * GAP_PX, fadeIn: 0.35, period: 0.9 + fi * 0.02 }));
          }

          // isolation: a small lockout tag at Utilities, and the lettering on a leader beside it
          var loto = K.valveTag(W, "lotoValve", { lines: ["LOTO"], size: 11, side: "left", drop: 20, reach: 14, valveSize: 7, layer: gMorn });
          loto.drawOn(story, T("isolated", -0.2), { speed: 1.6, events: false });
          var lotoLab = K.label(W, "lotoValve", "ISOLATED · LOTO · 07:40", { leader: [-70, -170], size: 18, layer: gMorn });
          lotoLab.drawOn(story, T("isolated", 0.35), { events: false });

          // work moves: five markers, the HSE site walk, the toolbox talk
          var MK = [
            [{ plan: [96, 64, 0] }, "LIFT · LOADING AREA", "se"],
            [{ plan: [16, 12, 9] }, "ELECTRICAL · UTILITIES", "w"],
            [{ plan: [58, 72, 5] }, "INSPECTION · WAREHOUSE", "sw"],
            [{ plan: [94, 20, 4.5] }, "MAINTENANCE · PH2", "e"],
            [{ plan: [12, 46, 11] }, "SAMPLING · LABORATORY", "nw"],
          ];
          var marks = MK.map(function (m, i) {
            var mk = K.activityMarker(W, m[0], { label: m[1], dir: m[2], leadPx: i === 1 ? 22 : undefined, size: 18, layer: gMorn });
            var t0 = EV("markers-0" + (i + 1));
            var e = mk.drawOn(story, t0, { speed: 2.0, events: false });
            // breathing: a finite drift that comes to rest before Frame 1 pulls wide
            var bd = T("noOne") - e - 0.1, nHalf = Math.max(2, 2 * Math.floor(bd / 2.6));
            mk.breathe(story, e + 0.05, bd, { amp: 0.06, period: ((2 * bd) / nHalf) * 0.999 });
            return mk;
          });
          var hse = K.dottedPath(W, PL.hseWalkLoop.plan, {
            plan: true,
            closed: true,
            layer: gMornGround,
            labelLayer: gMorn,
            label: "HSE SITE WALK · 07:30",
            labelFrac: 0.56,
            labelLeader: [-30, 86],
            labelSize: 18,
            spacingPx: 7,
            arrowAt: 0.8,
            dur: 1.3,
          });
          hse.drawOn(story, EV("hse-loop-01"), { speed: 1.5, events: false });
          var hseWalker = makeWalker(W, gMorn, { refScale: REF_OV, heightPx: FIG_PX, carry: null });
          var hsePts = [[71.6, 74.8, 0], [51.5, 75.6, 0], [31.6, 74.6, 0], [30.6, 58.5, 0]].map(function (p) { return K.iso(p[0], p[1], p[2]); });
          walk(story, hseWalker, hsePts, { t: EV("hse-footsteps"), speed: 2.9, period: 0.98, fadeIn: 0.4, settle: false, maxLen: 2.9 * (T("roof03", 1.4) - EV("hse-footsteps")) });

          var talk = K.groupFigures(W, { kind: "semicircle", centre: "toolboxTalk", n: 5, label: ["TOOLBOX TALK · 07:15", "11 PEOPLE"], labelLeader: [-44, 26], labelSize: 18, layer: gMorn });
          talk.drawOn(story, EV("toolbox"), { events: false });

          // once Frame 2 leads, the morning lettering lifts (it would sit off the safe area at siteLeft and
          // under the detail sheet); the drawn people, van, marks and routes stay
          var mornLetters = [route.parts.label.root, hse.parts.label.root, talk.labelItem.root, lotoLab.root];
          marks.forEach(function (mk) {
            (mk.lines || []).forEach(function (ln) { mornLetters.push(ln.wrap); });
            if (mk.parts.leader) mornLetters.push(mk.parts.leader.main);
          });
          story.fromTo(mornLetters, { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power1.inOut", immediateRender: false }, T("insurance", 0.68));

          // ================================================================ 1.4 the accepted envelope (L03)
          cam.to(story, "siteLeft", T("insurance"), 2.2, "power2.inOut");
          cam.drift(story, null, T("insurance", 2.2), T("noOne") - T("insurance", 2.2), 0.012);
          var env = site.rough.envelope;
          // the envelope's hand lettering at a legible size (18 px at siteWide, 17.8 px at siteLeft)
          if (env.label) env.label.setAttribute("font-size", "3.3");
          story.fromTo(env.construct, { drawSVG: "0%" }, { drawSVG: "100%", duration: EVD("envelope-construct"), ease: "power1.inOut", immediateRender: true }, EV("envelope-construct"));
          story.fromTo(env.firm, { drawSVG: "0%" }, { drawSVG: "100%", duration: T("accepted") - EV("envelope-firm"), ease: "power1.inOut", immediateRender: true }, EV("envelope-firm"));
          story.fromTo(env.label, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out", immediateRender: true }, EV("envelope-label"));
          // Frame 2 leads: the drawing steps back to 80 percent while the detail sheet works
          story.fromTo(siteWrap, { opacity: 1 }, { opacity: 0.8, duration: 1.0, ease: "power1.inOut", immediateRender: false }, T("insurance", 0.4));
          story.fromTo(siteWrap, { opacity: 0.8 }, { opacity: 1, duration: 0.8, ease: "power1.inOut", immediateRender: false }, T("noOne", -0.3));

          // ================================================================ 1.6 no one can hold a moving site in mind (L05)
          cam.to(story, "siteWide", T("noOne"), 1.9, "power2.inOut");
          cam.drift(story, null, T("noOne", 1.9), T("roof03") - T("noOne", 1.9), 0.006);
          var field = K.activityField(W, { count: 36, seed: "a1-world", layer: gField, refScale: 5.5, labelCount: 8, labelSize: 16, tagSize: 13, trailFrac: 0.6, minDist: 3.1, columnPx: 560 });
          field.drawOn(story, EV("field-01"), { span: T("head", -0.1) - EV("field-01"), accel: 0.8, speed: 2.2, events: false });
          var roofMk = K.activityMarker(W, "roof03Centre", { label: "ROOF 03", angle: -62, leadPx: 46, size: 18, layer: gRoofMk });
          roofMk.drawOn(story, T("noOne", 0.3), { speed: 1.4, events: false });
          var near = function (c, r) {
            return field.points.filter(function (p) { return Math.hypot(p[0] - c[0], p[1] - c[1]) < r; });
          };
          var CONT = [[[-14, 26], 13, "c1", false], [[34, 70], 12, "c2", false], [[6, 44], 11, "c3", true]];
          CONT.forEach(function (c, i) {
            var pts = near(c[0], c[1]);
            if (pts.length < 2) pts = [c[0], [c[0][0] + 6, c[0][1] + 3]];
            var lasso = K.containment(W, pts, { padPx: 16, seed: c[2], lite: c[3], layer: gField, refScale: 5.5, dur: 0.62 });
            lasso.drawOn(story, EV("containment-0" + (i + 1)), { events: false });
          });
          // on "mind": everything but Roof 03 steps back
          var dimT = T("head"), dimD = 0.6;
          [gField, gMorn, gMornGround].forEach(function (grp) {
            story.fromTo(grp, { opacity: 1 }, { opacity: 0.25, duration: dimD, ease: "power1.inOut", immediateRender: false }, dimT);
          });
          story.fromTo(site.rough.root, { opacity: 1 }, { opacity: 0.3, duration: dimD, ease: "power1.inOut", immediateRender: false }, dimT);

          // ================================================================ 1.7 Roof 03: hot work, every safeguard in place (L06)
          cam.to(story, "roof03", T("roof03"), 2.2, "power2.inOut");
          story.fromTo(site.rough.root, { opacity: 0.3 }, { opacity: 1, duration: 1.6, ease: "power1.inOut", immediateRender: false }, T("roof03", 0.2));
          [gField, gMorn, gMornGround].forEach(function (grp) {
            story.fromTo(grp, { opacity: 0.25 }, { opacity: 0, duration: 1.1, ease: "power1.in", immediateRender: false }, T("roof03"));
          });
          story.fromTo(gRoofMk, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.inOut", immediateRender: false }, T("hotWork", -0.15));

          var REF_R = 14.5; // world-scaled lettering authored at the landing scale: 18 px at the handoff
          var hot = K.activityMarker(W, "roof03Centre", { variant: "hot", label: "HOT WORK · ROOF 03 · 14:18", angle: -128, leadPx: 86, scale: "world", refScale: REF_R, layer: gRoof03 });
          var hotEnd = hot.drawOn(story, EV("hot-marker"), { speed: 1.8, events: false });
          // the reviewed kit's safeguard schedule (default layout); a2-resolve builds the same at the landing
          var sg = K.safeguardItems(W, "roof03Centre", { refScale: REF_R, size: 18, layer: gRoof03 });
          var SG_KEYS = ["certificate", "fireWatch", "extinguisher", "areaCleared", "sprinklers"];
          SG_KEYS.forEach(function (k, i) {
            var it = sg.items[k];
            var tickAt = EV("tick-0" + (i + 1));
            it.drawOn(story, tickAt + 0.16 - it.duration, { events: false });
          });
          // Sprinkler Zone 3: the dashed outline and its lettering
          if (szOutline) story.fromTo(szOutline, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.inOut", immediateRender: true }, T("hotWork", 0.8));
          var szLab = K.label(W, "sprinklerZone3Label", "SPRINKLER ZONE 3", { leader: [22, 30], size: 18, layer: gRoof03 });
          szLab.drawOn(story, EV("sz3-label"), { speed: 1.5, events: false });
          // the marker's quiet life, resting exactly at the landing
          var breatheTo = function (t0, t1) {
            var bd = t1 - t0, nHalf = Math.max(2, 2 * Math.floor(bd / 2.6));
            hot.breathe(story, t0, bd, { amp: 0.05, period: ((2 * bd) / nHalf) * 0.999 });
          };
          breatheTo(hotEnd + 0.05, LAND);

          // ================================================================ 1.8 the landing, 1.9 the unnoticed change (L07)
          cam.to(story, "landing", T("roof03", 2.2), LAND - T("roof03", 2.2), "sine.inOut");
          cam.to(story, "sz3", T("sprinkler", -0.3), 1.6, "power2.inOut");
          cam.drift(story, null, T("sprinkler", 1.3), T("nothingLooks") - T("sprinkler", 1.3), 0.006);
          var szTag = K.valveTag(W, "sprinklerZone3Valve", { text: "SZ3 ISOLATED · MAINTENANCE · 14:42", hand: "b", side: "left", drop: 110, reach: 60, size: 18, layer: gLater });
          var tagT0 = T("sprinkler", -0.2);
          szTag.drawOn(story, tagT0, { speed: szTag.duration / (EV("valve-clunk") - 0.05 - tagT0), events: false });
          K.sprinklerHeadsFade(story, site, EV("heads-off"), { to: 0.2, step: 0.055, dur: 0.45, events: false });
          breatheTo(LAND, T("afterwards"));

          // ================================================================ 1.10 nothing looks different; the conditions have changed (L08)
          // held exactly (the redraw and the fray are the motion), so Frame 3 can pin evidence to site points:
          // roof03AndSz3 from nothingLooks + 2.0 to afterwards, then roof03AndSz3 -> afterwardsWide (sine.inOut)
          // from afterwards to tooLate - 0.8, then afterwardsWide held to rewindStart
          cam.to(story, "roof03AndSz3", T("nothingLooks"), 2.0, "power2.inOut");
          var red = K.envelopeRedraw(W, { target: "roof03Centre", refScale: 10.5, marginPx: 22, span: 10, shoulder: 0.45, layer: gLater });
          var cross = red.crossing("heroExitPoint", "roof03Centre");
          var conn = K.conditionConnection(W, "heroExitPoint", "roof03Centre", { refScale: 10.5, breakAt: cross != null ? cross : 0.5, labelSize: 18, layer: gLater });
          conn.drawOn(story, EV("connection-01"), { events: false });
          red.drawOn(story, EV("envelope-redraw"), { events: false });
          conn.fray(story, EV("fray"), { dur: EVD("fray"), events: false });

          // ================================================================ 1.11 afterwards (L09 to L11)
          // a slow, continuous pull under the evidence; the rewind reverses it from its first frame
          var PULL = T("tooLate", -0.8) - T("afterwards");
          cam.to(story, "afterwardsWide", T("afterwards"), PULL, "sine.inOut");

          story.fromTo(siteWrap, { opacity: 1 }, { opacity: 0.35, duration: 1.8, ease: "power1.inOut", immediateRender: false }, T("afterwards", 0.1));
          story.fromTo(blur, { attr: { stdDeviation: 0 } }, { attr: { stdDeviation: 1.1 }, duration: 1.8, ease: "power1.inOut", immediateRender: false }, T("afterwards", 0.1));
          story.fromTo(szTag.root, { opacity: 1 }, { opacity: 0, duration: 1.2, ease: "power1.inOut", immediateRender: false }, T("afterwards", 0.2));
          var inc = K.incidentBox(Wov, "roof03Centre", { offset: [40, -96] });
          inc.drawOn(story, EV("incident"), { speed: 1.8, events: false });
          story.fromTo(ovWrap, { opacity: 1 }, { opacity: 0.55, duration: 1.0, ease: "power1.inOut", immediateRender: false }, T("q1", -0.5));

          // ================================================================ REGISTERED TIMELINE: forward, then the rewind
          var tl = gsap.timeline({ paused: true });
          FL.scrub(tl, story, { at: 0, from: 0, to: RS, duration: RS, ease: "none" });
          FL.scrub(tl, story, { at: RS, from: RS, to: LAND, duration: RE - RS, ease: FL.rewindEase() });
          // after the landing the frame holds, fully opaque, under a2-resolve's fade-in

          window.__timelines["a1-world"] = tl;
        })();
      </script>
