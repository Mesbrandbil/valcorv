<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>a1-inserts: close-up inserts, the LOTO valve, the welder, the SZ3 valve (S3b, S7b, S8a)</title>
    <!-- Ignored by the assembler. Everything that must exist at render time is inside <template>. -->
  </head>
  <body>
    <template id="a1-inserts-template">
      <link rel="stylesheet" href="assets/css/film.css" />
      <link rel="stylesheet" href="assets/css/film-color.css" />
      <link rel="stylesheet" href="assets/css/film-sketch.css" />
      <style>
        /*
          a1-inserts: three full-frame close-up inserts over a1-world (z 104, under the chrome).
          Each insert is an opaque paper panel (the page ground, the index grain tile at the same
          phase and the index vignette, so the paper reads exactly as it does elsewhere; the index's
          top paper tooth lies over it like every scene) carrying a graphite and colour illustration
          drawn here.
          Between the windows the scene is fully transparent.

          Shared windows (other builders cut on exactly these):
            S3b LOTO valve   clk.c('equipment')  to clk.c('workMoves')
            S7b welder       clk.c('hotWork')    to clk.c('certificate')
            S8a SZ3 valve    clk.c('then')       to clk.c('L07.end', 0.25)
          Everything is built on one story timeline (story time = scene-local time) that the
          registered timeline plays forward to rewindStart and then scrubs back to the story time of
          cue 'landing' with FL.rewindEase(), like a1-after. The rewind's tail passes the SZ3 window
          backwards (the tag lifts, the needle rises, the handwheel turns back, the water refills the
          riser); the landing itself (before clk.c('then')) shows no insert.

          Cut 3 colour (docs/cut3-direction.md section 1; tokens only): graphite line on top, pale
          watercolour washes and colour pencil under it.
            S3b LOTO: the valve body steel, the lagged steam run sand; the LOTO tag stays paper with
              ink lettering (a routine, accepted isolation). No strong colour.
            S7b weld: Roof 03's slate membrane, the terracotta utilities stack beyond; the welder in
              leather with a white shell; the arc a small --c-hot point in a --c-hot-soft glow (flat
              discs, never a flame); the fire watch in hi-vis with a white hard hat, a terracotta
              extinguisher. Strong: hot, hi-vis, leather.
            S8a SZ3: fire protection is water. The supply riser, the riser up to the zone and the
              handwheel are water (water-soft wash, water colour pencil); the valve, flanges and gauge
              steel. With the needle (from 'goes'), the water drains out of the riser to the zone: the
              wash sinks from the top of the frame to the valve's flange and the colour pencil above
              the level is offline grey. The tag hangs in alert (alert-soft wash, alert inner outline).
              Nobody in the insert reacts. Strong: water, alert.
          Handoff: the cuts are hard and unchanged. The last SZ3 frame (cut to a1-world S8b at
          clk.c('L07.end', 0.25)) shows the upper riser drained to paper and offline grey, the supply
          riser still water, the tag in alert; a1-world then drains the zone's heads one by one.
          The rewind: each insert svg carries --sk-bleed on the registered timeline, 1 to 0 over
          [rewindStart, +0.45 of the rewind] and back to 1 over its last 0.35, as a1-world's site.
        */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .a1-inserts-panel {
          position: absolute;
          inset: 0;
          overflow: hidden;
          opacity: 0;
          background-color: var(--paper-ground);
        }
        .a1-inserts-grain {
          position: absolute;
          inset: 0;
          background-image: url("assets/textures/paper-grain.png");
          background-size: 512px 512px;
          background-repeat: repeat;
        }
        .a1-inserts-vig {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 75% 70% at 50% 48%, color-mix(in srgb, var(--c-graphite) 0%, transparent) 58%, color-mix(in srgb, var(--c-graphite) 3.5%, transparent) 82%, color-mix(in srgb, var(--c-graphite) 7%, transparent) 100%);
        }
        svg.a1-inserts-svg {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          /* the graphite line and its lighter pass (a group may lighten both, as the fire watch does) */
          --a1i-g: var(--c-graphite);
          --a1i-gl: color-mix(in srgb, var(--c-graphite) 55%, var(--c-paper));
        }
        /*
          Colour (cut 3): graphite pressure ribbons stay the line on top; colour is pale watercolour
          under them (SketchKit's .skt-wash .skt-w-<tone>, laid by util.wash) and colour pencil in
          the hatching and the colour-pencil passes (.a1-inserts-cp), which follow the tone class of
          their group (skt-c-<tone> sets --skt-tc). The inserts follow the rewind's bleed (--sk-bleed
          on each svg, as a1-world's site).
        */
        .a1-inserts-svg .a1-inserts-ink {
          fill: var(--a1i-g);
          stroke: none;
        }
        .a1-inserts-svg .a1-inserts-inkl {
          fill: var(--a1i-gl);
          stroke: none;
        }
        /* a pressure ribbon in its group's colour pencil (the SZ3 tag's inner alert outline) */
        .a1-inserts-svg .a1-inserts-tl {
          fill: var(--skt-tc, var(--a1i-g));
          stroke: none;
        }
        .a1-inserts-svg .a1-inserts-ln,
        .a1-inserts-svg .a1-inserts-ov,
        .a1-inserts-svg .a1-inserts-ht,
        .a1-inserts-svg .a1-inserts-htl,
        .a1-inserts-svg .a1-inserts-cp {
          fill: none;
          stroke: var(--a1i-g);
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .a1-inserts-svg .a1-inserts-cn,
        .a1-inserts-svg .a1-inserts-cl,
        .a1-inserts-svg .a1-inserts-soft {
          fill: none;
          stroke: var(--a1i-gl);
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        /* colour pencil: overdraw, hatching and the colour line take the group's tone */
        .a1-inserts-svg .a1-inserts-ov,
        .a1-inserts-svg .a1-inserts-ht,
        .a1-inserts-svg .a1-inserts-htl,
        .a1-inserts-svg .a1-inserts-cp {
          stroke: var(--skt-tc, var(--a1i-g));
        }
        .a1-inserts-svg .a1-inserts-ln {
          stroke-width: 1.25px;
        }
        .a1-inserts-svg .a1-inserts-ov {
          stroke-width: 1px;
          stroke-opacity: 0.3;
        }
        .a1-inserts-svg .a1-inserts-cp {
          stroke-width: 1.7px;
          stroke-opacity: 0.82;
        }
        .a1-inserts-svg .a1-inserts-cn {
          stroke-width: 0.9px;
          stroke-opacity: 0.62;
        }
        .a1-inserts-svg .a1-inserts-cl {
          stroke-width: 0.9px;
          stroke-opacity: 0.7;
          stroke-dasharray: 26 6 3 6;
        }
        .a1-inserts-svg .a1-inserts-ht {
          stroke-width: 0.85px;
          stroke-opacity: 0.58;
        }
        /* colour-pencil hatching is pressed a little harder than the graphite */
        .a1-inserts-svg [class*="skt-c-"] .a1-inserts-ht {
          stroke-width: 1.05px;
          stroke-opacity: 0.72;
        }
        .a1-inserts-svg .a1-inserts-htl {
          stroke-width: 0.75px;
          stroke-opacity: 0.3;
        }
        .a1-inserts-svg .a1-inserts-soft {
          stroke-width: 9px;
          stroke-opacity: 0.07;
        }
        .a1-inserts-svg .a1-inserts-oc {
          fill: var(--c-paper);
          stroke: none;
        }
        /* the palette's white (--c-helmet): the dial, the zone plate, the SZ3 tag, the welder's shell */
        .a1-inserts-svg .a1-inserts-hi {
          fill: var(--c-helmet);
          stroke: none;
        }
        .a1-inserts-svg .a1-inserts-dot {
          fill: var(--a1i-g);
          stroke: none;
        }
        .a1-inserts-svg .a1-inserts-nss {
          vector-effect: non-scaling-stroke;
        }
        /* IBM Plex only, through the film tokens */
        .a1-inserts-svg .skt-lab {
          font-family: var(--mono);
        }
        .a1-inserts-svg .skt-sans {
          font-family: var(--sans);
        }
      </style>

      <div id="root" data-composition-id="a1-inserts" data-width="1920" data-height="1080">
        <div id="a1-inserts-loto" class="a1-inserts-panel" data-layout-ignore>
          <div class="a1-inserts-grain"></div>
          <div class="a1-inserts-vig"></div>
          <svg id="a1-inserts-loto-svg" class="a1-inserts-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"></svg>
        </div>
        <div id="a1-inserts-weld" class="a1-inserts-panel" data-layout-ignore>
          <div class="a1-inserts-grain"></div>
          <div class="a1-inserts-vig"></div>
          <svg id="a1-inserts-weld-svg" class="a1-inserts-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"></svg>
        </div>
        <div id="a1-inserts-sz3" class="a1-inserts-panel" data-layout-ignore>
          <div class="a1-inserts-grain"></div>
          <div class="a1-inserts-vig"></div>
          <svg id="a1-inserts-sz3-svg" class="a1-inserts-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"></svg>
        </div>
      </div>

      <script>
        (function () {
          // Globals from index.html: gsap (+ DrawSVG, CustomEase), FL, CUES, SCENES, SketchKit.
          var ID = "a1-inserts";
          var clk = FL.clock(ID);
          var T = function (a, off) {
            return clk.t(a, off);
          };
          var B = FL.BEAT;
          var U = SketchKit.util;
          var story = FL.story();
          // the handwheel closing: a steady turn that stops hard as the gate seats (the clunk)
          var CLOSE = "power1.in";
          if (window.CustomEase) {
            if (!(CustomEase.get && CustomEase.get("a1i-close"))) CustomEase.create("a1i-close", "M0,0 C0.22,0 0.3,0.14 0.44,0.36 0.62,0.66 0.8,0.92 1,1");
            CLOSE = "a1i-close";
          }

          // ================================================================ windows (scene-local)
          var W = {
            loto: [clk.c("equipment"), clk.c("workMoves")],
            weld: [clk.c("hotWork"), clk.c("certificate")],
            sz3: [clk.c("then"), clk.c("L07.end", 0.25)],
          };
          var RS = T("rewindStart"),
            RE = T("rewindEnd"),
            LAND = T("landing");

          // ================================================================ maths
          var PI = Math.PI,
            TAU = 2 * Math.PI;
          var add = function (a, b) {
            return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
          };
          var sub = function (a, b) {
            return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
          };
          var mul = function (a, k) {
            return [a[0] * k, a[1] * k, a[2] * k];
          };
          var dot = function (a, b) {
            return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
          };
          var cross = function (a, b) {
            return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
          };
          var nrm = function (a) {
            var l = Math.hypot(a[0], a[1], a[2]) || 1;
            return [a[0] / l, a[1] / l, a[2] / l];
          };
          var a2 = function (a, b) {
            return [a[0] + b[0], a[1] + b[1]];
          };
          var s2 = function (a, b) {
            return [a[0] - b[0], a[1] - b[1]];
          };
          var m2 = function (a, k) {
            return [a[0] * k, a[1] * k];
          };
          var d2 = function (a, b) {
            return a[0] * b[0] + a[1] * b[1];
          };
          var len2 = function (a) {
            return Math.hypot(a[0], a[1]);
          };
          var dist2 = function (a, b) {
            return Math.hypot(b[0] - a[0], b[1] - a[1]);
          };
          var lerp2 = function (a, b, t) {
            return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
          };
          var clamp = function (v, a, b) {
            return v < a ? a : v > b ? b : v;
          };
          var f2 = function (v) {
            return (Math.round(v * 100) / 100).toString();
          };
          var rng = function (seed) {
            return FL.prng("a1i-" + seed);
          };
          var mk = function (tag, attrs, parent) {
            return FL.svgEl(tag, attrs, parent);
          };
          var g = function (parent, attrs) {
            return FL.svgEl("g", attrs || {}, parent);
          };
          var dPts = function (pts, closed) {
            var s = "M" + f2(pts[0][0]) + " " + f2(pts[0][1]);
            for (var i = 1; i < pts.length; i++) s += "L" + f2(pts[i][0]) + " " + f2(pts[i][1]);
            return s + (closed ? "Z" : "");
          };
          var CLS = function (k) {
            return ID + "-" + k;
          };

          // ================================================================ orthographic camera
          // az/el in degrees; world z is up. Visible faces have normal . V > 0.
          function Cam(o) {
            var az = (o.az * PI) / 180,
              el = (o.el * PI) / 180,
              s = o.s || 1;
            var V = [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)];
            var R = nrm([V[1], -V[0], 0]);
            var Up = cross(mul(V, -1), R);
            return {
              V: V,
              s: s,
              p: function (P) {
                return [o.ox + s * dot(P, R), o.oy - s * dot(P, Up)];
              },
              v: function (D) {
                return [s * dot(D, R), -s * dot(D, Up)];
              },
            };
          }
          function basis(n) {
            var a = Math.abs(n[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
            var u = nrm(cross(n, a));
            return [u, cross(n, u)];
          }
          // the ellipse of a 3D circle (centre Cc, normal n, radius r)
          function ell(cam, Cc, n, r, bs) {
            var b = bs || basis(n);
            return { c: cam.p(Cc), A: m2(cam.v(b[0]), r), B: m2(cam.v(b[1]), r), u: b[0], v: b[1], n: n, r: r, C: Cc };
          }
          function ellPt(e, th) {
            var c = Math.cos(th),
              s = Math.sin(th);
            return [e.c[0] + e.A[0] * c + e.B[0] * s, e.c[1] + e.A[1] * c + e.B[1] * s];
          }
          function ellArc(e, t0, t1, N) {
            N = N || Math.max(10, Math.ceil((Math.abs(t1 - t0) / TAU) * 120));
            var out = [];
            for (var i = 0; i <= N; i++) out.push(ellPt(e, t0 + ((t1 - t0) * i) / N));
            return out;
          }
          // cylinder C0 -> C1, radius r: outline (closed, for the paper fill), silhouettes, outer arcs
          function cyl(cam, C0, C1, r, N) {
            var n = nrm(sub(C1, C0)),
              bs = basis(n);
            var e0 = ell(cam, C0, n, r, bs),
              e1 = ell(cam, C1, n, r, bs);
            var ax = s2(e1.c, e0.c),
              axl = len2(ax);
            var q = axl > 1e-6 ? [-ax[1] / axl, ax[0] / axl] : [1, 0];
            var ts = Math.atan2(d2(e0.B, q), d2(e0.A, q));
            var em = [e0.A[0] * Math.cos(ts + PI / 2) + e0.B[0] * Math.sin(ts + PI / 2), e0.A[1] * Math.cos(ts + PI / 2) + e0.B[1] * Math.sin(ts + PI / 2)];
            var sg = d2(em, ax) >= 0 ? 1 : -1;
            var hN = N ? N / 2 : null;
            var arc1 = ellArc(e1, ts, ts + sg * PI, hN),
              arc0 = ellArc(e0, ts + sg * PI, ts + 2 * sg * PI, hN);
            var M = Math.hypot(d2(e0.A, q), d2(e0.B, q));
            return {
              cam: cam,
              n: n,
              u: bs[0],
              v: bs[1],
              e0: e0,
              e1: e1,
              ts: ts,
              sg: sg,
              q: q,
              M: M,
              r: r,
              C0: C0,
              C1: C1,
              outline: arc1.concat(arc0),
              arc0: arc0,
              arc1: arc1,
              silA: [ellPt(e0, ts), ellPt(e1, ts)],
              silB: [ellPt(e0, ts + PI), ellPt(e1, ts + PI)],
              cap1: dot(n, cam.V) > 0,
              // the inner half of the visible cap (the edge between the cap and the body)
              capInner: dot(n, cam.V) > 0 ? ellArc(e1, ts + sg * PI, ts + 2 * sg * PI, hN) : ellArc(e0, ts, ts + sg * PI, hN),
              capFull: dot(n, cam.V) > 0 ? ellArc(e1, 0, TAU, N) : ellArc(e0, 0, TAU, N),
            };
          }

          // ================================================================ graphite marks
          function resample(pts, maxSeg) {
            var out = [pts[0]];
            for (var i = 1; i < pts.length; i++) {
              var a = pts[i - 1],
                b = pts[i],
                L = dist2(a, b),
                n = Math.max(1, Math.ceil(L / maxSeg));
              for (var k = 1; k <= n; k++) out.push(lerp2(a, b, k / n));
            }
            return out;
          }
          // A contour as a filled pressure ribbon: width breathes along the stroke, the pen lands a
          // little heavier than it lifts, open strokes taper at both ends. Static drawing (never drawn
          // on), so the ribbon can carry real pressure variation.
          function ribbon(parent, pts, o) {
            o = o || {};
            pts = resample(pts, o.seg || 12);
            var closed = !!o.closed,
              n = pts.length;
            var R = rng("rb" + (o.seed || "") + f2(pts[0][0]) + "," + f2(pts[0][1]) + "," + n);
            var ph1 = R() * TAU,
              ph2 = R() * TAU,
              ph3 = R() * TAU,
              per1 = 150 + R() * 150,
              per2 = 36 + R() * 30;
            var s = [0];
            for (var i = 1; i < n; i++) s.push(s[i - 1] + dist2(pts[i - 1], pts[i]));
            var L = s[n - 1] || 1;
            var w = o.w || 2,
              press = o.press != null ? o.press : 0.3,
              jit = o.jit != null ? o.jit : 0.6;
            var tp = closed ? 0 : Math.min(o.taper != null ? o.taper : Math.max(6, L * 0.2), 80);
            var wEnd = o.wEnd != null ? o.wEnd : 0.2;
            var left = [],
              right = [];
            for (i = 0; i < n; i++) {
              var ia = closed ? (i - 1 + n) % n : Math.max(0, i - 1),
                ib = closed ? (i + 1) % n : Math.min(n - 1, i + 1);
              var tx = pts[ib][0] - pts[ia][0],
                ty = pts[ib][1] - pts[ia][1],
                tl = Math.hypot(tx, ty) || 1;
              var nx = -ty / tl,
                ny = tx / tl,
                si = s[i];
              var wob = jit * (0.65 * Math.sin((si / per1) * TAU + ph1) + 0.35 * Math.sin((si / per2) * TAU + ph3));
              var pr = 1 + press * (0.62 * Math.sin((si / per1) * TAU + ph2) + 0.38 * Math.sin((si / (per2 * 1.7)) * TAU + ph1));
              var prof = 1;
              if (tp > 0) {
                var e = Math.min(si, L - si) / tp;
                if (e < 1) prof = wEnd + (1 - wEnd) * (e * e * (3 - 2 * e));
              }
              if (!closed) prof *= 1.1 - 0.2 * (si / L);
              var hw = Math.max(0.22, (w * pr * prof) / 2);
              var cx = pts[i][0] + nx * wob,
                cy = pts[i][1] + ny * wob;
              left.push([cx + nx * hw, cy + ny * hw]);
              right.push([cx - nx * hw, cy - ny * hw]);
            }
            var d = closed ? dPts(left, true) + dPts(right.slice().reverse(), true) : dPts(left.concat(right.slice().reverse()), true);
            var el = mk("path", { d: d, class: o.cls || CLS("ink"), "fill-rule": "evenodd" }, parent);
            if (o.soft) mk("path", { d: dPts(pts, closed), class: CLS("soft") }, parent);
            return el;
          }
          // thin second pass of the same line with its own drift (the pencil going over it again)
          function overdraw(parent, pts, o) {
            o = o || {};
            pts = resample(pts, 16);
            var R = rng("ov" + (o.seed || "") + f2(pts[0][0]) + f2(pts[0][1]));
            var ph = R() * TAU,
              per = 90 + R() * 120,
              amp = o.amp != null ? o.amp : 1.1;
            var n = pts.length,
              out = [],
              s = 0;
            for (var i = 0; i < n; i++) {
              if (i) s += dist2(pts[i - 1], pts[i]);
              var ia = Math.max(0, i - 1),
                ib = Math.min(n - 1, i + 1);
              var t = n2(s2(pts[ib], pts[ia]));
              var off = amp * Math.sin((s / per) * TAU + ph) + (o.bias || 0.5);
              out.push([pts[i][0] - t[1] * off, pts[i][1] + t[0] * off]);
            }
            // a partial pass: the second stroke covers most of the line, not all of it
            var a = Math.floor(n * (o.closed ? 0 : 0.06 + R() * 0.12)),
              b = Math.ceil(n * (o.closed ? 1 : 0.8 + R() * 0.2));
            var part = out.slice(a, Math.max(a + 2, b));
            return mk("path", { d: dPts(part, false), class: o.cls || CLS("ov") }, parent);
          }
          function n2(a) {
            var l = len2(a) || 1;
            return [a[0] / l, a[1] / l];
          }
          // construction overshoot past both ends of a straight edge
          function overshoot(parent, a, b, o) {
            o = o || {};
            var R = rng("ex" + f2(a[0]) + f2(b[1]) + (o.seed || ""));
            var t = n2(s2(b, a)),
              e0 = (o.min || 7) + R() * (o.var || 16),
              e1 = (o.min || 7) + R() * (o.var || 16);
            var d = "M" + f2(a[0] - t[0] * e0) + " " + f2(a[1] - t[1] * e0) + "L" + f2(a[0] + t[0] * 4) + " " + f2(a[1] + t[1] * 4);
            d += "M" + f2(b[0] - t[0] * 4) + " " + f2(b[1] - t[1] * 4) + "L" + f2(b[0] + t[0] * e1) + " " + f2(b[1] + t[1] * e1);
            return mk("path", { d: d, class: CLS("cn") }, parent);

          // ================================================================ S8a: the SZ3 control valve
          function buildSz3() {
            var svg = document.getElementById(ID + "-sz3-svg");

            // the plate on the wall, lettered in the wall plane
            var px0 = 420,
              pz1 = 210,
              pw = 400,
              ph = 150;
            var pc = [cam.p([px0, wallY, pz1]), cam.p([px0 + pw, wallY, pz1]), cam.p([px0 + pw, wallY, pz1 - ph]), cam.p([px0, wallY, pz1 - ph])];

            });
            var ex = cam.v([1, 0, 0]),
              ez = cam.v([0, 0, -1]);
            var o0 = cam.p([px0, wallY, pz1]);

            // ---------- riser below the valve, the valve, riser above
            // a water pipe: paper, a water-soft wash, water colour-pencil hatching and a colour line inside

            function waterPipe(parent, c, o) {

              var gWash = g(gp);
              wash(gWash, c.outline, "water-soft", o.washK != null ? o.washK : 1, { seed: "wp" + o.seed, inset: 3, jit: 2.2 });
              var layers = [];
              ["water"].concat(o.drain ? ["offline"] : []).forEach(function (tone, i) {

            }
            var rs0 = cyl(cam, [0, 0, -1000], [0, 0, -150], 58, 80);

            // riser above first (it is further from the viewer than the valve's chest and yoke)

            var riser = waterPipe(gMid, rs1, { seed: "rs1", drain: true });
            // the sinking level: the water (its wash and its colour pencil) is clipped below the level and

            var yTop = Math.max(-40, Math.min.apply(null, rs1.outline.map(function (p) { return p[1]; })) - 8),
              yBot = Math.max.apply(null, rs1.outline.map(function (p) { return p[1]; })) + 4;
            var lvId = ID + "-sz3-level",

            boltRing(gMid, cam, Lt, { axis: Z, centre: [0, 0, 150], rb: 78, rbolt: 9, len: 11, stud: 6, count: 8, phase: 0.3, which: "front", seed: "st2" });

            var gD = g(gMid, { transform: "matrix(" + dM.map(f2).join(" ") + ")" });

            }

            tweenAttr(weld.gFar, "transform", "translate(0 0)", "translate(-5 0)", t0, dur, "none");
            tweenAttr(weld.gMid, "transform", "translate(0 0)", "translate(-12 0)", t0, dur, "none");
            tweenAttr(weld.gFg, "transform", "translate(0 0)", "translate(-78 -4)", t0, dur, "none");
            // the torch hand travels slowly along the seam; the body follows a little
            var tv = weld.travel;
            tweenAttr(weld.arm, "transform", "translate(0 0) rotate(0 880 436)", "translate(" + f2(tv[0]) + " " + f2(tv[1]) + ") rotate(-0.6 880 436)", t0, dur, "sine.inOut");
            tweenAttr(weld.body, "transform", "translate(0 0)", "translate(" + f2(tv[0] * 0.3) + " " + f2(tv[1] * 0.3) + ")", t0, dur, "sine.inOut");
            story.fromTo(weld.bead, { drawSVG: "0% " + (weld.beadFrac0 * 100).toFixed(2) + "%" }, { drawSVG: "0% 100%", duration: dur, ease: "sine.inOut", immediateRender: true }, t0);
            // the fire watch shifts weight
            tweenAttr(weld.fw, "transform", "translate(0 0) rotate(0 1330 452)", "translate(-3 0) rotate(1.1 1330 452)", t0, dur, "sine.inOut");
            // the arc flickers on a stepped, seeded sequence (about 12 changes a second)
            var step = 1 / 12,
              k = 0,
              prev = arcTicks(0),
              prevR = arcGlow(0);
            weld.ticks.setAttribute("d", prev);
            weld.glow.setAttribute("r", prevR);
            for (var t = t0 + step; t < t1; t += step) {
              k++;
              var next = arcTicks(k),
                nextR = arcGlow(k);
              tweenAttr(weld.ticks, "d", prev, next, t, 0.001, "steps(1)");
              tweenAttr(weld.glow, "r", prevR, nextR, t, 0.001, "steps(1)");
              prev = next;
              prevR = nextR;
            }
          })();

          // ---------- S8a: cut in on 'then', the handwheel closes over 'sprinkler zone', the needle
          // falls on 'goes offline', the clunk on 'offline', the tag hangs (a second hand)
          (function () {
            var t0 = W.sz3[0],
              t1 = W.sz3[1];
            setAt(sz3.panel, "opacity", 0, 1, t0);
            setAt(sz3.panel, "opacity", 1, 0, t1);
            var dur = t1 - t0;
            tweenAttr(sz3.gCam, "transform", sz3.camT(1), sz3.camT(1.012), t0, dur, "none");
            tweenAttr(sz3.gBg, "transform", "translate(0 0)", "translate(5 -1)", t0, dur, "none");
            tweenAttr(sz3.gMid, "transform", "translate(0 0)", "translate(10 -2)", t0, dur, "none");
            tweenAttr(sz3.gFg, "transform", "translate(0 0)", "translate(64 -8)", t0, dur, "none");
            // handwheel: from 'sprinkler' to the clunk on 'offline', about one and a third turns
            var th0 = T("sprinkler", -0.06),
              th1 = T("offline");
            var sgn = sz3.hw.det >= 0 ? 1 : -1,
              turns = 480;
            tweenAttr(sz3.hw.rot, "transform", "rotate(0)", "rotate(" + turns * sgn + ")", th0, th1 - th0, CLOSE);
            // the rising stem runs back into the yoke with the turn
            var st = sz3.stem;
            tweenAttr(st.fill, "d", dPts(st.open.outline, true), dPts(st.shut.outline, true), th0, th1 - th0, CLOSE);
            tweenAttr(st.clip, "d", dPts(st.open.outline, true), dPts(st.shut.outline, true), th0, th1 - th0, CLOSE);
            tweenAttr(st.sil, "d", dPts(st.open.silA.concat(st.open.arc1).concat([st.open.silB[1], st.open.silB[0]]), false), dPts(st.shut.silA.concat(st.shut.arc1).concat([st.shut.silB[1], st.shut.silB[0]]), false), th0, th1 - th0, CLOSE);
            tweenAttr(st.cap, "d", dPts(st.open.capInner, false), dPts(st.shut.capInner, false), th0, th1 - th0, CLOSE);
            var trv = "translate(" + f2(st.travel[0]) + " " + f2(st.travel[1]) + ")";
            tweenAttr(st.thr, "transform", "translate(0 0)", trv, th0, th1 - th0, CLOSE);
            tweenAttr(st.thrIn, "transform", "translate(0 0)", trv, th0, th1 - th0, CLOSE);
            // the gauge: 7.2 bar, falling to the zero stop on 'goes offline'
            var tg0 = T("L07:goes.start", 0.05),
              tg1 = T("offline", 0.3);
            tweenAttr(sz3.needle, "transform", "rotate(" + f2(sz3.needleDeg(7.2)) + ")", "rotate(" + f2(sz3.needleDeg(0)) + ")", tg0, tg1 - tg0, "power2.in");
            // cut 3 colour, the unnoticed change: with the needle, the water drains out of the riser to
            // the zone. The wash sinks from the top of the frame to the valve's flange and the colour
            // pencil turns from water to offline grey; the supply riser below the valve stays water.
            // Silent (the clunk and the gauge carry the sound); nobody in the insert reacts.
            var rz = sz3.riser,
              lv = rz.level,
              td0 = T("L07:goes.start", -0.05),
              td1 = T("offline", 0.45);
            var span = lv.bot - lv.top;
            story.fromTo(lv.rect, { attr: { y: f2(lv.top), height: f2(span) } }, { attr: { y: f2(lv.bot), height: 0 }, duration: td1 - td0, ease: "power1.in", immediateRender: true }, td0);
            story.fromTo(lv.above, { attr: { height: 400 } }, { attr: { height: f2(span + 400) }, duration: td1 - td0, ease: "power1.in", immediateRender: true }, td0);
            // the tag, after the clunk
            dropTag(sz3.tag, sz3.pivot, T("offline", 0.06), {
              seq: [
                [64, 0],
                [-9, 0.22],
                [4.5, 0.32],
                [-1.8, 0.3],
                [0, 0.3],
              ],
            });
          })();


          // ================================================================ REGISTERED TIMELINE
          var tl = gsap.timeline({ paused: true });
          FL.scrub(tl, story, { at: 0, from: 0, to: RS, duration: RS, ease: "none" });
          FL.scrub(tl, story, { at: RS, from: RS, to: LAND, duration: RE - RS, ease: FL.rewindEase() });
          // the rewind's bleed, as a1-world's site: the colour drains as the tape runs back and floods
          // back in as it lands (the SZ3 insert passes backwards in the rewind's tail)
          var RW = RE - RS;
          [loto.panel, weld.panel, sz3.panel].forEach(function (pn) {
            var sv = pn.querySelector("svg");
            // immediateRender true: a custom-property fromTo that never rendered its start at build time is
            // not restored when a seek goes back past it (measured; opacity and attr tweens are)
            tl.fromTo(sv, { "--sk-bleed": 1 }, { "--sk-bleed": 0, duration: RW * 0.45, ease: "power1.inOut", immediateRender: true }, RS);
            tl.fromTo(sv, { "--sk-bleed": 0 }, { "--sk-bleed": 1, duration: RW * 0.35, ease: "power1.inOut", immediateRender: false }, RE - RW * 0.35);
          });

          window.__timelines["a1-inserts"] = tl;
        })();
      </script>
    </template>
  </body>
