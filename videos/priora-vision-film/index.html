<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Priora vision film</title>
    <!-- Shared runtime: local vendored GSAP 3.15 and plugins, the film library, generated cues. -->
    <script src="assets/vendor/gsap/gsap.min.js"></script>
    <script src="assets/vendor/gsap/DrawSVGPlugin.min.js"></script>
    <script src="assets/vendor/gsap/CustomEase.min.js"></script>
    <script src="assets/vendor/gsap/MorphSVGPlugin.min.js"></script>
    <script src="assets/vendor/gsap/MotionPathPlugin.min.js"></script>
    <script src="assets/js/film-lib.js"></script>
    <script src="assets/js/cues.js"></script>
    <script src="assets/js/film-assets.js"></script>
    <!-- Shared kits: the site (graphite twin + precise), the interface, the Act I sketch world. -->
    <script src="assets/js/site-data.js"></script>
    <script src="assets/js/site-kit.js"></script>
    <script src="assets/js/ui-kit.js"></script>
    <script src="assets/js/sketch-kit.js"></script>
    <link rel="stylesheet" href="assets/css/film.css" />
    <style>
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }
      /* Untimed full-bleed paper: warm ground, static grain, very faint vignette. */
      #film-paper {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-color: var(--paper-ground); /* grain darkens it to an average of --paper */
        pointer-events: none;
      }
      #film-paper-grain {
        position: absolute;
        inset: 0;
        background-image: url("assets/textures/paper-grain.png");
        background-size: 512px 512px;
        background-repeat: repeat;
      }
      #film-paper-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(59, 58, 51, 0) 58%, rgba(59, 58, 51, 0.035) 82%, rgba(59, 58, 51, 0.07) 100%);
      }
    </style>
  </head>
  <body>
    <!-- build-cues:root:begin -->
    <div id="root" data-composition-id="film" data-start="0" data-duration="90" data-width="1920" data-height="1080" data-fps="30">
    <!-- build-cues:root:end -->
      <div id="film-paper" aria-hidden="true" data-layout-ignore>
        <div id="film-paper-grain"></div>
        <div id="film-paper-vignette"></div>
      </div>
      <!-- build-cues:slots:begin -->
      <div id="el-a1-world" class="clip fl-slot" data-composition-id="a1-world" data-composition-src="compositions/a1-world.html" data-start="0" data-duration="42.766666" data-track-index="1" data-width="1920" data-height="1080" style="z-index: 10"></div>
      <div id="el-a2-resolve" class="clip fl-slot" data-composition-id="a2-resolve" data-composition-src="compositions/a2-resolve.html" data-start="42.366666" data-duration="17.2" data-track-index="1" data-width="1920" data-height="1080" style="z-index: 11"></div>
      <div id="el-a3-change" class="clip fl-slot" data-composition-id="a3-change" data-composition-src="compositions/a3-change.html" data-start="59.266666" data-duration="17.233333" data-track-index="1" data-width="1920" data-height="1080" style="z-index: 12"></div>
      <div id="el-a3-close" class="clip fl-slot" data-composition-id="a3-close" data-composition-src="compositions/a3-close.html" data-start="76" data-duration="14" data-track-index="1" data-width="1920" data-height="1080" style="z-index: 13"></div>
      <div id="el-a1-paper" class="clip fl-slot" data-composition-id="a1-paper" data-composition-src="compositions/a1-paper.html" data-start="7.866666" data-duration="8.466666" data-track-index="2" data-width="1920" data-height="1080" style="z-index: 101"></div>
      <div id="el-a1-after" class="clip fl-slot" data-composition-id="a1-after" data-composition-src="compositions/a1-after.html" data-start="28.366666" data-duration="14" data-track-index="3" data-width="1920" data-height="1080" style="z-index: 102"></div>
      <div id="el-chrome" class="clip fl-slot" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-start="0" data-duration="76" data-track-index="5" data-width="1920" data-height="1080" style="z-index: 200"></div>
      <!-- build-cues:slots:end -->
      <!-- build-cues:audio:begin -->
      <audio id="stem-voice" src="assets/audio/master-voice.wav" data-start="0" data-duration="90" data-track-index="20" data-volume="1"></audio>
      <audio id="stem-music" src="assets/audio/music.wav" data-start="0" data-duration="90" data-track-index="21" data-volume="1"></audio>
      <audio id="stem-sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="90" data-track-index="22" data-volume="1"></audio>
      <!-- build-cues:audio:end -->
    </div>
    <script>
      window.__timelines["film"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
