<svg xmlns="http://www.w3.org/2000/svg" id="priora-glyphs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!--
    Priora glyph sprite for the film, copied from priora-end-state-demo.html (read-only source).
    g-*    : every <symbol> the demo defines, unchanged except that the paper fill reads var(--pui-paper, #F5F3EE).
    node-* : the demo's on-site activity node (nodeMarkup()) baked per state. viewBox -30 -30 60 60 in screen px:
             draw at 60x60 centred on the node for the demo's 1:1 size, 90x90 for the hero in focus stages (k 1.5).
    others : reticle, anchor ellipse, packet token, condition check states.
    Signal: the demo's orange (#C4441C) appears only in the 'hatch' pattern, now var(--signal, #1F47D6).
    Every other glyph uses currentColor, so outside-state glyphs take the signal via style="color:var(--signal)",
    as the demo does with style="color:var(--signal)".
  -->
  <defs>
    <pattern id="hatch-ink" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" style="fill:var(--pui-paper, #F5F3EE)"/><line x1="0" y1="0" x2="0" y2="4" stroke="#111" stroke-width="1" stroke-opacity=".35"/></pattern>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" style="fill:var(--pui-paper, #F5F3EE)"/><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--signal, #1F47D6)" stroke-width="1.1" stroke-opacity=".55"/></pattern>

    <!-- state glyphs (legend, stream rows, economics, choices, header status) -->
    <symbol id="g-inside" viewBox="-10 -10 20 20"><circle r="6.6" fill="none" stroke="currentColor" stroke-opacity=".45"/><circle r="3" fill="currentColor"/></symbol>
    <symbol id="g-checking" viewBox="-10 -10 20 20"><circle r="7.6" fill="none" stroke="currentColor" stroke-dasharray="2.2 2.7"/><circle r="3" fill="currentColor"/></symbol>
    <symbol id="g-outside" viewBox="-10 -10 20 20"><circle r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M0 -7.2V-9.8M0 7.2V9.8M-7.2 0H-9.8M7.2 0H9.8" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="g-changed" viewBox="-10 -10 20 20"><circle r="6.6" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="-3.2" y="-3.2" width="6.4" height="6.4" fill="currentColor"/></symbol>
    <symbol id="g-retained" viewBox="-10 -10 20 20"><circle r="8.4" fill="none" stroke="currentColor" stroke-dasharray="1.4 1.6"/><path d="M-7.2 -0.2L-0.2 -7.2M-6.3 3.8L3.8 -6.3M-3.8 6.3L6.3 -3.8M0.2 7.2L7.2 0.2" stroke="currentColor" stroke-width=".75" stroke-opacity=".6"/><circle r="3.4" style="fill:var(--pui-paper, #F5F3EE)"/><circle r="2.3" fill="currentColor"/></symbol>
    <symbol id="g-cover" viewBox="-12 -10 24 20"><rect x="-11.2" y="-6.6" width="22.4" height="13.2" rx="6.6" fill="none" stroke="currentColor"/><rect x="-8.8" y="-4.2" width="17.6" height="8.4" rx="4.2" fill="none" stroke="currentColor" stroke-width=".8"/><circle cx="-3.4" r="2.1" fill="currentColor"/><circle cx="3.6" r="2" fill="none" stroke="currentColor" stroke-width=".8"/><path d="M3.6 -1V0H4.5" fill="none" stroke="currentColor" stroke-width=".7"/></symbol>
    <symbol id="g-system" viewBox="-10 -10 20 20"><circle r="5.8" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M-4.2 4.2L4.2 -4.2" stroke="currentColor" stroke-width="1.1"/></symbol>
    <symbol id="g-restored" viewBox="-10 -10 20 20"><circle r="5.8" fill="none" stroke="currentColor" stroke-width="1.1"/><circle r="2.2" fill="currentColor"/></symbol>
    <symbol id="g-arrow" viewBox="0 0 36 14"><path d="M1 7H34M28.5 1.8L34 7L28.5 12.2" fill="none" stroke="currentColor" stroke-width="1"/></symbol>
    <symbol id="g-arrow-s" viewBox="0 0 24 12"><path d="M1 6H22M17.5 1.8L22 6L17.5 10.2" fill="none" stroke="currentColor" stroke-width="1"/></symbol>
    <symbol id="g-check" viewBox="0 0 14 14"><path d="M2.5 7.4L5.6 10.3L11.5 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="g-play" viewBox="0 0 12 12"><path d="M3 1.6L10.4 6L3 10.4Z" fill="currentColor"/></symbol>
    <symbol id="g-pause" viewBox="0 0 12 12"><rect x="2.5" y="2" width="2.4" height="8" fill="currentColor"/><rect x="7.1" y="2" width="2.4" height="8" fill="currentColor"/></symbol>
    <symbol id="g-reset" viewBox="0 0 12 12"><path d="M2.4 6A3.6 3.6 0 1 0 3.5 3.4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.9 0.9V3.7H1.1" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
    <symbol id="g-rewind" viewBox="0 0 12 12"><path d="M6 2L2 6L6 10M10.5 2L6.5 6L10.5 10" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
    <symbol id="g-back" viewBox="0 0 12 12"><path d="M7.5 2.5L4 6L7.5 9.5" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
    <symbol id="g-close" viewBox="0 0 12 12"><path d="M2 2L10 10M10 2L2 10" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
    <symbol id="g-mark" viewBox="0 0 24 24"><path d="M12 3.2C19.2 3.2 20.8 4.8 20.8 12S19.2 20.8 12 20.8 3.2 19.2 3.2 12 4.8 3.2 12 3.2Z" fill="none" stroke="currentColor" stroke-width="1.15"/><circle cx="10.2" cy="13.4" r="2.3" fill="currentColor"/></symbol>

    <!-- on-site activity nodes, 1:1 in screen px (viewBox -30 -30 60 60) -->
    <symbol id="node-inside" viewBox="-30 -30 60 60" overflow="visible"><circle r="6.6" fill="none" stroke="currentColor" stroke-opacity=".42" stroke-width="1"/><circle r="3.1" fill="currentColor"/></symbol>
    <symbol id="node-checking" viewBox="-30 -30 60 60" overflow="visible"><circle class="node-spin" r="9" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2.2 2.9"/><circle r="3.1" fill="currentColor"/></symbol>
    <symbol id="node-outside" viewBox="-30 -30 60 60" overflow="visible"><circle r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M0 -11.5V-16M0 11.5V16M-11.5 0H-16M11.5 0H16" fill="none" stroke="currentColor" stroke-width="1.3"/><circle r="3.1" style="fill:var(--pui-paper, #F5F3EE)" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="node-changed" viewBox="-30 -30 60 60" overflow="visible"><circle r="6.6" fill="none" stroke="currentColor" stroke-opacity=".42" stroke-width="1"/><rect x="-3.4" y="-3.4" width="6.8" height="6.8" fill="currentColor"/></symbol>
    <symbol id="node-retained" viewBox="-30 -30 60 60" overflow="visible"><circle r="14" style="fill:var(--pui-paper, #F5F3EE)" fill-opacity=".94" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.4 2.4"/><path d="M-12.13 3.37L-3.37 12.13M-12.26 -1.57L1.57 12.26M-11.08 -5.20L5.20 11.08M-9.15 -8.07L8.07 9.15M-6.57 -10.30L10.30 6.57M-3.30 -11.85L11.85 3.30M0.92 -12.43L12.43 -0.92M8.21 -9.95L9.95 -8.21" fill="none" stroke="currentColor" stroke-opacity=".38" stroke-width=".8"/><circle r="5.4" style="fill:var(--pui-paper, #F5F3EE)"/><circle r="3.1" fill="currentColor"/></symbol>
    <symbol id="node-transferred" viewBox="-30 -30 60 60" overflow="visible"><rect x="-12" y="-10" width="40" height="20" rx="10" style="fill:var(--pui-paper, #F5F3EE)" fill-opacity=".92" stroke="currentColor" stroke-width="1.1"/><rect x="-9" y="-7" width="34" height="14" rx="7" fill="none" stroke="currentColor" stroke-width=".8"/><circle cx="15.5" cy="0" r="3.6" fill="none" stroke="currentColor" stroke-width=".9"/><path d="M15.5 -2V0H17.2" fill="none" stroke="currentColor" stroke-width=".9"/><circle r="3.1" fill="currentColor"/></symbol>
    <symbol id="node-pulse" viewBox="-30 -30 60 60" overflow="visible"><circle r="7" fill="none" stroke="currentColor" stroke-width="1"/></symbol>

    <!-- overlays around the hero node -->
    <symbol id="reticle" viewBox="-30 -30 60 60" overflow="visible"><path d="M-22 -14V-22H-14M14 -22H22V-14M22 14V22H14M-14 22H-22V14" fill="none" stroke="currentColor" stroke-width="1" opacity=".7"/></symbol>
    <symbol id="anchor-ellipse" viewBox="-30 -30 60 60" overflow="visible"><ellipse rx="7" ry="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/></symbol>
    <symbol id="slice-ring" viewBox="-30 -30 60 60" overflow="visible"><circle r="28" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2.5 3" opacity=".9"/></symbol>
    <symbol id="packet-token" viewBox="-10 -10 20 20" overflow="visible"><circle r="6.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><rect x="-3" y="-3" width="6" height="6" rx="1" fill="currentColor"/></symbol>

    <!-- condition check states (activity card rows, change steps): the demo's CHECK_SVG, one symbol per state -->
    <symbol id="ck-waiting" viewBox="0 0 16 16" overflow="visible"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1" stroke-dasharray="1.5 2"/></symbol>
    <symbol id="ck-ok" viewBox="0 0 16 16" overflow="visible"><path d="M3.4 8.4L6.6 11.4L12.8 4.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ck-bad" viewBox="0 0 16 16" overflow="visible"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 12L12 4" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  </defs>
</svg>
